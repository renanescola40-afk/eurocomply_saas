name: Secret Scanning

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: secret-scanning-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-secret-readiness:
    name: Production secret readiness gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies deterministically without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Run production secret readiness checks
        run: npm run security:production-secrets 2>&1 | tee production-secret-readiness.log

      - name: Upload production secret readiness diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: production-secret-readiness
          path: production-secret-readiness.log
          retention-days: 7
          if-no-files-found: warn
