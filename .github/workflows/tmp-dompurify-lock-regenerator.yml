name: Temporary DOMPurify Lock Regenerator

on:
  push:
    branches:
      - agent/fix-dompurify-ghsa-55q2-fjhq-7xh7

permissions:
  contents: write

jobs:
  regenerate-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out dependency branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: agent/fix-dompurify-ghsa-55q2-fjhq-7xh7
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Regenerate only DOMPurify dependency metadata
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --save-exact dompurify@3.4.13 --registry=https://registry.npmjs.org

      - name: Verify patched dependency and lock alignment
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          if (pkg.dependencies?.dompurify !== '3.4.13') throw new Error('package.json DOMPurify is not 3.4.13');
          if (lock.packages?.['']?.dependencies?.dompurify !== '3.4.13') throw new Error('lock root DOMPurify is not 3.4.13');
          if (lock.packages?.['node_modules/dompurify']?.version !== '3.4.13') throw new Error('resolved DOMPurify is not 3.4.13');
          if (!lock.packages?.['node_modules/dompurify']?.integrity?.startsWith('sha512-')) throw new Error('DOMPurify lock integrity is missing');
          console.log('DOMPurify 3.4.13 lock metadata verified.');
          NODE
          node scripts/security/check-package-lock-aligned.mjs

      - name: Remove one-shot workflow and commit generated lock
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/tmp-dompurify-lock-regenerator.yml
          git add package.json package-lock.json
          git diff --cached --check
          git diff --cached --quiet && { echo 'Expected dependency changes were not generated.' >&2; exit 1; }
          git commit -m 'fix(deps): upgrade DOMPurify to 3.4.13'
          git push origin HEAD:agent/fix-dompurify-ghsa-55q2-fjhq-7xh7
