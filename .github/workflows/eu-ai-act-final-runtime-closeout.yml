name: EU AI Act Final Runtime Closeout

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/compliance/**'
      - 'docs/compliance/**'
      - '.github/workflows/eu-ai-act-final-runtime-closeout.yml'
      - '.github/workflows/enterprise-readiness-scorecard.yml'
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      confirm_strict_closeout:
        description: 'Type CLOSEOUT to require all final runtime controls'
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: eu-ai-act-final-runtime-closeout-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  closeout:
    name: Validate final 16 runtime points
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      TARGET_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
      SAFE_EVIDENCE_ROOT: artifacts/eu-ai-act-final-runtime/safe-evidence
      RUNTIME_EVIDENCE_ROOT: artifacts/eu-ai-act-final-runtime/final-evidence
      SAFE_COVERAGE_PATH: artifacts/eu-ai-act-safe-runtime-promotion/eu-ai-act-product-coverage.json
      EU_AI_ACT_COVERAGE_JSON: artifacts/eu-ai-act-final-runtime/eu-ai-act-product-coverage.json
      EU_AI_ACT_COVERAGE_MARKDOWN: artifacts/eu-ai-act-final-runtime/eu-ai-act-product-coverage.md
      STRICT_CLOSEOUT: ${{ github.event_name == 'pull_request' && '0' || '1' }}
    steps:
      - name: Checkout exact assessed SHA
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false

      - name: Verify exact assessed checkout
        run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"

      - name: Enforce manual strict confirmation
        if: github.event_name == 'workflow_dispatch'
        run: test '${{ inputs.confirm_strict_closeout }}' = 'CLOSEOUT'

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies deterministically
        run: npm ci --ignore-scripts

      - name: Execute safe runtime contract suite
        run: >-
          npx vitest run
          src/server/ai-governance/decision-engine.test.ts
          src/server/ai-governance/deployer-obligations.test.ts
          src/server/ai-governance/high-risk-provider-data-governance.test.ts
          src/server/ai-governance/annex-iv-technical-documentation.test.ts
          src/server/ai-governance/quality-management-system.test.ts
          src/server/ai-governance/conformity-assessment.test.ts
          src/server/ai-governance/gpai-compliance.test.ts
          src/server/ai-governance/article-50-effective-dates.test.ts
          src/server/ai-governance/article-50-control-plane.test.ts
          src/lib/article-50-deadlines.test.ts
          tests/article-50-operational-api-contract.test.ts
          tests/article-50-operational-migration-contract.test.ts
          tests/article-50-operational-ui-contract.test.ts
          tests/article-50-runtime-evidence-contract.test.ts
          tests/prohibited-practices-operational-api-contract.test.ts
          tests/prohibited-practices-operational-migration-contract.test.ts
          tests/ai-literacy-api-contract.test.ts
          tests/ai-literacy-ui-contract.test.ts
          tests/fria-operational-api-contract.test.ts
          tests/fria-operational-migration-contract.test.ts
          tests/security/incident-operations-evidence.test.ts
          tests/security/platform-controls-runtime-proof.test.mjs
          tests/enterprise/public-ux-evidence.test.ts
          tests/compliance/eu-ai-act-final-runtime-closeout.test.mjs

      - name: Generate shared safe exact-SHA evidence
        env:
          RUNTIME_EVIDENCE_ROOT: ${{ env.SAFE_EVIDENCE_ROOT }}
        run: node scripts/compliance/generate-eu-ai-act-safe-runtime-bundle.mjs

      - name: Generate dedicated Article 50 safe evidence
        env:
          ARTICLE_50_RUNTIME_OUTPUT: ${{ env.SAFE_EVIDENCE_ROOT }}/docs/security/evidence/runtime/article-50-operational-validation.json
        run: node scripts/compliance/generate-article-50-runtime-evidence.mjs

      - name: Generate safe coverage baseline
        env:
          EU_AI_ACT_RUNTIME_EVIDENCE_ROOTS: ${{ env.SAFE_EVIDENCE_ROOT }}
          EU_AI_ACT_COVERAGE_JSON: ${{ env.SAFE_COVERAGE_PATH }}
          EU_AI_ACT_COVERAGE_MARKDOWN: artifacts/eu-ai-act-safe-runtime-promotion/eu-ai-act-product-coverage.md
        run: node scripts/compliance/generate-eu-ai-act-product-coverage.mjs

      - name: Locate trusted exact-SHA Legal Rules runtime artifact
        id: legal_rules
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifact_name="legal-rules-runtime-${TARGET_SHA}"
          response="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${artifact_name}&per_page=100")"
          selection="$(printf '%s' "$response" | jq -r --arg name "$artifact_name" --arg sha "$TARGET_SHA" '
            [.artifacts[] | select(.name == $name and .expired == false and .workflow_run.head_sha == $sha)]
            | sort_by(.created_at)
            | last // empty
            | if type == "object" then "\(.id)\t\(.workflow_run.id)" else "" end
          ')"
          if [ -z "$selection" ]; then
            echo 'found=false' >> "$GITHUB_OUTPUT"
            echo "No immutable Legal Rules runtime artifact exists yet for exact SHA ${TARGET_SHA}."
            exit 0
          fi
          IFS=$'\t' read -r artifact_id source_run_id <<< "$selection"
          [[ "$artifact_id" =~ ^[0-9]+$ ]]
          [[ "$source_run_id" =~ ^[0-9]+$ ]]
          run_json="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${source_run_id}")"
          test "$(printf '%s' "$run_json" | jq -r '.name')" = 'Legal Rules Runtime Validation'
          test "$(printf '%s' "$run_json" | jq -r '.conclusion')" = 'success'
          test "$(printf '%s' "$run_json" | jq -r '.head_sha')" = "$TARGET_SHA"
          test "$(printf '%s' "$run_json" | jq -r '.head_branch // ""')" = 'main'
          source_event="$(printf '%s' "$run_json" | jq -r '.event')"
          case "$source_event" in
            deployment_status|workflow_dispatch) ;;
            *) echo "Untrusted Legal Rules source event: ${source_event}" >&2; exit 1 ;;
          esac
          {
            echo 'found=true'
            echo "artifact_name=${artifact_name}"
            echo "artifact_id=${artifact_id}"
            echo "source_run_id=${source_run_id}"
          } >> "$GITHUB_OUTPUT"

      - name: Download trusted exact-SHA Legal Rules runtime artifact
        if: steps.legal_rules.outputs.found == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ steps.legal_rules.outputs.artifact_name }}
          path: ${{ env.RUNTIME_EVIDENCE_ROOT }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.legal_rules.outputs.source_run_id }}

      - name: Validate trusted Legal Rules runtime overlay
        if: steps.legal_rules.outputs.found == 'true'
        env:
          LEGAL_RULES_PATH: ${{ env.RUNTIME_EVIDENCE_ROOT }}/docs/security/evidence/runtime/legal-rules-validation.json
        run: |
          set -euo pipefail
          test -f "$LEGAL_RULES_PATH"
          test -z "$(find "$RUNTIME_EVIDENCE_ROOT" -type f ! -path "$LEGAL_RULES_PATH" -print -quit)"
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { validateLegalRulesRuntimeEvidenceDocument } from './scripts/compliance/generate-eu-ai-act-product-coverage.mjs';
          const document = JSON.parse(readFileSync(process.env.LEGAL_RULES_PATH, 'utf8'));
          if (!validateLegalRulesRuntimeEvidenceDocument(document, process.env.TARGET_SHA)) {
            throw new Error('downloaded Legal Rules runtime evidence failed exact-SHA validation');
          }
          NODE

      - name: Validate provider failure behavior
        run: npx vitest run tests/enterprise/provider-failure-evidence.test.ts

      - name: Write provider failure proof
        run: |
          mkdir -p artifacts/eu-ai-act-final-runtime
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          writeFileSync('artifacts/eu-ai-act-final-runtime/provider-proof.json', JSON.stringify({
            status: 'VERIFIED',
            targetSha: process.env.TARGET_SHA,
            source: 'tests/enterprise/provider-failure-evidence.test.ts',
          }, null, 2));
          NODE

      - name: Inspect protected main branch controls
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/compliance/build-platform-controls-runtime-proof.mjs

      - name: Build final runtime evidence overlay
        run: node scripts/compliance/generate-eu-ai-act-final-runtime-bundle.mjs

      - name: Generate final promoted product coverage
        env:
          # The coverage generator accepts comma-separated roots. A path-list colon is not supported.
          EU_AI_ACT_RUNTIME_EVIDENCE_ROOTS: ${{ env.SAFE_EVIDENCE_ROOT }},${{ env.RUNTIME_EVIDENCE_ROOT }}
        run: node scripts/compliance/generate-eu-ai-act-product-coverage.mjs

      - name: Enforce report and strict boundaries
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const report = JSON.parse(readFileSync(process.env.EU_AI_ACT_COVERAGE_JSON, 'utf8'));
          if (report.targetSha !== process.env.TARGET_SHA) throw new Error('coverage SHA mismatch');
          if (report.scores.implementationCoverage !== 100 || report.scores.ciVerifiedCoverage !== 100) throw new Error('static coverage regressed');
          // Pull-request closeout may promote readiness (8) and provider assurance (4)
          // above the 80-point synthetic baseline. LEGAL-RULES (4) remains reserved
          // for deployed exact-SHA proof, and PLATFORM-CONTROLS (4) remains blocked
          // when approving-review policy cannot be verified. The report-mode floor is 92.
          if (report.scores.runtimeEvidenceCoverage < 92) throw new Error('final overlay must promote readiness and provider evidence');
          if (process.env.STRICT_CLOSEOUT === '1' && report.scores.runtimeEvidenceCoverage !== 100) throw new Error('strict runtime closeout requires 100%');
          if (report.releaseDecision !== 'EU_AI_ACT_PRODUCT_COVERAGE_NO_GO') throw new Error('human review boundary must remain NO_GO');
          NODE

      - name: Upload exact-SHA final runtime closeout
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: eu-ai-act-final-runtime-closeout-${{ env.TARGET_SHA }}
          path: |
            artifacts/eu-ai-act-final-runtime
            artifacts/eu-ai-act-safe-runtime-promotion
          retention-days: 90
          if-no-files-found: error
