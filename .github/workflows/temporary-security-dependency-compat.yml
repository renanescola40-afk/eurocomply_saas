name: Temporary security dependency compatibility candidate
on:
  push:
    branches:
      - fix/security-dependency-patches-20261101
permissions:
  contents: write
concurrency:
  group: dependency-compat-candidate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - name: Setup Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - name: Regenerate lockfile from reviewed security overrides
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify patched package graph
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const packages = lock.packages ?? {};
          const versions = name => Object.entries(packages)
            .filter(([path]) => path === 'node_modules/' + name || path.endsWith('/node_modules/' + name))
            .map(([path, pkg]) => ({ path, version: pkg.version }));
          const expectations = {
            minimatch: '11.0.1',
            glob: '14.0.2',
            '@sentry/nextjs': '11.10.0',
            '@sentry/node': '11.10.0',
            '@sentry/bundler-plugins': '11.10.0',
          };
          for (const [name, expected] of Object.entries(expectations)) {
            const found = versions(name);
            if (!found.length || found.some(item => item.version !== expected)) {
              throw new Error(name + ': expected all installs at ' + expected + ', found ' + JSON.stringify(found));
            }
            console.log(name + ': ' + found.length + ' install(s) at ' + expected);
          }
          NODE
      - name: Validate package-lock alignment
        run: node scripts/security/check-package-lock-aligned.mjs
      - name: Validate clean install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Commit package-lock only
        shell: bash
        run: |
          set -euo pipefail
          git add package-lock.json
          test "$(git diff --cached --name-only)" = 'package-lock.json'
          if git diff --cached --quiet; then
            echo 'Lockfile already current; no commit needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(deps): lock patched minimatch and Sentry glob graph'
          git push origin "HEAD:${GITHUB_REF_NAME}"
