name: Temporary Fix PR1302 SCIM Groups Gate

on:
  push:
    branches:
      - agent/enterprise-scim-groups-self-service-megapack

permissions:
  contents: write

concurrency:
  group: temporary-fix-pr1302-scim-groups-gate
  cancel-in-progress: false

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]' || contains(github.event.head_commit.message, 'temporary SCIM Groups gate')
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: agent/enterprise-scim-groups-self-service-megapack
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Extend SCIM contract to Groups
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/security/check-enterprise-api-security.mjs')
          source = path.read_text()
          old_routes = """const scimUserRoutes = [
            /src\\/app\\/api\\/scim\\/v2\\/Users(?:\\/\\[id\\])?\\/route\\.ts$/,
          ];"""
          new_routes = """const scimResourceRoutes = [
            /src\\/app\\/api\\/scim\\/v2\\/(?:Users|Groups)(?:\\/\\[id\\])?\\/route\\.ts$/,
          ];"""
          if old_routes not in source:
              raise SystemExit('expected SCIM route contract block not found')
          source = source.replace(old_routes, new_routes)
          source = source.replace(
              'function evaluateScimUserContract(failures, source, path) {\n  if (!isAnyMatch(path, scimUserRoutes)) return false;',
              'function evaluateScimResourceContract(failures, source, path) {\n  if (!isAnyMatch(path, scimResourceRoutes)) return false;',
          )
          source = source.replace(
              'evaluateScimUserContract(failures, source, path)',
              'evaluateScimResourceContract(failures, source, path)',
          )
          if 'scimUserRoutes' in source or 'evaluateScimUserContract' in source:
              raise SystemExit('legacy SCIM Users-only contract remains')
          path.write_text(source)
          PY

      - name: Validate security and focused tests
        run: |
          node scripts/security/check-enterprise-api-security.mjs
          npx vitest run tests/enterprise/enterprise-scim-groups-contract.test.ts
          npm run typecheck

      - name: Commit permanent fix and remove temporary workflow
        run: |
          rm .github/workflows/temporary-fix-pr1302-scim-groups-gate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/security/check-enterprise-api-security.mjs .github/workflows/temporary-fix-pr1302-scim-groups-gate.yml
          git commit -m "fix(security): recognize SCIM Groups bearer contract"
          git push origin HEAD:agent/enterprise-scim-groups-self-service-megapack
