name: Enterprise Closeout Plan

on:
  pull_request:
    paths:
      - 'docs/enterprise/**'
      - 'scripts/enterprise/**'
      - 'tests/enterprise/**'
      - '.github/workflows/enterprise-closeout-plan.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: enterprise-closeout-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-closeout-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run closeout planner contract test
        run: npx vitest run tests/enterprise/enterprise-closeout-plan.test.ts

      - name: Generate enterprise readiness scorecard
        env:
          ENTERPRISE_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/enterprise/generate-readiness-scorecard.mjs

      - name: Build deterministic closeout plan
        id: closeout
        shell: bash
        run: |
          set +e
          node scripts/enterprise/enterprise-closeout-plan.mjs
          exit_code=$?
          set -e
          if [ "$exit_code" -ne 0 ] && [ "$exit_code" -ne 2 ]; then
            exit "$exit_code"
          fi
          echo "open_controls=$([ "$exit_code" -eq 2 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Upload closeout evidence
        uses: actions/upload-artifact@v4
        with:
          name: enterprise-closeout-plan-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            artifacts/enterprise-readiness/enterprise-readiness-scorecard.json
            artifacts/enterprise-readiness/enterprise-readiness-scorecard.md
            artifacts/enterprise-readiness/enterprise-closeout-plan.json
          if-no-files-found: error
          retention-days: 30

      - name: Report truthful gate status
        run: |
          if [ '${{ steps.closeout.outputs.open_controls }}' = 'true' ]; then
            echo 'Enterprise controls remain open. Artifact generated without promoting the release decision.'
          else
            echo 'No enterprise controls remain open in the generated exact-head scorecard.'
          fi
