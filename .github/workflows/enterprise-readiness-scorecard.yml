name: Enterprise Readiness Scorecard

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: enterprise-readiness-scorecard-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  scorecard:
    name: Generate evidence-backed enterprise scorecard
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ASSESSED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact assessed SHA
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ env.ASSESSED_SHA }}
          persist-credentials: false

      - name: Verify exact assessed checkout
        run: test "$(git rev-parse HEAD)" = "$ASSESSED_SHA"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies deterministically
        run: npm ci --ignore-scripts

      - name: Validate evidence override allowlist
        run: node scripts/enterprise/check-evidence-overrides.mjs

      - name: Validate persistent enterprise execution state
        run: node scripts/enterprise/check-persistent-execution-state.mjs

      - name: Test persistent enterprise execution state
        run: >-
          node --test
          tests/enterprise/persistent-execution-state.test.mjs
          tests/enterprise/write-persistent-execution-state.test.mjs

      - name: Validate scorecard and evidence tests
        run: >-
          npx vitest run
          tests/enterprise/enterprise-readiness-scorecard.test.ts
          tests/enterprise/enterprise-readiness-scorecard-orchestration.test.ts
          tests/enterprise/evidence-overrides-guard.test.ts
          tests/enterprise/architecture-review-evidence.test.ts
          tests/enterprise/incident-operations-evidence.test.ts
          tests/enterprise/centralized-logging-alert-evidence.test.ts
          tests/enterprise/public-ux-evidence.test.ts
          tests/enterprise/accessibility-consent-evidence.test.ts
          tests/enterprise/repository-control-evidence.test.ts
          tests/enterprise/admin-boundary-diagnostics.test.ts
          tests/enterprise/account-recovery-evidence.test.ts
          tests/enterprise/provider-failure-evidence.test.ts
          tests/enterprise/step-up-evidence.test.ts
          tests/enterprise/auth-rbac-runtime-evidence-fetch.test.ts
          tests/enterprise/supabase-rls-runtime-evidence-fetch.test.ts
          tests/enterprise/branch-protection-runtime-evidence-fetch.test.ts
          tests/enterprise/final-technical-controls-evidence-fetch.test.ts
          tests/enterprise/recovery-resilience-evidence-fetch.test.ts
          tests/security/supabase-rls-scorecard-evidence.test.ts
          tests/release/production-runtime-scorecard-evidence.test.ts

      - name: Validate scorecard aggregation boundary
        run: >-
          node --test
          tests/enterprise/repository-control-scorecard-aggregation.test.mjs
          tests/enterprise/derived-scorecard-evidence-builder.test.mjs

      - name: Validate distributed rate-limit proof contracts
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/enterprise-readiness
          npx vitest run tests/security/distributed-rate-limit-runtime-proof.test.ts 2>&1 | tee artifacts/enterprise-readiness/distributed-rate-limit-proof-tests.log

      - name: Retain distributed rate-limit proof test diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: distributed-rate-limit-proof-test-diagnostics-${{ env.ASSESSED_SHA }}
          path: artifacts/enterprise-readiness/distributed-rate-limit-proof-tests.log
          if-no-files-found: error
          retention-days: 30

      - name: Build exact-SHA architecture review evidence
        env:
          TARGET_SHA: ${{ env.ASSESSED_SHA }}
        run: node scripts/enterprise/build-architecture-review-evidence.mjs

      - name: Build exact-SHA incident and operations evidence
        env:
          TARGET_SHA: ${{ env.ASSESSED_SHA }}
        run: node scripts/enterprise/build-incident-operations-evidence.mjs

      - name: Build exact-SHA logging and alert evidence
        env:
          TARGET_SHA: ${{ env.ASSESSED_SHA }}
        run: node scripts/enterprise/build-centralized-logging-alert-evidence.mjs

      - name: Retain release evidence diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-documentation-evidence-${{ env.ASSESSED_SHA }}
          path: |
            docs/security/evidence/release/architecture-review.json
            docs/security/evidence/release/incident-response-validation.json
            docs/security/evidence/release/operations-ownership.json
            docs/security/evidence/p1/centralized-logging-alerts.json
          if-no-files-found: error
          retention-days: 90

      - name: Capture exact-SHA GitHub checks
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ env.ASSESSED_SHA }}
          GITHUB_CHECKS_WAIT_MS: '1080000'
        run: node scripts/enterprise/capture-github-checks-evidence.mjs

      - name: Run administrative-client boundary diagnostics
        env:
          TARGET_SHA: ${{ env.ASSESSED_SHA }}
          ADMIN_BOUNDARY_DIAGNOSTICS_PATH: artifacts/enterprise-readiness/admin-boundary-diagnostics.json
        run: node scripts/enterprise/check-admin-boundary-evidence.mjs

      - name: Retain administrative-client boundary diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: admin-boundary-diagnostics-${{ env.ASSESSED_SHA }}
          path: artifacts/enterprise-readiness/admin-boundary-diagnostics.json
          if-no-files-found: error
          retention-days: 30

      - name: Build exact-SHA repository control evidence
        env:
          TARGET_SHA: ${{ env.ASSESSED_SHA }}
          GITHUB_CHECKS_EVIDENCE_PATH: artifacts/enterprise-readiness/github-checks-evidence.json
        run: node scripts/enterprise/run-repository-control-evidence-for-scorecard.mjs

      - name: Retain repository control evidence diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: repository-control-evidence-${{ env.ASSESSED_SHA }}
          path: |
            docs/security/evidence/runtime/origin-guard-validation.json
            docs/security/evidence/runtime/authorization-bola-validation.json
            docs/security/evidence/runtime/security-headers-validation.json
            docs/security/evidence/runtime/no-store-validation.json
            docs/security/evidence/runtime/supabase-admin-boundary-validation.json
            docs/security/evidence/runtime/export-tenant-isolation-validation.json
            docs/security/evidence/runtime/centralized-logging-validation.json
            docs/security/evidence/runtime/request-id-validation.json
            docs/security/evidence/runtime/internal-jobs-validation.json
            docs/security/evidence/release/vulnerability-disclosure-validation.json
          if-no-files-found: error
          retention-days: 90

      - name: Build exact-SHA public UX and localization evidence
        env:
          TARGET_SHA: ${{ env.ASSESSED_SHA }}
          GITHUB_CHECKS_EVIDENCE_PATH: artifacts/enterprise-readiness/github-checks-evidence.json
        run: node scripts/enterprise/run-derived-scorecard-evidence-builder.mjs publicUx

      - name: Build exact-SHA accessibility and analytics consent evidence
        env:
          TARGET_SHA: ${{ env.ASSESSED_SHA }}
          GITHUB_CHECKS_EVIDENCE_PATH: artifacts/enterprise-readiness/github-checks-evidence.json
        run: node scripts/enterprise/run-derived-scorecard-evidence-builder.mjs accessibilityConsent

      - name: Build exact-SHA account recovery evidence
        env:
          TARGET_SHA: ${{ env.ASSESSED_SHA }}
          GITHUB_CHECKS_EVIDENCE_PATH: artifacts/enterprise-readiness/github-checks-evidence.json
        run: node scripts/enterprise/run-derived-scorecard-evidence-builder.mjs accountRecovery

      - name: Build exact-SHA provider failure evidence
        env:
          TARGET_SHA: ${{ env.ASSESSED_SHA }}
          GITHUB_CHECKS_EVIDENCE_PATH: artifacts/enterprise-readiness/github-checks-evidence.json
        run: node scripts/enterprise/run-derived-scorecard-evidence-builder.mjs providerFailure

      - name: Build exact-SHA sensitive-action step-up evidence
        env:
          TARGET_SHA: ${{ env.ASSESSED_SHA }}
          GITHUB_CHECKS_EVIDENCE_PATH: artifacts/enterprise-readiness/github-checks-evidence.json
        run: node scripts/enterprise/run-derived-scorecard-evidence-builder.mjs stepUp

      - name: Validate sensitive-action step-up evidence contract
        shell: bash
        run: |
          set -euo pipefail
          evidence=docs/security/evidence/p1/step-up-sensitive-actions.json
          status="$(jq -r '.status // "INVALID"' "$evidence")"
          if [ "$status" = "Open" ]; then
            echo "Sensitive-action step-up evidence remains NOT_VERIFIED for $ASSESSED_SHA."
          else
            node scripts/security/check-p1-step-up-evidence.mjs "$evidence"
          fi

      - name: Retrieve exact-SHA distributed rate-limit runtime evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ env.ASSESSED_SHA }}
        run: node scripts/enterprise/fetch-distributed-rate-limit-evidence.mjs

      - name: Validate distributed rate-limit evidence when available
        env:
          ENTERPRISE_EXPECTED_SHA: ${{ env.ASSESSED_SHA }}
        run: node scripts/security/check-p1-rate-limit-evidence.mjs

      - name: Retrieve exact-SHA Auth RBAC runtime evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ env.ASSESSED_SHA }}
        run: node scripts/enterprise/fetch-auth-rbac-evidence.mjs

      - name: Derive and validate Auth RBAC scorecard evidence when available
        shell: bash
        run: |
          set -euo pipefail
          if test -f docs/security/evidence/runtime/auth-rbac-final-validation.json; then
            node scripts/security/write-auth-rbac-scorecard-evidence.mjs
            node scripts/security/check-auth-rbac-scorecard-evidence.mjs
          else
            rm -f docs/security/evidence/runtime/auth-rbac-validation.json
            echo "Auth/RBAC runtime evidence remains NOT_VERIFIED for $ASSESSED_SHA."
          fi

      - name: Retrieve exact-SHA Supabase RLS runtime evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ env.ASSESSED_SHA }}
        run: node scripts/enterprise/fetch-supabase-rls-evidence.mjs

      - name: Derive and validate Supabase RLS scorecard evidence when available
        shell: bash
        run: |
          set -euo pipefail
          if test -f docs/security/evidence/runtime/supabase-live-rls-validation.json; then
            ENTERPRISE_EXPECTED_SHA="$ASSESSED_SHA" node scripts/security/write-supabase-rls-scorecard-evidence.mjs
            ENTERPRISE_EXPECTED_SHA="$ASSESSED_SHA" node scripts/security/check-supabase-rls-scorecard-evidence.mjs
          else
            rm -f docs/security/evidence/runtime/supabase-rls-validation.json
            echo "Supabase RLS runtime evidence remains NOT_VERIFIED for $ASSESSED_SHA."
          fi

      - name: Retrieve exact-SHA production runtime evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ env.ASSESSED_SHA }}
        run: node scripts/enterprise/fetch-production-runtime-evidence.mjs

      - name: Report unavailable production runtime evidence
        shell: bash
        run: |
          set -euo pipefail
          if ! test -f docs/security/evidence/runtime/production-runtime-validation.json; then
            echo "Production runtime evidence remains NOT_VERIFIED for $ASSESSED_SHA."
          fi

      - name: Retrieve exact-SHA branch protection runtime evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ env.ASSESSED_SHA }}
        run: node scripts/enterprise/fetch-branch-protection-runtime-evidence.mjs

      - name: Remove stale branch protection evidence when unavailable
        shell: bash
        run: |
          set -euo pipefail
          if ! test -f docs/security/evidence/runtime/branch-protection-validation.json; then
            rm -f docs/security/evidence/runtime/branch-protection-validation.json
            echo "Branch protection runtime evidence remains NOT_VERIFIED for $ASSESSED_SHA."
          fi

      - name: Retrieve exact-SHA final technical controls evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ env.ASSESSED_SHA }}
        run: node scripts/enterprise/fetch-final-technical-controls-evidence.mjs

      - name: Retrieve exact-SHA recovery resilience evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ env.ASSESSED_SHA }}
        run: node scripts/enterprise/fetch-recovery-resilience-evidence.mjs

      - name: Validate recovery evidence when available
        shell: bash
        run: |
          set -euo pipefail
          if test -f docs/security/evidence/runtime/rollback-validation.json && test -f docs/security/evidence/p1/backup-restore-tested.json; then
            ENTERPRISE_EXPECTED_SHA="$ASSESSED_SHA" node scripts/enterprise/check-recovery-scorecard-evidence.mjs
          else
            rm -f docs/security/evidence/runtime/rollback-validation.json docs/security/evidence/p1/backup-restore-tested.json
            echo "Recovery resilience evidence remains NOT_VERIFIED for $ASSESSED_SHA."
          fi

      - name: Retain product provider identity tenancy and runtime evidence diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: product-provider-identity-tenancy-runtime-evidence-${{ env.ASSESSED_SHA }}
          path: |
            docs/security/evidence/runtime/ux-acceptance-validation.json
            docs/security/evidence/runtime/localization-validation.json
            docs/security/evidence/runtime/accessibility-validation.json
            docs/security/evidence/runtime/analytics-consent-validation.json
            docs/security/evidence/runtime/auth-recovery-validation.json
            docs/security/evidence/runtime/auth-rbac-final-validation.json
            docs/security/evidence/runtime/auth-rbac-validation.json
            docs/security/evidence/runtime/supabase-live-rls-validation.json
            docs/security/evidence/runtime/supabase-rls-validation.json
            docs/security/evidence/runtime/provider-failure-classification.json
            docs/security/evidence/runtime/security-headers-validation.json
            docs/security/evidence/runtime/no-store-validation.json
            docs/security/evidence/runtime/production-runtime-validation.json
            docs/security/evidence/runtime/branch-protection-validation.json
            docs/security/evidence/runtime/security-events-validation.json
            docs/security/evidence/runtime/storage-tenant-isolation-validation.json
            docs/security/evidence/runtime/rollback-validation.json
            docs/security/evidence/p1/backup-restore-tested.json
            docs/security/evidence/p1/step-up-sensitive-actions.json
            docs/security/evidence/p1/distributed-rate-limit-sensitive-endpoints.json
          if-no-files-found: warn
          retention-days: 90

      - name: Generate scorecard
        env:
          ENTERPRISE_EXPECTED_SHA: ${{ env.ASSESSED_SHA }}
          GITHUB_CHECKS_EVIDENCE_PATH: artifacts/enterprise-readiness/github-checks-evidence.json
        run: node scripts/enterprise/generate-readiness-scorecard.mjs

      - name: Derive exact-SHA persistent execution state artifact
        env:
          ENTERPRISE_EXPECTED_SHA: ${{ env.ASSESSED_SHA }}
        run: node scripts/enterprise/write-persistent-execution-state.mjs

      - name: Publish job summary
        run: cat artifacts/enterprise-readiness/enterprise-readiness-scorecard.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload scorecard artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: enterprise-readiness-scorecard-${{ env.ASSESSED_SHA }}
          path: |
            artifacts/enterprise-readiness/
            docs/security/evidence/release/architecture-review.json
            docs/security/evidence/release/incident-response-validation.json
            docs/security/evidence/release/operations-ownership.json
            docs/security/evidence/release/vulnerability-disclosure-validation.json
            docs/security/evidence/p1/centralized-logging-alerts.json
            docs/security/evidence/p1/step-up-sensitive-actions.json
            docs/security/evidence/p1/distributed-rate-limit-sensitive-endpoints.json
            docs/security/evidence/runtime/origin-guard-validation.json
            docs/security/evidence/runtime/authorization-bola-validation.json
            docs/security/evidence/runtime/supabase-admin-boundary-validation.json
            docs/security/evidence/runtime/export-tenant-isolation-validation.json
            docs/security/evidence/runtime/centralized-logging-validation.json
            docs/security/evidence/runtime/request-id-validation.json
            docs/security/evidence/runtime/internal-jobs-validation.json
            docs/security/evidence/runtime/ux-acceptance-validation.json
            docs/security/evidence/runtime/localization-validation.json
            docs/security/evidence/runtime/accessibility-validation.json
            docs/security/evidence/runtime/analytics-consent-validation.json
            docs/security/evidence/runtime/auth-recovery-validation.json
            docs/security/evidence/runtime/auth-rbac-final-validation.json
            docs/security/evidence/runtime/auth-rbac-validation.json
            docs/security/evidence/runtime/supabase-live-rls-validation.json
            docs/security/evidence/runtime/supabase-rls-validation.json
            docs/security/evidence/runtime/provider-failure-classification.json
            docs/security/evidence/runtime/security-headers-validation.json
            docs/security/evidence/runtime/no-store-validation.json
            docs/security/evidence/runtime/production-runtime-validation.json
            docs/security/evidence/runtime/branch-protection-validation.json
            docs/security/evidence/runtime/security-events-validation.json
            docs/security/evidence/runtime/storage-tenant-isolation-validation.json
            docs/security/evidence/runtime/rollback-validation.json
            docs/security/evidence/p1/backup-restore-tested.json
          if-no-files-found: warn
          retention-days: 90

      - name: Enforce enterprise scorecard decision
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          scorecard=artifacts/enterprise-readiness/enterprise-readiness-scorecard.json
          test -f "$scorecard"
          decision="$(jq -r '.releaseDecision // "NO_GO"' "$scorecard")"
          echo "Enterprise scorecard terminal decision: $decision"
          test "$decision" = "GO"
