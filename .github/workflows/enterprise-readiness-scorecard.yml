name: Enterprise Readiness Scorecard

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: enterprise-readiness-scorecard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scorecard:
    name: Generate evidence-backed enterprise scorecard
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies deterministically
        run: npm ci --ignore-scripts

      - name: Validate scorecard tests
        run: npx vitest run tests/enterprise/enterprise-readiness-scorecard.test.ts

      - name: Generate scorecard
        run: node scripts/enterprise/generate-readiness-scorecard.mjs

      - name: Publish job summary
        run: cat artifacts/enterprise-readiness/enterprise-readiness-scorecard.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload scorecard artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: enterprise-readiness-scorecard-${{ github.sha }}
          path: artifacts/enterprise-readiness/
          if-no-files-found: error
          retention-days: 90
