name: Agent Nanoid Lock Refresh

on:
  push:
    branches:
      - agent/nanoid-security-closeout
    paths:
      - '.github/workflows/agent-nanoid-lock-refresh.yml'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm

      - name: Generate minimal audit remediation in lockfile
        run: npm audit fix --package-lock-only --ignore-scripts

      - name: Verify high/moderate audit gate
        run: npm audit --audit-level=moderate

      - name: Verify patched Nano ID resolution
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -e "const l=require('./package-lock.json'); console.log(l.packages['node_modules/nanoid']?.version || '')")"
          test -n "$version"
          node -e "const v=process.argv[1].split('.').map(Number); if (v[0] < 3 || (v[0] === 3 && (v[1] < 3 || (v[1] === 3 && v[2] < 18)))) process.exit(1)" "$version"
          echo "Resolved nanoid=$version"

      - name: Commit only regenerated lockfile when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo 'package-lock.json already remediated'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- package-lock.json
          test "$(git diff --cached --name-only)" = 'package-lock.json'
          git commit -m 'fix(security): remediate nanoid advisory in lockfile'
          git push origin HEAD:agent/nanoid-security-closeout

      - name: Upload regenerated lockfile
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: nanoid-security-lockfile-${{ github.sha }}
          path: package-lock.json
          if-no-files-found: error
          retention-days: 7
