name: P0 Commit Lockfile

on:
  workflow_dispatch:
  push:
    branches:
      - security/enterprise-full-security-suite
    paths:
      - '.github/workflows/p0-commit-lockfile.yml'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: write

concurrency:
  group: p0-commit-lockfile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  p0-commit-lockfile:
    name: Generate and commit deterministic npm lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: true

      - name: Show runner Node.js and npm versions
        run: |
          node --version
          npm --version

      - name: Generate lockfile without lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify generated lockfile works with npm ci
        run: npm ci --ignore-scripts

      - name: Verify no floating dependency specs remain
        run: node scripts/security/list-floating-dependencies.mjs

      - name: Verify lockfile readiness
        run: node scripts/security/check-lockfile-required.mjs

      - name: Show generated lockfile diff summary
        run: git diff --stat -- package-lock.json package.json

      - name: Commit deterministic lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "No package-lock.json changes to commit."
          else
            git commit -m "security: refresh deterministic npm lockfile"
            git push
          fi
