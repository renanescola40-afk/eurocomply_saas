name: Product FRIA Ephemeral Runtime QA

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/product-fria-ephemeral-qa.yml'
      - 'next.config.ts'
      - 'playwright.config.ts'
      - 'scripts/product/create-fria-ephemeral-fixtures.mjs'
      - 'scripts/product/sanitize-fria-playwright-report.mjs'
      - 'tests/e2e/fria-lifecycle-runtime-acceptance.spec.ts'
      - 'tests/e2e/payment-first-runtime-global-setup.ts'
      - 'src/middleware.ts'
      - 'src/hooks/useAuth.ts'
      - 'src/integrations/supabase/**'
      - 'src/app/[locale]/layout.tsx'
      - 'src/app/[locale]/pricing/**'
      - 'src/app/[locale]/signup/**'
      - 'src/app/[locale]/login/**'
      - 'src/app/[locale]/security/**'
      - 'src/app/[locale]/status/**'
      - 'src/app/[locale]/risck-comply-home/**'
      - 'src/app/[locale]/ai-systems/**'
      - 'src/app/[locale]/dashboard/layout.tsx'
      - 'src/app/[locale]/dashboard/organizations/**'
      - 'src/app/[locale]/dashboard/fria/**'
      - 'src/app/[locale]/dashboard/evidence/**'
      - 'src/app/api/ai-governance/fria/route.ts'
      - 'src/app/api/security/settings/route.ts'
      - 'src/lib/security/commercial-route-policy.ts'
      - 'src/server/security/commercial-access.ts'
      - 'src/server/security/api-commercial-policy.ts'
      - 'src/server/security/api-guards.ts'
      - 'src/server/security/rbac.ts'
      - 'src/server/queries/subscription.ts'
      - 'src/server/billing/subscription-authority.ts'
      - 'src/lib/billing/plans.ts'
      - 'src/lib/i18n/commercial-surface-copy.ts'
      - 'src/lib/i18n/pricing-commercial-truth.ts'
      - 'src/lib/evidence/**'
      - 'supabase/migrations/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/product-fria-ephemeral-qa.yml'
      - 'next.config.ts'
      - 'playwright.config.ts'
      - 'scripts/product/create-fria-ephemeral-fixtures.mjs'
      - 'scripts/product/sanitize-fria-playwright-report.mjs'
      - 'tests/e2e/fria-lifecycle-runtime-acceptance.spec.ts'
      - 'tests/e2e/payment-first-runtime-global-setup.ts'
      - 'src/middleware.ts'
      - 'src/hooks/useAuth.ts'
      - 'src/integrations/supabase/**'
      - 'src/app/[locale]/layout.tsx'
      - 'src/app/[locale]/pricing/**'
      - 'src/app/[locale]/signup/**'
      - 'src/app/[locale]/login/**'
      - 'src/app/[locale]/security/**'
      - 'src/app/[locale]/status/**'
      - 'src/app/[locale]/risck-comply-home/**'
      - 'src/app/[locale]/ai-systems/**'
      - 'src/app/[locale]/dashboard/layout.tsx'
      - 'src/app/[locale]/dashboard/organizations/**'
      - 'src/app/[locale]/dashboard/fria/**'
      - 'src/app/[locale]/dashboard/evidence/**'
      - 'src/app/api/ai-governance/fria/route.ts'
      - 'src/app/api/security/settings/route.ts'
      - 'src/lib/security/commercial-route-policy.ts'
      - 'src/server/security/commercial-access.ts'
      - 'src/server/security/api-commercial-policy.ts'
      - 'src/server/security/api-guards.ts'
      - 'src/server/security/rbac.ts'
      - 'src/server/queries/subscription.ts'
      - 'src/server/billing/subscription-authority.ts'
      - 'src/lib/billing/plans.ts'
      - 'src/lib/i18n/commercial-surface-copy.ts'
      - 'src/lib/i18n/pricing-commercial-truth.ts'
      - 'src/lib/evidence/**'
      - 'supabase/migrations/**'

permissions:
  contents: read

concurrency:
  group: product-fria-ephemeral-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: true

jobs:
  fria-runtime:
    name: Disposable final customer journey + FRIA lifecycle
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      EXPECTED_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      E2E_BASE_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      SITE_URL: http://127.0.0.1:3000

    steps:
      - name: Checkout exact assessed SHA without credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
          persist-credentials: false

      - name: Verify exact assessed SHA
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_HEAD_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install application dependencies
        run: npm ci --ignore-scripts

      - name: Install Chromium for focused Playwright acceptance
        run: npx playwright install --with-deps chromium

      - name: Set up pinned Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520
        with:
          version: 2.101.0

      - name: Install PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Start reviewed exact-SHA disposable database
        shell: bash
        run: |
          set -euo pipefail
          node scripts/recovery/run-reviewed-ephemeral-schema-boundary-v4.mjs

      - name: Verify published disposable database bindings
        shell: bash
        run: |
          set -euo pipefail
          test "${RECOVERY_EPHEMERAL_DATABASE_PROVISIONED:-}" = 'true'
          test "${RECOVERY_EPHEMERAL_DATABASE_MODE:-}" = 'project-schema'
          test -n "${RECOVERY_EPHEMERAL_WORKDIR:-}"
          test "${RECOVERY_EPHEMERAL_MIGRATION_HISTORY_CANONICAL:-}" = 'false'
          test "${RECOVERY_EPHEMERAL_MIGRATION_COUNT:-0}" -gt 0
          test -n "${RECOVERY_ISOLATED_DATABASE_URL:-}"
          applied_count="$(psql "$RECOVERY_ISOLATED_DATABASE_URL" --no-psqlrc --tuples-only --no-align --set ON_ERROR_STOP=1 --command 'select count(*) from supabase_migrations.schema_migrations;' | tr -d '[:space:]')"
          [[ "$applied_count" =~ ^[0-9]+$ ]]
          test "$applied_count" -gt 0
          echo "E2E_FRIA_PRE_RESTART_MIGRATION_COUNT=$applied_count" >> "$GITHUB_ENV"

      - name: Restart disposable database as minimal local Auth and REST stack
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RECOVERY_EPHEMERAL_WORKDIR:-}"
          test -n "${RECOVERY_ISOLATED_DATABASE_URL:-}"
          test "${E2E_FRIA_PRE_RESTART_MIGRATION_COUNT:-0}" -gt 0

          # `supabase db start` intentionally provisions only Postgres. A direct
          # `supabase start` sees that project as already running and leaves Auth,
          # Kong and PostgREST stopped. Stop with backup semantics first so the
          # exact-SHA schema volume is preserved, then start only the services
          # required for authenticated Product acceptance.
          supabase --workdir "$RECOVERY_EPHEMERAL_WORKDIR" stop
          supabase --workdir "$RECOVERY_EPHEMERAL_WORKDIR" start \
            -x realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

          post_restart_count="$(psql "$RECOVERY_ISOLATED_DATABASE_URL" --no-psqlrc --tuples-only --no-align --set ON_ERROR_STOP=1 --command 'select count(*) from supabase_migrations.schema_migrations;' | tr -d '[:space:]')"
          [[ "$post_restart_count" =~ ^[0-9]+$ ]]
          test "$post_restart_count" = "$E2E_FRIA_PRE_RESTART_MIGRATION_COUNT"

          fria_table="$(psql "$RECOVERY_ISOLATED_DATABASE_URL" --no-psqlrc --tuples-only --no-align --set ON_ERROR_STOP=1 --command "select coalesce(to_regclass('public.ai_fria_assessments')::text, '');" | tr -d '[:space:]')"
          test "$fria_table" = 'ai_fria_assessments'

          evidence_table="$(psql "$RECOVERY_ISOLATED_DATABASE_URL" --no-psqlrc --tuples-only --no-align --set ON_ERROR_STOP=1 --command "select coalesce(to_regclass('public.evidence_items')::text, '');" | tr -d '[:space:]')"
          test "$evidence_table" = 'evidence_items'

          supabase --workdir "$RECOVERY_EPHEMERAL_WORKDIR" status -o env > "$RUNNER_TEMP/fria-supabase-status.env"

      - name: Export masked loopback Supabase runtime configuration
        shell: bash
        run: |
          set -euo pipefail
          STATUS_FILE="$RUNNER_TEMP/fria-supabase-status.env" python - <<'PY'
          import os
          import shlex
          from pathlib import Path
          from urllib.parse import urlparse

          values = {}
          for raw_line in Path(os.environ['STATUS_FILE']).read_text(encoding='utf-8').splitlines():
              if '=' not in raw_line:
                  continue
              key, raw_value = raw_line.split('=', 1)
              key = key.strip()
              raw_value = raw_value.strip()
              try:
                  parsed = shlex.split(raw_value)
                  value = parsed[0] if parsed else ''
              except ValueError:
                  value = raw_value.strip('"\'')
              values[key] = value

          api_url = values.get('API_URL', '')
          anon_key = values.get('ANON_KEY', '')
          service_role = values.get('SERVICE_ROLE_KEY', '')
          host = urlparse(api_url).hostname
          if host not in {'127.0.0.1', 'localhost', '::1'}:
              raise SystemExit('Local Supabase API_URL is not loopback')
          if not anon_key or not service_role:
              raise SystemExit('Local Supabase status did not expose required runtime keys')

          for value in (anon_key, service_role):
              print(f'::add-mask::{value}')

          exports = {
              'NEXT_PUBLIC_SUPABASE_URL': api_url,
              'NEXT_PUBLIC_SUPABASE_ANON_KEY': anon_key,
              'SUPABASE_URL': api_url,
              'SUPABASE_ANON_KEY': anon_key,
              'SUPABASE_SERVICE_ROLE_KEY': service_role,
              'E2E_FRIA_RUNTIME_EVIDENCE_PATH': os.path.join(os.environ['RUNNER_TEMP'], 'fria-runtime-evidence.json'),
          }
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as handle:
              for key, value in exports.items():
                  handle.write(f'{key}={value}\n')
          PY
          rm -f "$RUNNER_TEMP/fria-supabase-status.env"

      - name: Verify local Auth and REST endpoints
        shell: bash
        run: |
          set -euo pipefail
          test -n "${NEXT_PUBLIC_SUPABASE_URL:-}"
          test -n "${SUPABASE_ANON_KEY:-}"
          curl --fail --silent --show-error "$NEXT_PUBLIC_SUPABASE_URL/auth/v1/health" >/dev/null
          curl --fail --silent --show-error \
            --header "apikey: $SUPABASE_ANON_KEY" \
            "$NEXT_PUBLIC_SUPABASE_URL/rest/v1/" >/dev/null

      - name: Create disposable licensed and unlicensed Product identities
        run: node scripts/product/create-fria-ephemeral-fixtures.mjs

      - name: Start application against loopback Supabase
        shell: bash
        run: |
          set -euo pipefail
          npm run dev > "$RUNNER_TEMP/fria-next.log" 2>&1 &
          next_pid=$!
          echo "$next_pid" > "$RUNNER_TEMP/fria-next.pid"
          ready=false
          for _ in $(seq 1 90); do
            if ! kill -0 "$next_pid" 2>/dev/null; then
              echo 'Product QA application process exited before readiness.' >&2
              tail -n 200 "$RUNNER_TEMP/fria-next.log" >&2 || true
              exit 1
            fi
            if curl --fail --silent --show-error "$E2E_BASE_URL/en/login" >/dev/null; then
              ready=true
              break
            fi
            sleep 2
          done
          if [ "$ready" != 'true' ]; then
            echo 'Product QA application did not become ready within the bounded startup window.' >&2
            tail -n 200 "$RUNNER_TEMP/fria-next.log" >&2 || true
            exit 1
          fi

      - name: Execute final customer journey and FRIA lifecycle acceptance
        shell: bash
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ runner.temp }}/fria-playwright-raw.json
        run: |
          set -euo pipefail
          test -n "${E2E_FRIA_OWNER_EMAIL:-}"
          test -n "${E2E_FRIA_OWNER_PASSWORD:-}"
          test -n "${E2E_FRIA_REVIEWER_EMAIL:-}"
          test -n "${E2E_FRIA_APPROVER_EMAIL:-}"
          test -n "${E2E_FRIA_APPROVER_PASSWORD:-}"
          test -n "${E2E_UNLICENSED_OWNER_EMAIL:-}"
          test -n "${E2E_UNLICENSED_OWNER_PASSWORD:-}"
          test "${E2E_ALLOW_SYNTHETIC_APP_WRITES:-}" = 'true'
          test "${E2E_FRIA_COMMERCIAL_AUTHORITY_VERIFIED:-}" = 'true'
          test "${E2E_FRIA_UNLICENSED_AUTHORITY_VERIFIED:-}" = 'true'
          test "${E2E_FRIA_EVIDENCE_VAULT_SCHEMA_VERIFIED:-}" = 'true'
          rm -f "$E2E_FRIA_RUNTIME_EVIDENCE_PATH"
          if ! npx playwright test tests/e2e/fria-lifecycle-runtime-acceptance.spec.ts --project=chromium --reporter=line,github,json --retries=1; then
            app_healthy=false
            auth_healthy=false
            if curl --fail --silent --show-error "$E2E_BASE_URL/en/login" >/dev/null; then
              app_healthy=true
            fi
            if curl --fail --silent --show-error "$NEXT_PUBLIC_SUPABASE_URL/auth/v1/health" >/dev/null; then
              auth_healthy=true
            fi
            RAW="$PLAYWRIGHT_JSON_OUTPUT_NAME" \
              OUTPUT="$RUNNER_TEMP/fria-playwright-diagnostics.json" \
              APP_HEALTHY="$app_healthy" \
              AUTH_HEALTHY="$auth_healthy" \
              node scripts/product/sanitize-fria-playwright-report.mjs
            echo "::error title=FRIA runtime acceptance failed::Product QA sanitized failure diagnostic: app_healthy=$app_healthy auth_healthy=$auth_healthy"
            exit 1
          fi
          rm -f "$PLAYWRIGHT_JSON_OUTPUT_NAME"

      - name: Upload sanitized FRIA failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: product-fria-failure-${{ env.EXPECTED_HEAD_SHA }}
          path: ${{ runner.temp }}/fria-playwright-diagnostics.json
          if-no-files-found: warn
          retention-days: 14

      - name: Require executed sanitized final Product evidence
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s "$E2E_FRIA_RUNTIME_EVIDENCE_PATH" ]; then
            echo "::error title=Missing FRIA runtime evidence::The runtime acceptance did not emit the required sanitized evidence file."
            exit 1
          fi
          EVIDENCE="$E2E_FRIA_RUNTIME_EVIDENCE_PATH" EXPECTED="$EXPECTED_HEAD_SHA" node - <<'NODE'
          const fs = require('node:fs');
          const evidence = JSON.parse(fs.readFileSync(process.env.EVIDENCE, 'utf8'));
          if (evidence.schema !== 'risck-comply.product-fria-runtime-acceptance.v2') throw new Error('unexpected_evidence_schema');
          if (evidence.outcome !== 'passed') throw new Error('fria_runtime_not_passed');
          if (evidence.targetSha !== process.env.EXPECTED) throw new Error('fria_runtime_sha_mismatch');
          const requiredChecks = [
            'localizedPricingRendered',
            'publicPricingRendered',
            'professionalPlanCtaRendered',
            'trustCenterRendered',
            'publicStatusRendered',
            'commercialAuthorityVerified',
            'unlicensedAuthorityVerified',
            'unlicensedPaidDashboardDenied',
            'unlicensedTopLevelProductDenied',
            'unlicensedBillingRecoveryReachable',
            'evidenceVaultSchemaVerified',
            'ownerAuthenticated',
            'legacyHomeConvergedToEnterpriseShell',
            'enterpriseShellRendered',
            'responsiveShellVerified',
            'topLevelAiSystemUsesEnterpriseShell',
            'aiSystemCreated',
            'assessmentCreated',
            'humanReviewerAssigned',
            'distinctApproverAssigned',
            'legalReviewCompleted',
            'fria01EvidenceSubmitted',
            'fria15EvidenceSubmitted',
            'evidenceVaultRendered',
            'evidenceVaultItemCreated',
            'approverAuthenticatedSeparately',
            'approvalPersisted',
            'approvedStateImmutable',
          ];
          for (const key of requiredChecks) {
            if (evidence.checks?.[key] !== true) throw new Error(`fria_runtime_check_missing_${key}`);
          }
          if (Object.keys(evidence.checks ?? {}).length !== requiredChecks.length) throw new Error('fria_runtime_unexpected_check_set');
          if (evidence.evidenceIntegrity?.syntheticWritesExplicitlyEnabled !== true) throw new Error('synthetic_write_boundary_missing');
          for (const key of ['credentialsStored','emailsStored','userIdentifiersStored','organizationIdentifiersStored','rawProviderResponsesStored']) {
            if (evidence.evidenceIntegrity?.[key] !== false) throw new Error(`unsafe_evidence_${key}`);
          }
          NODE

      - name: Upload sanitized final Product runtime evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: product-fria-runtime-${{ env.EXPECTED_HEAD_SHA }}
          path: ${{ runner.temp }}/fria-runtime-evidence.json
          if-no-files-found: error
          retention-days: 30

      - name: Stop disposable runtime
        if: always()
        shell: bash
        run: |
          set +e
          if [ -f "$RUNNER_TEMP/fria-next.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/fria-next.pid")" 2>/dev/null || true
          fi
          node scripts/recovery/manage-ephemeral-recovery-database.mjs stop
          rm -f "$RUNNER_TEMP/fria-next.log" "$RUNNER_TEMP/fria-next.pid" "$RUNNER_TEMP/fria-supabase-status.env"
