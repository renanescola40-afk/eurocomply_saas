name: Apply regenerated sharp lockfile

on:
  push:
    branches:
      - fix/sharp-ghsa-wq5f-xc86-pv6w-20261006

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Regenerate lockfile
        run: npm install --package-lock-only --ignore-scripts --fund=false --audit=false
      - name: Commit lockfile if changed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already synchronized"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'chore: regenerate package lock for sharp 0.35.5'
          git push
