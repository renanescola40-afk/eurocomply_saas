name: Temporary fix PR1299 lockfile

on:
  push:
    branches:
      - agent/incremental-safe-runtime-promotion-megapack
    paths:
      - .github/workflows/temporary-fix-pr1299-lockfile.yml

permissions:
  contents: write

concurrency:
  group: temporary-fix-pr1299-lockfile
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: agent/incremental-safe-runtime-promotion-megapack
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Regenerate secure lockfile
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund fast-uri@^3.1.3
          node - <<'NODE'
          const lock = require('./package-lock.json');
          const version = lock.packages?.['node_modules/fast-uri']?.version;
          if (!version) throw new Error('fast-uri missing from lockfile');
          const [major, minor, patch] = version.split('.').map(Number);
          if (major < 3 || (major === 3 && minor < 1) || (major === 3 && minor === 1 && patch < 3)) {
            throw new Error(`fast-uri remains vulnerable: ${version}`);
          }
          console.log(`fast-uri secured at ${version}`);
          NODE
          npm audit --audit-level=moderate

      - name: Commit lockfile and remove temporary workflow
        run: |
          set -euo pipefail
          rm .github/workflows/temporary-fix-pr1299-lockfile.yml
          git config user.name "pr1299-lockfile-fix[bot]"
          git config user.email "pr1299-lockfile-fix@users.noreply.github.com"
          git add package-lock.json .github/workflows/temporary-fix-pr1299-lockfile.yml
          git diff --cached --check
          git commit -m "fix(deps): secure fast-uri lockfile for runtime promotion"
          git push origin HEAD:agent/incremental-safe-runtime-promotion-megapack
