name: Temporary fix PR1299 lockfile

on:
  pull_request:
    types: [synchronize]
    branches: [main]
    paths:
      - .github/workflows/temporary-fix-pr1299-lockfile.yml

permissions:
  contents: write

concurrency:
  group: temporary-fix-pr1299-lockfile
  cancel-in-progress: false

jobs:
  repair:
    if: github.event.pull_request.number == 1299 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Generate sanitized audit diagnosis
        run: |
          set -euo pipefail
          npm audit fix --package-lock-only --ignore-scripts --no-fund || true
          npm audit --json > .tmp-pr1299-audit.json || true
          node - <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('.tmp-pr1299-audit.json', 'utf8'));
          const vulnerabilities = Object.entries(report.vulnerabilities || {}).map(([name, item]) => ({
            name,
            severity: item.severity,
            direct: item.isDirect === true,
            range: item.range,
            fixAvailable: item.fixAvailable === true
              ? true
              : item.fixAvailable && typeof item.fixAvailable === 'object'
                ? { name: item.fixAvailable.name, version: item.fixAvailable.version, major: item.fixAvailable.isSemVerMajor === true }
                : false,
            via: Array.isArray(item.via)
              ? item.via.map((entry) => typeof entry === 'string' ? entry : ({ source: entry.source, name: entry.name, severity: entry.severity, range: entry.range }))
              : [],
          }));
          fs.writeFileSync('.tmp-pr1299-audit-summary.json', JSON.stringify({ metadata: report.metadata, vulnerabilities }, null, 2) + '\n');
          NODE

      - name: Commit diagnosis and remove temporary workflow
        run: |
          set -euo pipefail
          rm .github/workflows/temporary-fix-pr1299-lockfile.yml .tmp-pr1299-audit.json
          git config user.name "pr1299-lockfile-fix[bot]"
          git config user.email "pr1299-lockfile-fix@users.noreply.github.com"
          git add package-lock.json .tmp-pr1299-audit-summary.json .github/workflows/temporary-fix-pr1299-lockfile.yml
          git diff --cached --check
          git commit -m "chore(ci): capture sanitized dependency audit for PR1299"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
