name: Temporary fix PR1299 lockfile

on:
  pull_request:
    types: [synchronize]
    branches: [main]
    paths:
      - .github/workflows/temporary-fix-pr1299-lockfile.yml

permissions:
  contents: write

concurrency:
  group: temporary-fix-pr1299-lockfile
  cancel-in-progress: false

jobs:
  repair:
    if: github.event.pull_request.number == 1299 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Regenerate audited lockfile
        run: |
          set -euo pipefail
          npm audit fix --package-lock-only --ignore-scripts --no-fund
          npm audit --audit-level=moderate

      - name: Commit lockfile and remove temporary workflow
        run: |
          set -euo pipefail
          rm .github/workflows/temporary-fix-pr1299-lockfile.yml
          git config user.name "pr1299-lockfile-fix[bot]"
          git config user.email "pr1299-lockfile-fix@users.noreply.github.com"
          git add package-lock.json .github/workflows/temporary-fix-pr1299-lockfile.yml
          git diff --cached --check
          git commit -m "fix(deps): refresh audited lockfile for runtime promotion"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
