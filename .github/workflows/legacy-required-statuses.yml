name: Legacy Required Status Contexts

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: legacy-required-statuses-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Scan repository for accidental secret exposure
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Scan public repository content
        run: npm run security:public-secrets

  quality:
    name: CI / quality
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: 'true'
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: public-placeholder-anon-key
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Validate package lock
        run: npm run security:package-lock
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm run test
      - name: Production build
        run: npm run build

  enterprise-merge-gate:
    name: Enterprise merge/deploy gate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: [secret-scan, quality]
    env:
      CI: 'true'
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: public-placeholder-anon-key
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run repository security gates
        run: node scripts/security/run-security-ci-without-audit.mjs
      - name: Validate route quality
        run: npm run quality:routes
      - name: Validate production release contract
        run: |
          node --check scripts/release/check-enterprise-release-env.mjs
          node --check scripts/release/run-public-production-release.mjs
          node --check scripts/release/validate-release-go-no-go-evidence.mjs
          node --check scripts/release/verify-enterprise-evidence-bundle.mjs
          grep -Fq "npm run release:production-final" .github/workflows/enterprise-production-gate.yml
          grep -Fq "environment: Production" .github/workflows/enterprise-production-gate.yml
          grep -Fq "if-no-files-found: error" .github/workflows/enterprise-production-gate.yml
