name: Temporary Apply Next Lockfile Fix

on:
  push:
    branches:
      - dependabot/npm_and_yarn/nextjs-and-react-a8da19b315

permissions:
  contents: write

jobs:
  apply-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          persist-credentials: true
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Regenerate package lock only
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit corrected lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo 'package-lock.json already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'chore: synchronize Next.js 15.5.26 lockfile'
          git push
