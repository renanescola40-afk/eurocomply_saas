name: Stripe Test Proof Bootstrap

on:
  push:
    branches:
      - ops/stripe-test-proof-bootstrap-20261001
    paths:
      - '.github/workflows/stripe-test-proof-bootstrap.yml'

permissions:
  contents: read

env:
  RELEASE_SHA: b5cf5fcbe9fb73934397860ba1e81e561b3cbabf

jobs:
  probe-production-secret-availability:
    name: Probe protected proof secret availability
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: Production
    env:
      STRIPE_TEST_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      SUPABASE_DB_POOLER_URL: ${{ secrets.SUPABASE_DB_POOLER_URL }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Check exact current main
        shell: bash
        run: |
          set -euo pipefail
          current_main="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/main" | jq -r '.sha')"
          test "$current_main" = "$RELEASE_SHA"
      - name: Report bounded availability only
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$STRIPE_TEST_SECRET_KEY" == sk_test_* ]]; then stripe_test='present'; else stripe_test='missing'; fi
          if [[ -n "$VERCEL_AUTOMATION_BYPASS_SECRET" ]]; then bypass='present'; else bypass='missing'; fi
          case "$SUPABASE_DB_POOLER_URL" in postgresql://*|postgres://*) db='present' ;; *) db='missing' ;; esac
          printf 'STRIPE_TEST_SECRET_KEY=%s\nVERCEL_AUTOMATION_BYPASS_SECRET=%s\nSUPABASE_DB_POOLER_URL=%s\n' "$stripe_test" "$bypass" "$db"
          test "$stripe_test" = 'present'
          test "$bypass" = 'present'
          test "$db" = 'present'
