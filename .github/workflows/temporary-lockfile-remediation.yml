name: Temporary lockfile remediation

on:
  push:
    branches:
      - agent/incident-response-continuity-megapack

permissions:
  contents: write

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/incident-response-continuity-megapack
          fetch-depth: 0

      - name: Setup pinned Node and npm
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          cache: npm

      - name: Remediate audited transitive dependency in lockfile
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@10.8.2
          npm audit fix --package-lock-only --ignore-scripts
          npm ci --ignore-scripts
          npm audit --audit-level=moderate
          node -e "const lock=require('./package-lock.json'); const entry=lock.packages?.['node_modules/brace-expansion']; if (!entry || entry.version !== '1.1.16') { throw new Error('brace-expansion was not remediated to 1.1.16'); }"

      - name: Commit lockfile remediation and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/temporary-lockfile-remediation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json .github/workflows/temporary-lockfile-remediation.yml
          git diff --cached --check
          git commit -m 'fix(deps): remediate brace-expansion audit finding'
          git push origin HEAD:agent/incident-response-continuity-megapack
