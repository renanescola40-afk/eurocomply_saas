name: Production Provider Runtime Proof

run-name: Production provider proof for ${{ github.sha }}

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: production-provider-runtime-proof-${{ github.sha }}
  cancel-in-progress: false

jobs:
  production-environment-governance:
    name: Verify Production governance before provider secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Bind proof to exact current main before governance lookup
        shell: bash
        env:
          TARGET_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_REF_NAME" = "main"
          main_sha="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/main" | jq -r '.sha')"
          test "$main_sha" = "$TARGET_SHA"
      - name: Check out exact trusted release SHA
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
      - name: Verify Production environment governance before protected secrets
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_ENVIRONMENT_NAME: Production
          REQUIRE_PROTECTED_BRANCHES: 'true'
        run: node scripts/security/check-github-environment-governance.mjs

  validate-production-providers:
    name: Validate production provider control plane
    needs: production-environment-governance
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: Production
    env:
      TARGET_SHA: ${{ github.sha }}
      PROVIDER_PROOF_ENVIRONMENT: production
      PROVIDER_TARGETS_PATH: config/production-provider-targets.json
      GITHUB_TOKEN: ${{ github.token }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      SENTRY_ORG: ${{ vars.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

    steps:
      - name: Validate exact current main SHA
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_REF" = "refs/heads/main"
          main_sha="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/main" | jq -r '.sha')"
          test "$main_sha" = "$TARGET_SHA"

      - name: Checkout exact release SHA
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm

      - name: Install deterministic dependencies
        run: npm ci --ignore-scripts

      - name: Load reviewed Vercel target authority into runtime environment
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const doc = JSON.parse(fs.readFileSync(process.env.PROVIDER_TARGETS_PATH, 'utf8'));
          const target = doc?.vercel;
          if (
            doc?.schema !== 'risck-comply.production-provider-targets.v1'
            || !/^prj_[A-Za-z0-9]+$/.test(String(target?.projectId ?? ''))
            || !/^team_[A-Za-z0-9]+$/.test(String(target?.teamId ?? ''))
            || !/^[A-Za-z0-9][A-Za-z0-9._-]{0,99}$/.test(String(target?.projectName ?? ''))
          ) process.exit(1);
          fs.appendFileSync(process.env.GITHUB_ENV, [
            `VERCEL_PROJECT_ID=${target.projectId}`,
            `VERCEL_TEAM_ID=${target.teamId}`,
            `VERCEL_PROJECT_NAME=${target.projectName}`,
            '',
          ].join('\n'));
          NODE

      - name: Load canonical Stripe Price bindings from Vercel Production
        run: node scripts/security/load-vercel-stripe-price-bindings.mjs

      - name: Validate provider proof contracts
        run: |
          node --check scripts/security/run-production-provider-runtime-proof.mjs
          node --check scripts/security/run-stripe-live-billing-provider-proof.mjs
          node --check scripts/security/check-supabase-provider-resilience.mjs
          node --check scripts/security/load-vercel-stripe-price-bindings.mjs
          node --check scripts/security/diagnose-production-provider-blockers.mjs
          node -e "const fs=require('node:fs'); const p=JSON.parse(fs.readFileSync(process.env.PROVIDER_TARGETS_PATH,'utf8')); if(p.schema!=='risck-comply.production-provider-targets.v1') process.exit(1)"
          npx vitest run \
            scripts/release/validate-production-secrets-runtime-evidence.test.mjs \
            tests/enterprise/production-provider-runtime-proof.test.ts \
            tests/enterprise/production-runtime-truth-contract.test.ts \
            tests/enterprise/production-provider-blocker-diagnostics.test.ts
          node --test tests/enterprise/stripe-live-billing-provider-proof.test.mjs
          node --test tests/enterprise/vercel-stripe-price-bindings.test.mjs
          node --test tests/enterprise/supabase-provider-resilience-proof.test.mjs

      - name: Execute strict live billing provider proof
        run: node scripts/security/run-stripe-live-billing-provider-proof.mjs

      - name: Execute strict Supabase provider resilience proof
        if: always()
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/security/check-supabase-provider-resilience.mjs

      - name: Execute broad live provider proof
        if: always()
        run: node scripts/security/run-production-provider-runtime-proof.mjs

      - name: Stage strict billing provider evidence outside canonical P0 evidence namespace
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-validation
          if [ -f docs/security/evidence/runtime/stripe-live-billing-provider-proof.json ]; then
            mv docs/security/evidence/runtime/stripe-live-billing-provider-proof.json \
              release-validation/stripe-live-billing-provider-proof.json
          fi

      - name: Validate generated exact-SHA provider evidence
        if: always()
        run: node scripts/security/check-p0-runtime-evidence-files.mjs

      - name: Diagnose provider blockers without storing provider values
        if: always()
        run: node scripts/security/diagnose-production-provider-blockers.mjs

      - name: Publish provider blocker summary
        if: always()
        shell: bash
        run: |
          resilience=release-validation/supabase-provider-resilience.json
          diagnostic=release-validation/provider-blocker-diagnostics.json
          {
            echo '## Production provider blocker diagnostics'
            echo
            if [ -f "$resilience" ]; then
              jq -r '"- Supabase resilience: \(.status)/\(.outcome)\n- Managed backup observed: \(.checks.managedBackupObserved)\n- Production-eligible plan: \(.checks.productionEligiblePlan)\n- PITR enabled: \(.metrics.pitrEnabled)"' "$resilience"
              jq -r '.blockerCodes[]? | "- `\(.)`"' "$resilience"
            else
              echo '- Supabase resilience: NOT_PRODUCED'
            fi
            if [ -f "$diagnostic" ]; then
              jq -r '"- Broad provider proof: \(.providerProofStatus)/\(.providerProofOutcome)\n- Blocked providers: \(.blockedProviderCount)\n- Broad blocker codes: \(.blockerCount)"' "$diagnostic"
              jq -r '.blockerCodes[]? | "- `\(.)`"' "$diagnostic"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload redacted provider evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: production-provider-runtime-proof-${{ env.TARGET_SHA }}
          path: |
            docs/security/evidence/runtime/production-secrets-provider-stores.json
            release-validation/stripe-live-billing-provider-proof.json
            release-validation/supabase-provider-resilience.json
            release-validation/provider-blocker-diagnostics.json
          if-no-files-found: error
          retention-days: 90
