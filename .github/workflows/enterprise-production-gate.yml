name: Enterprise Production Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  actions: read
  security-events: read

jobs:
  quality-security-build:
    name: Quality, security, build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: 'true'
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: public-placeholder-anon-key
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Quality and security gates
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm run security:package-lock
          npm run lint
          npm run typecheck
          npm run test
          npm run build
          if [ "${{ github.event_name }}" != pull_request ] || ! git diff --quiet HEAD^ HEAD -- package.json package-lock.json npm-shrinkwrap.json; then
            npm audit --audit-level=moderate
          fi
          node scripts/security/run-security-ci-without-audit.mjs
          npm run quality:routes

  e2e-production-like:
    name: E2E production-like gate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: 'true'
      PLAYWRIGHT_USE_PRODUCTION_SERVER: 'true'
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: public-placeholder-anon-key
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- tests/e2e/enterprise-production-gate.spec.ts

  production-release-contract:
    name: Production release contract
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate contract
        run: |
          node --check scripts/release/check-enterprise-release-env.mjs
          node --check scripts/release/run-public-production-release.mjs
          node --check scripts/release/validate-release-go-no-go-evidence.mjs
          node --check scripts/release/verify-enterprise-evidence-bundle.mjs
          grep -Fq "npm run release:production-final" .github/workflows/enterprise-production-gate.yml
          grep -Fq "release:go-no-go-evidence" scripts/release/run-public-production-release-v2.mjs
          grep -Fq "verify-enterprise-evidence-bundle.mjs" .github/workflows/enterprise-production-gate.yml
          grep -Fq "if-no-files-found: error" .github/workflows/enterprise-production-gate.yml
          grep -Fq "environment: Production" .github/workflows/enterprise-production-gate.yml

  production-release-validation:
    name: Production runtime validation
    if: github.event_name != 'pull_request'
    needs: [quality-security-build, e2e-production-like]
    runs-on: ubuntu-24.04
    environment: Production
    env:
      RELEASE_COMMIT_SHA: ${{ github.sha }}
      RELEASE_BUILD_SHA: ${{ github.sha }}
      RISCK_COMPLY_ENTERPRISE_RELEASE: 'true'
      RELEASE_DEPLOYMENT_URL: ${{ secrets.RELEASE_DEPLOYMENT_URL || vars.RELEASE_DEPLOYMENT_URL }}
      RELEASE_PRODUCTION_URL: ${{ secrets.RELEASE_PRODUCTION_URL || vars.RELEASE_PRODUCTION_URL }}
      NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL || secrets.NEXT_PUBLIC_APP_URL }}
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || secrets.NEXT_PUBLIC_SITE_URL }}
      HEALTHCHECK_TOKEN: ${{ secrets.HEALTHCHECK_TOKEN }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      STRIPE_PRICE_STARTER_MONTHLY: ${{ vars.STRIPE_PRICE_STARTER_MONTHLY || secrets.STRIPE_PRICE_STARTER_MONTHLY }}
      STRIPE_PRICE_GROWTH_MONTHLY: ${{ vars.STRIPE_PRICE_GROWTH_MONTHLY || secrets.STRIPE_PRICE_GROWTH_MONTHLY }}
      STRIPE_PRICE_ENTERPRISE_MONTHLY: ${{ vars.STRIPE_PRICE_ENTERPRISE_MONTHLY || secrets.STRIPE_PRICE_ENTERPRISE_MONTHLY }}
      STRIPE_PRICE_ESSENTIAL_MONTHLY: ${{ vars.STRIPE_PRICE_ESSENTIAL_MONTHLY || secrets.STRIPE_PRICE_ESSENTIAL_MONTHLY }}
      STRIPE_PRICE_PROFESSIONAL_MONTHLY: ${{ vars.STRIPE_PRICE_PROFESSIONAL_MONTHLY || secrets.STRIPE_PRICE_PROFESSIONAL_MONTHLY }}
      STRIPE_PRICE_BUSINESS_MONTHLY: ${{ vars.STRIPE_PRICE_BUSINESS_MONTHLY || secrets.STRIPE_PRICE_BUSINESS_MONTHLY }}
      STRIPE_PRICE_BUSINESS_ENTERPRISE_MONTHLY: ${{ vars.STRIPE_PRICE_BUSINESS_ENTERPRISE_MONTHLY || secrets.STRIPE_PRICE_BUSINESS_ENTERPRISE_MONTHLY }}
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
      NEXT_PUBLIC_SENTRY_DSN: ${{ vars.NEXT_PUBLIC_SENTRY_DSN || secrets.NEXT_PUBLIC_SENTRY_DSN }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN || vars.SENTRY_DSN }}
      SENTRY_ORG: ${{ vars.SENTRY_ORG || secrets.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT || secrets.SENTRY_PROJECT }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      RELEASE_ROLLBACK_TARGET: ${{ vars.RELEASE_ROLLBACK_TARGET || secrets.RELEASE_ROLLBACK_TARGET }}
      RELEASE_ROLLBACK_TARGET_URL: ${{ vars.RELEASE_ROLLBACK_TARGET_URL || secrets.RELEASE_ROLLBACK_TARGET_URL }}
      LAST_KNOWN_GOOD_DEPLOYMENT_URL: ${{ vars.LAST_KNOWN_GOOD_DEPLOYMENT_URL || secrets.LAST_KNOWN_GOOD_DEPLOYMENT_URL }}
      RELEASE_ROLLBACK_TARGET_SHA: ${{ vars.RELEASE_ROLLBACK_TARGET_SHA || secrets.RELEASE_ROLLBACK_TARGET_SHA }}
      RELEASE_ROLLBACK_TARGET_COMMIT_SHA: ${{ vars.RELEASE_ROLLBACK_TARGET_COMMIT_SHA || secrets.RELEASE_ROLLBACK_TARGET_COMMIT_SHA }}
      LAST_KNOWN_GOOD_COMMIT_SHA: ${{ vars.LAST_KNOWN_GOOD_COMMIT_SHA || secrets.LAST_KNOWN_GOOD_COMMIT_SHA }}
      LAST_KNOWN_GOOD_SHA: ${{ vars.LAST_KNOWN_GOOD_SHA || secrets.LAST_KNOWN_GOOD_SHA }}
      RELEASE_ROLLBACK_TARGET_VALIDATED: ${{ vars.RELEASE_ROLLBACK_TARGET_VALIDATED || secrets.RELEASE_ROLLBACK_TARGET_VALIDATED }}
      RELEASE_RUN_OBSERVABILITY_SMOKE: ${{ vars.RELEASE_RUN_OBSERVABILITY_SMOKE || secrets.RELEASE_RUN_OBSERVABILITY_SMOKE }}
      REQUIRE_MALWARE_SCAN_FOR_UPLOADS: ${{ vars.REQUIRE_MALWARE_SCAN_FOR_UPLOADS || secrets.REQUIRE_MALWARE_SCAN_FOR_UPLOADS }}
      MALWARE_SCANNER_PROVIDER: ${{ vars.MALWARE_SCANNER_PROVIDER || secrets.MALWARE_SCANNER_PROVIDER }}
      MALWARE_SCANNER_ENDPOINT: ${{ secrets.MALWARE_SCANNER_ENDPOINT || vars.MALWARE_SCANNER_ENDPOINT }}
      MALWARE_SCANNER_URL: ${{ secrets.MALWARE_SCANNER_URL || vars.MALWARE_SCANNER_URL }}
      MALWARE_SCANNER_ALLOWED_HOSTS: ${{ vars.MALWARE_SCANNER_ALLOWED_HOSTS || secrets.MALWARE_SCANNER_ALLOWED_HOSTS }}
      MALWARE_SCANNER_API_KEY: ${{ secrets.MALWARE_SCANNER_API_KEY }}
      CLOUDMERSIVE_API_KEY: ${{ secrets.CLOUDMERSIVE_API_KEY }}
      MALWARE_SCANNER_CLAMAV_HOST: ${{ secrets.MALWARE_SCANNER_CLAMAV_HOST || vars.MALWARE_SCANNER_CLAMAV_HOST }}
      MALWARE_SCANNER_CLAMAV_PORT: ${{ vars.MALWARE_SCANNER_CLAMAV_PORT || secrets.MALWARE_SCANNER_CLAMAV_PORT }}
      MALWARE_SCANNER_TIMEOUT_MS: ${{ vars.MALWARE_SCANNER_TIMEOUT_MS || secrets.MALWARE_SCANNER_TIMEOUT_MS }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: node scripts/release/check-enterprise-release-env.mjs
      - run: npm run release:production-final
      - run: node scripts/release/verify-enterprise-evidence-bundle.mjs
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: enterprise-production-final-evidence-${{ github.sha }}
          path: |
            docs/security/evidence/runtime/**/*.json
            release-validation/**
          if-no-files-found: error

  enterprise-closure-status:
    name: Enterprise closure status
    if: always()
    needs: [quality-security-build, e2e-production-like, production-release-contract, production-release-validation]
    runs-on: ubuntu-24.04
    steps:
      - name: Enforce required jobs
        env:
          EVENT: ${{ github.event_name }}
          QUALITY: ${{ needs.quality-security-build.result }}
          E2E: ${{ needs.e2e-production-like.result }}
          CONTRACT: ${{ needs.production-release-contract.result }}
          RUNTIME: ${{ needs.production-release-validation.result }}
        run: |
          test "$QUALITY" = success
          test "$E2E" = success
          if [ "$EVENT" = pull_request ]; then
            test "$CONTRACT" = success
          else
            test "$RUNTIME" = success
          fi
