name: Enterprise Production Gate

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_target:
        description: Release target to validate
        required: true
        default: enterprise
        type: choice
        options:
          - enterprise
          - production

permissions:
  contents: read
  actions: read
  security-events: read

concurrency:
  group: enterprise-production-gate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-validation:
    name: Release validation
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      CI: 'true'
    steps:
      - name: Checkout exact release SHA
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Deterministic install
        run: npm ci --ignore-scripts

      - name: Verify exact release SHA
        run: |
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          echo "Validated release SHA: ${GITHUB_SHA}"

      - name: Package lock alignment
        run: npm run security:package-lock

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: public-placeholder-anon-key

      - name: npm audit
        run: npm audit --audit-level=moderate

      - name: Security CI
        run: npm run security:ci

      - name: Route quality
        run: npm run quality:routes

      - name: Upload release validation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: enterprise-production-gate-${{ github.sha }}
          path: |
            docs/security/evidence/runtime/**/*.json
            *.log
          if-no-files-found: warn
          retention-days: 90
