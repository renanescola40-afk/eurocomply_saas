name: Enterprise Production Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_run:
    workflows:
      - Auth RBAC Tenant Proof
      - Supabase Live RLS Validation
      - RISCK COMPLY Upload Security CI
      - Audit Chain Runtime Proof
      - Production Runtime Proof
      - Production Provider Runtime Proof
      - Branch Protection Runtime Proof
      - Step-Up Runtime Proof
      - Stripe Runtime Evidence Promotion
      - Public Production Final
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  actions: read
  deployments: read
  security-events: read

env:
  TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

concurrency:
  group: enterprise-production-gate-${{ github.event.workflow_run.head_sha || github.sha }}-${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'success' && github.run_id || 'active' }}
  cancel-in-progress: true

jobs:
  quality-security-build:
    name: Quality, security, build
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: 'true'
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: public-placeholder-anon-key
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Quality and security gates
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm run security:package-lock
          npm run lint
          npm run typecheck
          npm run test
          npm run build
          if [ "${{ github.event_name }}" != pull_request ] || ! git diff --quiet HEAD^ HEAD -- package.json package-lock.json npm-shrinkwrap.json; then
            npm audit --audit-level=moderate
          fi
          node scripts/security/run-security-ci-without-audit.mjs
          npm run quality:routes

  e2e-production-like:
    name: E2E production-like gate
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: 'true'
      PLAYWRIGHT_USE_PRODUCTION_SERVER: 'true'
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: public-placeholder-anon-key
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- tests/e2e/enterprise-production-gate.spec.ts

  production-environment-governance:
    name: Verify Production governance before final runtime secrets
    if: >-
      github.event_name != 'pull_request' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Verify exact current main before governance lookup
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          main_sha="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/main" | jq -r '.sha')"
          test "$main_sha" = "$TARGET_SHA"
      - name: Verify Production environment governance before protected secrets
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_ENVIRONMENT_NAME: Production
          REQUIRE_PROTECTED_BRANCHES: 'true'
        run: node scripts/security/check-github-environment-governance.mjs

  production-release-contract:
    name: Production release contract
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate contract
        run: |
          node --check scripts/release/check-enterprise-release-env.mjs
          node --check scripts/release/run-public-production-release.mjs
          node --check scripts/release/validate-release-go-no-go-evidence.mjs
          node --check scripts/release/verify-enterprise-evidence-bundle.mjs
          node --check scripts/release/hydrate-enterprise-retained-runtime-evidence.mjs
          node --check scripts/release/write-github-vercel-production-deployment-evidence.mjs
          node --check scripts/enterprise/fetch-auth-rbac-evidence.mjs
          node --check scripts/enterprise/fetch-supabase-rls-evidence.mjs
          node --check scripts/enterprise/fetch-upload-scanner-runtime-evidence.mjs
          node --check scripts/enterprise/fetch-audit-chain-runtime-evidence.mjs
          node --check scripts/enterprise/fetch-production-runtime-evidence.mjs
          node --check scripts/enterprise/fetch-production-provider-runtime-evidence.mjs
          node --check scripts/enterprise/fetch-branch-protection-runtime-evidence.mjs
          node --check scripts/enterprise/fetch-step-up-runtime-evidence.mjs
          node --check scripts/enterprise/fetch-stripe-promoted-runtime-evidence.mjs
          node --check scripts/enterprise/fetch-public-production-final-evidence.mjs
          grep -Fq "npm run release:production-final" .github/workflows/enterprise-production-gate.yml
          grep -Fq "hydrate-enterprise-retained-runtime-evidence.mjs" .github/workflows/enterprise-production-gate.yml
          grep -Fq "RETAINED_PROOF_SOURCE_WORKFLOW_PATH" .github/workflows/enterprise-production-gate.yml
          grep -Fq "RELEASE_RUN_OBSERVABILITY_SMOKE: 'true'" .github/workflows/enterprise-production-gate.yml
          grep -Fq "write-github-vercel-production-deployment-evidence.mjs" .github/workflows/enterprise-production-gate.yml
          grep -Fq "VERCEL_AUTOMATION_BYPASS_SECRET" .github/workflows/enterprise-production-gate.yml
          grep -Fq "cancel-in-progress: true" .github/workflows/enterprise-production-gate.yml
          grep -Fq "deployments: read" .github/workflows/enterprise-production-gate.yml
          grep -Fq "check-github-environment-governance.mjs" .github/workflows/enterprise-production-gate.yml
          grep -Fq "needs: [quality-security-build, e2e-production-like, production-environment-governance]" .github/workflows/enterprise-production-gate.yml
          grep -Fq "node scripts/release/validate-release-go-no-go-evidence.mjs" scripts/release/run-public-production-release-v2.mjs
          grep -Fq "verify-enterprise-evidence-bundle.mjs" .github/workflows/enterprise-production-gate.yml
          grep -Fq "if-no-files-found: error" .github/workflows/enterprise-production-gate.yml
          grep -Fq "environment: Production" .github/workflows/enterprise-production-gate.yml

  production-release-validation:
    name: Production runtime validation
    if: >-
      github.event_name != 'pull_request' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    needs: [quality-security-build, e2e-production-like, production-environment-governance]
    runs-on: ubuntu-24.04
    environment: Production
    env:
      RELEASE_COMMIT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      RELEASE_BUILD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      RISCK_COMPLY_ENTERPRISE_RELEASE: 'true'
      RELEASE_DEPLOYMENT_URL: ${{ secrets.RELEASE_DEPLOYMENT_URL || vars.RELEASE_DEPLOYMENT_URL }}
      RELEASE_PRODUCTION_URL: ${{ secrets.RELEASE_PRODUCTION_URL || vars.RELEASE_PRODUCTION_URL }}
      NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL || secrets.NEXT_PUBLIC_APP_URL }}
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || secrets.NEXT_PUBLIC_SITE_URL }}
      HEALTHCHECK_TOKEN: ${{ secrets.HEALTHCHECK_TOKEN }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      STRIPE_PRICE_ESSENTIAL_MONTHLY: ${{ vars.STRIPE_PRICE_ESSENTIAL_MONTHLY || secrets.STRIPE_PRICE_ESSENTIAL_MONTHLY }}
      STRIPE_PRICE_ESSENTIAL_ANNUAL: ${{ vars.STRIPE_PRICE_ESSENTIAL_ANNUAL || secrets.STRIPE_PRICE_ESSENTIAL_ANNUAL }}
      STRIPE_PRICE_PROFESSIONAL_MONTHLY: ${{ vars.STRIPE_PRICE_PROFESSIONAL_MONTHLY || secrets.STRIPE_PRICE_PROFESSIONAL_MONTHLY }}
      STRIPE_PRICE_PROFESSIONAL_ANNUAL: ${{ vars.STRIPE_PRICE_PROFESSIONAL_ANNUAL || secrets.STRIPE_PRICE_PROFESSIONAL_ANNUAL }}
      STRIPE_PRICE_BUSINESS_MONTHLY: ${{ vars.STRIPE_PRICE_BUSINESS_MONTHLY || secrets.STRIPE_PRICE_BUSINESS_MONTHLY }}
      STRIPE_PRICE_BUSINESS_ENTERPRISE_MONTHLY: ${{ vars.STRIPE_PRICE_BUSINESS_ENTERPRISE_MONTHLY || secrets.STRIPE_PRICE_BUSINESS_ENTERPRISE_MONTHLY }}
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
      NEXT_PUBLIC_SENTRY_DSN: ${{ vars.NEXT_PUBLIC_SENTRY_DSN || secrets.NEXT_PUBLIC_SENTRY_DSN }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN || vars.SENTRY_DSN }}
      SENTRY_ORG: ${{ vars.SENTRY_ORG || secrets.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT || secrets.SENTRY_PROJECT }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      RELEASE_ROLLBACK_TARGET: ${{ vars.RELEASE_ROLLBACK_TARGET || secrets.RELEASE_ROLLBACK_TARGET }}
      RELEASE_ROLLBACK_TARGET_URL: ${{ vars.RELEASE_ROLLBACK_TARGET_URL || secrets.RELEASE_ROLLBACK_TARGET_URL }}
      LAST_KNOWN_GOOD_DEPLOYMENT_URL: ${{ vars.LAST_KNOWN_GOOD_DEPLOYMENT_URL || secrets.LAST_KNOWN_GOOD_DEPLOYMENT_URL }}
      RELEASE_ROLLBACK_TARGET_SHA: ${{ vars.RELEASE_ROLLBACK_TARGET_SHA || secrets.RELEASE_ROLLBACK_TARGET_SHA }}
      RELEASE_ROLLBACK_TARGET_COMMIT_SHA: ${{ vars.RELEASE_ROLLBACK_TARGET_COMMIT_SHA || secrets.RELEASE_ROLLBACK_TARGET_COMMIT_SHA }}
      LAST_KNOWN_GOOD_COMMIT_SHA: ${{ vars.LAST_KNOWN_GOOD_COMMIT_SHA || secrets.LAST_KNOWN_GOOD_COMMIT_SHA }}
      LAST_KNOWN_GOOD_SHA: ${{ vars.LAST_KNOWN_GOOD_SHA || secrets.LAST_KNOWN_GOOD_SHA }}
      RELEASE_ROLLBACK_TARGET_VALIDATED: ${{ vars.RELEASE_ROLLBACK_TARGET_VALIDATED || secrets.RELEASE_ROLLBACK_TARGET_VALIDATED }}
      RELEASE_RUN_OBSERVABILITY_SMOKE: 'true'
      REQUIRE_MALWARE_SCAN_FOR_UPLOADS: ${{ vars.REQUIRE_MALWARE_SCAN_FOR_UPLOADS || secrets.REQUIRE_MALWARE_SCAN_FOR_UPLOADS }}
      MALWARE_SCANNER_PROVIDER: ${{ vars.MALWARE_SCANNER_PROVIDER || secrets.MALWARE_SCANNER_PROVIDER }}
      MALWARE_SCANNER_ENDPOINT: ${{ secrets.MALWARE_SCANNER_ENDPOINT || vars.MALWARE_SCANNER_ENDPOINT }}
      MALWARE_SCANNER_URL: ${{ secrets.MALWARE_SCANNER_URL || vars.MALWARE_SCANNER_URL }}
      MALWARE_SCANNER_ALLOWED_HOSTS: ${{ vars.MALWARE_SCANNER_ALLOWED_HOSTS || secrets.MALWARE_SCANNER_ALLOWED_HOSTS }}
      MALWARE_SCANNER_API_KEY: ${{ secrets.MALWARE_SCANNER_API_KEY }}
      CLOUDMERSIVE_API_KEY: ${{ secrets.CLOUDMERSIVE_API_KEY }}
      MALWARE_SCANNER_CLAMAV_HOST: ${{ secrets.MALWARE_SCANNER_CLAMAV_HOST || vars.MALWARE_SCANNER_CLAMAV_HOST }}
      MALWARE_SCANNER_CLAMAV_PORT: ${{ vars.MALWARE_SCANNER_CLAMAV_PORT || secrets.MALWARE_SCANNER_CLAMAV_PORT }}
      MALWARE_SCANNER_TIMEOUT_MS: ${{ vars.MALWARE_SCANNER_TIMEOUT_MS || secrets.MALWARE_SCANNER_TIMEOUT_MS }}
      GITHUB_TOKEN: ${{ github.token }}
      RETAINED_PROOF_SOURCE_WORKFLOW: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.name || '' }}
      RETAINED_PROOF_SOURCE_WORKFLOW_PATH: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.path || '' }}
      RETAINED_PROOF_SOURCE_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - name: Verify exact current main target
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          main_sha="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/main" | jq -r '.sha')"
          test "$main_sha" = "$TARGET_SHA"
      - name: Hydrate retained exact-SHA runtime proofs
        run: node scripts/release/hydrate-enterprise-retained-runtime-evidence.mjs
      - name: Publish retained proof fan-in summary
        shell: bash
        run: |
          manifest=release-validation/retained-runtime-evidence-hydration.json
          {
            echo '## Retained exact-SHA runtime proof fan-in'
            echo
            jq -r '"- Target SHA: `\(.targetSha)`\n- Hydrated producers: \(.hydratedProducerCount)/\(.producerCount)\n- Missing producers: \(.missingProducerCount)\n- Trigger source: \(.sourceWorkflowPath // .sourceWorkflowName // "direct gate")"' "$manifest"
          } >> "$GITHUB_STEP_SUMMARY"
      - run: node scripts/release/check-enterprise-release-env.mjs
      - run: npm run release:production-final
      - run: node scripts/release/verify-enterprise-evidence-bundle.mjs
      - name: Write exact-SHA Vercel production deployment evidence
        if: always()
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          PRODUCTION_DEPLOYMENT_PROOF_ATTEMPTS: '12'
          PRODUCTION_DEPLOYMENT_PROOF_POLL_MS: '5000'
        run: node scripts/release/write-github-vercel-production-deployment-evidence.mjs
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: enterprise-production-final-evidence-${{ env.TARGET_SHA }}
          path: |
            docs/security/evidence/runtime/**/*.json
            release-validation/**
          if-no-files-found: error

  enterprise-closure-status:
    name: Enterprise closure status
    if: >-
      always() &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    needs: [quality-security-build, e2e-production-like, production-environment-governance, production-release-contract, production-release-validation]
    runs-on: ubuntu-24.04
    steps:
      - name: Enforce required jobs
        env:
          EVENT: ${{ github.event_name }}
          QUALITY: ${{ needs.quality-security-build.result }}
          E2E: ${{ needs.e2e-production-like.result }}
          GOVERNANCE: ${{ needs.production-environment-governance.result }}
          CONTRACT: ${{ needs.production-release-contract.result }}
          RUNTIME: ${{ needs.production-release-validation.result }}
        run: |
          test "$QUALITY" = success
          test "$E2E" = success
          if [ "$EVENT" = pull_request ]; then
            test "$CONTRACT" = success
          else
            test "$GOVERNANCE" = success
            test "$RUNTIME" = success
          fi
