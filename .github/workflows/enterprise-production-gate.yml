name: Enterprise Production Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_target:
        description: Release target to validate
        required: true
        default: enterprise
        type: choice
        options:
          - enterprise
          - production

permissions:
  contents: read
  pull-requests: read
  actions: read
  security-events: read

concurrency:
  group: enterprise-production-gate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality-security-build:
    name: Quality, security, build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      CI: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Deterministic install
        run: npm ci

      - name: Package lock alignment
        run: npm run security:package-lock

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: npm audit for dependency changes
        shell: bash
        run: |
          if [ "pull_request" = "pull_request" ] && git diff --quiet HEAD^ HEAD -- package.json package-lock.json npm-shrinkwrap.json; then
            echo "No dependency manifest or lockfile changes; npm audit is not applicable to this PR."
          else
            npm audit --audit-level=moderate
          fi

      - name: Security CI
        run: node scripts/security/run-security-ci-without-audit.mjs

      - name: Route quality
        run: npm run quality:routes

      - name: Upload quality/security logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: enterprise-quality-security-logs
          path: |
            docs/security/evidence/runtime/**/*.json
            release-validation/**
          if-no-files-found: ignore
          retention-days: 30

  e2e-production-like:
    name: E2E production-like gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      CI: 'true'
      RELEASE_TARGET: ${{ inputs.release_target || 'enterprise' }}
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '0'
      PLAYWRIGHT_USE_PRODUCTION_SERVER: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Deterministic install
        run: npm ci --ignore-scripts

      - name: Build production app for production-like E2E
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run focused E2E tests without silent skip
        run: npm run test:e2e -- tests/e2e/enterprise-production-gate.spec.ts

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: enterprise-playwright-artifacts
          path: |
            playwright-report/**
            test-results/**
          if-no-files-found: ignore
          retention-days: 30

  production-release-contract:
    name: Production release contract
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate release runner syntax
        run: |
          node --check scripts/release/check-enterprise-release-env.mjs
          node --check scripts/release/run-public-production-release.mjs
          node --check scripts/release/run-public-production-release-v2.mjs
          node --check scripts/release/verify-enterprise-evidence-bundle.mjs

      - name: Assert fail-closed workflow contract
        run: |
          grep -Fq "npm run release:production-final" .github/workflows/enterprise-production-gate.yml
          grep -Fq "verify-enterprise-evidence-bundle.mjs" .github/workflows/enterprise-production-gate.yml
          grep -Fq "if-no-files-found: error" .github/workflows/enterprise-production-gate.yml
          grep -Fq "environment: Production" .github/workflows/enterprise-production-gate.yml

  production-release-validation:
    name: Production runtime validation
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: Production
    needs: [quality-security-build, e2e-production-like]
    timeout-minutes: 90
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      CI: 'true'
      RELEASE_TARGET: ${{ inputs.release_target || 'enterprise' }}
      RISCK_COMPLY_ENTERPRISE_RELEASE: 'true'
      PLAYWRIGHT_USE_PRODUCTION_SERVER: 'true'
      RELEASE_COMMIT_SHA: ${{ github.sha }}
      RELEASE_BUILD_SHA: ${{ github.sha }}
      RELEASE_DEPLOYMENT_URL: ${{ secrets.RELEASE_DEPLOYMENT_URL }}
      RELEASE_PRODUCTION_URL: ${{ secrets.RELEASE_PRODUCTION_URL }}
      HEALTHCHECK_TOKEN: ${{ secrets.HEALTHCHECK_TOKEN }}
      RELEASE_ROLLBACK_TARGET: ${{ secrets.RELEASE_ROLLBACK_TARGET }}
      LAST_KNOWN_GOOD_DEPLOYMENT_URL: ${{ secrets.LAST_KNOWN_GOOD_DEPLOYMENT_URL }}
      RELEASE_ROLLBACK_TARGET_SHA: ${{ secrets.RELEASE_ROLLBACK_TARGET_SHA }}
      LAST_KNOWN_GOOD_COMMIT_SHA: ${{ secrets.LAST_KNOWN_GOOD_COMMIT_SHA }}
      RELEASE_ROLLBACK_TARGET_VALIDATED: ${{ secrets.RELEASE_ROLLBACK_TARGET_VALIDATED }}
      RELEASE_RUN_OBSERVABILITY_SMOKE: ${{ secrets.RELEASE_RUN_OBSERVABILITY_SMOKE }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_TP“P×ÔÕTPTÑWĞS“Ó—ÒÑVH_BˆÕTPTÑWÔÑT•’PÑWÔ“ÓWÒÑVNˆ	ŞÈÙXÜ™]Ë”ÕTPTÑWÔÑT•’PÑWÔ“ÓWÒÑVH_BˆÑS•–WÑÓˆ	ŞÈÙXÜ™]Ë”ÑS•–WÑÓˆ_Bˆ‘VÔP“P×ÔÑS•–WÑÓˆ	ŞÈÙXÜ™]Ë“‘VÔP“P×ÔÑS•–WÑÓˆ_BˆÑS•–WÓÔ‘Îˆ	ŞÈÙXÜ™]Ë”ÑS•–WÓÔ‘È_BˆÑS•–WÔ“Ò‘PÕˆ	ŞÈÙXÜ™]Ë”ÑS•–WÔ“Ò‘PÕ_BˆÑS•–WĞUUÕÒÑSˆ	ŞÈÙXÜ™]Ë”ÑS•–WĞUUÕÒÑSˆ_BˆÕ’TWÔÑPÔ‘UÒÑVNˆ	ŞÈÙXÜ™]Ë”Õ’TWÔÑPÔ‘UÒÑVH_BˆÕ’TWÕÑP’ÓÒ×ÔÑPÔ‘Uˆ	ŞÈÙXÜ™]Ë”Õ’TWÕÑP’ÓÒ×ÔÑPÔ‘U_BˆÕ’TWÔ’PÑWÔÕT•T—ÓSÓ•Nˆ	ŞÈÙXÜ™]Ë”Õ’TWÔ’PÑWÔÕT•T—ÓSÓ•H_BˆÕ’TWÔ’PÑWÑÔ“ÕÕÓSÓ•Nˆ	ŞÈÙXÜ™]Ë”Õ’TWÔ’PÑWÑÔ“ÕÕÓSÓ•H_BˆÕ’TWÔ’PÑWÑS•T”’TÑWÓSÓ•Nˆ	ŞÈÙXÜ™]Ë”Õ’TWÔ’PÑWÑS•T”’TÑWÓSÓ•H_BˆÕ’TWÔ’PÑWÑTÔÑS•PSÓSÓ•Nˆ	ŞÈÙXÜ™]Ë”Õ’TWÔ’PÑWÑTÔÑS•PSÓSÓ•H_BˆÕ’TWÔ’PÑWÔ“Ñ‘TÔÒSÓSÓSÓ•Nˆ	ŞÈÙXÜ™]Ë”Õ’TWÔ’PÑWÔ“Ñ‘TÔÒSÓSÓSÓ•H_BˆÕ’TWÔ’PÑWĞ•TÒS‘TÔ×ÓSÓ•Nˆ	ŞÈÙXÜ™]Ë”Õ’TWÔ’PÑWĞ•TÒS‘TÔ×ÓSÓ•H_BˆÕ’TWÔ’PÑWĞ•TÒS‘TÔ×ÑS•T”’TÑWÓSÓ•Nˆ	ŞÈÙXÜ™]Ë”Õ’TWÔ’PÑWĞ•TÒS‘TÔ×ÑS•T”’TÑWÓSÓ•H_BˆTÕTÒÔ‘QT×Ô‘TÕÕT“ˆ	ŞÈÙXÜ™]Ë•TÕTÒÔ‘QT×Ô‘TÕÕT“_BˆTÕTÒÔ‘QT×Ô‘TÕÕÒÑSˆ	ŞÈÙXÜ™]Ë•TÕTÒÔ‘QT×Ô‘TÕÕÒÑSˆ_Bˆ‘TURT‘WÓPSĞT‘WÔĞĞS—Ñ“Ô—ÕTĞQÎˆ	ŞÈÙXÜ™]Ë”‘TURT‘WÓPSĞT‘WÔĞĞS—Ñ“Ô—ÕTĞQÈ_BˆPSĞT‘WÔĞĞS—Ô‘TURT‘Qˆ	ŞÈÙXÜ™]Ë“PSĞT‘WÔĞĞS—Ô‘TURT‘Q_BˆPSĞT‘WÔĞĞS“‘T—Ô“Õ’QTˆ	ŞÈÙXÜ™]Ë“PSĞT‘WÔĞĞS“‘T—Ô“Õ’QTˆ_BˆPSĞT‘WÔĞĞS“‘T—ÑS‘ÒS•ˆ	ŞÈÙXÜ™]Ë“PSĞT‘WÔĞĞS“‘T—ÑS‘ÒS•_BˆPSĞT‘WÔĞĞS“‘T—ÕT“ˆ	ŞÈÙXÜ™]Ë“PSĞT‘WÔĞĞS“‘T—ÕT“_BˆPSĞT‘WÔĞĞS“‘T—ĞSÕÑQÒÔÕÎˆ	ŞÈÙXÜ™]Ë“PSĞT‘WÔĞĞS“‘T—ĞSÕÑQÒÔÕÈ_BˆPSĞT‘WÔĞĞS“‘T—ĞÓTĞU—ÒÔÕˆ	ŞÈÙXÜ™]Ë“PSĞT‘WÔĞĞS“‘T—ĞÓSPU—ÒÔÕ_BˆPSĞT‘WÔĞĞS“‘T—ĞÓTĞU—ÔÔ•ˆ	ŞÈÙXÜ™]Ë“PSĞT‘WÔĞĞS“‘T—ĞÓSPU—ÔÔ•_BˆPSĞT‘WÔĞĞS“‘T—ÕSQSÕUÓTÎˆ	ŞÈÙXÜ™]Ë“PSĞT‘WÔĞĞS“‘T—ÕSQSÕUÓTÈ_Bˆİ\Î‚ˆH˜[YNˆÚXÚÛİ]ˆ