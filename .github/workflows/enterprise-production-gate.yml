name: Enterprise Production Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_target:
        description: Release target to validate
        required: true
        default: enterprise
        type: choice
        options:
          - enterprise
          - production

permissions:
  contents: read
  pull-requests: read
  actions: read
  security-events: read

concurrency:
  group: enterprise-production-gate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality-security-build:
    name: Quality, security, build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      CI: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Deterministic install
        run: npm ci

      - name: Package lock alignment
        run: npm run security:package-lock

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: npm audit
        run: npm audit --audit-level=moderate

      - name: Security CI
        run: npm run security:ci

      - name: Route quality
        run: npm run quality:routes

      - name: Upload quality/security logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enterprise-quality-security-logs
          path: |
            docs/security/evidence/runtime/**/*.json
            release-validation/**
          if-no-files-found: ignore

  e2e-production-like:
    name: E2E production-like gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      CI: 'true'
      RELEASE_TARGET: ${{ inputs.release_target || 'enterprise' }}
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '0'
      PLAYWRIGHT_USE_PRODUCTION_SERVER: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Deterministic install
        run: npm ci --ignore-scripts

      - name: Build production app for production-like E2E
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run focused E2E tests without silent skip
        run: npm run test:e2e -- tests/e2e/enterprise-production-gate.spec.ts

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enterprise-playwright-artifacts
          path: |
            playwright-report/**
            test-results/**
          if-no-files-found: ignore

  production-release-validation:
    name: Production release validation
    runs-on: ubuntu-latest
    environment: Production
    needs: [quality-security-build, e2e-production-like]
    timeout-minutes: 90
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      CI: 'true'
      RELEASE_TARGET: ${{ inputs.release_target || 'enterprise' }}
      RISCK_COMPLY_ENTERPRISE_RELEASE: 'true'
      PLAYWRIGHT_USE_PRODUCTION_SERVER: 'true'
      RELEASE_COMMIT_SHA: ${{ github.sha }}
      RELEASE_BUILD_SHA: ${{ github.sha }}
      RELEASE_DEPLOYMENT_URL: ${{ secrets.RELEASE_DEPLOYMENT_URL }}
      RELEASE_PRODUCTION_URL: ${{ secrets.RELEASE_PRODUCTION_URL }}
      HEALTHCHECK_TOKEN: ${{ secrets.HEALTHCHECK_TOKEN }}
      RELEASE_ROLLBACK_TARGET: ${{ secrets.RELEASE_ROLLBACK_TARGET }}
      LAST_KNOWN_GOOD_DEPLOYMENT_URL: ${{ secrets.LAST_KNOWN_GOOD_DEPLOYMENT_URL }}
      RELEASE_ROLLBACK_TARGET_SHA: ${{ secrets.RELEASE_ROLLBACK_TARGET_SHA }}
      LAST_KNOWN_GOOD_COMMIT_SHA: ${{ secrets.LAST_KNOWN_GOOD_COMMIT_SHA }}
      RELEASE_ROLLBACK_TARGET_VALIDATED: ${{ secrets.RELEASE_ROLLBACK_TARGET_VALIDATED }}
      RELEASE_RUN_OBSERVABILITY_SMOKE: ${{ secrets.RELEASE_RUN_OBSERVABILITY_SMOKE }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      STRIPE_PRICE_STARTER_MONTHLY: ${{ secrets.STRIPE_PRICE_STARTER_MONTHLY }}
      STRIPE_PRICE_GROWTH_MONTHLY: ${{ secrets.STRIPE_PRICE_GROWTH_MONTHLY }}
      STRIPE_PRICE_ENTERPRISE_MONTHLY: ${{ secrets.STRIPE_PRICE_ENTERPRISE_MONTHLY }}
      STRIPE_PRICE_ESSENTIAL_MONTHLY: ${{ secrets.STRIPE_PRICE_ESSENTIAL_MONTHLY }}
      STRIPE_PRICE_PROFESSIONAL_MONTHLY: ${{ secrets.STRIPE_PRICE_PROFESSIONAL_MONTHLY }}
      STRIPE_PRICE_BUSINESS_MONTHLY: ${{ secrets.STRIPE_PRICE_BUSINESS_MONTHLY }}
      STRIPE_PRICE_BUSINESS_ENTERPRISE_MONTHLY: ${{ secrets.STRIPE_PRICE_BUSINESS_ENTERPRISE_MONTHLY }}
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
      REQUIRE_MALWARE_SCAN_FOR_UPLOADS: ${{ secrets.REQUIRE_MALWARE_SCAN_FOR_UPLOADS }}
      MALWARE_SCAN_REQUIRED: ${{ secrets.MALWARE_SCAN_REQUIRED }}
      MALWARE_SCANNER_PROVIDER: ${{ secrets.MALWARE_SCANNER_PROVIDER }}
      MALWARE_SCANNER_ENDPOINT: ${{ secrets.MALWARE_SCANNER_ENDPOINT }}
      MALWARE_SCANNER_URL: ${{ secrets.MALWARE_SCANNER_URL }}
      MALWARE_SCANNER_ALLOWED_HOSTS: ${{ secrets.MALWARE_SCANNER_ALLOWED_HOSTS }}
      MALWARE_SCANNER_CLAMAV_HOST: ${{ secrets.MALWARE_SCANNER_CLAMAV_HOST }}
      MALWARE_SCANNER_CLAMAV_PORT: ${{ secrets.MALWARE_SCANNER_CLAMAV_PORT }}
      MALWARE_SCANNER_TIMEOUT_MS: ${{ secrets.MALWARE_SCANNER_TIMEOUT_MS }}
    steps:
      - name: Confirm PR release validation scope
        if: github.event_name == 'pull_request'
        run: |
          echo "Production release validation is deferred on pull_request because it requires protected production secrets."
          echo "This PR still requires the quality, security, build, and production-like E2E gates to pass."
          echo "Run the workflow_dispatch or main-branch production release validation before promotion."

      - name: Checkout
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        uses: actions/checkout@v4

      - name: Setup Node
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Deterministic install for env preflight
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        run: npm ci

      - name: Enterprise release env preflight
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        run: node scripts/release/check-enterprise-release-env.mjs

      - name: Enterprise production final gate
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        run: npm run release:production-final

      - name: Upload final release evidence
        if: always() && (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main')
        uses: actions/upload-artifact@v4
        with:
          name: enterprise-production-final-evidence
          path: |
            docs/security/evidence/runtime/**/*.json
            release-validation/**
          if-no-files-found: ignore
