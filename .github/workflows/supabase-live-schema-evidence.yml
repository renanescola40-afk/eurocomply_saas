name: Supabase Live Schema Evidence

on:
  pull_request:
    paths:
      - 'scripts/supabase/build-migration-object-evidence.mjs'
      - 'scripts/supabase/build-migration-object-evidence.test.mjs'
      - '.github/workflows/supabase-live-schema-evidence.yml'
      - 'docs/security/runbooks/SUPABASE_LIVE_SCHEMA_EVIDENCE.md'
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact current main SHA to inspect
        required: true
        type: string
      source_run_id:
        description: Supabase Production Migration Dry Run workflow run containing the exact inventory
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  contract:
    name: Validate live schema evidence contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --check scripts/supabase/build-migration-object-evidence.mjs
      - run: node --test scripts/supabase/build-migration-object-evidence.test.mjs

  capture:
    name: Capture exact-SHA production schema evidence
    if: github.event_name == 'workflow_dispatch'
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: supabase-production-schema-evidence
    env:
      TARGET_SHA: ${{ inputs.release_sha }}
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      OUTPUT_DIR: artifacts/supabase-live-schema-evidence
    steps:
      - name: Validate inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]
          echo "TARGET_SHA=${TARGET_SHA,,}" >> "$GITHUB_ENV"

      - name: Checkout exact release SHA
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact current main and source run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')" = "$TARGET_SHA"
          RUN_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}")"
          test "$(jq -r '.head_sha' <<<"$RUN_JSON")" = "$TARGET_SHA"
          test "$(jq -r '.path' <<<"$RUN_JSON")" = '.github/workflows/supabase-production-migration-dry-run.yml'

      - name: Download exact migration inventory
        uses: actions/download-artifact@v4
        with:
          name: supabase-production-migration-dry-run-${{ inputs.release_sha }}
          path: source-artifact
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run_id }}

      - name: Validate database configuration
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: test -n "$SUPABASE_DB_URL"

      - name: Capture read-only live catalog
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT_DIR"
          psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -At -F $'\t' <<'SQL' > "$OUTPUT_DIR/live-catalog.tsv"
          begin read only;
          select 'TABLE', quote_ident(n.nspname)||'.'||quote_ident(c.relname)
          from pg_class c join pg_namespace n on n.oid=c.relnamespace
          where n.nspname not in ('pg_catalog','information_schema') and c.relkind in ('r','p');
          select 'VIEW', quote_ident(n.nspname)||'.'||quote_ident(c.relname)
          from pg_class c join pg_namespace n on n.oid=c.relnamespace
          where n.nspname not in ('pg_catalog','information_schema') and c.relkind in ('v','m');
          select 'FUNCTION', quote_ident(n.nspname)||'.'||quote_ident(p.proname)
          from pg_proc p join pg_namespace n on n.oid=p.pronamespace
          where n.nspname not in ('pg_catalog','information_schema');
          select 'TYPE', quote_ident(n.nspname)||'.'||quote_ident(t.typname)
          from pg_type t join pg_namespace n on n.oid=t.typnamespace
          where n.nspname not in ('pg_catalog','information_schema') and t.typtype in ('e','c','d');
          select 'INDEX', quote_ident(schemaname)||'.'||quote_ident(indexname) from pg_indexes where schemaname not in ('pg_catalog','information_schema');
          select 'POLICY', quote_ident(schemaname)||'.'||quote_ident(tablename) from pg_policies;
          commit;
          SQL
          node - <<'NODE'
          const fs=require('fs');
          const rows=fs.readFileSync(process.env.OUTPUT_DIR+'/live-catalog.tsv','utf8').trim().split(/\r?\n/).filter(Boolean).map(line=>{const [kind,name]=line.split('\t');return {kind,name:name.replaceAll('"','').toLowerCase()}});
          rows.sort((a,b)=>`${a.kind}:${a.name}`.localeCompare(`${b.kind}:${b.name}`));
          fs.writeFileSync(process.env.OUTPUT_DIR+'/live-schema-catalog.json',JSON.stringify({schema:'risck-comply.supabase-live-schema-catalog.v1',releaseSha:process.env.TARGET_SHA,capturedAt:new Date().toISOString(),transactionMode:'READ ONLY',objects:rows},null,2)+'\n');
          NODE

      - name: Build migration object evidence
        shell: bash
        run: |
          set -euo pipefail
          INVENTORY="$(find source-artifact -type f -path '*/drift/migration-reconciliation-inventory.json' -print -quit)"
          test -n "$INVENTORY"
          node scripts/supabase/build-migration-object-evidence.mjs "$INVENTORY" "$OUTPUT_DIR/live-schema-catalog.json" "$OUTPUT_DIR"

      - name: Upload immutable evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: supabase-live-schema-evidence-${{ env.TARGET_SHA }}
          path: artifacts/supabase-live-schema-evidence
          if-no-files-found: error
          retention-days: 90
