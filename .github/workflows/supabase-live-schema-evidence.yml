name: Supabase Live Schema Evidence

on:
  pull_request:
    paths:
      - 'scripts/supabase/build-migration-object-evidence.mjs'
      - 'scripts/supabase/build-migration-object-evidence.test.mjs'
      - 'scripts/supabase/migration-object-evidence-core.mjs'
      - 'scripts/supabase/normalize-live-schema-catalog.mjs'
      - 'scripts/supabase/normalize-live-schema-catalog.test.mjs'
      - 'scripts/supabase/production-schema-evidence.sql'
      - 'scripts/supabase/live-schema-evidence-workflow-contract.test.mjs'
      - '.github/workflows/supabase-live-schema-evidence.yml'
      - 'docs/security/runbooks/SUPABASE_LIVE_SCHEMA_EVIDENCE.md'
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact current main SHA to inspect
        required: true
        type: string
      source_run_id:
        description: Supabase Production Migration Dry Run workflow run containing the exact inventory
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  contract:
    name: Validate live schema evidence contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: |
          node --check scripts/supabase/build-migration-object-evidence.mjs
          node --check scripts/supabase/migration-object-evidence-core.mjs
          node --check scripts/supabase/normalize-live-schema-catalog.mjs
      - run: |
          node --test \
            scripts/supabase/build-migration-object-evidence.test.mjs \
            scripts/supabase/normalize-live-schema-catalog.test.mjs \
            scripts/supabase/live-schema-evidence-workflow-contract.test.mjs

  capture:
    name: Capture exact-SHA production schema evidence
    if: github.event_name == 'workflow_dispatch'
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: supabase-production-schema-evidence
    env:
      TARGET_SHA: ${{ inputs.release_sha }}
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      OUTPUT_DIR: artifacts/supabase-live-schema-evidence
    steps:
      - name: Validate inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]
          echo "TARGET_SHA=${TARGET_SHA,,}" >> "$GITHUB_ENV"

      - name: Checkout exact release SHA
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact current main and source run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')" = "$TARGET_SHA"
          RUN_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}")"
          test "$(jq -r '.head_sha' <<<"$RUN_JSON")" = "$TARGET_SHA"
          test "$(jq -r '.path' <<<"$RUN_JSON")" = '.github/workflows/supabase-production-migration-dry-run.yml'

      - name: Download exact migration inventory
        uses: actions/download-artifact@v8.0.1
        with:
          name: supabase-production-migration-dry-run-${{ inputs.release_sha }}
          path: source-artifact
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run_id }}

      - name: Validate database configuration
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: test -n "$SUPABASE_DB_URL"

      - name: Capture read-only live catalog
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT_DIR"
          psql "$SUPABASE_DB_URL" \
            -X \
            -qAt \
            -v ON_ERROR_STOP=1 \
            --file scripts/supabase/production-schema-evidence.sql \
            > "$OUTPUT_DIR/catalog.txt"

          test -s "$OUTPUT_DIR/catalog.txt"
          grep -q '^table|public|' "$OUTPUT_DIR/catalog.txt"
          grep -q '^migration|' "$OUTPUT_DIR/catalog.txt"
          grep -q '^catalog_capability|persistent_object_grants_v1$' "$OUTPUT_DIR/catalog.txt"
          sha256sum "$OUTPUT_DIR/catalog.txt" > "$OUTPUT_DIR/CATALOG_SHA256SUMS"

      - name: Build migration object evidence
        shell: bash
        run: |
          set -euo pipefail
          INVENTORY="$(find source-artifact -type f -path '*/drift/migration-reconciliation-inventory.json' -print -quit)"
          test -n "$INVENTORY"
          node scripts/supabase/build-migration-object-evidence.mjs \
            "$INVENTORY" \
            "$OUTPUT_DIR/catalog.txt" \
            "supabase/migrations" \
            "$OUTPUT_DIR" \
            "--target-sha=$TARGET_SHA" \
            "--dry-run-id=$SOURCE_RUN_ID" \
            "--schema-evidence-run-id=$GITHUB_RUN_ID"
          test -s "$OUTPUT_DIR/migration-object-evidence.json"

      - name: Publish bounded summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Supabase live schema evidence'
            echo
            echo "- Release SHA: \`$TARGET_SHA\`"
            echo "- Dry-run source: \`$SOURCE_RUN_ID\`"
            echo "- Schema evidence run: \`$GITHUB_RUN_ID\`"
            if test -f "$OUTPUT_DIR/catalog.txt"; then
              echo "- Tables/views: $(grep -c '^table|' "$OUTPUT_DIR/catalog.txt" || true)"
              echo "- Recorded migrations: $(grep -c '^migration|' "$OUTPUT_DIR/catalog.txt" || true)"
            fi
            echo '- Production writes: not authorized and not executed'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload immutable evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: supabase-live-schema-evidence-${{ env.TARGET_SHA }}
          path: artifacts/supabase-live-schema-evidence
          if-no-files-found: error
          retention-days: 90
