name: One-shot Stripe LIVE authority rebind

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/ops-stripe-live-authority-rebind.yml

permissions:
  contents: read

concurrency:
  group: ops-stripe-live-authority-rebind
  cancel-in-progress: true

jobs:
  rebind:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: Production
    env:
      RELEASE_SHA: ${{ github.sha }}
      STRIPE_ACCOUNT_BOOTSTRAP_CONFIRMATION: PROVISION_NEW_STRIPE_LIVE_ACCOUNT
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      HEALTHCHECK_TOKEN: ${{ secrets.HEALTHCHECK_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out trusted current main
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Require exact current main
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          main_sha="$(curl --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/main" | jq -r '.sha')"
          test "$main_sha" = "$RELEASE_SHA"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22

      - name: Load reviewed account authority
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_STRIPE_ACCOUNT_ID="$(node -e "const fs=require('node:fs');const a=JSON.parse(fs.readFileSync('config/stripe-live-account-authority.json','utf8'));if(a.schema!=='risck-comply.stripe-live-account-authority.v1'||a.mode!=='live'||!/^acct_[A-Za-z0-9]+$/.test(a.accountId))process.exit(1);process.stdout.write(a.accountId)")"
          echo "EXPECTED_STRIPE_ACCOUNT_ID=$EXPECTED_STRIPE_ACCOUNT_ID" >> "$GITHUB_ENV"

      - name: Load reviewed Vercel target authority
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const doc = JSON.parse(fs.readFileSync('config/production-provider-targets.json', 'utf8'));
          const target = doc?.vercel;
          if (
            doc?.schema !== 'risck-comply.production-provider-targets.v1'
            || !/^prj_[A-Za-z0-9]+$/.test(String(target?.projectId ?? ''))
            || !/^team_[A-Za-z0-9]+$/.test(String(target?.teamId ?? ''))
            || !/^[A-Za-z0-9][A-Za-z0-9._-]{0,99}$/.test(String(target?.projectName ?? ''))
          ) process.exit(1);
          fs.appendFileSync(process.env.GITHUB_ENV, [
            `VERCEL_PROJECT_ID=${target.projectId}`,
            `VERCEL_TEAM_ID=${target.teamId}`,
            `VERCEL_PROJECT_NAME=${target.projectName}`,
            '',
          ].join('\n'));
          NODE

      - name: Fail closed on incompatible Vercel binding types
        run: node scripts/security/check-vercel-stripe-binding-types.mjs

      - name: Verify protected Stripe authority before mutation
        run: node scripts/security/check-stripe-live-account-bootstrap-preflight.mjs

      - name: Revalidate exact current remote main immediately before provider mutation
        shell: bash
        run: |
          set -euo pipefail
          main_sha="$(curl --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/main" | jq -r '.sha')"
          test "$main_sha" = "$RELEASE_SHA"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"

      - name: Rebind canonical LIVE authority and prices to Vercel Production
        run: node scripts/ops/provision-stripe-live-account.mjs

      - name: Re-read Vercel Production bindings
        run: node scripts/security/load-vercel-stripe-price-bindings.mjs

      - name: Revalidate main after provider mutation
        shell: bash
        run: |
          set -euo pipefail
          main_sha="$(curl --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/main" | jq -r '.sha')"
          test "$main_sha" = "$RELEASE_SHA"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"

      - name: Build non-promoted Production candidate from exact rebound SHA
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"
          candidate_url="$(
            npx --yes "vercel@56.3.2" deploy --prod --skip-domain \
              --project="$VERCEL_PROJECT_ID" \
              --scope="$VERCEL_TEAM_ID" \
              --token="$VERCEL_TOKEN" | tail -n 1 | tr -d '\r'
          )"
          if [[ ! "$candidate_url" =~ ^https://[^[:space:]]+$ ]]; then
            echo "Non-promoted Vercel candidate URL missing." >&2
            exit 1
          fi
          deployment_host="${candidate_url#https://}"
          deployment_host="${deployment_host%%/*}"
          deployment_json="$(
            curl --fail --silent --show-error \
              --header "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v13/deployments/$deployment_host?teamId=$VERCEL_TEAM_ID"
          )"
          deployed_sha="$(jq -r '.meta.githubCommitSha // .gitSource.sha // empty' <<<"$deployment_json")"
          deployed_target="$(jq -r '.target // empty' <<<"$deployment_json")"
          deployed_state="$(jq -r '.readyState // .state // empty' <<<"$deployment_json")"
          test "${deployed_sha,,}" = "${RELEASE_SHA,,}"
          test "$deployed_target" = "production"
          test "$deployed_state" = "READY"
          echo "candidate_url=$candidate_url" >> "$GITHUB_OUTPUT"

      - name: Revalidate exact current main before Production promotion
        shell: bash
        run: |
          set -euo pipefail
          main_sha="$(curl --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/main" | jq -r '.sha')"
          test "$main_sha" = "$RELEASE_SHA"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"

      - name: Promote exact-SHA candidate to Production
        shell: bash
        env:
          CANDIDATE_URL: ${{ steps.deploy.outputs.candidate_url }}
        run: |
          set -euo pipefail
          test -n "$CANDIDATE_URL"
          npx --yes "vercel@56.3.2" promote "$CANDIDATE_URL" --yes \
            --project="$VERCEL_PROJECT_ID" \
            --scope="$VERCEL_TEAM_ID" \
            --token="$VERCEL_TOKEN"

      - name: Verify canonical Production alias resolves to promoted exact SHA
        shell: bash
        run: |
          set -euo pipefail
          production_json="$(
            curl --fail --silent --show-error \
              --header "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v13/deployments/www.risckcomply.com?teamId=$VERCEL_TEAM_ID"
          )"
          production_sha="$(jq -r '.meta.githubCommitSha // .gitSource.sha // empty' <<<"$production_json")"
          production_state="$(jq -r '.readyState // .state // empty' <<<"$production_json")"
          production_target="$(jq -r '.target // empty' <<<"$production_json")"
          test "${production_sha,,}" = "${RELEASE_SHA,,}"
          test "$production_target" = "production"
          test "$production_state" = "READY"

      - name: Prove canonical Production health and authenticated readiness after cutover
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HEALTHCHECK_TOKEN"
          ready_ok=false
          for _ in $(seq 1 24); do
            health_status="$(curl --silent --output /dev/null --write-out '%{http_code}' "https://www.risckcomply.com/api/health" || true)"
            ready_body="$(curl --silent --show-error \
              -H "Authorization: Bearer $HEALTHCHECK_TOKEN" \
              -H "Accept: application/json" \
              "https://www.risckcomply.com/api/ready" || true)"
            ready_status="$(jq -r '.status // empty' <<<"$ready_body" 2>/dev/null || true)"
            if [ "$health_status" = "200" ] && [ "$ready_status" = "ready" ]; then
              ready_ok=true
              break
            fi
            sleep 5
          done
          test "$ready_ok" = true

      - name: Verify canonical runtime release SHA after cutover
        shell: bash
        env:
          RELEASE_DEPLOYMENT_URL: https://www.risckcomply.com
          RELEASE_COMMIT_SHA: ${{ github.sha }}
          RELEASE_BUILD_SHA: ${{ github.sha }}
        run: node scripts/release/verify-runtime-release-sha.mjs
