name: Enterprise Integrations Runtime Proof

run-name: Enterprise integrations proof for ${{ inputs.release_sha }}

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full 40-character current main SHA
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: enterprise-integrations-runtime-${{ inputs.release_sha }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: production-integrations-proof
    env:
      RELEASE_SHA: ${{ inputs.release_sha }}

    steps:
      - name: Validate release SHA
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]]

      - name: Checkout exact release SHA
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ inputs.release_sha }}
          persist-credentials: false

      - name: Verify exact current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(git rev-parse origin/main)" = "$RELEASE_SHA"
          test "$GITHUB_SHA" = "$RELEASE_SHA"
          test "$GITHUB_REF_NAME" = "main"

      - name: Set up pinned Supabase CLI
        uses: supabase/setup-cli@46f89843689f213b433d85a0508d1183e1803070
        with:
          version: 2.101.0

      - name: Install PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Start exact-SHA disposable Supabase project database
        run: node scripts/recovery/manage-ephemeral-recovery-database.mjs start-project

      - name: Bind disposable database to integration validator
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RECOVERY_ISOLATED_DATABASE_URL"
          printf 'DATABASE_URL=%s\n' "$RECOVERY_ISOLATED_DATABASE_URL" >> "$GITHUB_ENV"

      - name: Execute fail-closed runtime validation
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DATABASE_URL"
          mkdir -p artifacts
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/security/validate-enterprise-integrations-runtime.sql > artifacts/enterprise-integrations-runtime.txt
          node -e 'const fs=require("fs"); const sha=process.env.RELEASE_SHA; fs.writeFileSync("artifacts/enterprise-integrations-runtime.json", JSON.stringify({schema_version:1,release_sha:sha,release_branch:"main",status:"PASS",validated_at:new Date().toISOString(),controls:["INT-SCHEMA","INT-RLS","INT-TENANT-FK","INT-AUDIT-IMMUTABLE","INT-CREDENTIAL-DIGEST"],limitations:["Provider interoperability, webhook delivery SLA, live OIDC/SAML login and SCIM conformance require separate provider testing."]},null,2)+"\n");'

      - name: Remove disposable project database
        if: always()
        run: node scripts/recovery/manage-ephemeral-recovery-database.mjs stop

      - name: Upload redacted runtime evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: enterprise-integrations-runtime-proof-${{ inputs.release_sha }}
          path: |
            artifacts/enterprise-integrations-runtime.json
            artifacts/enterprise-integrations-runtime.txt
          if-no-files-found: error
          retention-days: 90
