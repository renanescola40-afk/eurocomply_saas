name: Public Commercial GA Production

run-name: Public GA deploy for ${{ inputs.release_sha }}

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact 40-character SHA currently at the tip of main
        required: true
        type: string
      confirmation:
        description: Type DEPLOY_PUBLIC_GA to authorize the protected public production deployment
        required: true
        type: string

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: public-commercial-production
  cancel-in-progress: false

jobs:
  authorize:
    name: Authorize exact current-main Public GA SHA
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Validate explicit Public GA authorization
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || {
            echo 'release_sha must be a full 40-character Git SHA' >&2
            exit 1
          }
          test "$CONFIRMATION" = 'DEPLOY_PUBLIC_GA'
          test "$GITHUB_REF" = 'refs/heads/main'

      - name: Verify release SHA is the current main tip
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          main_sha="$(curl --fail --silent --show-error             -H "Authorization: Bearer $GH_TOKEN"             -H 'Accept: application/vnd.github+json'             -H 'X-GitHub-Api-Version: 2022-11-28'             "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/main" | jq -r '.sha')"
          test "$main_sha" = "${RELEASE_SHA,,}"

  deploy-public-ga:
    name: Public Commercial GA — build, deploy and verify exact SHA
    needs: authorize
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: production
    env:
      RELEASE_TARGET: public-production
      RELEASE_SHA: ${{ inputs.release_sha }}
      RELEASE_COMMIT_SHA: ${{ inputs.release_sha }}
      RELEASE_BUILD_SHA: ${{ inputs.release_sha }}
      NEXT_PUBLIC_BUILD_SHA: ${{ inputs.release_sha }}
      NEXT_TELEMETRY_DISABLED: '1'

      RELEASE_PRODUCTION_URL: https://www.risckcomply.com
      NEXT_PUBLIC_APP_URL: https://www.risckcomply.com
      NEXT_PUBLIC_SITE_URL: https://www.risckcomply.com
      TRUSTED_ORIGINS: https://www.risckcomply.com

      RELEASE_ROLLBACK_RESOLUTION_MODE: automatic

      HEALTHCHECK_TOKEN: ${{ secrets.HEALTHCHECK_TOKEN }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      STRIPE_PRICE_ESSENTIAL_MONTHLY: ${{ vars.STRIPE_PRICE_ESSENTIAL_MONTHLY || secrets['STRIPE_PRICE_ESSENTIAL_MONTHLY'] }}
      STRIPE_PRICE_ESSENTIAL_ANNUAL: ${{ vars.STRIPE_PRICE_ESSENTIAL_ANNUAL || secrets['STRIPE_PRICE_ESSENTIAL_ANNUAL'] }}
      STRIPE_PRICE_PROFESSIONAL_MONTHLY: ${{ vars.STRIPE_PRICE_PROFESSIONAL_MONTHLY || secrets['STRIPE_PRICE_PROFESSIONAL_MONTHLY'] }}
      STRIPE_PRICE_PROFESSIONAL_ANNUAL: ${{ vars.STRIPE_PRICE_PROFESSIONAL_ANNUAL || secrets['STRIPE_PRICE_PROFESSIONAL_ANNUAL'] }}

      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}

      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      EMAIL_FROM: ${{ vars.EMAIL_FROM }}
      REQUIRE_TRANSACTIONAL_EMAIL_DELIVERY: 'true'
      ENABLE_DASHBOARD_METRIC_SNAPSHOTS: 'false'

      NEXT_PUBLIC_SENTRY_DSN: ${{ vars.NEXT_PUBLIC_SENTRY_DSN || secrets['NEXT_PUBLIC_SENTRY_DSN'] }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

      REQUIRE_MALWARE_SCAN_FOR_UPLOADS: ${{ vars.REQUIRE_MALWARE_SCAN_FOR_UPLOADS || 'false' }}
      MALWARE_SCANNER_PROVIDER: ${{ vars.MALWARE_SCANNER_PROVIDER }}
      MALWARE_SCANNER_ENDPOINT: ${{ secrets.MALWARE_SCANNER_ENDPOINT }}
      MALWARE_SCANNER_URL: ${{ secrets.MALWARE_SCANNER_URL }}
      MALWARE_SCANNER_API_KEY: ${{ secrets.MALWARE_SCANNER_API_KEY }}
      CLOUDMERSIVE_API_KEY: ${{ secrets.CLOUDMERSIVE_API_KEY }}
      MALWARE_SCANNER_ALLOWED_HOSTS: ${{ vars.MALWARE_SCANNER_ALLOWED_HOSTS }}
      MALWARE_SCANNER_CLAMAV_HOST: ${{ secrets.MALWARE_SCANNER_CLAMAV_HOST }}
      MALWARE_SCANNER_CLAMAV_PORT: ${{ vars.MALWARE_SCANNER_CLAMAV_PORT }}
      MALWARE_SCANNER_TIMEOUT_MS: ${{ vars.MALWARE_SCANNER_TIMEOUT_MS }}

      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

    steps:
      - name: Check out exact release SHA
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Verify exact checkout and current main
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${RELEASE_SHA,,}"
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse origin/main)" = "${RELEASE_SHA,,}"

      - name: Revalidate Production environment governance after admission
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_ENVIRONMENT_NAME: production
          REQUIRE_PROTECTED_BRANCHES: 'true'
        run: node scripts/security/check-github-environment-governance.mjs

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies deterministically
        run: npm ci

      - name: Validate Public GA release helper syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/release/check-public-production-release-env.mjs
          node --check scripts/release/resolve-public-production-rollback.mjs
          node --check scripts/release/run-deployment-smoke-v2.mjs
          node --check scripts/release/verify-runtime-release-sha.mjs

      - name: Public production environment preflight
        run: node scripts/release/check-public-production-release-env.mjs

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test with production credentials isolated
        shell: bash
        run: |
          set -euo pipefail
          env -i \
            HOME="$HOME" \
            PATH="$PATH" \
            CI=true \
            NODE_ENV=test \
            npm run test

      - name: Build application
        run: npm run build

      - name: Public GA critical security gates
        shell: bash
        run: |
          set -euo pipefail
          npm run security:api-guards
          npm run security:auth-tokens
          npm run security:authorization-bola
          npm run security:server-action-identity
          npm run security:protected-routes
          npm run security:origin-guards
          npm run security:billing-webhook-body
          npm run security:public-secrets
          npm run security:public-errors
          npm run security:headers
          npm run security:no-store
          npm run security:storage
          npm run quality:routes

      - name: Vercel production environment readiness
        run: npm run ops:vercel-readiness

      - name: Verify Vercel production binding
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ] || [ -z "${VERCEL_PROJECT_ID:-}" ] || [ -z "${VERCEL_ORG_ID:-}" ]; then
            echo '::error title=Missing Vercel production binding::VERCEL_TOKEN, VERCEL_PROJECT_ID and VERCEL_ORG_ID are required.'
            exit 1
          fi
          if ! curl --fail --silent --show-error             --header "Authorization: Bearer $VERCEL_TOKEN"             "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID"             >/dev/null; then
            echo '::error title=Vercel project authentication failed::The configured token cannot read the bound production project/team.'
            exit 1
          fi
      - name: Reverify main before observing Vercel production
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse HEAD)" = "${RELEASE_SHA,,}"
          test "$(git rev-parse origin/main)" = "${RELEASE_SHA,,}"

      - name: Wait for exact-SHA Vercel production deployment
        id: vercel_deployment
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.vercel.com/v7/deployments?projectId=$VERCEL_PROJECT_ID&teamId=$VERCEL_ORG_ID&target=production&sha=${RELEASE_SHA,,}&limit=10"
          deployment_json=''
          for attempt in $(seq 1 40); do
            response="$(curl --fail --silent --show-error               --header "Authorization: Bearer $VERCEL_TOKEN"               "$api")"
            deployment_json="$(printf '%s' "$response" | jq -c '.deployments[0] // empty')"
            if [ -n "$deployment_json" ]; then
              state="$(printf '%s' "$deployment_json" | jq -r '.state // .readyState // empty')"
              deployment_id="$(printf '%s' "$deployment_json" | jq -r '.uid // .id // empty')"
              deployment_url="$(printf '%s' "$deployment_json" | jq -r '.url // empty')"
              observed_sha="$(printf '%s' "$deployment_json" | jq -r '.meta.githubCommitSha // empty')"
              observed_target="$(printf '%s' "$deployment_json" | jq -r '.target // empty')"

              test "$observed_sha" = "${RELEASE_SHA,,}"
              test "$observed_target" = "production"
              [[ "$deployment_id" =~ ^dpl_[A-Za-z0-9]+$ ]]
              [ -n "$deployment_url" ]

              case "$state" in
                READY)
                  echo "id=$deployment_id" >> "$GITHUB_OUTPUT"
                  echo "url=https://$deployment_url" >> "$GITHUB_OUTPUT"
                  break
                  ;;
                ERROR|CANCELED|BLOCKED)
                  echo "::error title=Exact-SHA Vercel deployment failed::Deployment $deployment_id reached terminal state $state."
                  exit 1
                  ;;
              esac
            fi

            if [ "$attempt" -eq 40 ]; then
              echo "::error title=Exact-SHA Vercel production deployment missing::No READY production deployment for ${RELEASE_SHA,,} was observed within 10 minutes."
              exit 1
            fi
            sleep 15
          done

      - name: Verify exact deployment identity
        shell: bash
        env:
          VERCEL_DEPLOYMENT_ID: ${{ steps.vercel_deployment.outputs.id }}
        run: |
          set -euo pipefail
          deployment="$(curl --fail --silent --show-error             --header "Authorization: Bearer $VERCEL_TOKEN"             "https://api.vercel.com/v13/deployments/$VERCEL_DEPLOYMENT_ID?teamId=$VERCEL_ORG_ID")"
          test "$(printf '%s' "$deployment" | jq -r '.projectId // empty')" = "$VERCEL_PROJECT_ID"
          test "$(printf '%s' "$deployment" | jq -r '.meta.githubCommitSha // empty')" = "${RELEASE_SHA,,}"
          state="$(printf '%s' "$deployment" | jq -r '.readyState // .state // empty')"
          test "$state" = "READY"

      - name: Resolve and validate previous healthy production rollback
        shell: bash
        env:
          CURRENT_VERCEL_DEPLOYMENT_ID: ${{ steps.vercel_deployment.outputs.id }}
        run: node scripts/release/resolve-public-production-rollback.mjs

      - name: Upload Public GA rollback resolution evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: public-ga-rollback-resolution-${{ inputs.release_sha }}
          path: artifacts/release/public-ga-rollback-resolution.json
          if-no-files-found: error
          retention-days: 90

      - name: Preserve Beagle pre-change release boundary
        shell: bash
        run: |
          set -euo pipefail
          binding='docs/security/pentest/BEAGLE_ACTIVE_TEST_VERSION_BINDING_2026-09-12.md'
          notice='docs/operations/BEAGLE_ACTIVE_TEST_OPERATIONAL_NOTICE_2026-09-12.md'
          external='docs/security/evidence/external/beagle-vapt-2026-09-12.md'
          amendment='docs/security/pentest/production-testing-amendment.md'

          for source in "$binding" "$notice" "$external" "$amendment"; do
            test -f "$source"
          done

          if grep -Eq 'OBSERVED_PRODUCTION_GITHUB_SHA=[a-f0-9]{40}' "$binding"; then
            tested_sha="$(grep -Eo 'OBSERVED_PRODUCTION_GITHUB_SHA=[a-f0-9]{40}' "$binding" | head -n 1 | cut -d= -f2)"
          else
            tested_sha="$(grep -F 'Production Git SHA:' "$external" | head -n 1 | grep -Eo '[a-f0-9]{40}')"
          fi

          if grep -Eq 'OBSERVED_PRODUCTION_DEPLOYMENT_ID=dpl_[A-Za-z0-9]+' "$binding"; then
            tested_deployment_id="$(grep -Eo 'OBSERVED_PRODUCTION_DEPLOYMENT_ID=dpl_[A-Za-z0-9]+' "$binding" | head -n 1 | cut -d= -f2)"
          else
            tested_deployment_id="$(grep -F 'Production deployment:' "$external" | head -n 1 | grep -Eo 'dpl_[A-Za-z0-9]+')"
          fi

          [[ "$tested_sha" =~ ^[a-f0-9]{40}$ ]]
          [[ "$tested_deployment_id" =~ ^dpl_[A-Za-z0-9]+$ ]]
          grep -q 'www.risckcomply.com' "$binding"
          grep -q 'EVIDENCE_PRESERVED=true' "$external"

          mkdir -p artifacts/release
          binding_sha256="$(sha256sum "$binding" | awk '{print $1}')"
          notice_sha256="$(sha256sum "$notice" | awk '{print $1}')"
          external_sha256="$(sha256sum "$external" | awk '{print $1}')"
          amendment_sha256="$(sha256sum "$amendment" | awk '{print $1}')"

          post_pentest=true
          if [ "$tested_sha" = "$RELEASE_SHA" ]; then
            post_pentest=false
          fi

          jq -n \
            --arg capturedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg testedDeploymentId "$tested_deployment_id" \
            --arg testedSha "$tested_sha" \
            --arg proposedReleaseSha "$RELEASE_SHA" \
            --arg bindingSha256 "$binding_sha256" \
            --arg noticeSha256 "$notice_sha256" \
            --arg externalSha256 "$external_sha256" \
            --arg amendmentSha256 "$amendment_sha256" \
            --argjson proposedReleaseIsPostPentestVersion "$post_pentest" \
            '{
              schema: "risck-comply.beagle-prechange-preservation.v1",
              capturedAt: $capturedAt,
              canonicalTarget: "https://www.risckcomply.com",
              testedDeploymentId: $testedDeploymentId,
              testedSha: $testedSha,
              proposedReleaseSha: $proposedReleaseSha,
              proposedReleaseIsPostPentestVersion: $proposedReleaseIsPostPentestVersion,
              coverageInheritance: false,
              statement: "Existing Beagle evidence remains attributed only to the tested pre-change Production version; this release does not inherit Beagle coverage without separate revalidation.",
              sourceDigests: {
                versionBindingSha256: $bindingSha256,
                operationalNoticeSha256: $noticeSha256,
                externalEvidenceSha256: $externalSha256,
                productionTestingAmendmentSha256: $amendmentSha256
              }
            }' > artifacts/release/beagle-prechange-preservation.json

      - name: Upload Beagle pre-change preservation artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: beagle-prechange-preservation-${{ inputs.release_sha }}
          path: |
            artifacts/release/beagle-prechange-preservation.json
            docs/security/pentest/BEAGLE_ACTIVE_TEST_VERSION_BINDING_2026-09-12.md
            docs/operations/BEAGLE_ACTIVE_TEST_OPERATIONAL_NOTICE_2026-09-12.md
            docs/security/evidence/external/beagle-vapt-2026-09-12.md
            docs/security/pentest/production-testing-amendment.md
          if-no-files-found: error
          retention-days: 90

      - name: Reverify main before canonical production verification
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse HEAD)" = "${RELEASE_SHA,,}"
          test "$(git rev-parse origin/main)" = "${RELEASE_SHA,,}"

      - name: Production smoke on canonical hostname
        env:
          RELEASE_DEPLOYMENT_URL: https://www.risckcomply.com
          RELEASE_SMOKE_URLS: https://www.risckcomply.com
        run: npm run release:deployment-smoke

      - name: Verify exact deployed runtime SHA
        env:
          RELEASE_DEPLOYMENT_URL: https://www.risckcomply.com
          RELEASE_PRODUCTION_URL: https://www.risckcomply.com
        run: node scripts/release/verify-runtime-release-sha.mjs

      - name: Reverify main after production promotion
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse origin/main)" = "${RELEASE_SHA,,}"

      - name: Public GA deployment summary
        if: always()
        shell: bash
        run: |
          {
            echo '## RISCK COMPLY Public Commercial GA'
            echo
            printf '%s\n' "- Release SHA: $RELEASE_SHA"
            echo "- Vercel project binding: checked"
            echo "- Exact-SHA Vercel production deployment: observed READY if prior step passed"
            echo "- Healthy rollback target: auto-resolved and health-checked if prior step passed"
            echo "- Exact runtime SHA: verified if prior verification step passed"
            echo "- Enterprise 100 evidence: intentionally independent from this Public GA deployment lane"
          } >> "$GITHUB_STEP_SUMMARY"
