name: G5-02 PostgreSQL 17.6 Canonical Replay
on:
  push:
    branches:
      - fix/g5-02-evidence-failclosed-20261023
    paths:
      - .github/workflows/g5-02-buildkite-replay.yml
      - scripts/diagnostics/g5-02-*.py
      - scripts/diagnostics/g5-02-*.json
      - supabase/migrations/**
permissions:
  contents: read
  issues: write

jobs:
  isolated-replay:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_DB: risck_synthetic
          POSTGRES_USER: risck_synthetic
          POSTGRES_PASSWORD: synthetic-local-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U risck_synthetic -d risck_synthetic"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGDATABASE: risck_synthetic
      PGUSER: risck_synthetic
      PGPASSWORD: synthetic-local-only
    steps:
      - name: Checkout exact event SHA
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reject unsafe provider variables
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REF_NAME" = "fix/g5-02-evidence-failclosed-20261023"
          for key in DATABASE_URL DIRECT_URL SUPABASE_SERVICE_ROLE_KEY SUPABASE_ACCESS_TOKEN VERCEL_TOKEN STRIPE_SECRET_KEY; do
            if printenv "$key" >/dev/null 2>&1; then
              echo "Forbidden production-capable env: $key" >&2
              exit 1
            fi
          done
      - name: Install client and confirm synthetic PostgreSQL 17.6
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          psql -X -Atqc "select current_setting('server_version')"
          psql -X -Atqc "select current_database()"
          test "$(psql -X -Atqc "select current_database()")" = "risck_synthetic"
      - name: Discover historical SQL sources (offline)
        shell: bash
        run: python3 scripts/diagnostics/g5-02-source-discovery.py
      - name: Replay canonical migration source (retain failure for evidence)
        id: replay
        shell: bash
        run: |
          set +e
          python3 scripts/diagnostics/g5-02-canonical-replay.py
          rc=$?
          printf 'replay_exit_code=%s\n' "$rc" >> "$GITHUB_OUTPUT"
          exit "$rc"
      - name: Publish synthetic evidence as Buildkite artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: g5-02-evidence
          path: artifacts/g5-02-pg17/
          if-no-files-found: warn
      - name: Report sanitized summary to GitHub PR
        if: always()
        env:
          G5_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          G5_PR_NUMBER: "2575"
        shell: bash
        run: python3 scripts/diagnostics/g5-02-publish-pr-evidence.py
      - name: Fail closed after evidence collection
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib,sys
          p=pathlib.Path("artifacts/g5-02-pg17/replay.json")
          if not p.is_file():
              print("G5_02_ACCEPTANCE=FAIL missing replay evidence")
              sys.exit(1)
          data=json.loads(p.read_text())
          accepted=(data.get("status")=="PASS" and data.get("completed")==137)
          print("G5_02_ACCEPTANCE="+("PASS" if accepted else "FAIL"))
          sys.exit(0 if accepted else 1)
          PY
