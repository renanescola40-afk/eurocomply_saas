name: Stripe Binding Runtime Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stripe-binding-runtime-probe.yml'
      - 'src/app/api/internal/stripe-diagnostic/route.ts'
  workflow_dispatch:

permissions:
  contents: read

env:
  TARGET_SHA: ${{ github.sha }}

jobs:
  production-stripe-binding-probe:
    name: Production Stripe binding probe
    runs-on: ubuntu-24.04
    environment: Production
    timeout-minutes: 5
    steps:
      - name: Probe protected production Stripe bindings
        shell: bash
        env:
          HEALTHCHECK_TOKEN: ${{ secrets.HEALTHCHECK_TOKEN }}
          RELEASE_PRODUCTION_URL: ${{ secrets.RELEASE_PRODUCTION_URL || vars.RELEASE_PRODUCTION_URL }}
        run: |
          set -euo pipefail
          test -n "$HEALTHCHECK_TOKEN"
          test -n "$RELEASE_PRODUCTION_URL"

          base="${RELEASE_PRODUCTION_URL%/}"
          response_file="$(mktemp)"
          http_code="$(curl --silent --show-error \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --connect-timeout 10 \
            --max-time 20 \
            -H "Authorization: Bearer $HEALTHCHECK_TOKEN" \
            -H 'Accept: application/json' \
            "$base/api/internal/stripe-diagnostic")"

          jq '{status,secretKeyConfigured,bindings:[.bindings[]|{label,configured,ok,error}]}' "$response_file"
          jq -e '.secretKeyConfigured == true and (.bindings | length == 4)' "$response_file" >/dev/null

          if [ "$http_code" != "200" ]; then
            echo "STRIPE_BINDING_PROBE_HTTP_STATUS=$http_code"
            exit 1
          fi

          jq -e '.status == "ok" and all(.bindings[]; .configured == true and .ok == true)' "$response_file" >/dev/null
