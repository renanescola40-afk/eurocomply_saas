name: Supabase Migration Execution Plan

on:
  pull_request:
    paths:
      - 'scripts/supabase/build-migration-execution-plan.mjs'
      - 'scripts/supabase/build-migration-execution-plan.test.mjs'
      - 'scripts/supabase/validate-migration-evidence-lineage.mjs'
      - 'scripts/supabase/validate-migration-evidence-lineage.test.mjs'
      - '.github/workflows/supabase-migration-execution-plan.yml'
      - 'docs/security/runbooks/SUPABASE_MIGRATION_EXECUTION_PLAN.md'
  workflow_dispatch:
    inputs:
      release_sha:
        description: Immutable subject SHA whose reviewed classifications are being planned
        required: true
        type: string
      decision_run_id:
        description: Successful migration classification decision gate run ID
        required: true
        type: string
      batch_size:
        description: Maximum migrations per batch, 1-25
        required: true
        default: '10'
        type: string

permissions:
  contents: read
  actions: read

jobs:
  contract:
    name: Validate execution-plan contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --check scripts/supabase/build-migration-execution-plan.mjs
      - run: node --check scripts/supabase/validate-migration-evidence-lineage.mjs
      - run: |
          node --test scripts/supabase/build-migration-execution-plan.test.mjs
          node --test scripts/supabase/validate-migration-evidence-lineage.test.mjs

  compile:
    name: Compile non-authorizing migration execution plan
    if: github.event_name == 'workflow_dispatch'
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: supabase-production-migration-review
    env:
      SUBJECT_SHA: ${{ inputs.release_sha }}
      SOURCE_RUN_ID: ${{ inputs.decision_run_id }}
      MIGRATION_BATCH_SIZE: ${{ inputs.batch_size }}
      OUTPUT_DIR: artifacts/supabase-migration-execution-plan
    steps:
      - name: Validate inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SUBJECT_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$MIGRATION_BATCH_SIZE" =~ ^[0-9]+$ ]]
          test "$MIGRATION_BATCH_SIZE" -ge 1
          test "$MIGRATION_BATCH_SIZE" -le 25
          echo "SUBJECT_SHA=${SUBJECT_SHA,,}" >> "$GITHUB_ENV"

      - name: Checkout current main evidence commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Verify subject lineage and decision run provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CURRENT_SHA="$(git rev-parse HEAD)"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')" = "$CURRENT_SHA"
          git cat-file -e "$SUBJECT_SHA^{commit}"
          git merge-base --is-ancestor "$SUBJECT_SHA" "$CURRENT_SHA"
          mapfile -t CHANGED < <(git diff --name-only "$SUBJECT_SHA".."$CURRENT_SHA")
          node scripts/supabase/validate-migration-evidence-lineage.mjs "$SUBJECT_SHA" "$CURRENT_SHA" execution "${CHANGED[@]}"

          RUN_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}")"
          test "$(jq -r '.head_sha' <<<"$RUN_JSON")" = "$CURRENT_SHA"
          test "$(jq -r '.path' <<<"$RUN_JSON")" = '.github/workflows/supabase-migration-reconciliation-decision-gate.yml'
          test "$(jq -r '.conclusion' <<<"$RUN_JSON")" = 'success'
          echo "CURRENT_SHA=$CURRENT_SHA" >> "$GITHUB_ENV"

      - name: Download accepted classification artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          name: supabase-migration-reconciliation-decisions-${{ inputs.release_sha }}
          path: source-decision
          github-token: ${{ github.token }}
          run-id: ${{ inputs.decision_run_id }}

      - name: Compile bounded pre-staging plan
        shell: bash
        run: |
          set -euo pipefail
          DECISION="$(find source-decision -name decision-result.json -print -quit)"
          PENDING="$(find source-decision -name pending-deployment-plan.json -print -quit)"
          REPAIR="$(find source-decision -name migration-history-repair-candidates.json -print -quit)"
          test -n "$DECISION"
          test -n "$PENDING"
          test -n "$REPAIR"
          node scripts/supabase/build-migration-execution-plan.mjs "$DECISION" "$PENDING" "$REPAIR" "$OUTPUT_DIR"

      - name: Publish safety summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Supabase migration execution plan'
            echo
            echo "- Subject release SHA: \`$SUBJECT_SHA\`"
            echo "- Evidence commit SHA: \`${CURRENT_SHA:-unresolved}\`"
            echo "- Batch size: \`$MIGRATION_BATCH_SIZE\`"
            echo '- SQL executed: no'
            echo '- Migration history modified: no'
            echo '- Staging rehearsal required before production: yes for pending migrations'
            echo '- Production write authorized: no'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload immutable planning artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: supabase-migration-execution-plan-${{ env.SUBJECT_SHA }}
          path: artifacts/supabase-migration-execution-plan
          if-no-files-found: error
          retention-days: 90
