name: Supabase Migration Execution Plan

on:
  pull_request:
    paths:
      - 'scripts/supabase/build-migration-execution-plan.mjs'
      - 'scripts/supabase/build-migration-execution-plan.test.mjs'
      - '.github/workflows/supabase-migration-execution-plan.yml'
      - 'docs/security/runbooks/SUPABASE_MIGRATION_EXECUTION_PLAN.md'
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact current main SHA
        required: true
        type: string
      decision_run_id:
        description: Run ID of the accepted migration decision gate artifact
        required: true
        type: string
      batch_size:
        description: Maximum migrations per batch, 1-25
        required: true
        default: '10'
        type: string

permissions:
  contents: read
  actions: read

jobs:
  contract:
    name: Validate execution-plan contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --check scripts/supabase/build-migration-execution-plan.mjs
      - run: node --test scripts/supabase/build-migration-execution-plan.test.mjs

  compile:
    name: Compile non-authorizing migration execution plan
    if: github.event_name == 'workflow_dispatch'
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: supabase-production-migration-review
    env:
      TARGET_SHA: ${{ inputs.release_sha }}
      SOURCE_RUN_ID: ${{ inputs.decision_run_id }}
      MIGRATION_BATCH_SIZE: ${{ inputs.batch_size }}
      OUTPUT_DIR: artifacts/supabase-migration-execution-plan
    steps:
      - name: Validate exact inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$MIGRATION_BATCH_SIZE" =~ ^[0-9]+$ ]]
          test "$MIGRATION_BATCH_SIZE" -ge 1
          test "$MIGRATION_BATCH_SIZE" -le 25
          echo "TARGET_SHA=${TARGET_SHA,,}" >> "$GITHUB_ENV"

      - name: Checkout exact current main
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact SHA and decision run provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')" = "$TARGET_SHA"
          RUN_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}")"
          test "$(jq -r '.head_sha' <<<"$RUN_JSON")" = "$TARGET_SHA"
          test "$(jq -r '.path' <<<"$RUN_JSON")" = '.github/workflows/supabase-migration-reconciliation-decision-gate.yml'
          test "$(jq -r '.conclusion' <<<"$RUN_JSON")" = 'success'

      - name: Download accepted decision artifacts
        uses: actions/download-artifact@v4
        with:
          name: supabase-migration-reconciliation-decisions-${{ inputs.release_sha }}
          path: source-decision
          github-token: ${{ github.token }}
          run-id: ${{ inputs.decision_run_id }}

      - name: Compile bounded plan only
        shell: bash
        run: |
          set -euo pipefail
          DECISION="$(find source-decision -name decision-result.json -print -quit)"
          PENDING="$(find source-decision -name pending-deployment-plan.json -print -quit)"
          REPAIR="$(find source-decision -name migration-history-repair-candidates.json -print -quit)"
          test -n "$DECISION"
          test -n "$PENDING"
          test -n "$REPAIR"
          node scripts/supabase/build-migration-execution-plan.mjs "$DECISION" "$PENDING" "$REPAIR" "$OUTPUT_DIR"

      - name: Publish safety summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Supabase migration execution plan'
            echo
            echo "- Release SHA: \`$TARGET_SHA\`"
            echo "- Batch size: \`$MIGRATION_BATCH_SIZE\`"
            echo '- SQL executed: no'
            echo '- Migration history modified: no'
            echo '- Dry-run authorized: no'
            echo '- Production write authorized: no'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload immutable planning artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: supabase-migration-execution-plan-${{ env.TARGET_SHA }}
          path: artifacts/supabase-migration-execution-plan
          if-no-files-found: error
          retention-days: 90
