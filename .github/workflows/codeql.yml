name: CodeQL

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '23 3 * * 1'

permissions:
  actions: read
  contents: read
  security-events: write

# A newer commit supersedes an in-flight CodeQL run for the same PR/main ref.
# Keep all PR, push and scheduled security triggers enabled.
concurrency:
  group: codeql-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze JavaScript and TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        language:
          - javascript-typescript

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # Keep CodeQL v4 action steps on the same immutable revision to avoid
      # mixed-version autobuild and analysis configuration errors.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@24c54180a607b1449ed407dd24f251e4e9147c8d

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d
        with:
          category: '/language:${{ matrix.language }}'
          output: codeql-results
          # Keep the supported default upload path on pull requests as well as main.
          # CodeQL Action v4 post-processes SARIF even when upload is disabled, and
          # disabling PR upload can make result interpretation query a missing PR ref.
          upload: always

      - name: Preserve CodeQL SARIF for pull requests
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: codeql-sarif-${{ github.sha }}
          path: codeql-results
          if-no-files-found: error
          retention-days: 30