name: P1 Admin MFA Evidence

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'docs/security/evidence/p1/admin-mfa-required.json'
      - 'docs/security/evidence/p1/admin-mfa-required.template.json'
      - 'docs/security/P1_ADMIN_MFA_USAGE.md'
      - 'scripts/security/check-p1-admin-mfa-evidence.mjs'
      - '.github/workflows/p1-admin-mfa.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'docs/security/evidence/p1/admin-mfa-required.json'
      - 'docs/security/evidence/p1/admin-mfa-required.template.json'
      - 'docs/security/P1_ADMIN_MFA_USAGE.md'
      - 'scripts/security/check-p1-admin-mfa-evidence.mjs'
      - '.github/workflows/p1-admin-mfa.yml'

permissions:
  contents: read

jobs:
  p1-admin-mfa:
    name: Validate P1 admin MFA evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Show runner Node.js and npm versions
        run: |
          node --version
          npm --version

      - name: Validate P1 admin MFA evidence if present
        run: node scripts/security/check-p1-admin-mfa-evidence.mjs
