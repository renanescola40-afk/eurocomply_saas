name: Stripe Billing Portal Bootstrap

run-name: Stripe Billing Portal authority alignment for ${{ inputs.release_sha }}

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact current main SHA whose reviewed Portal contract and policy will be aligned
        required: true
        type: string
      confirmation:
        description: Type PROVISION_STRIPE_BILLING_PORTAL_CONFIGURATION
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: stripe-billing-portal-bootstrap-production
  cancel-in-progress: false

jobs:
  provision:
    name: Align reviewed live Billing Portal authority
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Check out main history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Require exact current main SHA
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          git fetch --no-tags --prune origin main
          CURRENT_MAIN="$(git rev-parse origin/main)"
          test "$CURRENT_MAIN" = "${RELEASE_SHA,,}"
          git checkout --detach "${RELEASE_SHA,,}"
          test "$(git rev-parse HEAD)" = "${RELEASE_SHA,,}"

      - name: Validate operator confirmation
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = "PROVISION_STRIPE_BILLING_PORTAL_CONFIGURATION"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Align or reuse contract-selected Stripe Billing Portal configuration
        id: portal
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_BILLING_PORTAL_BOOTSTRAP_CONFIRMATION: ${{ inputs.confirmation }}
        run: node scripts/ops/provision-stripe-billing-portal-config.mjs

      - name: Publish operator handoff
        shell: bash
        env:
          CONFIGURATION_ID: ${{ steps.portal.outputs.configuration_id }}
          DISPOSITION: ${{ steps.portal.outputs.disposition }}
          CONTRACT_SOURCE: ${{ steps.portal.outputs.contract_source }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          [[ "$CONFIGURATION_ID" =~ ^bpc_[A-Za-z0-9]+$ ]]
          test "$CONTRACT_SOURCE" = "default" -o "$CONTRACT_SOURCE" = "explicit"
          {
            echo '## Stripe Billing Portal authority alignment'
            echo
            echo "- Source SHA: ${RELEASE_SHA,,}"
            echo "- Contract authority: $CONTRACT_SOURCE"
            echo "- Provider result: $DISPOSITION"
            echo "- Verified configuration: $CONFIGURATION_ID"
            echo
            echo 'No application contract was changed by this workflow. The provider object selected by config/stripe-billing-portal-contract.json was reused or aligned to the reviewed policy. Run the exact-SHA Stripe/provider proof next.'
          } >> "$GITHUB_STEP_SUMMARY"
