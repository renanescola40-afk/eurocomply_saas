name: Auth RBAC Tenant Proof

run-name: Auth/RBAC tenant proof for ${{ inputs.release_sha || github.sha }}

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_sha:
        description: Optional full 40-character current main SHA; defaults to the triggering SHA
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: auth-rbac-runtime-proof-${{ inputs.release_sha || github.sha }}
  cancel-in-progress: false

jobs:
  validate-auth-rbac:
    name: Validate live Auth RBAC and tenant isolation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    env:
      TARGET_SHA: ${{ inputs.release_sha || github.sha }}

    steps:
      - name: Validate requested release SHA
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$TARGET_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "release_sha must be a full 40-character Git SHA" >&2
            exit 1
          fi
          echo "TARGET_SHA=${TARGET_SHA,,}" >> "$GITHUB_ENV"

      - name: Check out exact release SHA
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ inputs.release_sha || github.sha }}
          persist-credentials: false

      - name: Verify exact current main checkout
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          OBSERVED_SHA="$(git rev-parse HEAD)"
          test "$OBSERVED_SHA" = "$TARGET_SHA"
          MAIN_SHA="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/main" | jq -r '.sha')"
          test "$MAIN_SHA" = "$TARGET_SHA"

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm

      - name: Install deterministic dependencies
        run: npm ci --ignore-scripts

      - name: Validate Auth RBAC proof contracts
        run: >-
          npx vitest run
          tests/security/auth-rbac-runtime-proof.test.ts
          tests/security/auth-rbac-scorecard-evidence.test.ts

      - name: Execute protected Auth RBAC tenant validation
        env:
          ENTERPRISE_EXPECTED_SHA: ${{ env.TARGET_SHA }}
          ENTERPRISE_EXPECTED_BRANCH: main
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          AUTH_RBAC_ORGANIZATION_A_ID: ${{ secrets.AUTH_RBAC_ORGANIZATION_A_ID }}
          AUTH_RBAC_ORGANIZATION_B_ID: ${{ secrets.AUTH_RBAC_ORGANIZATION_B_ID }}
          AUTH_RBAC_OWNER_EMAIL: ${{ secrets.AUTH_RBAC_OWNER_EMAIL }}
          AUTH_RBAC_OWNER_PASSWORD: ${{ secrets.AUTH_RBAC_OWNER_PASSWORD }}
          AUTH_RBAC_MEMBER_EMAIL: ${{ secrets.AUTH_RBAC_MEMBER_EMAIL }}
          AUTH_RBAC_MEMBER_PASSWORD: ${{ secrets.AUTH_RBAC_MEMBER_PASSWORD }}
          AUTH_RBAC_OUTSIDER_EMAIL: ${{ secrets.AUTH_RBAC_OUTSIDER_EMAIL }}
          AUTH_RBAC_OUTSIDER_PASSWORD: ${{ secrets.AUTH_RBAC_OUTSIDER_PASSWORD }}
        run: node scripts/security/run-auth-rbac-live-validation.mjs

      - name: Validate redacted source runtime evidence
        if: always()
        run: node scripts/security/check-auth-rbac-runtime-evidence.mjs

      - name: Derive canonical scorecard evidence
        if: always()
        run: node scripts/security/write-auth-rbac-scorecard-evidence.mjs

      - name: Validate canonical scorecard evidence
        if: always()
        run: node scripts/security/check-auth-rbac-scorecard-evidence.mjs

      - name: Upload redacted runtime and scorecard evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: auth-rbac-runtime-proof-${{ env.TARGET_SHA }}
          path: |
            docs/security/evidence/runtime/auth-rbac-final-validation.json
            docs/security/evidence/runtime/auth-rbac-validation.json
          if-no-files-found: error
          retention-days: 90
