name: One-time fast-uri lock repair

on:
  pull_request:
    types: [synchronize]
    paths:
      - .github/workflows/one-time-fix-fast-uri-lock.yml

permissions:
  contents: write

concurrency:
  group: one-time-fast-uri-lock-repair-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  repair-lock:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/safe-runtime-autopromotion-megapack'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/safe-runtime-autopromotion-megapack
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Update vulnerable transitive dependency
        run: npm update fast-uri --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify patched version
        run: |
          node - <<'NODE'
          const lock = require('./package-lock.json');
          const version = lock.packages?.['node_modules/fast-uri']?.version;
          const [major, minor, patch] = String(version || '').split('.').map(Number);
          const patched = major > 3 || (major === 3 && (minor > 1 || (minor === 1 && patch >= 3)));
          if (!patched) throw new Error(`Expected patched fast-uri >=3.1.3, got ${version}`);
          console.log(`Using patched fast-uri ${version}`);
          NODE
          npm audit --audit-level=moderate

      - name: Commit generated lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo 'package-lock.json already contains the patched dependency.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'fix(security): update fast-uri to patched release'
          git push origin HEAD:agent/safe-runtime-autopromotion-megapack
