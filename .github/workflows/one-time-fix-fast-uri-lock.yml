name: One-time fast-uri lock repair

on:
  push:
    branches:
      - agent/safe-runtime-autopromotion-megapack
    paths:
      - .github/workflows/one-time-fix-fast-uri-lock.yml

permissions:
  contents: write

concurrency:
  group: one-time-fast-uri-lock-repair
  cancel-in-progress: false

jobs:
  repair-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/safe-runtime-autopromotion-megapack
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Update vulnerable transitive dependency
        run: npm update fast-uri --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify patched version
        run: |
          node -e "const lock=require('./package-lock.json'); const v=lock.packages?.['node_modules/fast-uri']?.version; if(v!=='3.1.3') throw new Error('Expected fast-uri 3.1.3, got '+v)"
          npm audit --audit-level=moderate

      - name: Commit generated lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo 'package-lock.json already contains the patched dependency.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'fix(security): update fast-uri to patched 3.1.3'
          git push origin HEAD:agent/safe-runtime-autopromotion-megapack
