name: Enable Public Paid GA

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: enable-public-paid-ga
  cancel-in-progress: false

jobs:
  enable:
    name: Enable paid self-serve checkout
    runs-on: ubuntu-latest
    environment: Production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_PROJECT_ID: prj_APpXAyQFy1Gie50xfbO45zjkyUSm
      VERCEL_TEAM_ID: team_wu3LZI6ReFxO16xipv73GLwG
      VERCEL_TEAM_SLUG: renanescola40-afks-projects
      VERCEL_CLI_VERSION: 56.3.2
    steps:
      - name: Require Vercel authority
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"
          test -n "$VERCEL_PROJECT_ID"
          test -n "$VERCEL_TEAM_ID"

      - name: Enable Public Paid GA in Vercel Production
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          status="$(
            curl --silent --show-error               --output "$response_file"               --write-out '%{http_code}'               --request POST               --url "https://api.vercel.com/v10/projects/$VERCEL_PROJECT_ID/env?teamId=$VERCEL_TEAM_ID&upsert=true"               --header "Authorization: Bearer $VERCEL_TOKEN"               --header "Content-Type: application/json"               --data '{"key":"RISCK_COMPLY_PAID_BILLING_REQUIRED","value":"true","type":"plain","target":["production"],"comment":"Public Paid GA approved after exact-SHA runtime/provider closure"}'
          )"
          if [[ "$status" != "200" && "$status" != "201" ]]; then
            echo "Vercel environment update failed with HTTP $status."
            jq -r '{error: (.error.code // "unknown"), message: (.error.message // "request_failed")}' "$response_file" 2>/dev/null || true
            exit 1
          fi
          key="$(jq -r '.created.key // .key // empty' "$response_file")"
          test "$key" = "RISCK_COMPLY_PAID_BILLING_REQUIRED"
          echo "RISCK_COMPLY_PAID_BILLING_REQUIRED enabled for Production."

      - name: Resolve current READY production deployment
        id: deployment
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          curl --silent --show-error --fail             --url "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT_ID&teamId=$VERCEL_TEAM_ID&target=production&limit=20"             --header "Authorization: Bearer $VERCEL_TOKEN" > "$response_file"
          deployment_url="$(jq -r '[.deployments[] | select((.state // .readyState) == "READY" and .target == "production")][0].url // empty' "$response_file")"
          test -n "$deployment_url"
          echo "url=https://$deployment_url" >> "$GITHUB_OUTPUT"
          echo "Resolved current READY production deployment."

      - name: Redeploy once with updated Production environment
        shell: bash
        run: |
          set -euo pipefail
          npx --yes "vercel@$VERCEL_CLI_VERSION" redeploy "${{ steps.deployment.outputs.url }}"             --token "$VERCEL_TOKEN"             --scope "$VERCEL_TEAM_SLUG"

      - name: Summary
        shell: bash
        run: |
          {
            echo "## Public Paid GA activation"
            echo "- Production flag: enabled"
            echo "- Redeploy requested: yes"
            echo "- Secret values logged: no"
          } >> "$GITHUB_STEP_SUMMARY"
