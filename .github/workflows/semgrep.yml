name: Semgrep

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: semgrep-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Run Semgrep SAST
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SEMGREP_VERSION: '1.97.0'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install pinned Semgrep without Docker Hub
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input --retries 5 --timeout 60 "semgrep==${SEMGREP_VERSION}"
          installed_version="$(semgrep --version | head -n 1 | tr -d '[:space:]')"
          if [ "$installed_version" != "$SEMGREP_VERSION" ]; then
            echo "::error title=Semgrep version mismatch::Expected $SEMGREP_VERSION, got $installed_version."
            exit 1
          fi

      - name: Run Semgrep rules
        run: >-
          semgrep scan
          --config p/owasp-top-ten
          --config p/typescript
          --config p/javascript
          --severity ERROR
          --error
          --metrics off
          src
