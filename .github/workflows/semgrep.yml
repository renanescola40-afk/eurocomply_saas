name: Semgrep

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: semgrep-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Run Semgrep SAST
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: semgrep/semgrep:1.97.0
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run Semgrep rules on PR diff
        if: github.event_name == 'pull_request'
        run: semgrep scan --config p/owasp-top-ten --config p/typescript --config p/javascript --baseline-commit "${{ github.event.pull_request.base.sha }}" --error --metrics off

      - name: Run Semgrep rules on default branch
        if: github.event_name != 'pull_request'
        run: semgrep scan --config p/owasp-top-ten --config p/typescript --config p/javascript --error --metrics off
