name: Enterprise Runtime Closeout

run-name: Enterprise runtime closeout for ${{ inputs.release_sha }}

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full 40-character current main SHA
        required: true
        type: string
      confirmation:
        description: Type RUN_ENTERPRISE_RUNTIME_CLOSEOUT
        required: true
        type: string
      recovery_rollback_confirmation:
        description: Type EXECUTE_CONTROLLED_PRODUCTION_ROLLBACK to authorize the protected recovery exercise
        required: true
        type: string

permissions:
  contents: read
  actions: write

concurrency:
  group: enterprise-runtime-closeout-${{ inputs.release_sha }}
  cancel-in-progress: false

jobs:
  closeout:
    name: Dispatch, collect and promote protected runtime evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 720
    environment: production-enterprise-closeout
    env:
      RELEASE_SHA: ${{ inputs.release_sha }}
      RELEASE_BRANCH: main
      TARGET_SHA: ${{ inputs.release_sha }}
      RECOVERY_ROLLBACK_CONFIRMATION: ${{ inputs.recovery_rollback_confirmation }}
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_CHECKS_EVIDENCE_PATH: artifacts/enterprise-readiness/github-checks-evidence.json
      ENTERPRISE_EXPECTED_SHA: ${{ inputs.release_sha }}
      ENTERPRISE_SCORECARD_JSON: artifacts/enterprise-readiness/canonical-scorecard.json
      ENTERPRISE_SCORECARD_MARKDOWN: artifacts/enterprise-readiness/canonical-scorecard.md

    steps:
      - name: Validate operator confirmations and SHA
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = "RUN_ENTERPRISE_RUNTIME_CLOSEOUT"
          test "$RECOVERY_ROLLBACK_CONFIRMATION" = "EXECUTE_CONTROLLED_PRODUCTION_ROLLBACK"
          [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]]

      - name: Check out exact release SHA
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ inputs.release_sha }}
          persist-credentials: false

      - name: Verify exact current main checkout
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(git rev-parse origin/main)" = "$RELEASE_SHA"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Install deterministic dependencies
        run: npm ci --ignore-scripts

      - name: Validate campaign and promotion contracts
        run: |
          node --test tests/security/enterprise-runtime-campaign-contract.test.mjs
          node --test tests/security/final-eleven-runtime-proofs.test.mjs
          node --test tests/enterprise/runtime-lane-normalization.test.mjs
          node --test tests/enterprise/build-enterprise-evidence-manifest.test.mjs
          node --test tests/enterprise/promote-enterprise-scorecard.test.mjs
          node --test tests/enterprise/enterprise-promotion-closeout.test.mjs
          node --test tests/enterprise/final-assurance-proof.test.mjs
          node --test tests/enterprise/final-eleven-closeout.test.mjs
          npx vitest run tests/security/recovery-resilience-proof.test.ts

      - name: Execute enterprise runtime campaign
        id: campaign
        run: node scripts/release/run-enterprise-runtime-campaign.mjs

      - name: Capture exact-SHA repository checks
        if: steps.campaign.outcome == 'success'
        run: node scripts/enterprise/capture-github-checks-evidence.mjs

      - name: Generate canonical exact-SHA baseline scorecard
        if: steps.campaign.outcome == 'success'
        run: node scripts/enterprise/generate-readiness-scorecard.mjs

      - name: Assemble manifest and promote scorecard
        if: steps.campaign.outcome == 'success'
        id: promotion
        run: |
          node scripts/enterprise/run-enterprise-promotion-closeout.mjs \
            --campaign artifacts/enterprise-runtime-campaign.json \
            --scorecard artifacts/enterprise-readiness/canonical-scorecard.json \
            --runtime-root artifacts/runtime-evidence \
            --staging-root artifacts/enterprise-readiness/evidence-input \
            --sha "$RELEASE_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --run "$GITHUB_RUN_ID" \
            --manifest-output artifacts/enterprise-readiness/evidence-manifest.json \
            --promotion-output artifacts/enterprise-readiness/scorecard-promotion-report.json \
            --closeout-output artifacts/enterprise-readiness/enterprise-promotion-closeout.json

      - name: Upload campaign and evidence-backed progress bundle
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: enterprise-runtime-closeout-${{ inputs.release_sha }}
          path: |
            artifacts/enterprise-runtime-campaign.json
            artifacts/runtime-evidence/
            artifacts/enterprise-readiness/
          if-no-files-found: error
          retention-days: 90

      - name: Enforce fail-closed enterprise closeout
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.campaign.outcome }}" = "success"
          test "${{ steps.promotion.outcome }}" = "success"
          node - <<'NODE'
          const fs = require('node:fs');
          const path = 'artifacts/enterprise-readiness/enterprise-promotion-closeout.json';
          const report = JSON.parse(fs.readFileSync(path, 'utf8'));
          console.log(`Enterprise preliminary completion: ${report.preliminary?.completePercent ?? 'unknown'}%`);
          console.log(`Final coherence promoted: ${report.coherencePromoted === true}`);
          console.log(`Enterprise completion: ${report.promoted?.completePercent ?? 'unknown'}%`);
          console.log(`Enterprise remaining: ${report.promoted?.remainingPercent ?? 'unknown'}%`);
          console.log(`Release decision: ${report.releaseDecision}`);
          if (report.releaseDecision !== 'GO') process.exit(1);
          NODE
