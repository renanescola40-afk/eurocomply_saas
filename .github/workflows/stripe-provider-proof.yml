name: Stripe Provider Proof

run-name: Stripe provider proof for ${{ inputs.release_sha }}

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full 40-character main-branch SHA deployed to production
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: stripe-provider-proof-${{ inputs.release_sha }}
  cancel-in-progress: false

jobs:
  validate-stripe-provider:
    name: Validate Stripe test-mode provider configuration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Check out main history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Validate requested main SHA
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          git fetch --no-tags --prune origin main
          git merge-base --is-ancestor "${RELEASE_SHA,,}" origin/main
          git checkout --detach "${RELEASE_SHA,,}"

      - name: Verify exact checkout
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${RELEASE_SHA,,}"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Probe Stripe provider configuration
        id: probe
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_PRICE_STARTER_MONTHLY: ${{ secrets.STRIPE_PRICE_STARTER_MONTHLY }}
          STRIPE_PRICE_GROWTH_MONTHLY: ${{ secrets.STRIPE_PRICE_GROWTH_MONTHLY }}
          STRIPE_PRICE_ENTERPRISE_MONTHLY: ${{ secrets.STRIPE_PRICE_ENTERPRISE_MONTHLY }}
          STRIPE_PRICE_STARTER: ${{ secrets.STRIPE_PRICE_STARTER }}
          STRIPE_PRICE_GROWTH: ${{ secrets.STRIPE_PRICE_GROWTH }}
          STRIPE_PRICE_ENTERPRISE: ${{ secrets.STRIPE_PRICE_ENTERPRISE }}
        run: node scripts/security/probe-stripe-provider-config.mjs

      - name: Write redacted evidence
        env:
          ENTERPRISE_EXPECTED_SHA: ${{ inputs.release_sha }}
          ENTERPRISE_EXPECTED_BRANCH: main
          STRIPE_PROVIDER_PROBE_PASSED: 'true'
        run: node scripts/security/write-stripe-provider-evidence.mjs

      - name: Upload redacted evidence
        uses: actions/upload-artifact@v7
        with:
          name: stripe-provider-proof-${{ inputs.release_sha }}
          path: docs/security/evidence/runtime/stripe-provider-configuration-validation.json
          if-no-files-found: error
          retention-days: 90
