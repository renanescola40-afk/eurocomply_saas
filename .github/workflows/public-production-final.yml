name: Public Production Final

on:
  workflow_dispatch:
    inputs:
      release_target:
        description: Runtime target label for the evidence bundle
        required: true
        default: production
      require_runtime_evidence:
        description: Keep true for public launch validation
        required: true
        default: 'true'
      production_url:
        description: Public deployment URL to validate
        required: true
        default: https://risckcomply.com
      rollback_url:
        description: Previously validated rollback deployment URL
        required: true
      rollback_sha:
        description: Previously validated rollback commit SHA
        required: true
      rollback_validated:
        description: Set true only after rollback target was manually verified
        required: true
        default: 'false'

permissions:
  actions: read
  contents: read

concurrency:
  group: public-production-final
  cancel-in-progress: false

env:
  CI: 'true'
  NEXT_TELEMETRY_DISABLED: '1'
  RELEASE_TARGET: public-production
  RELEASE_RUNTIME_TARGET: ${{ inputs.release_target }}
  RELEASE_REQUIRE_RUNTIME_EVIDENCE: ${{ inputs.require_runtime_evidence }}
  RELEASE_COMMIT_SHA: ${{ github.sha }}
  RELEASE_BUILD_SHA: ${{ github.sha }}
  RELEASE_DEPLOYMENT_URL: ${{ inputs.production_url }}
  RELEASE_PRODUCTION_URL: ${{ inputs.production_url }}
  NEXT_PUBLIC_APP_URL: ${{ inputs.production_url }}
  NEXT_PUBLIC_SITE_URL: ${{ inputs.production_url }}
  RELEASE_ROLLBACK_TARGET_URL: ${{ inputs.rollback_url }}
  RELEASE_ROLLBACK_TARGET: ${{ inputs.rollback_url }}
  LAST_KNOWN_GOOD_DEPLOYMENT_URL: ${{ inputs.rollback_url }}
  RELEASE_ROLLBACK_TARGET_SHA: ${{ inputs.rollback_sha }}
  LAST_KNOWN_GOOD_SHA: ${{ inputs.rollback_sha }}
  RELEASE_ROLLBACK_TARGET_VALIDATED: ${{ inputs.rollback_validated }}
  RELEASE_RUN_OBSERVABILITY_SMOKE: 'true'

jobs:
  production-environment-governance:
    name: Verify Production governance before final runtime secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      TARGET_SHA: ${{ github.sha }}
    steps:
      - name: Bind final proof to exact current main before governance lookup
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_REF_NAME" = "main"
          main_sha="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/main" | jq -r '.sha')"
          test "$main_sha" = "$TARGET_SHA"
      - name: Check out exact trusted release SHA
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Verify Production environment governance before protected secrets
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_ENVIRONMENT_NAME: Production
          REQUIRE_PROTECTED_BRANCHES: 'true'
        run: node scripts/security/check-github-environment-governance.mjs

  production-final:
    needs: production-environment-governance
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 90
    steps:
      - name: Revalidate exact current main after environment approval
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "main"
          main_sha="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/main" | jq -r '.sha')"
          test "$main_sha" = "$GITHUB_SHA"

      - name: Check out exact current main
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Verify checked-out SHA still equals current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Revalidate environment governance after admission
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_ENVIRONMENT_NAME: Production
          REQUIRE_PROTECTED_BRANCHES: 'true'
        run: node scripts/security/check-github-environment-governance.mjs

      - name: Install dependencies for Playwright browser setup
        run: npm ci --ignore-scripts

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Validate public release runner syntax
        run: |
          node --check scripts/release/run-public-production-release.mjs
          node --check scripts/release/check-public-production-release-env.mjs
          node --check scripts/release/run-public-production-release-final.mjs
          node --check scripts/release/write-public-production-go-no-go-evidence.mjs
          node --check scripts/release/validate-public-production-go-no-go-evidence.mjs
          node --check scripts/release/validate-public-production-final-runtime-evidence.mjs
          node --check scripts/release/validate-observability-runtime-evidence.mjs
          node --check scripts/release/validate-rollback-runtime-evidence.mjs
          node --check scripts/release/runtime-release-sha-contract.mjs
          node --check scripts/release/verify-runtime-release-sha.mjs
          node --check scripts/release/write-security-response-evidence.mjs
          node --check scripts/release/record-security-response-final-evidence.mjs
          node --check scripts/release/release-subprocess-env.mjs
          grep -Fq "RELEASE_RUN_OBSERVABILITY_SMOKE: 'true'" .github/workflows/public-production-final.yml
          grep -Fq 'validatePublicProductionFinalRuntimeEvidence' scripts/enterprise/fetch-public-production-final-evidence.mjs

      - name: Revalidate protected producer boundary
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_ENVIRONMENT_NAME: Production
          REQUIRE_PROTECTED_BRANCHES: 'true'
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse origin/main)" = "$TARGET_SHA"
          main_sha="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/main" | jq -r '.sha')"
          test "$main_sha" = "$TARGET_SHA"
          node scripts/security/check-github-environment-governance.mjs

      - name: Run public production final gate
        env:
          HEALTHCHECK_TOKEN: ${{ secrets.HEALTHCHECK_TOKEN }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_PRICE_ESSENTIAL_MONTHLY: ${{ vars.STRIPE_PRICE_ESSENTIAL_MONTHLY || secrets.STRIPE_PRICE_ESSENTIAL_MONTHLY }}
          STRIPE_PRICE_ESSENTIAL_ANNUAL: ${{ vars.STRIPE_PRICE_ESSENTIAL_ANNUAL || secrets.STRIPE_PRICE_ESSENTIAL_ANNUAL }}
          STRIPE_PRICE_PROFESSIONAL_MONTHLY: ${{ vars.STRIPE_PRICE_PROFESSIONAL_MONTHLY || secrets.STRIPE_PRICE_PROFESSIONAL_MONTHLY }}
          STRIPE_PRICE_PROFESSIONAL_ANNUAL: ${{ vars.STRIPE_PRICE_PROFESSIONAL_ANNUAL || secrets.STRIPE_PRICE_PROFESSIONAL_ANNUAL }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
        run: npm run release:production-final

      - name: Capture exact-SHA GitHub checks for final scorecard
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
          GITHUB_CHECKS_WAIT_MS: '900000'
        run: node scripts/enterprise/capture-github-checks-evidence.mjs

      - name: Generate scorecard from the same protected runtime run
        env:
          ENTERPRISE_EXPECTED_SHA: ${{ github.sha }}
          GITHUB_CHECKS_EVIDENCE_PATH: artifacts/enterprise-readiness/github-checks-evidence.json
        run: node scripts/enterprise/generate-readiness-scorecard.mjs

      - name: Publish enterprise readiness summary
        run: cat artifacts/enterprise-readiness/enterprise-readiness-scorecard.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release validation logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: public-production-final-validation-${{ github.sha }}
          path: |
            release-validation/public-production/**
            artifacts/enterprise-readiness/**
            docs/security/evidence/runtime/public-production-release-env-readiness.json
            docs/security/evidence/runtime/deployment-smoke-validation.json
            docs/security/evidence/runtime/security-headers-validation.json
            docs/security/evidence/runtime/no-store-validation.json
            docs/security/evidence/runtime/observability-smoke-validation.json
            docs/security/evidence/runtime/rollback-dry-run-validation.json
            docs/security/evidence/runtime/supabase-live-rls-validation.json
            docs/security/evidence/runtime/runtime-release-sha-validation.json
            docs/security/evidence/runtime/release-go-no-go.json
            docs/security/evidence/runtime/production-final-validation.json
            docs/security/evidence/runtime/final-validation-runner.json
          retention-days: 90
          if-no-files-found: error
