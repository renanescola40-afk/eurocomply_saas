name: P1 DAST Evidence

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'docs/security/evidence/p1/dast-automated.json'
      - 'docs/security/evidence/p1/dast-automated.template.json'
      - 'docs/security/P1_DAST_USAGE.md'
      - 'scripts/security/check-p1-dast-evidence.mjs'
      - '.github/workflows/p1-dast.yml'

permissions:
  contents: read

jobs:
  p1-dast:
    name: Validate P1 DAST evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Show runner Node.js and npm versions
        run: |
          node --version
          npm --version

      - name: Validate P1 DAST evidence if present
        run: node scripts/security/check-p1-dast-evidence.mjs
