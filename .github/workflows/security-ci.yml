name: EuroComply Security CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: security-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-ci:
    name: Run security gates, typecheck and tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies without lifecycle scripts
        run: npm install --ignore-scripts

      - name: Run CI preflight with placeholders
        run: node scripts/preflight-ci.mjs

      - name: Run GitHub workflow governance gate
        run: npm run security:github-workflows

      - name: Print npm audit triage summary
        run: |
          npm run security:npm-audit:json > npm-audit.json || true
          echo "## npm audit triage summary" > npm-audit-summary.md
          echo "" >> npm-audit-summary.md
          echo '```text' >> npm-audit-summary.md
          npm run security:npm-audit:summary | tee -a npm-audit-summary.md || true
          echo '```' >> npm-audit-summary.md
          cat npm-audit-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Print final security readiness blockers
        run: |
          echo "## Final security readiness" > final-security-readiness.md
          echo "" >> final-security-readiness.md
          echo '```text' >> final-security-readiness.md
          npm run security:final-readiness 2>&1 | tee -a final-security-readiness.md || true
          echo '```' >> final-security-readiness.md
          cat final-security-readiness.md >> "$GITHUB_STEP_SUMMARY"
          npm run security:final-readiness:report || true

      - name: Upload npm audit triage artifact
        uses: actions/upload-artifact@v7
        with:
          name: npm-audit-triage
          path: |
            npm-audit.json
            npm-audit-summary.md
            final-security-readiness.md
            final-security-readiness.json
          retention-days: 7
          if-no-files-found: warn

      - name: Run EuroComply security gates
        run: |
          npm run security:public-secrets
          npm run security:supply-chain
          npm run security:ci-cd
          npm run security:rls
          npm run security:client-boundaries
          npm run security:auth-tokens
          npm run security:authorization-bola
          npm run security:server-action-identity
          npm run security:protected-routes
          npm run security:headers
          npm run security:no-store
          npm run security:origin-guards
          npm run security:no-open-proxy
          npm run security:internal-maintenance
          npm run security:ops-readiness
          npm run security:public-verifiers
          npm run security:public-errors
          npm run security:csv-exports
          npm run security:document-filenames
          npm run security:billing-webhook-body
          npm run security:responses
          npm run security:logs
          npm run security:api-endpoints
          npm run security:api-guards
          npm run security:enterprise-api

      - name: Run step-up authentication gate
        run: node scripts/security/check-step-up.mjs
