name: EuroComply Security CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: security-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-ci:
    name: Run security gates, typecheck and tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: security-ci

    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
      TRUSTED_ORIGINS: ${{ vars.TRUSTED_ORIGINS }}
      HEALTHCHECK_TOKEN: ${{ secrets.HEALTHCHECK_TOKEN }}
      EVIDENCE_PACK_SIGNING_SECRET: ${{ secrets.EVIDENCE_PACK_SIGNING_SECRET }}
      AUDIT_CHAIN_SIGNING_SECRET: ${{ secrets.AUDIT_CHAIN_SIGNING_SECRET }}
      STEP_UP_SIGNING_SECRET: ${{ secrets.STEP_UP_SIGNING_SECRET }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      STRIPE_PRICE_ESSENTIAL_MONTHLY: ${{ vars.STRIPE_PRICE_ESSENTIAL_MONTHLY }}
      STRIPE_PRICE_PROFESSIONAL_MONTHLY: ${{ vars.STRIPE_PRICE_PROFESSIONAL_MONTHLY }}
      STRIPE_PRICE_BUSINESS_MONTHLY: ${{ vars.STRIPE_PRICE_BUSINESS_MONTHLY }}
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies without lifecycle scripts
        run: npm install --ignore-scripts

      - name: Run production preflight
        run: npm run preflight

      - name: Print npm audit triage summary
        run: |
          npm run security:npm-audit:json > npm-audit.json || true
          echo "## npm audit triage summary" > npm-audit-summary.md
          echo "" >> npm-audit-summary.md
          echo '```text' >> npm-audit-summary.md
          npm run security:npm-audit:summary | tee -a npm-audit-summary.md || true
          echo '```' >> npm-audit-summary.md
          cat npm-audit-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Print final security readiness blockers
        run: |
          echo "## Final security readiness" > final-security-readiness.md
          echo "" >> final-security-readiness.md
          echo '```text' >> final-security-readiness.md
          npm run security:final-readiness 2>&1 | tee -a final-security-readiness.md || true
          echo '```' >> final-security-readiness.md
          cat final-security-readiness.md >> "$GITHUB_STEP_SUMMARY"
          npm run security:final-readiness:report || true

      - name: Upload npm audit triage artifact
        uses: actions/upload-artifact@v7
        with:
          name: npm-audit-triage
          path: |
            npm-audit.json
            npm-audit-summary.md
            final-security-readiness.md
            final-security-readiness.json
          retention-days: 7
          if-no-files-found: warn

      - name: Run EuroComply security CI
        run: npm run security:ci

      - name: Run step-up authentication gate
        run: node scripts/security/check-step-up.mjs
