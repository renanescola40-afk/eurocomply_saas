name: EuroComply Security CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: security-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-ci:
    name: Run security gates, typecheck and tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
      SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
      NEXT_PUBLIC_APP_URL: https://eurocomply.example
      TRUSTED_ORIGINS: https://eurocomply.example
      HEALTHCHECK_TOKEN: test-healthcheck-token
      EVIDENCE_PACK_SIGNING_SECRET: test-evidence-pack-signing-secret
      AUDIT_CHAIN_SIGNING_SECRET: test-audit-chain-signing-secret

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies without lifecycle scripts
        run: npm install --ignore-scripts

      - name: Run EuroComply security CI
        run: npm run security:ci
