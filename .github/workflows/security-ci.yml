name: EuroComply Security CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: security-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-ci:
    name: Run security gates, typecheck and tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          show-progress: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies without lifecycle scripts
        run: npm install --ignore-scripts

      - name: Run CI preflight with placeholders
        run: node scripts/preflight-ci.mjs

      - name: Run GitHub workflow governance gate
        run: npm run security:github-workflows

      - name: Print npm audit triage summary
        run: |
          npm run security:npm-audit:json > npm-audit.json || true
          echo "## npm audit triage summary" > npm-audit-summary.md
          echo "" >> npm-audit-summary.md
          echo '```text' >> npm-audit-summary.md
          npm run security:npm-audit:summary | tee -a npm-audit-summary.md || true
          echo '```' >> npm-audit-summary.md
          cat npm-audit-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Print final security readiness blockers
        run: |
          echo "## Final security readiness" > final-security-readiness.md
          echo "" >> final-security-readiness.md
          echo '```text' >> final-security-readiness.md
          npm run security:final-readiness 2>&1 | tee -a final-security-readiness.md || true
          echo '```' >> final-security-readiness.md
          cat final-security-readiness.md >> "$GITHUB_STEP_SUMMARY"
          npm run security:final-readiness:report || true

      - name: Upload npm audit triage artifact
        uses: actions/upload-artifact@v7
        with:
          name: npm-audit-triage
          path: |
            npm-audit.json
            npm-audit-summary.md
            final-security-readiness.md
            final-security-readiness.json
          retention-days: 7
          if-no-files-found: warn

      - name: Public secrets gate
        # Governance marker for legacy workflow gates: npm run security:ci
        run: npm run security:public-secrets 2>&1 | tee public-secrets.log

      - name: Upload public secrets diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: public-secrets-gate
          path: public-secrets.log
          retention-days: 7
          if-no-files-found: warn

      - name: Production secret readiness gate
        run: npm run security:production-secrets

      - name: Supply-chain gate
        run: npm run security:supply-chain

      - name: CI/CD secrets gate
        run: npm run security:ci-cd

      - name: RLS gate
        run: npm run security:rls

      - name: Client boundaries gate
        run: npm run security:client-boundaries

      - name: Auth token validation gate
        run: npm run security:auth-tokens

      - name: Authorization BOLA gate
        run: npm run security:authorization-bola

      - name: Server action identity gate
        run: npm run security:server-action-identity

      - name: Protected routes gate
        run: npm run security:protected-routes

      - name: Security headers gate
        run: npm run security:headers

      - name: No-store gate
        run: npm run security:no-store

      - name: Origin guards gate
        run: npm run security:origin-guards

      - name: No open proxy gate
        run: npm run security:no-open-proxy

      - name: Internal maintenance gate
        run: npm run security:internal-maintenance

      - name: Ops readiness gate
        run: npm run security:ops-readiness

      - name: Public verifiers gate
        run: npm run security:public-verifiers

      - name: Public errors gate
        run: npm run security:public-errors

      - name: CSV exports gate
        run: npm run security:csv-exports

      - name: Document filenames gate
        run: npm run security:document-filenames

      - name: Billing webhook body gate
        run: npm run security:billing-webhook-body

      - name: Security responses gate
        run: npm run security:responses

      - name: Log sanitization gate
        run: npm run security:logs

      - name: API endpoint hardening gate
        run: npm run security:api-endpoints

      - name: API guards gate
        run: npm run security:api-guards

      - name: Enterprise API gate
        run: npm run security:enterprise-api

      - name: Step-up authentication gate
        run: node scripts/security/check-step-up.mjs
