name: One-shot Vitest 4.1.11 remediation

on:
  push:
    branches:
      - fix/p1-final-technical-payment-first-proof-20260908
    paths:
      - .github/workflows/one-shot-vitest-411-remediation.yml

permissions:
  contents: write

concurrency:
  group: one-shot-vitest-411-remediation
  cancel-in-progress: false

jobs:
  remediate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: fix/p1-final-technical-payment-first-proof-20260908
          fetch-depth: 1
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm

      - name: Align npm with repository package manager
        shell: bash
        run: npm install --global npm@10.8.2

      - name: Regenerate dependency lock safely
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm install --save-dev --save-exact vitest@4.1.11 --package-lock-only --ignore-scripts --no-audit --fund=false --legacy-peer-deps
          npm ci --ignore-scripts
          npm audit --audit-level=moderate
          node --test scripts/security/npm-audit-policy.test.mjs tests/enterprise/dependency-vulnerability-evidence.test.mjs tests/enterprise/dependency-vulnerability-remediation-candidate.test.mjs tests/enterprise/dependency-vulnerability-scorecard-contract.test.mjs

      - name: Commit verified remediation and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/one-shot-vitest-411-remediation.yml
          git config user.name 'risck-comply-release-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add package.json package-lock.json .github/workflows/one-shot-vitest-411-remediation.yml
          git diff --cached --check
          git diff --cached --quiet && { echo 'No remediation changes produced'; exit 1; }
          git commit -m 'chore(security): bump vitest to 4.1.11'
          git push origin HEAD:fix/p1-final-technical-payment-first-proof-20260908
