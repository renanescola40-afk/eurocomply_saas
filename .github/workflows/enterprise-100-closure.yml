name: Enterprise 100 Closure

on:
  pull_request:
    paths:
      - 'config/enterprise-100-closure.json'
      - 'scripts/enterprise/collect-github-exact-sha-artifacts.mjs'
      - 'scripts/enterprise/fetch-enterprise-final-authority-evidence.mjs'
      - 'scripts/enterprise/fetch-stripe-promoted-runtime-evidence.mjs'
      - 'scripts/release/check-enterprise-100-closure.mjs'
      - 'scripts/release/hydrate-enterprise-100-evidence.mjs'
      - 'scripts/release/validate-external-security-review-evidence.mjs'
      - 'scripts/release/write-github-vercel-production-deployment-evidence.mjs'
      - 'scripts/security/external-security-assurance-contract.mjs'
      - 'scripts/security/validate-external-security-assurance.mjs'
      - 'scripts/supabase/write-rls-reconciliation-closure-evidence.mjs'
      - 'scripts/supabase/write-rls-reconciliation-closure-evidence.test.mjs'
      - 'tests/enterprise-100-closure.test.ts'
      - 'tests/enterprise/enterprise-100-evidence-hydration.test.mjs'
      - 'tests/enterprise/enterprise-final-authority-contract.test.mjs'
      - 'tests/enterprise/github-exact-sha-artifact-collector.test.mjs'
      - 'tests/enterprise/production-deployment-github-vercel-proof.test.ts'
      - 'tests/enterprise/stripe-promoted-runtime-evidence-fetch.test.ts'
      - 'tests/security/enterprise-100-closure-workflow.test.mjs'
      - 'tests/security/enterprise-100-stale-workflow-run-guard.test.mjs'
      - 'tests/security/external-assurance-enterprise-closure-contract.test.mjs'
      - 'tests/security/external-security-assurance-contract.test.mjs'
      - 'tests/security/external-security-assurance-contract.test.ts'
      - '.github/workflows/enterprise-100-closure.yml'
      - '.github/workflows/external-security-assurance.yml'
      - '.github/workflows/supabase-production-rls-reconciliation.yml'
  push:
    branches: [main]
  workflow_run:
    workflows:
      - 'Enterprise Production Gate'
      - 'Production Runtime Proof'
      - 'Enterprise Recovery Drill'
      - 'Recovery Resilience Proof'
      - 'Production Provider Runtime Proof'
      - 'Product FRIA Ephemeral Runtime QA'
      - 'Final Billing + Product Live Closeout'
      - 'Supabase Forward Production Acceptance'
      - 'Enterprise Safe Runtime Bootstrap'
      - 'Enterprise Runtime Evidence Closeout'
      - 'Enterprise Readiness Scorecard'
      - 'Stripe Runtime Evidence Promotion'
      - 'Supabase Production Migration Dry Run'
      - 'Supabase Production RLS Reconciliation'
      - 'External Security Assurance Acceptance'
      - 'Final Legal Publication Gate'
      - 'Enterprise Conversation Runtime Closeout'
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  statuses: read
  deployments: read

concurrency:
  group: enterprise-100-closure-${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  contract:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.head_sha == github.sha }}
    name: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha != github.sha && 'Stale Enterprise closure trigger (ignored)' || 'Enterprise closure contract' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ENTERPRISE_CLOSURE_EXPECTED_SHA: ${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha || github.sha }}
      RETAINED_ARTIFACT_ROOT: artifacts/enterprise-100-retained-artifacts
      HYDRATED_CLOSURE_ROOT: artifacts/enterprise-100-evidence-root
    steps:
      - name: Checkout exact SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.ENTERPRISE_CLOSURE_EXPECTED_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Test closure verifier hydration and artifact collection contracts
        run: |
          node --check scripts/enterprise/collect-github-exact-sha-artifacts.mjs
          node --check scripts/enterprise/fetch-enterprise-final-authority-evidence.mjs
          node --check scripts/enterprise/fetch-stripe-promoted-runtime-evidence.mjs
          node --check scripts/release/check-enterprise-100-closure.mjs
          node --check scripts/release/hydrate-enterprise-100-evidence.mjs
          node --check scripts/release/write-github-vercel-production-deployment-evidence.mjs
          node --check scripts/supabase/write-rls-reconciliation-closure-evidence.mjs
          npx vitest run \
            tests/enterprise-100-closure.test.ts \
            tests/enterprise/production-deployment-github-vercel-proof.test.ts \
            tests/enterprise/stripe-promoted-runtime-evidence-fetch.test.ts \
            tests/security/external-security-assurance-contract.test.ts
          node --test \
            scripts/supabase/write-rls-reconciliation-closure-evidence.test.mjs \
            tests/enterprise/enterprise-100-evidence-hydration.test.mjs \
            tests/enterprise/enterprise-final-authority-contract.test.mjs \
            tests/enterprise/github-exact-sha-artifact-collector.test.mjs \
            tests/security/enterprise-100-closure-workflow.test.mjs \
            tests/security/enterprise-100-stale-workflow-run-guard.test.mjs \
            tests/security/external-assurance-enterprise-closure-contract.test.mjs \
            tests/security/external-security-assurance-contract.test.mjs

      - name: Validate repository contract
        if: github.event_name == 'pull_request'
        run: |
          node -e "const c=require('./config/enterprise-100-closure.json'); if(!Array.isArray(c.controls)||c.controls.length!==16||new Set(c.controls.map(x=>x.id)).size!==16) process.exit(1)"
          grep -Fq 'ENTERPRISE_CLOSURE_EVIDENCE_ROOTS' scripts/release/check-enterprise-100-closure.mjs
          grep -Fq 'enterprise-100-evidence-hydration.v1' scripts/release/hydrate-enterprise-100-evidence.mjs
          grep -Fq 'github-exact-sha-artifact-collection.v1' scripts/enterprise/collect-github-exact-sha-artifacts.mjs
          grep -Fq 'fetch-enterprise-final-authority-evidence.mjs' .github/workflows/enterprise-100-closure.yml
          grep -Fq 'write-github-vercel-production-deployment-evidence.mjs' .github/workflows/enterprise-100-closure.yml
          grep -Fq 'direct-production-deployment/release-validation/production-deployment.json' .github/workflows/enterprise-100-closure.yml
          grep -Fq 'Enterprise Production Gate' .github/workflows/enterprise-100-closure.yml
          grep -Fq 'Production Runtime Proof' .github/workflows/enterprise-100-closure.yml
          grep -Fq 'Recovery Resilience Proof' .github/workflows/enterprise-100-closure.yml
          grep -Fq 'Production Provider Runtime Proof' .github/workflows/enterprise-100-closure.yml
          grep -Fq 'Product FRIA Ephemeral Runtime QA' .github/workflows/enterprise-100-closure.yml
          grep -Fq 'Final Billing + Product Live Closeout' .github/workflows/enterprise-100-closure.yml
          grep -Fq 'Supabase Forward Production Acceptance' .github/workflows/enterprise-100-closure.yml
          grep -Fq 'Enterprise Safe Runtime Bootstrap' .github/workflows/enterprise-100-closure.yml
          grep -Fq 'Stripe Runtime Evidence Promotion' .github/workflows/enterprise-100-closure.yml
          grep -Fq 'Supabase Production RLS Reconciliation' .github/workflows/enterprise-100-closure.yml
          grep -Fq 'External Security Assurance Acceptance' .github/workflows/enterprise-100-closure.yml
          grep -Fq 'Final Legal Publication Gate' .github/workflows/enterprise-100-closure.yml
          grep -Fq 'Enterprise Conversation Runtime Closeout' .github/workflows/enterprise-100-closure.yml
          grep -Fq "test \"\$main_sha\" = \"\$ENTERPRISE_CLOSURE_EXPECTED_SHA\"" .github/workflows/enterprise-100-closure.yml

      - name: Validate target SHA is exact current main
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ENTERPRISE_CLOSURE_EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$ENTERPRISE_CLOSURE_EXPECTED_SHA"
          main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')"
          test "$main_sha" = "$ENTERPRISE_CLOSURE_EXPECTED_SHA"

      - name: Collect authorized retained artifacts bound to exact closure SHA and producer
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf "$RETAINED_ARTIFACT_ROOT" "$HYDRATED_CLOSURE_ROOT"
          mkdir -p "$RETAINED_ARTIFACT_ROOT" "$HYDRATED_CLOSURE_ROOT"
          node scripts/enterprise/collect-github-exact-sha-artifacts.mjs \
            enterprise-100 \
            "$ENTERPRISE_CLOSURE_EXPECTED_SHA" \
            "$RETAINED_ARTIFACT_ROOT"

      - name: Collect direct domain authority artifacts
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ env.ENTERPRISE_CLOSURE_EXPECTED_SHA }}
          FINAL_AUTHORITY_SOURCE_ROOT: artifacts/enterprise-100-retained-artifacts/direct-final-authority
        run: node scripts/enterprise/fetch-enterprise-final-authority-evidence.mjs

      - name: Generate direct exact-SHA production deployment evidence
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ env.ENTERPRISE_CLOSURE_EXPECTED_SHA }}
          PRODUCTION_DEPLOYMENT_PROOF_ATTEMPTS: '12'
          PRODUCTION_DEPLOYMENT_PROOF_POLL_MS: '5000'
        shell: bash
        run: |
          set -euo pipefail
          proof="$RETAINED_ARTIFACT_ROOT/direct-production-deployment/release-validation/production-deployment.json"
          mkdir -p "$(dirname "$proof")"
          set +e
          PRODUCTION_DEPLOYMENT_EVIDENCE_PATH="$proof" \
            node scripts/release/write-github-vercel-production-deployment-evidence.mjs
          proof_exit=$?
          set -e
          test -f "$proof"
          if [ "$proof_exit" -ne 0 ]; then
            echo 'Exact-SHA production deployment proof remains OPEN; retaining fail-closed evidence for closure evaluation.'
          fi

      - name: Replace legacy Stripe Open state with authoritative promoted exact-SHA runtime evidence
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ env.ENTERPRISE_CLOSURE_EXPECTED_SHA }}
          STRIPE_RUNTIME_EVIDENCE_REQUIRED: 'false'
        shell: bash
        run: |
          set -euo pipefail

          # stripe-runtime-proof.yml intentionally writes repository validation as Open.
          # Retain those files for audit, but remove their .json extension so the
          # closure hydrator cannot confuse them with promoted runtime proof.
          while IFS= read -r -d '' legacy; do
            mv "$legacy" "${legacy}.legacy-open-ignored"
          done < <(find "$RETAINED_ARTIFACT_ROOT" -type f -name 'stripe-billing-validation.json' -print0)

          rm -f docs/security/evidence/runtime/stripe-billing-validation.json
          node scripts/enterprise/fetch-stripe-promoted-runtime-evidence.mjs

          canonical=docs/security/evidence/runtime/stripe-billing-validation.json
          if [ -f "$canonical" ]; then
            destination="$RETAINED_ARTIFACT_ROOT/authoritative-stripe-promotion/docs/security/evidence/runtime"
            mkdir -p "$destination"
            cp "$canonical" "$destination/stripe-billing-validation.json"
            echo 'Authoritative promoted Stripe runtime evidence added to exact-SHA closure input.'
          else
            echo 'No successful authoritative promoted Stripe runtime evidence exists for this exact SHA; billing runtime remains uncredited.'
          fi

      - name: Hydrate declared Enterprise 100 evidence
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          node scripts/release/hydrate-enterprise-100-evidence.mjs \
            "$RETAINED_ARTIFACT_ROOT" \
            "$HYDRATED_CLOSURE_ROOT" \
            "$ENTERPRISE_CLOSURE_EXPECTED_SHA"

      - name: Enforce final exact-SHA closure
        if: github.event_name != 'pull_request'
        env:
          ENTERPRISE_CLOSURE_EVIDENCE_ROOTS: ${{ env.HYDRATED_CLOSURE_ROOT }}
        run: node scripts/release/check-enterprise-100-closure.mjs

      - name: Publish closure summary
        if: always() && github.event_name != 'pull_request'
        shell: bash
        run: |
          collection_manifest="$RETAINED_ARTIFACT_ROOT/github-exact-sha-artifact-collection.json"
          if [ -f "$collection_manifest" ]; then
            {
              echo '## Exact-SHA retained artifact collection'
              echo
              jq -r '"- Status: \(.status)\n- Collected artifacts: \(.collectedArtifactCount)\n- Authorized producers: \(.producerCount)\n- Infrastructure error: \(.errorCode // "none")"' "$collection_manifest"
              echo
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f release-validation/enterprise-100-closure.json ]; then
            {
              echo '## Enterprise 100 exact-SHA closure'
              echo
              jq -r '"- Decision: \(.decision)\n- Accepted controls: \(.acceptedControls)/\(.totalControls)\n- Target SHA: \(.expectedSha)"' release-validation/enterprise-100-closure.json
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f "$HYDRATED_CLOSURE_ROOT/enterprise-100-evidence-hydration.json" ]; then
            jq -r '"- Hydrated retained evidence: \(.hydratedEvidence)/\(.expectedEvidence)\n- Explicit aliases used: \(.aliasedEvidence)\n- Ambiguous: \(.ambiguousEvidence)\n- Stale: \(.staleEvidence)\n- Missing: \(.missingEvidence)\n- Sensitive rejected: \(.rejectedSensitiveEvidence)"' \
              "$HYDRATED_CLOSURE_ROOT/enterprise-100-evidence-hydration.json" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload closure result
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: enterprise-100-closure-${{ env.ENTERPRISE_CLOSURE_EXPECTED_SHA }}
          path: |
            release-validation/enterprise-100-closure.json
            artifacts/enterprise-100-retained-artifacts/github-exact-sha-artifact-collection.json
            artifacts/enterprise-100-retained-artifacts/direct-final-authority/enterprise-final-authority-source.json
            artifacts/enterprise-100-evidence-root/enterprise-100-evidence-hydration.json
          if-no-files-found: error
          retention-days: 90
