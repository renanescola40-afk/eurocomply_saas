name: P0 Supabase RLS Plan

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'docs/security/evidence/templates/supabase-live-rls-plan.template.json'
      - 'scripts/security/check-p0-supabase-rls-plan.mjs'
      - 'docs/security/P0_SUPABASE_RLS_PLAN_USAGE.md'
      - '.github/workflows/p0-supabase-rls-plan.yml'

permissions:
  contents: read

jobs:
  p0-supabase-rls-plan:
    name: Validate Supabase RLS plan template
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Show runner Node.js and npm versions
        run: |
          node --version
          npm --version

      - name: Validate plan template
        run: node scripts/security/check-p0-supabase-rls-plan.mjs docs/security/evidence/templates/supabase-live-rls-plan.template.json
