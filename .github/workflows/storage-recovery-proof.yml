# V8 exact-main revalidation trigger: c2acd4ab — no logic change
name: Storage Recovery Synthetic Proof

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/storage-recovery-proof.yml
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact current main SHA
        required: true
        type: string
      confirmation:
        description: Type EXECUTE_ISOLATED_STORAGE_RECOVERY_PROOF
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: storage-recovery-proof-wsjswdrwhyughactoxcf
  cancel-in-progress: false

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production-recovery
    env:
      TARGET_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.release_sha || github.sha }}
      CONFIRMATION: ${{ github.event_name == 'workflow_dispatch' && inputs.confirmation || 'EXECUTE_ISOLATED_STORAGE_RECOVERY_PROOF' }}
      RECOVERY_PROJECT_REF: wsjswdrwhyughactoxcf
      PRODUCTION_PROJECT_REF: tganhbbhfxcpblmgqprg
      RECOVERY_EVIDENCE_FILE: docs/trust/BACKUP_RESTORE_EVIDENCE_2026-09-24.md
      RECOVERY_EVIDENCE_BLOB_SHA: 4fdc57665ad72dc4b8035ea6e72d46efc6e4e0b9
      FUNCTION_NAME: dr-storage-recovery-proof
      EVIDENCE_PATH: artifacts/storage-recovery/storage-recovery-proof.json

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Validate exact main and trusted isolated target
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$GITHUB_REF_NAME" = "main"
          test "$GITHUB_SHA" = "$TARGET_SHA"
          test "$CONFIRMATION" = "EXECUTE_ISOLATED_STORAGE_RECOVERY_PROOF"
          test "$RECOVERY_PROJECT_REF" != "$PRODUCTION_PROJECT_REF"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"

          main_sha="$(curl --fail --silent --show-error             -H "Authorization: Bearer $GH_TOKEN"             -H 'Accept: application/vnd.github+json'             "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/main" | jq -r '.sha')"

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            # Manual attestations remain exact-current-main only.
            test "$main_sha" = "$TARGET_SHA"
          else
            # A push-triggered recovery proof may sit in the Actions queue while a
            # newer main commit lands. Accept only if TARGET_SHA is still contained
            # in current main history; reject divergent/non-main commits.
            compare_json="$(curl --fail --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/compare/${TARGET_SHA}...main")"
            compare_status="$(jq -r '.status // empty' <<<"$compare_json")"
            case "$compare_status" in
              identical|ahead) ;;
              *) echo "Assessed SHA is not contained in current main history" >&2; exit 1 ;;
            esac
          fi

          test -f "$RECOVERY_EVIDENCE_FILE"
          test "$(git hash-object "$RECOVERY_EVIDENCE_FILE")" = "$RECOVERY_EVIDENCE_BLOB_SHA"
          grep -Fq -- "- project: \`$RECOVERY_PROJECT_REF\`" "$RECOVERY_EVIDENCE_FILE"
          grep -Fq 'REPRESENTATIVE_ROWSET_LINEAGE_REVALIDATED_2026_10_04=PASS_4_OF_4' "$RECOVERY_EVIDENCE_FILE"
          grep -Fq 'BACKUP_MECHANISM_SOURCE=NOT_INDEPENDENTLY_ATTESTED' "$RECOVERY_EVIDENCE_FILE"

      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359
        with:
          version: 2.114.0

      - name: Validate allowlisted recovery project
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          project_json="$(curl --fail --silent --show-error             -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN"             "https://api.supabase.com/v1/projects/$RECOVERY_PROJECT_REF")"
          test "$(jq -r '.id // .ref // empty' <<<"$project_json")" = "$RECOVERY_PROJECT_REF"
          test "$(jq -r '.name // empty' <<<"$project_json")" = "risck-comply-s1-restore-2026-09-02"
          test "$(jq -r '.region // empty' <<<"$project_json")" = "eu-west-1"
          case "$(jq -r '.status // empty' <<<"$project_json")" in
            ACTIVE_HEALTHY|FUNCTIONS_DEPLOYED) ;;
            *) echo "Recovery target is not healthy" >&2; exit 1 ;;
          esac

      - name: Build one-time synthetic proof function
        shell: bash
        run: |
          set -euo pipefail
          nonce="$(openssl rand -hex 24)"
          echo "DR_STORAGE_NONCE=$nonce" >> "$GITHUB_ENV"
          mkdir -p "supabase/functions/$FUNCTION_NAME"
          cat > "supabase/functions/$FUNCTION_NAME/index.ts" <<'TS'
          import "jsr:@supabase/functions-js/edge-runtime.d.ts";
          import { createClient } from "npm:@supabase/supabase-js@2";

          async function sha(bytes: Uint8Array) {
            const d = await crypto.subtle.digest("SHA-256", bytes);
            return Array.from(new Uint8Array(d)).map((b) => b.toString(16).padStart(2, "0")).join("");
          }

          Deno.serve(async (req: Request) => {
            if (req.headers.get("x-dr-proof-nonce") !== Deno.env.get("DR_STORAGE_PROOF_NONCE")) {
              return Response.json({ ok: false }, { status: 401 });
            }

            const url = Deno.env.get("SUPABASE_URL");
            let key = Deno.env.get("SUPABASE_SERVICE_ROLE_KEY");

            const rawSecretKeys = Deno.env.get("SUPABASE_SECRET_KEYS");
            if (rawSecretKeys) {
              try {
                const parsed = JSON.parse(rawSecretKeys);
                if (parsed && typeof parsed === "object" && typeof parsed.default === "string" && parsed.default.length > 0) {
                  key = parsed.default;
                }
              } catch {
                // Keep the legacy service-role fallback. The proof must fail closed
                // only if no valid admin key is available at all.
              }
            }

            if (!key || !url) {
              return Response.json({
                schema: "risck-comply.storage-recovery-proof.v2",
                ok: false,
                syntheticObjectOnly: true,
                allowlistedRecoveryProject: true,
                providerRestoreProvenanceClaimed: false,
                cleanupCompleted: false,
                error: "admin_key_unavailable"
              }, { status: 500 });
            }

            const sb = createClient(url, key, { auth: { persistSession: false } });
            const bucket = "dr-storage-recovery-proof";
            const original = "runtime/original.txt";
            const backup = "backup/original.txt";
            const restored = "runtime/restored.txt";
            const bytes = new TextEncoder().encode("RISCK_COMPLY_STORAGE_RECOVERY_SYNTHETIC_V2");
            const expected = await sha(bytes);

            const cleanup = async (strict: boolean) => {
              for (let attempt = 1; attempt <= 4; attempt++) {
                const empty = await sb.storage.emptyBucket(bucket);
                if (empty.error && empty.error.message !== "Bucket not found" && strict) return false;

                // Storage deletion can be eventually consistent after
                // emptyBucket succeeds. Retry the bucket delete with a
                // short bounded delay rather than failing the proof on
                // the propagation window.
                await new Promise((resolve) => setTimeout(resolve, attempt * 250));

                const del = await sb.storage.deleteBucket(bucket);
                if (!del.error || del.error.message === "Bucket not found") return true;

                const stillNotEmpty = del.error.message.toLowerCase().includes("not empty");
                if (!stillNotEmpty) return strict ? false : true;
              }
              return !strict;
            };

            await cleanup(false);

            try {
              const c = await sb.storage.createBucket(bucket, { public: false });
              if (c.error) throw new Error("create_bucket_failed");

              const u = await sb.storage.from(bucket).upload(original, bytes, { contentType: "text/plain" });
              if (u.error) throw new Error("upload_failed");

              const o = await sb.storage.from(bucket).download(original);
              if (o.error) throw new Error("download_original_failed");
              const originalHash = await sha(new Uint8Array(await o.data.arrayBuffer()));

              const cp = await sb.storage.from(bucket).copy(original, backup);
              if (cp.error) throw new Error("backup_copy_failed");

              const rm = await sb.storage.from(bucket).remove([original]);
              if (rm.error) throw new Error("delete_original_failed");

              const deletedListing = await sb.storage.from(bucket).list("runtime", {
                limit: 100,
                search: "original.txt"
              });
              if (deletedListing.error) throw new Error("delete_verification_list_failed");
              const originalMissingAfterDelete = !deletedListing.data.some((entry) => entry.name === "original.txt");

              const b = await sb.storage.from(bucket).download(backup);
              if (b.error) throw new Error("download_backup_failed");
              const backupBytes = new Uint8Array(await b.data.arrayBuffer());
              const backupHash = await sha(backupBytes);

              const ru = await sb.storage.from(bucket).upload(restored, backupBytes, { contentType: "text/plain" });
              if (ru.error) throw new Error("restore_upload_failed");

              const r = await sb.storage.from(bucket).download(restored);
              if (r.error) throw new Error("download_restored_failed");
              const restoredBytes = new Uint8Array(await r.data.arrayBuffer());
              const restoredHash = await sha(restoredBytes);

              const mechanicsOk =
                originalHash === expected &&
                backupHash === expected &&
                restoredHash === expected &&
                originalMissingAfterDelete;

              const cleanupCompleted = await cleanup(true);
              const ok = mechanicsOk && cleanupCompleted;

              return Response.json({
                schema: "risck-comply.storage-recovery-proof.v2",
                ok,
                syntheticObjectOnly: true,
                allowlistedRecoveryProject: true,
                providerRestoreProvenanceClaimed: false,
                originalMissingAfterDelete,
                originalHashMatches: originalHash === expected,
                backupHashMatches: backupHash === expected,
                restoredHashMatches: restoredHash === expected,
                byteLength: restoredBytes.byteLength,
                productionCustomerObjectRead: false,
                productionCustomerObjectCopied: false,
                cleanupCompleted
              }, {
                status: ok ? 200 : 500,
                headers: { "cache-control": "no-store" }
              });
            } catch (e) {
              const cleanupCompleted = await cleanup(true);
              return Response.json({
                schema: "risck-comply.storage-recovery-proof.v2",
                ok: false,
                syntheticObjectOnly: true,
                allowlistedRecoveryProject: true,
                providerRestoreProvenanceClaimed: false,
                cleanupCompleted,
                error: String(e instanceof Error ? e.message : e)
              }, { status: 500 });
            }
          });
          TS

      - name: Deploy one-time function
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          supabase secrets set --project-ref "$RECOVERY_PROJECT_REF" "DR_STORAGE_PROOF_NONCE=$DR_STORAGE_NONCE"
          supabase functions deploy "$FUNCTION_NAME" --project-ref "$RECOVERY_PROJECT_REF" --no-verify-jwt

      - name: Execute and validate recovery proof
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$EVIDENCE_PATH")"
          response="$(curl --silent --show-error             -H "x-dr-proof-nonce: $DR_STORAGE_NONCE"             -H 'Accept: application/json'             "https://$RECOVERY_PROJECT_REF.supabase.co/functions/v1/$FUNCTION_NAME")"
          printf '%s\n' "$response" | jq -e . >/dev/null
          if ! jq -e '
            .schema=="risck-comply.storage-recovery-proof.v2" and
            .ok==true and
            .syntheticObjectOnly==true and
            .allowlistedRecoveryProject==true and
            .providerRestoreProvenanceClaimed==false and
            .originalMissingAfterDelete==true and
            .originalHashMatches==true and
            .backupHashMatches==true and
            .restoredHashMatches==true and
            .productionCustomerObjectRead==false and
            .productionCustomerObjectCopied==false and
            .cleanupCompleted==true
          ' <<<"$response" >/dev/null; then
            error="$(jq -r '.error // "proof_predicate_failed"' <<<"$response")"
            echo "Storage recovery proof failed: $error" >&2
            exit 1
          fi
          jq 'del(.error)' <<<"$response" > "$EVIDENCE_PATH"

      - name: Upload redacted evidence
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: storage-recovery-proof-${{ github.event_name == 'workflow_dispatch' && inputs.release_sha || github.sha }}
          path: artifacts/storage-recovery/storage-recovery-proof.json
          if-no-files-found: error
          retention-days: 90

      - name: Remove temporary proof function and nonce
        if: always()
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -u
          function_ok=0
          secret_ok=0

          LEGACY_FUNCTION_NAME="dr-storage-recovery-proof-20261004"

          for function_name in "$FUNCTION_NAME" "$LEGACY_FUNCTION_NAME"; do
            deleted=0
            for attempt in 1 2 3; do
              if supabase functions delete "$function_name" --project-ref "$RECOVERY_PROJECT_REF" --yes; then
                deleted=1
                break
              fi
              sleep $((attempt * 2))
            done

            # Deletion is idempotent: if a legacy/current proof function is already
            # absent, verify absence through the Management API before failing.
            if [ "$deleted" -ne 1 ]; then
              functions_json="$(curl --fail --silent --show-error \
                -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
                "https://api.supabase.com/v1/projects/$RECOVERY_PROJECT_REF/functions")"
              if jq -e --arg name "$function_name" '.[] | select((.slug // .name) == $name)' <<<"$functions_json" >/dev/null; then
                echo "Temporary recovery proof function still exists: $function_name" >&2
                function_ok=0
                break
              fi
            fi
          done

          if [ "$function_ok" -ne 0 ]; then
            function_ok=1
          else
            # function_ok starts at 0; set PASS only when neither current nor legacy
            # function remains after the deletion/absence verification loop.
            functions_json="$(curl --fail --silent --show-error \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              "https://api.supabase.com/v1/projects/$RECOVERY_PROJECT_REF/functions")"
            if ! jq -e --arg current "$FUNCTION_NAME" --arg legacy "$LEGACY_FUNCTION_NAME" \
              '.[] | select((.slug // .name) == $current or (.slug // .name) == $legacy)' \
              <<<"$functions_json" >/dev/null; then
              function_ok=1
            fi
          fi

          for attempt in 1 2 3; do
            if supabase secrets unset --project-ref "$RECOVERY_PROJECT_REF" DR_STORAGE_PROOF_NONCE; then
              secret_ok=1
              break
            fi
            sleep $((attempt * 2))
          done

          if [ "$function_ok" -ne 1 ] || [ "$secret_ok" -ne 1 ]; then
            echo "Temporary recovery proof cleanup could not be confirmed" >&2
            exit 1
          fi
