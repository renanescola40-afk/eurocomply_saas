name: Enterprise Reconciliation Operations

on:
  pull_request:
    paths:
      - 'src/server/enterprise/group-access-reconciliation-operations.ts'
      - 'src/app/api/internal/enterprise-group-access-reconciliation/**'
      - 'supabase/migrations/*enterprise_reconciliation_operations.sql'
      - 'tests/enterprise/enterprise-reconciliation-operations.test.ts'
      - '.github/workflows/enterprise-reconciliation-operations.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: enterprise-reconciliation-operations-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assurance:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx vitest run tests/enterprise/enterprise-reconciliation-operations.test.ts
      - run: npm run typecheck
