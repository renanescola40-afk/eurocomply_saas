name: Audit Chain Runtime Proof

run-name: Audit-chain runtime proof for ${{ inputs.release_sha || github.sha }}

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_sha:
        description: Optional full current main SHA; defaults to selected main SHA
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: audit-chain-runtime-proof-${{ inputs.release_sha || github.sha }}
  cancel-in-progress: false

jobs:
  production-environment-governance:
    name: Verify Production governance before audit-chain secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      TARGET_SHA: ${{ inputs.release_sha || github.sha }}
    steps:
      - name: Bind proof to exact current main before governance lookup
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          test "$GITHUB_REF_NAME" = "main"
          main_sha="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/main" | jq -r '.sha')"
          test "$main_sha" = "${TARGET_SHA,,}"
      - name: Check out exact trusted release SHA
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Verify Production environment governance before protected secrets
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_ENVIRONMENT_NAME: Production
          REQUIRE_PROTECTED_BRANCHES: 'true'
        run: node scripts/security/check-github-environment-governance.mjs

  validate-audit-chain-runtime:
    name: Validate exact-SHA live audit chain
    needs: production-environment-governance
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: Production
    env:
      TARGET_SHA: ${{ inputs.release_sha || github.sha }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      AUDIT_CHAIN_SIGNING_SECRET: ${{ secrets.AUDIT_CHAIN_SIGNING_SECRET }}
      EVIDENCE_PACK_SIGNING_SECRET: ${{ secrets.EVIDENCE_PACK_SIGNING_SECRET }}
      AUDIT_CHAIN_LIVE_PROOF: 'true'
      RISCK_COMPLY_ENTERPRISE_RELEASE: 'true'

    steps:
      - name: Validate exact current main SHA
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ ! "$TARGET_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "release_sha must be a full Git SHA" >&2
            exit 1
          fi
          TARGET_SHA="${TARGET_SHA,,}"
          echo "TARGET_SHA=$TARGET_SHA" >> "$GITHUB_ENV"
          main_sha="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/main" | jq -r '.sha')"
          test "$main_sha" = "$TARGET_SHA"

      - name: Checkout exact release SHA
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact checkout
        run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Install deterministic dependencies
        run: npm ci --ignore-scripts

      - name: Validate audit-chain proof contracts
        run: |
          node --check scripts/security/run-audit-chain-live-validation.mjs
          node --check scripts/security/run-audit-chain-live-validation-v2.mjs
          node --check scripts/security/validate-audit-chain-live-evidence.mjs
          node --check scripts/security/preflight-audit-chain-runtime-proof.mjs
          node --check scripts/enterprise/fetch-audit-chain-runtime-evidence.mjs
          npx vitest run \
            tests/enterprise/audit-chain-runtime-evidence-fetch.test.ts \
            tests/enterprise/audit-chain-ephemeral-runtime-proof.test.ts \
            tests/enterprise/audit-chain-runtime-bounded-proof.test.ts \
            tests/enterprise/audit-chain-runtime-preflight.test.ts

      - name: Preflight protected audit-chain runtime prerequisites
        id: runtime_preflight
        run: node scripts/security/preflight-audit-chain-runtime-proof.mjs

      - name: Execute protected ephemeral live audit-chain proof
        if: steps.runtime_preflight.outputs.ready == 'true'
        run: node scripts/security/run-audit-chain-live-validation-v2.mjs

      - name: Validate raw redacted audit-chain evidence
        if: steps.runtime_preflight.outputs.ready == 'true'
        run: |
          node -e "import('./scripts/enterprise/fetch-audit-chain-runtime-evidence.mjs').then(({validateRawAuditChainEvidence})=>{const fs=require('node:fs');const e=JSON.parse(fs.readFileSync('docs/security/evidence/runtime/audit-chain-live-validation.json','utf8'));const r=validateRawAuditChainEvidence(e);if(!r.passed){console.error(r.failures.join('\\n'));process.exit(1)}})"

      - name: Fail closed when audit-chain prerequisites are blocked
        if: steps.runtime_preflight.outputs.ready != 'true'
        shell: bash
        run: |
          set -euo pipefail
          evidence=docs/security/evidence/runtime/audit-chain-live-validation.json
          test -f "$evidence"
          jq -r '.blockerCodes[] | "Audit-chain blocker: \(.)"' "$evidence"
          echo 'Live audit-chain proof was intentionally not executed; no disposable runtime mutation was performed.'
          exit 1

      - name: Upload redacted exact-SHA audit-chain evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: audit-chain-runtime-proof-${{ env.TARGET_SHA }}
          path: docs/security/evidence/runtime/audit-chain-live-validation.json
          if-no-files-found: error
          retention-days: 90
