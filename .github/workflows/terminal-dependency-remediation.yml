name: Terminal Dependency Remediation

on:
  push:
    branches:
      - security/database-terminal-closure

permissions:
  contents: write

concurrency:
  group: terminal-dependency-remediation
  cancel-in-progress: false

jobs:
  remediate:
    if: github.repository == 'renanescola40-afk/eurocomply_saas'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: security/database-terminal-closure
          fetch-depth: 1
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm

      - name: Apply non-breaking lockfile remediation
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          cp package.json /tmp/package.before.json
          npm audit fix --package-lock-only --ignore-scripts
          cmp -s package.json /tmp/package.before.json
          npm audit --audit-level=moderate
          test -n "$(git status --porcelain -- package-lock.json)"
          test -z "$(git status --porcelain -- package.json)"

      - name: Commit remediated lockfile and remove ephemeral workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/terminal-dependency-remediation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json .github/workflows/terminal-dependency-remediation.yml
          git diff --cached --exit-code --quiet && exit 1 || true
          git commit -m 'fix(deps): remediate undici audit advisory'
          git push origin HEAD:security/database-terminal-closure
