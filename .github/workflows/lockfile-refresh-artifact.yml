name: Lockfile Refresh Artifact

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/lockfile-refresh-artifact.yml'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

concurrency:
  group: lockfile-refresh-artifact-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh-lockfile:
    name: Generate package-lock artifact
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Generate deterministic lockfile without lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify lockfile can be consumed by npm ci
        run: npm ci --ignore-scripts

      - name: Upload generated lockfile
        uses: actions/upload-artifact@v7
        with:
          name: refreshed-package-lock
          path: package-lock.json
          retention-days: 1
          if-no-files-found: error
