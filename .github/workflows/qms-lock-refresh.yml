name: QMS dependency lock refresh

on:
  push:
    branches:
      - agent/qms-capa-audit-management-review-operational-megapack
    paths:
      - .github/workflows/qms-lock-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Refresh Vitest and lockfile
        run: npm install --ignore-scripts --save-dev vitest@4.1.10

      - name: Commit deterministic dependency update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes were required."
            exit 0
          fi
          git commit -m "fix(deps): update Vitest to 4.1.10"
          git push origin HEAD:agent/qms-capa-audit-management-review-operational-megapack
