name: Enterprise Readiness Scorecard Stabilizer

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Optional exact current main SHA to stabilize
        required: false
        type: string
  workflow_run:
    workflows:
      - CI
      - CodeQL
      - Semgrep
      - Secret Scanning
      - Scan repository for accidental secret exposure
      - Dependency Review
      - Actionlint
      - Public Claims Guard
      - Full Security Suite
      - Enterprise Production Gate
      - RISCK COMPLY Security CI
      - RISCK COMPLY Upload Security CI
      - Enterprise DAST
      - Dependency Vulnerability Proof
      - Distributed Rate Limit Runtime Proof
      - Auth RBAC Tenant Proof
      - Supabase Live RLS Validation
      - Production Runtime Proof
      - Audit Chain Runtime Proof
      - Production Provider Runtime Proof
      - Branch Protection Runtime Proof
      - Step-Up Runtime Proof
      - Stripe Runtime Evidence Promotion
      - Public Production Final
      - Final Technical Controls Proof
      - Recovery Resilience Proof
      - Enterprise Recovery Drill
    branches: [main]
    types: [completed]

permissions:
  actions: write
  contents: read

concurrency:
  group: enterprise-readiness-scorecard-stabilizer-${{ github.event.workflow_run.head_sha || inputs.target_sha || github.sha }}
  cancel-in-progress: true

jobs:
  stabilize:
    name: Dispatch one terminal exact-SHA scorecard
    if: >-
      github.event_name != 'workflow_run' ||
      (
        github.event.workflow_run.head_branch == 'main' &&
        (
          github.event.workflow_run.name != 'Enterprise Production Gate' ||
          github.event.workflow_run.event != 'workflow_dispatch'
        )
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GITHUB_TOKEN: ${{ github.token }}
      TARGET_SHA: ${{ github.event.workflow_run.head_sha || inputs.target_sha || github.sha }}
      STABILIZER_DEBOUNCE_SECONDS: '90'
    steps:
      - name: Debounce producer storm before checkout or API access
        if: github.event_name == 'workflow_run'
        shell: bash
        run: sleep "$STABILIZER_DEBOUNCE_SECONDS"

      - name: Checkout exact producer SHA
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false

      - name: Verify exact producer SHA
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22

      - name: Validate stabilizer source
        run: node --check scripts/release/stabilize-enterprise-readiness-scorecard.mjs

      - name: Stabilize terminal exact-SHA scorecard
        id: stabilize
        run: node scripts/release/stabilize-enterprise-readiness-scorecard.mjs

      - name: Publish stabilization summary
        if: always()
        shell: bash
        env:
          DISPATCHED: ${{ steps.stabilize.outputs.dispatched }}
          REASON: ${{ steps.stabilize.outputs.reason }}
          STABILIZED_SHA: ${{ steps.stabilize.outputs.target_sha }}
        run: |
          {
            echo '## Enterprise readiness scorecard stabilizer'
            echo
            echo "- Target SHA: ${STABILIZED_SHA:-$TARGET_SHA}"
            echo "- Dispatched terminal scorecard: ${DISPATCHED:-unknown}"
            echo "- Reason: ${REASON:-stabilizer-failed-before-output}"
            echo
            echo 'Producer-triggered runs debounce before checkout or API access. The surviving exact-SHA run retries transient GitHub API pressure, waits for the reviewed material producer set, refreshes the Enterprise Production Gate when its snapshot predates those producers, accepts a terminal GO or NO_GO gate as a completed evaluation, and only then dispatches the existing readiness scorecard when needed. A Production Gate run dispatched by this stabilizer is ignored on completion so it cannot recursively restart the stabilizer.'
            echo
            echo 'Terminal evaluation status never awards PASS: the Production Gate and scorecard artifacts remain authoritative for GO/NO_GO and runtime closure. This workflow does not mutate production.'
          } >> "$GITHUB_STEP_SUMMARY"
