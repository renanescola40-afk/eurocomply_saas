name: Article 50 Control Plane

on:
  pull_request:
    paths:
      - 'src/server/ai-governance/article-50-**'
      - 'scripts/compliance/check-article-50-control-plane.mjs'
      - 'docs/compliance/ARTICLE_50_**'
      - 'docs/compliance/evidence/review-packets/article-50-**'
      - '.github/workflows/article-50-control-plane.yml'
  push:
    branches: [main]
    paths:
      - 'src/server/ai-governance/article-50-**'
      - 'scripts/compliance/check-article-50-control-plane.mjs'
      - 'docs/compliance/ARTICLE_50_**'
      - 'docs/compliance/evidence/review-packets/article-50-**'

permissions:
  contents: read

concurrency:
  group: article-50-control-plane-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/compliance/check-article-50-control-plane.mjs
      - run: npx vitest run src/server/ai-governance/article-50-effective-dates.test.ts src/server/ai-governance/article-50-control-plane.test.ts
      - run: npm run typecheck
