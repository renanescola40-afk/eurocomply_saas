name: SCIM Runtime Proof

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full 40-character current main SHA
        required: true
        type: string
      confirmation:
        description: Type EXECUTE_SCIM_RUNTIME_PROOF
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: scim-runtime-proof-${{ inputs.release_sha }}
  cancel-in-progress: false

jobs:
  scim-runtime-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: production-identity-proof
    env:
      TARGET_SHA: ${{ inputs.release_sha }}
      SCIM_PROOF_CONFIRMATION: ${{ inputs.confirmation }}
      PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
      SCIM_PROOF_BEARER_TOKEN: ${{ secrets.SCIM_PROOF_BEARER_TOKEN }}
      SCIM_PROOF_EMAIL_DOMAIN: ${{ secrets.SCIM_PROOF_EMAIL_DOMAIN }}
      SCIM_RUNTIME_OUTPUT: artifacts/scim-runtime-proof/scim-runtime-validation.json

    steps:
      - name: Validate request
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$SCIM_PROOF_CONFIRMATION" = "EXECUTE_SCIM_RUNTIME_PROOF"

      - name: Checkout exact release SHA
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify protected exact-main execution
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse origin/main)" = "$TARGET_SHA"
          test "$GITHUB_SHA" = "$TARGET_SHA"
          test "$GITHUB_REF_NAME" = "main"

      - name: Execute SCIM Users and Groups lifecycle proof
        run: node scripts/identity/run-scim-runtime-proof.mjs

      - name: Validate redacted exact-SHA evidence
        if: always()
        run: node scripts/identity/check-scim-runtime-evidence.mjs

      - name: Generate evidence checksum
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s "$SCIM_RUNTIME_OUTPUT"
          sha256sum "$SCIM_RUNTIME_OUTPUT" > artifacts/scim-runtime-proof/SHA256SUMS

      - name: Upload immutable SCIM evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: scim-runtime-proof-${{ inputs.release_sha }}
          path: artifacts/scim-runtime-proof
          if-no-files-found: error
          retention-days: 365
