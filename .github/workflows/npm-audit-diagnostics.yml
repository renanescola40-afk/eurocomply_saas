name: npm Audit Diagnostics

run-name: npm audit diagnostics for ${{ github.event.pull_request.head.sha || github.sha }}

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/npm-audit-diagnostics.yml
      - scripts/security/summarize-npm-audit.mjs

permissions:
  contents: read

concurrency:
  group: npm-audit-diagnostics-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Capture fail-closed npm audit diagnostics
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm

      - name: Install deterministic dependencies
        run: npm ci --ignore-scripts

      - name: Capture npm audit report and status
        shell: bash
        run: |
          set -uo pipefail
          status=0
          npm audit --audit-level=moderate --json > npm-audit.json || status=$?
          node scripts/security/summarize-npm-audit.mjs npm-audit.json | tee npm-audit-summary.txt
          printf '%s\n' "$status" > npm-audit-status.txt

      - name: Upload npm audit diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: npm-audit-diagnostics-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            npm-audit.json
            npm-audit-summary.txt
            npm-audit-status.txt
          if-no-files-found: error
          retention-days: 30

      - name: Enforce original npm audit result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          status="$(cat npm-audit-status.txt)"
          [[ "$status" =~ ^[0-9]+$ ]]
          exit "$status"
