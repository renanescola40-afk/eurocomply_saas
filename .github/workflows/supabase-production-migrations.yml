name: Supabase Production Migrations (Legacy Guard)

run-name: Legacy Supabase production migration guard for ${{ inputs.release_sha }}

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact 40-character SHA currently at the tip of main
        required: true
        type: string
      confirmation:
        description: Type USE_CANONICAL_FORWARD_PROMOTION to acknowledge that this legacy entry point never writes Production
        required: true
        type: string

permissions:
  contents: read

env:
  TARGET_SHA: ${{ inputs.release_sha }}
  CANONICAL_PROMOTION_WORKFLOW: .github/workflows/supabase-forward-reconciliation-production-promotion.yml

jobs:
  guard:
    name: Refuse legacy production writes
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Validate exact current main and acknowledgement
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          if [[ ! "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "release_sha must be a full lowercase 40-character Git SHA" >&2
            exit 1
          fi
          if [ "$INPUT_CONFIRMATION" != "USE_CANONICAL_FORWARD_PROMOTION" ]; then
            echo "confirmation must exactly match USE_CANONICAL_FORWARD_PROMOTION" >&2
            exit 1
          fi
          MAIN_SHA="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/main" | jq -r '.sha')"
          test "$MAIN_SHA" = "$TARGET_SHA"

      - name: Check out exact current main SHA without credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify canonical promotion governance is present
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -f "$CANONICAL_PROMOTION_WORKFLOW"
          test -f config/supabase-forward-reconciliation.json
          jq -e '
            .truthBoundary.productionWriteAuthorizedByConfig == false and
            .truthBoundary.migrationHistoryRepairAllowed == false and
            .truthBoundary.unrestrictedDbPushAllowed == false and
            .truthBoundary.onlyListedForwardMigrationsMayBeRehearsedOrRequested == true
          ' config/supabase-forward-reconciliation.json >/dev/null
          grep -Fq 'Verify rehearsal dry-run and human decision provenance' "$CANONICAL_PROMOTION_WORKFLOW"
          grep -Fq 'Execute final filtered dry run immediately before promotion' "$CANONICAL_PROMOTION_WORKFLOW"
          grep -Fq 'Revalidate current main, bounded S3 and human approval immediately before production write' "$CANONICAL_PROMOTION_WORKFLOW"
          grep -Fq 'Apply only the filtered selected migration set' "$CANONICAL_PROMOTION_WORKFLOW"

      - name: Block legacy production write path
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '## Legacy Supabase production writer blocked by design'
            echo
            printf -- '- Release SHA: `%s`\n' "$TARGET_SHA"
            echo '- Production write performed: `false`'
            echo '- Database credentials released: `false`'
            printf -- '- Required writer: `%s`\n' "$CANONICAL_PROMOTION_WORKFLOW"
            echo
            echo 'Use the canonical promotion workflow only after exact-SHA rehearsal, bounded dry-run, Decision Gate and required human approval provenance are complete.'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Legacy Supabase Production Migrations never writes Production; use $CANONICAL_PROMOTION_WORKFLOW" >&2
          exit 1
