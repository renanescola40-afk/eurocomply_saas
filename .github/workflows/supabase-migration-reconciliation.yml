name: Supabase Migration Reconciliation

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact current main SHA
        required: true
        type: string
      inventory_run_id:
        description: Workflow run containing migration drift inventory artifact
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: supabase-migration-reconciliation
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    environment: production-migration-reconciliation
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha }}
          persist-credentials: false

      - name: Verify exact current main SHA
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          current_main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')"
          test "${TARGET_SHA,,}" = "${current_main_sha,,}"

      - name: Download and validate migration inventory
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.inventory_run_id }}
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          run_path="repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}"
          status="$(gh api "$run_path" --jq '.status')"
          conclusion="$(gh api "$run_path" --jq '.conclusion')"
          head_sha="$(gh api "$run_path" --jq '.head_sha')"
          workflow_path="$(gh api "$run_path" --jq '.path')"

          test "$status" = "completed"
          case "$conclusion" in
            success|failure) ;;
            *)
              echo "Source drift audit must be completed with success or fail-closed failure" >&2
              exit 1
              ;;
          esac
          test "${head_sha,,}" = "${TARGET_SHA,,}"
          test "$workflow_path" = ".github/workflows/supabase-migration-drift-audit.yml"

          mkdir -p artifacts/source
          artifact_name="supabase-migration-drift-${TARGET_SHA,,}"
          artifact_id="$(
            gh api "${run_path}/artifacts?per_page=100" \
              --jq "[.artifacts[] | select(.expired == false and .name == \"${artifact_name}\")] | sort_by(.created_at) | reverse | .[0].id // empty"
          )"
          [[ "$artifact_id" =~ ^[0-9]+$ ]]
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > artifacts/source/inventory.zip
          unzip -q artifacts/source/inventory.zip -d artifacts/supabase-migration-drift

          test -s artifacts/supabase-migration-drift/migration-state-remote.txt
          test -s artifacts/supabase-migration-drift/migration-drift.json
          test -s artifacts/supabase-migration-drift/migration-reconciliation-inventory.json

          node <<'NODE'
          const fs = require('node:fs');
          const drift = JSON.parse(fs.readFileSync(
            'artifacts/supabase-migration-drift/migration-drift.json',
            'utf8',
          ));
          const inventory = JSON.parse(fs.readFileSync(
            'artifacts/supabase-migration-drift/migration-reconciliation-inventory.json',
            'utf8',
          ));
          if (inventory.schema !== 'risck-comply.supabase-migration-reconciliation-inventory.v1') {
            throw new Error('Unexpected migration reconciliation inventory schema');
          }
          if (!Array.isArray(inventory.items) || !Array.isArray(inventory.remoteVersions)) {
            throw new Error('Incomplete migration reconciliation inventory');
          }
          if (!drift.generatedAt || !drift.summary || !drift.safety) {
            throw new Error('Incomplete migration drift evidence');
          }
          if (drift.safety.databaseModified || drift.safety.migrationHistoryModified) {
            throw new Error('Source drift audit claims a database mutation');
          }
          NODE

      - name: Compile reviewed reconciliation
        run: node scripts/supabase/compile-migration-reconciliation.mjs

      - name: Assert no production mutation
        run: |
          node -e "const r=require('./artifacts/supabase-migration-reconciliation/migration-reconciliation-result.json'); if(r.safety.databaseModified||r.safety.migrationHistoryModified||r.safety.productionPushAuthorized||r.safety.unrestrictedDbPushAllowed) process.exit(1)"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: supabase-migration-reconciliation-${{ inputs.target_sha }}
          path: artifacts/supabase-migration-reconciliation
          retention-days: 90
          if-no-files-found: error
