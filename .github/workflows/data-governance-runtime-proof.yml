name: Data Governance Privacy Audit Proof

run-name: Data governance proof for ${{ inputs.release_sha }}

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full 40-character current main SHA
        required: true
        type: string
      confirmation:
        description: Type EXECUTE_DATA_GOVERNANCE_PROOF
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: data-governance-runtime-proof-${{ inputs.release_sha }}
  cancel-in-progress: false

jobs:
  data-governance-environment-governance:
    name: Verify data governance proof environment before protected attestations
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      TARGET_SHA: ${{ inputs.release_sha }}
      DATA_GOVERNANCE_CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - name: Bind data governance proof to exact current main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$DATA_GOVERNANCE_CONFIRMATION" = "EXECUTE_DATA_GOVERNANCE_PROOF"
          test "$GITHUB_REF_NAME" = "main"
          test "$GITHUB_SHA" = "$TARGET_SHA"
          main_sha="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/main" | jq -r '.sha')"
          test "$main_sha" = "$TARGET_SHA"

      - name: Check out exact trusted release SHA
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ inputs.release_sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22

      - name: Verify data governance proof environment governance
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_ENVIRONMENT_NAME: production-data-governance-proof
          REQUIRE_PROTECTED_BRANCHES: 'true'
        run: node scripts/security/check-github-environment-governance.mjs

  governance-proof:
    needs: data-governance-environment-governance
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: production-data-governance-proof
    env:
      TARGET_SHA: ${{ inputs.release_sha }}
      DATA_GOVERNANCE_CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - name: Revalidate exact current main after environment approval
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$DATA_GOVERNANCE_CONFIRMATION" = "EXECUTE_DATA_GOVERNANCE_PROOF"
          test "$GITHUB_REF_NAME" = "main"
          test "$GITHUB_SHA" = "$TARGET_SHA"
          main_sha="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/main" | jq -r '.sha')"
          test "$main_sha" = "$TARGET_SHA"

      - name: Checkout exact release SHA
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ inputs.release_sha }}
          persist-credentials: false

      - name: Verify exact current main execution
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse origin/main)" = "$TARGET_SHA"
          test "$GITHUB_SHA" = "$TARGET_SHA"
          test "$GITHUB_REF_NAME" = "main"

      - name: Set up protected Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22

      - name: Revalidate environment governance after admission
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_ENVIRONMENT_NAME: production-data-governance-proof
          REQUIRE_PROTECTED_BRANCHES: 'true'
        run: node scripts/security/check-github-environment-governance.mjs

      - name: Revalidate protected producer boundary
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_ENVIRONMENT_NAME: production-data-governance-proof
          REQUIRE_PROTECTED_BRANCHES: 'true'
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse origin/main)" = "$TARGET_SHA"
          main_sha="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/main" | jq -r '.sha')"
          test "$main_sha" = "$TARGET_SHA"
          node scripts/security/check-github-environment-governance.mjs

      - name: Set up pinned Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520
        with:
          version: 2.101.0

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Start exact-SHA disposable Supabase project database
        run: node scripts/recovery/run-reviewed-ephemeral-schema-boundary-v4.mjs

      - name: Execute governance proof
        env:
          DATA_RESIDENCY_REGION: ${{ vars.DATA_RESIDENCY_REGION }}
          DATA_RETENTION_DEFAULT_DAYS: ${{ vars.DATA_RETENTION_DEFAULT_DAYS }}
          DATA_EXPORT_ENCRYPTION_REQUIRED: ${{ vars.DATA_EXPORT_ENCRYPTION_REQUIRED }}
        run: node scripts/data-governance/run-data-governance-runtime-proof.mjs

      - name: Validate evidence
        run: node scripts/data-governance/check-data-governance-evidence.mjs

      - name: Remove disposable project database
        if: always()
        run: node scripts/recovery/manage-ephemeral-recovery-database.mjs stop

      - name: Upload redacted evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: data-governance-runtime-proof-${{ inputs.release_sha }}
          path: docs/security/evidence/runtime/data-governance-validation.json
          if-no-files-found: error
          retention-days: 90
