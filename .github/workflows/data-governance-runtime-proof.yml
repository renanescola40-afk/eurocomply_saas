name: Data Governance Privacy Audit Proof

run-name: Data governance proof for ${{ inputs.release_sha }}

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full 40-character current main SHA
        required: true
        type: string
      confirmation:
        description: Type EXECUTE_DATA_GOVERNANCE_PROOF
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: data-governance-runtime-proof-${{ inputs.release_sha }}
  cancel-in-progress: false

jobs:
  governance-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: production-data-governance-proof
    env:
      TARGET_SHA: ${{ inputs.release_sha }}
      DATA_GOVERNANCE_CONFIRMATION: ${{ inputs.confirmation }}
      RECOVERY_ISOLATED_DATABASE_URL: ${{ secrets.RECOVERY_ISOLATED_DATABASE_URL }}
      DATA_RESIDENCY_REGION: ${{ vars.DATA_RESIDENCY_REGION }}
      DATA_RETENTION_DEFAULT_DAYS: ${{ vars.DATA_RETENTION_DEFAULT_DAYS }}
      DATA_EXPORT_ENCRYPTION_REQUIRED: ${{ vars.DATA_EXPORT_ENCRYPTION_REQUIRED }}
    steps:
      - name: Validate requested release SHA and confirmation
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$DATA_GOVERNANCE_CONFIRMATION" = "EXECUTE_DATA_GOVERNANCE_PROOF"

      - name: Checkout exact release SHA
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ inputs.release_sha }}
          persist-credentials: false

      - name: Verify protected exact-main execution
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse origin/main)" = "$TARGET_SHA"
          test "$GITHUB_SHA" = "$TARGET_SHA"
          test "$GITHUB_REF_NAME" = "main"

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Execute governance proof
        run: node scripts/data-governance/run-data-governance-runtime-proof.mjs

      - name: Validate evidence
        run: node scripts/data-governance/check-data-governance-evidence.mjs

      - name: Upload redacted evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: data-governance-runtime-proof-${{ inputs.release_sha }}
          path: docs/security/evidence/runtime/data-governance-validation.json
          if-no-files-found: error
          retention-days: 90
