name: P0 Provider Runtime Plan

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'docs/security/evidence/templates/provider-runtime-plan.template.json'
      - 'scripts/security/check-p0-provider-runtime-plan.mjs'
      - 'docs/security/P0_PROVIDER_PLAN_USAGE.md'
      - '.github/workflows/p0-provider-plan.yml'

permissions:
  contents: read

jobs:
  p0-provider-plan:
    name: Validate provider runtime plan template
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Show runner Node.js and npm versions
        run: |
          node --version
          npm --version

      - name: Validate provider plan template
        run: node scripts/security/check-p0-provider-runtime-plan.mjs docs/security/evidence/templates/provider-runtime-plan.template.json
