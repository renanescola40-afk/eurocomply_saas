name: Code Review

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: code-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  code-review:
    name: Code Review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Workflow pattern gate
        run: node scripts/security/check-workflow-sensitive-patterns.mjs

      - name: Workflow permissions gate
        run: node scripts/security/check-workflow-permissions.mjs

      - name: Required checks gate
        run: node scripts/security/check-ci-required-checks-validation.mjs
