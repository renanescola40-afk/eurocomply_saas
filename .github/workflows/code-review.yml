name: Code Review

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read
  pull-requests: read

jobs:
  code-review:
    runs-on: ubuntu-latest
    name: Code Review
    steps:
      - name: Record review policy
        run: |
          echo "Automated third-party code review is disabled for deterministic CI."
          echo "Use GitHub branch protection, CODEOWNERS and required checks for merge review."
