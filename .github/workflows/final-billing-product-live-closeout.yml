name: Final Billing + Product Live Closeout

run-name: Final billing/product live closeout for ${{ inputs.release_sha }}

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact 40-character SHA currently at main and deployed to production
        required: true
        type: string
      organization_id:
        description: Pre-authorized organization UUID with a legitimate live subscription lifecycle
        required: true
        type: string
      stripe_subscription_id:
        description: Existing legitimate live Stripe subscription ID to observe read-only
        required: true
        type: string
      stripe_event_id:
        description: Existing processed live Stripe event ID correlated to the subscription
        required: true
        type: string
      confirmation:
        description: Type CLOSE_BILLING_PRODUCT_LIVE
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: final-billing-product-live-closeout-production
  cancel-in-progress: false

jobs:
  closeout:
    name: Prove final Billing + Product live closure
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: Production
    env:
      TARGET_SHA: ${{ inputs.release_sha }}
      RELEASE_SHA: ${{ inputs.release_sha }}
      RELEASE_COMMIT_SHA: ${{ inputs.release_sha }}
      RELEASE_BUILD_SHA: ${{ inputs.release_sha }}
      PROVIDER_PROOF_ENVIRONMENT: production
      STRIPE_PRICE_ESSENTIAL_MONTHLY: ${{ vars.STRIPE_PRICE_ESSENTIAL_MONTHLY }}
      STRIPE_PRICE_ESSENTIAL_ANNUAL: ${{ vars.STRIPE_PRICE_ESSENTIAL_ANNUAL }}
      STRIPE_PRICE_PROFESSIONAL_MONTHLY: ${{ vars.STRIPE_PRICE_PROFESSIONAL_MONTHLY }}
      STRIPE_PRICE_PROFESSIONAL_ANNUAL: ${{ vars.STRIPE_PRICE_PROFESSIONAL_ANNUAL }}
      PGSSLMODE: require
      PGOPTIONS: -c default_transaction_read_only=on -c statement_timeout=45000 -c lock_timeout=5000
      RELEASE_DEPLOYMENT_URL: https://www.risckcomply.com
      RELEASE_PRODUCTION_URL: https://www.risckcomply.com
      RELEASE_TARGET: final-billing-product-live-closeout

    steps:
      - name: Check out exact release SHA
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Authorize exact current main and bounded live observation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CONFIRMATION: ${{ inputs.confirmation }}
          ORGANIZATION_ID: ${{ inputs.organization_id }}
          STRIPE_SUBSCRIPTION_ID: ${{ inputs.stripe_subscription_id }}
          STRIPE_EVENT_ID: ${{ inputs.stripe_event_id }}
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          test "$CONFIRMATION" = "CLOSE_BILLING_PRODUCT_LIVE"
          git fetch --no-tags --prune origin main
          main_sha="$(git rev-parse origin/main)"
          test "$(git rev-parse HEAD)" = "${TARGET_SHA,,}"
          test "$main_sha" = "${TARGET_SHA,,}"
          api_main_sha="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/main" | jq -r '.sha')"
          test "$api_main_sha" = "${TARGET_SHA,,}"
          [[ "$ORGANIZATION_ID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$ ]]
          [[ "$STRIPE_SUBSCRIPTION_ID" =~ ^sub_[A-Za-z0-9]+$ ]]
          [[ "$STRIPE_EVENT_ID" =~ ^evt_[A-Za-z0-9]+$ ]]

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Install deterministic dependencies
        run: npm ci --ignore-scripts

      - name: Validate closeout implementation contracts
        run: |
          node --check scripts/security/run-final-stripe-control-plane-proof.mjs
          node --check scripts/security/build-final-billing-product-live-closeout.mjs
          node --test tests/enterprise/final-billing-product-live-closeout.test.mjs

      - name: Provision or reuse reviewed Billing Portal when default authority is selected
        id: portal
        shell: bash
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_BILLING_PORTAL_BOOTSTRAP_CONFIRMATION: PROVISION_STRIPE_BILLING_PORTAL_CONFIGURATION
        run: |
          set -euo pipefail
          configuration_id="$(node -e "const c=require('./config/stripe-billing-portal-contract.json'); process.stdout.write(c.configurationId || '')")"
          if [ -n "$configuration_id" ]; then
            [[ "$configuration_id" =~ ^bpc_[A-Za-z0-9]+$ ]]
            echo 'disposition=explicit-contract' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node scripts/ops/provision-stripe-billing-portal-config.mjs

      - name: Prove Stripe production control plane
        id: stripe_control_plane
        if: always() && steps.portal.outcome == 'success'
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: node scripts/security/run-final-stripe-control-plane-proof.mjs

      - name: Prove four canonical self-serve Stripe prices
        id: commercial_catalog
        if: always()
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        run: node scripts/security/run-stripe-commercial-catalog-proof.mjs

      - name: Verify exact deployed production runtime SHA
        id: runtime_sha
        if: always()
        env:
          HEALTHCHECK_TOKEN: ${{ secrets.HEALTHCHECK_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release/verify-runtime-release-sha.mjs
          rm -f docs/security/evidence/runtime/runtime-release-sha-validation.json
          for path in \
            docs/security/evidence/runtime/production-final-validation.json \
            docs/security/evidence/runtime/final-validation-runner.json; do
            if git ls-files --error-unmatch "$path" >/dev/null 2>&1; then
              git restore --worktree -- "$path"
            else
              rm -f "$path"
            fi
          done

      - name: Verify hosted PostgreSQL client availability
        id: postgres_client
        if: always() && steps.runtime_sha.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          command -v psql >/dev/null
          psql --version

      - name: Collect legitimate live lifecycle observation read-only
        id: lifecycle_observation
        if: always() && steps.runtime_sha.outcome == 'success' && steps.postgres_client.outcome == 'success'
        env:
          SUPABASE_DB_POOLER_URL: ${{ secrets.SUPABASE_DB_POOLER_URL }}
          ORGANIZATION_ID: ${{ inputs.organization_id }}
          STRIPE_SUBSCRIPTION_ID: ${{ inputs.stripe_subscription_id }}
          STRIPE_EVENT_ID: ${{ inputs.stripe_event_id }}
        shell: bash
        run: |
          set -euo pipefail
          case "$SUPABASE_DB_POOLER_URL" in
            postgresql://*|postgres://*) ;;
            *) echo 'SUPABASE_DB_POOLER_URL must be a PostgreSQL URI' >&2; exit 1 ;;
          esac
          mkdir -p artifacts/billing-lifecycle-runtime-proof
          psql "$SUPABASE_DB_POOLER_URL" \
            --set ON_ERROR_STOP=1 \
            --tuples-only \
            --no-align \
            --set organization_id="$ORGANIZATION_ID" \
            --set stripe_subscription_id="$STRIPE_SUBSCRIPTION_ID" \
            --set stripe_event_id="$STRIPE_EVENT_ID" \
            --set target_environment="production" \
            --file scripts/enterprise/billing-lifecycle-runtime-proof.sql \
            > artifacts/billing-lifecycle-runtime-proof/raw.json
          test -s artifacts/billing-lifecycle-runtime-proof/raw.json

      - name: Collect canonical billing audit chain read-only
        id: audit_collect
        if: always() && steps.lifecycle_observation.outcome == 'success'
        env:
          SUPABASE_DB_POOLER_URL: ${{ secrets.SUPABASE_DB_POOLER_URL }}
          ORGANIZATION_ID: ${{ inputs.organization_id }}
        shell: bash
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_POOLER_URL" \
            --set ON_ERROR_STOP=1 \
            --tuples-only \
            --no-align \
            --set organization_id="$ORGANIZATION_ID" \
            --file scripts/enterprise/billing-lifecycle-audit-chain.sql \
            > artifacts/billing-lifecycle-runtime-proof/raw-audit-chain.json
          test -s artifacts/billing-lifecycle-runtime-proof/raw-audit-chain.json

      - name: Verify canonical billing audit hash chain
        id: audit_chain
        if: always() && steps.audit_collect.outcome == 'success'
        env:
          AUDIT_CHAIN_SIGNING_SECRET: ${{ secrets.AUDIT_CHAIN_SIGNING_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/security/verify-audit-chain.mjs \
            --input artifacts/billing-lifecycle-runtime-proof/raw-audit-chain.json \
            > artifacts/billing-lifecycle-runtime-proof/audit-chain-verification.json
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const result = JSON.parse(readFileSync('artifacts/billing-lifecycle-runtime-proof/audit-chain-verification.json', 'utf8'));
          if (result.ok !== true || !Number.isSafeInteger(result.checked) || result.checked < 4) process.exit(1);
          NODE

      - name: Build sanitized durable lifecycle evidence
        id: lifecycle_evidence
        if: always() && steps.lifecycle_observation.outcome == 'success' && steps.audit_chain.outcome == 'success'
        env:
          REPOSITORY: ${{ github.repository }}
          TARGET_ENVIRONMENT: production
          ORGANIZATION_ID: ${{ inputs.organization_id }}
          STRIPE_SUBSCRIPTION_ID: ${{ inputs.stripe_subscription_id }}
          STRIPE_EVENT_ID: ${{ inputs.stripe_event_id }}
          RUNTIME_RELEASE_SHA_VERIFIED: ${{ steps.runtime_sha.outcome == 'success' && 'true' || 'false' }}
          AUDIT_CHAIN_CRYPTOGRAPHICALLY_VERIFIED: ${{ steps.audit_chain.outcome == 'success' && 'true' || 'false' }}
        run: node scripts/enterprise/build-billing-lifecycle-runtime-proof.mjs

      - name: Remove raw database observations before retention
        if: always()
        shell: bash
        run: |
          rm -f \
            artifacts/billing-lifecycle-runtime-proof/raw.json \
            artifacts/billing-lifecycle-runtime-proof/raw-audit-chain.json \
            artifacts/billing-lifecycle-runtime-proof/audit-chain-verification.json

      - name: Build final redacted closeout decision
        id: final_decision
        if: always()
        env:
          PORTAL_BOOTSTRAP_OUTCOME: ${{ steps.portal.outcome }}
          STRIPE_CONTROL_PLANE_OUTCOME: ${{ steps.stripe_control_plane.outcome }}
          COMMERCIAL_CATALOG_OUTCOME: ${{ steps.commercial_catalog.outcome }}
          RUNTIME_RELEASE_SHA_OUTCOME: ${{ steps.runtime_sha.outcome }}
          LIFECYCLE_OBSERVATION_OUTCOME: ${{ steps.lifecycle_observation.outcome }}
          AUDIT_CHAIN_OUTCOME: ${{ steps.audit_chain.outcome }}
          LIFECYCLE_EVIDENCE_OUTCOME: ${{ steps.lifecycle_evidence.outcome }}
        run: node scripts/security/build-final-billing-product-live-closeout.mjs

      - name: Reject sensitive retained closeout content
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test ! -e artifacts/billing-lifecycle-runtime-proof/raw.json
          test ! -e artifacts/billing-lifecycle-runtime-proof/raw-audit-chain.json
          test ! -e artifacts/billing-lifecycle-runtime-proof/audit-chain-verification.json
          ! grep -RIE 'postgres(ql)?://|supabase\.co|service[_-]?role|whsec_|(sk|rk|pk)_(live|test)_|\bsub_[A-Za-z0-9]+\b|\bevt_[A-Za-z0-9]+\b|\b[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}\b' \
            release-validation/final-billing-product-live-closeout.json \
            release-validation/final-stripe-control-plane-proof.json \
            artifacts/billing-lifecycle-runtime-proof/evidence.json 2>/dev/null

      - name: Upload final redacted closeout evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: final-billing-product-live-closeout-${{ inputs.release_sha }}
          path: |
            release-validation/final-billing-product-live-closeout.json
            release-validation/final-stripe-control-plane-proof.json
            docs/security/evidence/runtime/stripe-commercial-catalog-proof.json
            artifacts/billing-lifecycle-runtime-proof/evidence.json
            artifacts/billing-lifecycle-runtime-proof/summary.md
          if-no-files-found: warn
          retention-days: 90

      - name: Enforce final Billing + Product live decision
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s release-validation/final-billing-product-live-closeout.json
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const evidence = JSON.parse(readFileSync('release-validation/final-billing-product-live-closeout.json', 'utf8'));
          console.log(JSON.stringify({ status: evidence.status, outcome: evidence.outcome, decision: evidence.decision, blockerCodes: evidence.blockerCodes }, null, 2));
          if (evidence.status !== 'Complete' || evidence.outcome !== 'passed' || evidence.decision !== 'BILLING_PRODUCT_EU_AI_ACT: PASS') process.exit(1);
          NODE
