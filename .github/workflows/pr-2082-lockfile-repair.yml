name: PR 2082 Lockfile Repair

on:
  pull_request:
    branches:
      - main
    paths:
      - package-lock.json
      - .github/workflows/pr-2082-lockfile-repair.yml

permissions:
  contents: write

jobs:
  repair-lockfile:
    name: Regenerate and verify package-lock
    if: github.event.pull_request.number == 2082 && github.head_ref == 'dependabot/npm_and_yarn/nextjs-and-react-0a85864cd4'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Regenerate lockfile deterministically
        run: npm install --package-lock-only --ignore-scripts

      - name: Prove clean install
        run: npm ci --ignore-scripts

      - name: Commit repaired lockfile when changed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo 'package-lock.json is already aligned.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'chore: regenerate React 19.3 package lock'
          git push origin HEAD:${GITHUB_HEAD_REF}
