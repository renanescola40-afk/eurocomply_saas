name: Enterprise Runtime Evidence Closeout

on:
  pull_request:
    paths:
      - 'scripts/release/validate-enterprise-runtime-closeout.mjs'
      - 'scripts/release/validate-enterprise-runtime-closeout.test.mjs'
      - 'scripts/release/run-authenticated-production-smoke.mjs'
      - 'scripts/release/run-production-observability-validation.mjs'
      - 'scripts/release/run-observability-smoke-validation.mjs'
      - 'scripts/release/validate-observability-runtime-evidence.mjs'
      - 'tests/release/enterprise-runtime-closeout-wiring.test.mjs'
      - '.github/workflows/enterprise-runtime-evidence-closeout.yml'
      - 'docs/security/runbooks/ENTERPRISE_RUNTIME_EVIDENCE_CLOSEOUT.md'
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact current main SHA deployed to production
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  contract:
    name: Validate runtime closeout contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --check scripts/release/validate-enterprise-runtime-closeout.mjs
      - run: node --check scripts/release/run-authenticated-production-smoke.mjs
      - run: node --check scripts/release/run-production-observability-validation.mjs
      - run: node --test scripts/release/validate-enterprise-runtime-closeout.test.mjs
      - run: node --test tests/release/enterprise-runtime-closeout-wiring.test.mjs

  environment-governance:
    name: Verify closeout environment governance before protected secrets
    if: github.event_name == 'workflow_dispatch'
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TARGET_SHA: ${{ inputs.release_sha }}
    steps:
      - name: Check out trusted current main
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Verify requested closeout SHA is current main
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          test "$(git rev-parse HEAD)" = "${TARGET_SHA,,}"

      - name: Verify enterprise closeout environment governance
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_ENVIRONMENT_NAME: enterprise-production-closeout
          REQUIRE_PROTECTED_BRANCHES: 'true'
        run: node scripts/security/check-github-environment-governance.mjs

  closeout:
    name: Collect and validate exact-SHA runtime evidence
    if: github.event_name == 'workflow_dispatch'
    needs: [contract, environment-governance]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: enterprise-production-closeout
    env:
      TARGET_SHA: ${{ inputs.release_sha }}
      RELEASE_TARGET: production
      RELEASE_COMMIT_SHA: ${{ inputs.release_sha }}
      RELEASE_BUILD_SHA: ${{ inputs.release_sha }}
      RELEASE_RUN_OBSERVABILITY_SMOKE: 'true'

      # Safe production coordinates may be admitted at job scope. Protected
      # secret values are deliberately scoped to the consuming steps below,
      # after the post-approval exact-main revalidation has succeeded.
      PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
      RELEASE_PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
      RELEASE_DEPLOYMENT_URL: ${{ vars.PRODUCTION_URL }}
      NEXT_PUBLIC_APP_URL: ${{ vars.PRODUCTION_URL }}
      NEXT_PUBLIC_SITE_URL: ${{ vars.PRODUCTION_URL }}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}

      STRIPE_PRICE_STARTER_MONTHLY: ${{ vars.STRIPE_PRICE_STARTER_MONTHLY }}
      STRIPE_PRICE_GROWTH_MONTHLY: ${{ vars.STRIPE_PRICE_GROWTH_MONTHLY }}
      STRIPE_PRICE_ENTERPRISE_MONTHLY: ${{ vars.STRIPE_PRICE_ENTERPRISE_MONTHLY }}
      STRIPE_PRICE_ESSENTIAL_MONTHLY: ${{ vars.STRIPE_PRICE_ESSENTIAL_MONTHLY }}
      STRIPE_PRICE_ESSENTIAL_ANNUAL: ${{ vars.STRIPE_PRICE_ESSENTIAL_ANNUAL }}
      STRIPE_PRICE_PROFESSIONAL_MONTHLY: ${{ vars.STRIPE_PRICE_PROFESSIONAL_MONTHLY }}
      STRIPE_PRICE_PROFESSIONAL_ANNUAL: ${{ vars.STRIPE_PRICE_PROFESSIONAL_ANNUAL }}
      STRIPE_PRICE_BUSINESS_MONTHLY: ${{ vars.STRIPE_PRICE_BUSINESS_MONTHLY }}
      STRIPE_PRICE_BUSINESS_ENTERPRISE_MONTHLY: ${{ vars.STRIPE_PRICE_BUSINESS_ENTERPRISE_MONTHLY }}

      SENTRY_ORG: ${{ vars.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}

      RELEASE_ROLLBACK_TARGET: ${{ vars.RELEASE_ROLLBACK_TARGET }}
      RELEASE_ROLLBACK_TARGET_URL: ${{ vars.RELEASE_ROLLBACK_TARGET_URL }}
      LAST_KNOWN_GOOD_DEPLOYMENT_URL: ${{ vars.LAST_KNOWN_GOOD_DEPLOYMENT_URL }}
      RELEASE_ROLLBACK_TARGET_SHA: ${{ vars.RELEASE_ROLLBACK_TARGET_SHA }}
      RELEASE_ROLLBACK_TARGET_COMMIT_SHA: ${{ vars.RELEASE_ROLLBACK_TARGET_SHA }}
      LAST_KNOWN_GOOD_COMMIT_SHA: ${{ vars.LAST_KNOWN_GOOD_COMMIT_SHA }}
      RELEASE_ROLLBACK_TARGET_VALIDATED: ${{ vars.RELEASE_ROLLBACK_TARGET_VALIDATED }}
    steps:
      - name: Revalidate exact current main after environment approval
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          test "$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')" = "${TARGET_SHA,,}"
          test -n "$RELEASE_PRODUCTION_URL"

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Run public production final validation
        env:
          HEALTHCHECK_TOKEN: ${{ secrets.READINESS_TOKEN }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
        run: npm run release:production-final

      - name: Run authenticated production journey smoke
        env:
          HEALTHCHECK_TOKEN: ${{ secrets.READINESS_TOKEN }}
          TEST_USER_A_EMAIL: ${{ secrets.TEST_USER_A_EMAIL }}
          TEST_USER_A_PASSWORD: ${{ secrets.TEST_USER_A_PASSWORD }}
          TEST_USER_B_EMAIL: ${{ secrets.TEST_USER_B_EMAIL }}
          TEST_USER_B_PASSWORD: ${{ secrets.TEST_USER_B_PASSWORD }}
        run: node scripts/release/run-authenticated-production-smoke.mjs

      - name: Promote canonical production observability evidence
        env:
          HEALTHCHECK_TOKEN: ${{ secrets.READINESS_TOKEN }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
        run: node scripts/release/run-production-observability-validation.mjs

      - name: Stamp workflow provenance
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release/stamp-runtime-closeout-provenance.mjs \
            docs/security/evidence/runtime \
            "$TARGET_SHA" \
            "$GITHUB_RUN_ID" \
            "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Validate consolidated closeout
        run: node scripts/release/validate-enterprise-runtime-closeout.mjs docs/security/evidence/runtime artifacts/enterprise-runtime-closeout

      - name: Upload immutable closeout bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: enterprise-runtime-closeout-${{ env.TARGET_SHA }}
          path: |
            docs/security/evidence/runtime
            artifacts/enterprise-runtime-closeout
          if-no-files-found: error
          retention-days: 90
