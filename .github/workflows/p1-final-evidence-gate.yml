name: P1 Final Evidence Gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'docs/security/evidence/p1/**.json'
      - 'docs/security/evidence/p1/P1_PROGRESS.md'
      - 'scripts/security/check-p1-evidence-index.mjs'
      - 'scripts/security/report-p1-evidence-gap.mjs'
      - 'scripts/security/generate-p1-progress-dashboard.mjs'
      - '.github/workflows/p1-final-evidence-gate.yml'

permissions:
  contents: read

jobs:
  p1-final-evidence-gate:
    name: Validate final P1 evidence
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate P1 evidence index
        run: node scripts/security/check-p1-evidence-index.mjs

      - name: Report P1 evidence gap
        run: node scripts/security/report-p1-evidence-gap.mjs

      - name: Validate generated P1 progress dashboard
        run: |
          node scripts/security/generate-p1-progress-dashboard.mjs
          git diff --exit-code docs/security/evidence/p1/P1_PROGRESS.md

      - name: Enforce final P1 evidence only when declared complete
        if: github.event_name == 'workflow_dispatch'
        run: |
          node scripts/security/check-p1-evidence-index.mjs --strict
          node scripts/security/report-p1-evidence-gap.mjs --strict
