name: Final Technical Controls Proof

run-name: Final technical controls proof for ${{ inputs.release_sha }}

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full current main SHA
        required: true
        type: string
      confirmation:
        description: Type EXECUTE_FINAL_TECHNICAL_PROOF
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: final-technical-controls-proof-${{ inputs.release_sha }}
  cancel-in-progress: false

jobs:
  prove-final-technical-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: production-final-technical-proof
    env:
      ENTERPRISE_EXPECTED_SHA: ${{ inputs.release_sha }}
      FINAL_TECHNICAL_CONFIRMATION: ${{ inputs.confirmation }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Validate requested SHA and confirmation
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ENTERPRISE_EXPECTED_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          test "$FINAL_TECHNICAL_CONFIRMATION" = "EXECUTE_FINAL_TECHNICAL_PROOF"
          echo "ENTERPRISE_EXPECTED_SHA=${ENTERPRISE_EXPECTED_SHA,,}" >> "$GITHUB_ENV"
      - name: Checkout exact current main SHA
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ inputs.release_sha }}
          persist-credentials: false
      - name: Verify exact current main checkout
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$ENTERPRISE_EXPECTED_SHA"
          test "$(git rev-parse origin/main)" = "$ENTERPRISE_EXPECTED_SHA"
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - name: Set up pinned Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520
        with:
          version: 2.101.0
      - name: Install deterministic dependencies
        run: npm ci --ignore-scripts
      - name: Verify runner PostgreSQL client without network installation
        run: node scripts/recovery/verify-postgresql-client.mjs
      - name: Start exact-SHA disposable Supabase project database
        run: node scripts/recovery/run-reviewed-ephemeral-schema-boundary-v4.mjs
      - name: Preflight protected final technical proof
        run: node scripts/security/preflight-protected-proof.mjs final-technical
      - name: Execute protected final technical proof
        run: node scripts/security/run-final-technical-controls-proof.mjs
      - name: Remove disposable recovery database
        if: always()
        run: node scripts/recovery/manage-ephemeral-recovery-database.mjs stop
      - name: Upload redacted proof evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: final-technical-controls-proof-${{ env.ENTERPRISE_EXPECTED_SHA }}
          path: |
            docs/security/evidence/runtime/final-technical-controls-preflight.json
            docs/security/evidence/runtime/final-technical-controls-validation.json
          if-no-files-found: error
          retention-days: 90
