name: Auth Onboarding Billing Runtime Proof

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact 40-character SHA currently at main
        required: true
        type: string
      target_environment:
        description: Target environment label
        required: true
        type: choice
        options: [staging, production]
      organization_id:
        description: Pre-authorized organization UUID to observe
        required: true
        type: string
      stripe_event_id:
        description: Successfully processed Stripe event ID
        required: true
        type: string
      expected_plan:
        description: Expected canonical subscription and onboarding plan
        required: true
        type: string
      confirmation:
        description: Type PROVE_AUTH_ONBOARDING_BILLING_RUNTIME
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: auth-onboarding-billing-runtime-${{ inputs.target_environment }}
  cancel-in-progress: false

jobs:
  prove:
    name: Prove auth onboarding billing runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: ${{ inputs.target_environment }}
    env:
      RELEASE_SHA: ${{ inputs.release_sha }}
      TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
      ORGANIZATION_ID: ${{ inputs.organization_id }}
      STRIPE_EVENT_ID: ${{ inputs.stripe_event_id }}
      EXPECTED_PLAN: ${{ inputs.expected_plan }}
      REPOSITORY: ${{ github.repository }}
      SUPABASE_DB_POOLER_URL: ${{ secrets.SUPABASE_DB_POOLER_URL }}
      PGSSLMODE: require

    steps:
      - name: Check out trusted main
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Authorize exact release and bounded inputs
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          main_sha="$(git rev-parse origin/main)"
          [[ "$RELEASE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          test "${RELEASE_SHA,,}" = "$main_sha"
          test "$(git rev-parse HEAD)" = "$main_sha"
          test "${{ inputs.confirmation }}" = "PROVE_AUTH_ONBOARDING_BILLING_RUNTIME"
          [[ "$ORGANIZATION_ID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$ ]]
          [[ "$STRIPE_EVENT_ID" =~ ^evt_[A-Za-z0-9]+$ ]]
          [[ "$EXPECTED_PLAN" =~ ^[a-z][a-z0-9_-]{1,119}$ ]]
          test -n "$SUPABASE_DB_POOLER_URL"
          case "$SUPABASE_DB_POOLER_URL" in
            postgresql://*|postgres://*) ;;
            *) echo "SUPABASE_DB_POOLER_URL must be a PostgreSQL URI" >&2; exit 1 ;;
          esac

      - name: Install PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y postgresql-client

      - name: Collect read-only runtime observation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/auth-onboarding-billing-runtime-proof
          psql "$SUPABASE_DB_POOLER_URL" \
            --set ON_ERROR_STOP=1 \
            --tuples-only \
            --no-align \
            --set organization_id="$ORGANIZATION_ID" \
            --set stripe_event_id="$STRIPE_EVENT_ID" \
            --set expected_plan="$EXPECTED_PLAN" \
            --file scripts/identity/auth-onboarding-billing-runtime-proof.sql \
            > artifacts/auth-onboarding-billing-runtime-proof/raw.json
          test -s artifacts/auth-onboarding-billing-runtime-proof/raw.json

      - name: Build sanitized evidence
        run: node scripts/identity/build-auth-onboarding-billing-evidence.mjs

      - name: Remove raw database observation
        shell: bash
        run: rm -f artifacts/auth-onboarding-billing-runtime-proof/raw.json

      - name: Reject sensitive artifact content
        shell: bash
        run: |
          set -euo pipefail
          test ! -e artifacts/auth-onboarding-billing-runtime-proof/raw.json
          ! grep -RIE 'postgres(ql)?://|supabase\.co|service[_-]?role|whsec_|(sk|rk|pk)_(live|test)_' artifacts/auth-onboarding-billing-runtime-proof

      - name: Publish bounded summary
        shell: bash
        run: cat artifacts/auth-onboarding-billing-runtime-proof/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload retained evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: auth-onboarding-billing-runtime-proof-${{ inputs.release_sha }}
          path: |
            artifacts/auth-onboarding-billing-runtime-proof/evidence.json
            artifacts/auth-onboarding-billing-runtime-proof/summary.md
          retention-days: 90
          if-no-files-found: error

      - name: Enforce runtime decision
        run: node scripts/identity/check-auth-onboarding-billing-evidence.mjs
