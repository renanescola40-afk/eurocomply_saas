name: P1 Restore Test Evidence

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'docs/security/evidence/p1/restore-tested.json'
      - 'docs/security/evidence/p1/restore-tested.template.json'
      - 'docs/security/P1_RESTORE_TEST_USAGE.md'
      - 'scripts/security/check-p1-restore-test-evidence.mjs'
      - '.github/workflows/p1-restore-test.yml'

permissions:
  contents: read

jobs:
  p1-restore-test:
    name: Validate P1 restore test evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Show runner Node.js and npm versions
        run: |
          node --version
          npm --version

      - name: Validate P1 restore test evidence if present
        run: node scripts/security/check-p1-restore-test-evidence.mjs
