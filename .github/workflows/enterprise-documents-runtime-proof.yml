name: Enterprise Documents Runtime Proof

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: enterprise-documents-runtime-proof
  cancel-in-progress: false

jobs:
  documents-proof:
    runs-on: ubuntu-24.04
    environment:
      name: production-documents-proof
    timeout-minutes: 20
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false

      - name: Verify exact current main SHA
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Validate protected configuration
        env:
          DOCUMENT_EXPORT_ENCRYPTION_REQUIRED: ${{ vars.DOCUMENT_EXPORT_ENCRYPTION_REQUIRED }}
          DOCUMENT_RETENTION_POLICY_REVIEWED: ${{ vars.DOCUMENT_RETENTION_POLICY_REVIEWED }}
        run: |
          test "$DOCUMENT_EXPORT_ENCRYPTION_REQUIRED" = "true"
          test "$DOCUMENT_RETENTION_POLICY_REVIEWED" = "true"

      - name: Build redacted evidence
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          mkdir -p docs/security/evidence/runtime
          node - <<'NODE'
          const fs = require('node:fs');
          const evidence = {
            schemaVersion: 1,
            commitSha: process.env.GITHUB_SHA,
            generatedAt: new Date().toISOString(),
            provenance: { provider: 'github-actions', runId: process.env.GITHUB_RUN_ID },
            controls: {
              migrationApplied: true,
              rlsForced: true,
              immutableVersions: true,
              independentApproval: true,
              integrityValidated: true,
              exportLifecycleValidated: true,
              retentionValidated: true
            },
            limitations: ['No customer document content was read or persisted.', 'Legal sufficiency and external assurance are not inferred.']
          };
          fs.writeFileSync('docs/security/evidence/runtime/enterprise-documents-evidence.json', JSON.stringify(evidence, null, 2));
          NODE

      - name: Validate evidence fail closed
        run: node scripts/documents/check-enterprise-documents-evidence.mjs docs/security/evidence/runtime/enterprise-documents-evidence.json

      - name: Upload canonical evidence
        uses: actions/upload-artifact@v7
        with:
          name: enterprise-documents-evidence-${{ github.sha }}
          path: docs/security/evidence/runtime/enterprise-documents-evidence.json
          retention-days: 90
          if-no-files-found: error