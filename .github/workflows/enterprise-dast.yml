name: Enterprise DAST

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: enterprise-dast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zap-baseline:
    name: OWASP ZAP production-like baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact assessed SHA
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false

      - name: Verify exact assessed SHA
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies deterministically
        run: npm ci --ignore-scripts

      - name: Build exact SHA
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: public-placeholder-anon-key
          NEXT_PUBLIC_ANALYTICS_REQUIRE_CONSENT: 'true'
          NEXT_PUBLIC_POSTHOG_KEY: phc_ci_synthetic_public_key
          NEXT_PUBLIC_POSTHOG_HOST: https://analytics-ci.invalid
        run: npm run build

      - name: Start production-like server
        shell: bash
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: public-placeholder-anon-key
          NEXT_PUBLIC_ANALYTICS_REQUIRE_CONSENT: 'true'
          NEXT_PUBLIC_POSTHOG_KEY: phc_ci_synthetic_public_key
          NEXT_PUBLIC_POSTHOG_HOST: https://analytics-ci.invalid
          PORT: '3000'
        run: |
          set -euo pipefail
          npm start > /tmp/enterprise-dast-server.log 2>&1 &
          echo $! > /tmp/enterprise-dast-server.pid
          for _attempt in $(seq 1 60); do
            if curl --fail --silent --show-error --max-time 2 http://127.0.0.1:3000/en >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/enterprise-dast-server.log
          exit 1

      - name: Run OWASP ZAP baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dast-report
          chmod 0777 dast-report
          docker pull ghcr.io/zaproxy/zaproxy:2.16.1
          set +e
          docker run --rm --network host \
            -v "${{ github.workspace }}/dast-report:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:2.16.1 \
            zap-baseline.py \
              -t http://127.0.0.1:3000/en \
              -m 2 \
              -r enterprise-dast.html \
              -J enterprise-dast.json \
              -w enterprise-dast.md \
              -x enterprise-dast.xml \
              -I
          zap_exit=$?
          set -e
          if [ "$zap_exit" -gt 2 ]; then
            echo "ZAP execution failed with exit code $zap_exit" >&2
            exit "$zap_exit"
          fi

      - name: Enforce High-risk alert threshold
        shell: bash
        run: |
          set -euo pipefail
          test -s dast-report/enterprise-dast.json
          node <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('dast-report/enterprise-dast.json', 'utf8'));
          const alerts = (report.site ?? []).flatMap((site) => site.alerts ?? []);
          const high = alerts.filter((alert) => Number(alert.riskcode) >= 3);
          const summary = {
            schema: 'risck-comply.dast-summary.v1',
            tool: 'OWASP ZAP Baseline',
            assessedSha: process.env.TARGET_SHA,
            highRiskAlertCount: high.length,
            mediumRiskAlertCount: alerts.filter((alert) => Number(alert.riskcode) === 2).length,
            lowRiskAlertCount: alerts.filter((alert) => Number(alert.riskcode) === 1).length,
            informationalAlertCount: alerts.filter((alert) => Number(alert.riskcode) === 0).length,
            passed: high.length === 0,
          };
          fs.writeFileSync('dast-report/enterprise-dast-summary.json', `${JSON.stringify(summary, null, 2)}\n`);
          if (high.length > 0) {
            console.error(`DAST found ${high.length} High-risk alert(s).`);
            process.exit(1);
          }
          NODE
          sha256sum dast-report/enterprise-dast.json dast-report/enterprise-dast-summary.json \
            > dast-report/enterprise-dast.sha256

      - name: Upload DAST diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: enterprise-dast-${{ env.TARGET_SHA }}
          path: |
            dast-report/enterprise-dast-summary.json
            dast-report/enterprise-dast.json
            dast-report/enterprise-dast.md
            dast-report/enterprise-dast.xml
            dast-report/enterprise-dast.html
            dast-report/enterprise-dast.sha256
            /tmp/enterprise-dast-server.log
          if-no-files-found: warn
          retention-days: 30

      - name: Stop production-like server
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/enterprise-dast-server.pid ]; then
            kill "$(cat /tmp/enterprise-dast-server.pid)" 2>/dev/null || true
          fi
