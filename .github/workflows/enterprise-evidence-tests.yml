name: Enterprise Evidence Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: read
  pull-requests: read
  checks: read
  statuses: read

concurrency:
  group: enterprise-evidence-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evidence-tests:
    name: Validate enterprise evidence contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact tested SHA
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # Gate acceptance binds a reviewed source ancestor to this exact CI HEAD.
          # A shallow checkout cannot verify that ancestry; do not weaken the gate.
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: npm

      - name: Install deterministic dependencies
        run: npm ci --ignore-scripts

      - name: Validate G1 evidence factory contracts
        env:
          EVIDENCE_EXACT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVIDENCE_PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVIDENCE_EXACT_SHA" || {
            echo "Evidence validation refused: checkout differs from current workflow SHA" >&2
            exit 1
          }
          node --test tests/ci/enterprise-evidence-exact-sha-contract.test.mjs
          node --test tests/enterprise-evidence/validate-evidence.test.mjs
          node --test tests/enterprise-evidence/a19-acceptance.test.mjs
          node --test tests/enterprise-evidence/privacy-lead-capture-carry.test.mjs
          node --test tests/enterprise-evidence/netlify-qa-preview-carry.test.mjs
          node --test tests/enterprise-evidence/prelaunch-intake-source-carry.test.mjs
          node --test tests/enterprise-evidence/privacy-safe-marketing-carry.test.mjs
          node --test tests/enterprise-evidence/netlify-manual-draft-carry.test.mjs
          node --test tests/enterprise-evidence/ai-inventory-completeness-carry.test.mjs
          node --test tests/enterprise-evidence/netlify-remote-draft-carry.test.mjs
          node --test tests/enterprise-evidence/ai-inventory-save-recovery-carry.test.mjs
          node --test tests/enterprise-evidence/sec01-qa-dsar-mfa-carry.test.mjs
          node --test tests/enterprise-evidence/sec04-privileged-rpc-acl-carry.test.mjs
          node --test tests/enterprise-evidence/netlify-local-qa-build-carry.test.mjs
          node --test tests/enterprise-evidence/bil02-stripe-netlify-qa-carry.test.mjs
          node --test tests/enterprise-evidence/sec01-aal1-bootstrap-draft-carry.test.mjs
          node --test tests/enterprise-evidence/billing-invoice-tenant-binding-carry.test.mjs
          node --test tests/enterprise-evidence/netlify-git-preview-isolated-carry.test.mjs
          node --test tests/enterprise-evidence/sec01-identity-mfa-setup-carry.test.mjs
          node --test tests/enterprise-evidence/fun-qa-private-aal2-assertion-carry.test.mjs
          node --test tests/enterprise-evidence/public-recovery-static-carry.test.mjs
          node --test tests/enterprise-evidence/sec01-no-admin-mfa-carry.test.mjs
          node --test tests/enterprise-evidence/sec01-qa-only-mfa-auth-write-carry.test.mjs
          node --test tests/enterprise-evidence/sec01-qa-provider-runner-carry.test.mjs
          node --test tests/enterprise-evidence/sec01-revoked-session-rls-review-carry.test.mjs
          node --test tests/enterprise-evidence/bil03-paid-entitlement-carry.test.mjs
          node --test tests/enterprise-evidence/sec01-qa-mfa-actions-carry.test.mjs
          node --test tests/enterprise-evidence/sec01-qa-preflight-diagnostics-carry.test.mjs
          node --test tests/enterprise-evidence/sec01-qa-app-browser-carry.test.mjs
          node --test tests/enterprise-evidence/sec01-browser-positive-login-carry.test.mjs
          node --test tests/enterprise-evidence/sec01-browser-same-form-carry.test.mjs
          node --test tests/enterprise-evidence/sec01-profile-identity-carry.test.mjs
          node --test tests/enterprise-evidence/sec01-signed-session-id-carry.test.mjs
          node --test tests/enterprise-evidence/sec01-v2-bootstrap-rpc-carry.test.mjs
          node --test tests/enterprise-evidence/sec01-qa-organization-sso-carry.test.mjs
          node --test tests/enterprise-evidence/sec01-qa-inventory-transaction-carry.test.mjs
          node --test tests/enterprise-evidence/sec01-qa-profile-auth-proof-carry.test.mjs
          node --test tests/enterprise-evidence/sec01-qa-browser-aal2-organization-carry.test.mjs
          node --test tests/enterprise-evidence/sec01-qa-inventory-attestation-carry.test.mjs
          node --test tests/enterprise-evidence/sec01-circleci-heredoc-carry.test.mjs
          node --test scripts/check-netlify-preview.test.mjs scripts/qa-environment-guard.test.mjs
          node --test tests/security/sec01-aal1-bootstrap-draft-contract.test.mjs
          node --test tests/billing/qa-stripe-test-ledger.test.mjs
          node --test scripts/qa-environment-guard.test.mjs scripts/check-netlify-preview.test.mjs
          node scripts/enterprise-evidence/validate-evidence.mjs --report

      - name: Generate exact-SHA SHA-256 evidence manifest
        env:
          EVIDENCE_EXACT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVIDENCE_SHA256_OUTPUT: artifacts/enterprise-readiness/EVIDENCE_SHA256_MANIFEST.json
        run: |
          node scripts/enterprise-evidence/generate-sha256-manifest.mjs \
            docs/enterprise/evidence/ENTERPRISE_EVIDENCE_MASTER_INDEX.json \
            docs/enterprise/evidence/ENTERPRISE_38_CONTROL_MATRIX.json \
            docs/enterprise/evidence/ENTERPRISE_24_GATE_MATRIX.json \
            docs/enterprise/evidence/PROVIDER_READBACK_SUPABASE_MIGRATION_PARITY_2026-11-01.json \
            docs/enterprise/evidence/PROVIDER_READBACK_SUPABASE_RLS_FORCE_GRANTS_2026-11-01.json \
            docs/enterprise/evidence/PROVIDER_READBACK_VERCEL_PRODUCTION_IDENTITY_2026-11-01.json \
            docs/enterprise/evidence/schemas/enterprise-evidence-record.schema.json \
            scripts/enterprise-evidence/validate-evidence.mjs \
            tests/enterprise-evidence/validate-evidence.test.mjs

      - name: Run enterprise evidence tests with retained diagnostics
        id: evidence_tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/enterprise-readiness
          set +e
          npx vitest run \
            tests/enterprise/enterprise-readiness-scorecard.test.ts \
            tests/enterprise/enterprise-readiness-scorecard-stabilizer.test.ts \
            tests/enterprise/evidence-overrides-guard.test.ts \
            tests/enterprise/architecture-review-evidence.test.ts \
            tests/enterprise/incident-operations-evidence.test.ts \
            tests/enterprise/centralized-logging-alert-evidence.test.ts \
            tests/enterprise/public-ux-evidence.test.ts \
            tests/enterprise/accessibility-consent-evidence.test.ts \
            tests/enterprise/repository-control-evidence.test.ts \
            tests/enterprise/admin-boundary-diagnostics.test.ts \
            tests/enterprise/account-recovery-evidence.test.ts \
            tests/enterprise/provider-failure-evidence.test.ts \
            tests/enterprise/step-up-evidence.test.ts \
            tests/enterprise/auth-rbac-runtime-evidence-fetch.test.ts \
            tests/enterprise/supabase-rls-runtime-evidence-fetch.test.ts \
            tests/enterprise/branch-protection-runtime-evidence-fetch.test.ts \
            tests/security/supabase-rls-scorecard-evidence.test.ts \
            tests/release/production-runtime-scorecard-evidence.test.ts \
            2>&1 | tee artifacts/enterprise-readiness/enterprise-evidence-tests.log
          TEST_STATUS=${PIPESTATUS[0]}
          set -e
          echo "status=$TEST_STATUS" >> "$GITHUB_OUTPUT"

      - name: Upload enterprise evidence test diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: enterprise-evidence-test-diagnostics-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            artifacts/enterprise-readiness/enterprise-evidence-tests.log
            artifacts/enterprise-readiness/EVIDENCE_SHA256_MANIFEST.json
            artifacts/enterprise-evidence-factory/progress-report.json
          if-no-files-found: error
          retention-days: 30

      - name: Enforce enterprise evidence tests passed
        if: steps.evidence_tests.outputs.status != '0'
        run: |
          echo "Enterprise evidence contract tests failed. Review the retained diagnostic artifact." >&2
          exit 1
