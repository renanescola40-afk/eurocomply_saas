name: Stripe Runtime Proof Contract

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/stripe-entitlement-runtime-proof.yml'
      - '.github/workflows/stripe-runtime-proof-contract.yml'
      - 'scripts/enterprise/stripe-runtime-proof.sql'
      - 'scripts/enterprise/build-stripe-runtime-proof.mjs'
      - 'tests/enterprise/stripe-runtime-proof-contract.test.ts'
      - 'tests/security/stripe-runtime-proof-workflow.test.ts'
      - 'docs/enterprise/STRIPE_ENTITLEMENT_RUNTIME_PROOF.md'
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: stripe-runtime-proof-contract-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false
      - run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx vitest run tests/enterprise/stripe-runtime-proof-contract.test.ts tests/security/stripe-runtime-proof-workflow.test.ts
