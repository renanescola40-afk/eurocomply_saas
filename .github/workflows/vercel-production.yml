name: Vercel Production Deploy

run-name: Production deploy for ${{ inputs.release_sha }}

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact 40-character SHA currently at the tip of main
        required: true
        type: string
      confirmation:
        description: Type DEPLOY_PRODUCTION to authorize the protected production job
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: vercel-production-${{ inputs.release_sha }}
  cancel-in-progress: false

jobs:
  authorize-release:
    name: Authorize exact current-main SHA
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate explicit production authorization
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          PRODUCTION_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "release_sha must be a full 40-character Git SHA" >&2
            exit 1
          fi
          if [ "$PRODUCTION_CONFIRMATION" != "DEPLOY_PRODUCTION" ]; then
            echo "confirmation must exactly match DEPLOY_PRODUCTION" >&2
            exit 1
          fi
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "production deployment must be dispatched from refs/heads/main" >&2
            exit 1
          fi

      - name: Check out trusted main history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release SHA is the current main tip
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git cat-file -e "${RELEASE_SHA}^{commit}"
          test "$(git rev-parse origin/main)" = "${RELEASE_SHA,,}"

  deploy-production:
    name: P0 gates and deploy exact SHA to Vercel production
    needs: authorize-release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production

    env:
      RELEASE_SHA: ${{ inputs.release_sha }}
      VERCEL_CLI_VERSION: '56.3.2'
      RELEASE_TARGET: ${{ vars.RELEASE_TARGET }}
      NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
      TRUSTED_ORIGINS: ${{ vars.TRUSTED_ORIGINS }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets['NEXT_PUBLIC_SUPABASE_URL'] }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets['NEXT_PUBLIC_SUPABASE_ANON_KEY'] }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets['SUPABASE_SERVICE_ROLE_KEY'] }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets['SUPABASE_ACCESS_TOKEN'] }}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
      STRIPE_SECRET_KEY: ${{ secrets['STRIPE_SECRET_KEY'] }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets['STRIPE_WEBHOOK_SECRET'] }}
      STRIPE_PRICE_ESSENTIAL_MONTHLY: ${{ vars.STRIPE_PRICE_ESSENTIAL_MONTHLY }}
      STRIPE_PRICE_PROFESSIONAL_MONTHLY: ${{ vars.STRIPE_PRICE_PROFESSIONAL_MONTHLY }}
      STRIPE_PRICE_BUSINESS_MONTHLY: ${{ vars.STRIPE_PRICE_BUSINESS_MONTHLY }}
      RESEND_API_KEY: ${{ secrets['RESEND_API_KEY'] }}
      HEALTHCHECK_TOKEN: ${{ secrets['HEALTHCHECK_TOKEN'] }}
      EVIDENCE_PACK_SIGNING_SECRET: ${{ secrets['EVIDENCE_PACK_SIGNING_SECRET'] }}
      AUDIT_CHAIN_SIGNING_SECRET: ${{ secrets['AUDIT_CHAIN_SIGNING_SECRET'] }}
      STEP_UP_SIGNING_SECRET: ${{ secrets['STEP_UP_SIGNING_SECRET'] }}
      CRON_SECRET: ${{ secrets['CRON_SECRET'] }}
      INTERNAL_CRON_SECRET: ${{ secrets['INTERNAL_CRON_SECRET'] }}
      UPSTASH_REDIS_REST_URL: ${{ secrets['UPSTASH_REDIS_REST_URL'] }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets['UPSTASH_REDIS_REST_TOKEN'] }}
      REQUIRE_MALWARE_SCAN_FOR_UPLOADS: ${{ vars.REQUIRE_MALWARE_SCAN_FOR_UPLOADS }}
      MALWARE_SCANNER_PROVIDER: ${{ vars.MALWARE_SCANNER_PROVIDER }}
      MALWARE_SCANNER_ENDPOINT: ${{ secrets['MALWARE_SCANNER_ENDPOINT'] }}
      MALWARE_SCANNER_URL: ${{ secrets['MALWARE_SCANNER_URL'] }}
      MALWARE_SCANNER_API_KEY: ${{ secrets['MALWARE_SCANNER_API_KEY'] }}
      MALWARE_SCANNER_CLAMAV_HOST: ${{ secrets['MALWARE_SCANNER_CLAMAV_HOST'] }}
      MALWARE_SCANNER_CLAMAV_PORT: ${{ vars.MALWARE_SCANNER_CLAMAV_PORT }}
      MALWARE_SCANNER_TIMEOUT_MS: ${{ vars.MALWARE_SCANNER_TIMEOUT_MS }}
      NEXT_PUBLIC_SENTRY_DSN: ${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
      SENTRY_DSN: ${{ secrets['SENTRY_DSN'] }}
      SENTRY_ORG: ${{ vars.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
      SENTRY_AUTH_TOKEN: ${{ secrets['SENTRY_AUTH_TOKEN'] }}
      VERCEL_TOKEN: ${{ secrets['VERCEL_TOKEN'] }}
      VERCEL_ORG_ID: ${{ secrets['VERCEL_ORG_ID'] }}
      VERCEL_PROJECT_ID: ${{ secrets['VERCEL_PROJECT_ID'] }}

    steps:
      - name: Check out exact release SHA
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact checkout and current main before gates
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${RELEASE_SHA,,}"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "${RELEASE_SHA,,}"

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dcba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies deterministically
        run: npm ci

      - name: Run lint gate
        run: npm run lint

      - name: Run typecheck gate
        run: npm run typecheck

      - name: Run test gate
        run: npm run test

      - name: Run build gate
        run: npm run build

      - name: Run full security CI gate
        run: npm run security:ci

      - name: Run route quality gate
        run: npm run quality:routes

      - name: Run Vercel production environment readiness gate
        run: npm run ops:vercel-readiness

      - name: Run release readiness gate
        run: npm run release:readiness

      - name: Run enterprise readiness gate
        if: env.RELEASE_TARGET == 'enterprise'
        run: npm run release:enterprise-readiness

      - name: Pull Vercel production environment
        run: npx --yes "vercel@${VERCEL_CLI_VERSION}" pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build Vercel production artifact
        run: npx --yes "vercel@${VERCEL_CLI_VERSION}" build --prod --token="$VERCEL_TOKEN"

      - name: Reverify current main immediately before production deployment
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${RELEASE_SHA,,}"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "${RELEASE_SHA,,}"

      - name: Deploy prebuilt artifact to Vercel production
        run: npx --yes "vercel@${VERCEL_CLI_VERSION}" deploy --prebuilt --prod --token="$VERCEL_TOKEN"
