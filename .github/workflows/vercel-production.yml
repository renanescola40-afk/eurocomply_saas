name: Vercel Production Deploy

run-name: Production deploy for ${{ inputs.release_sha }}

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact 40-character SHA currently at the tip of main
        required: true
        type: string
      confirmation:
        description: Type DEPLOY_PRODUCTION to authorize the protected production job
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: vercel-production-${{ inputs.release_sha }}
  cancel-in-progress: false

jobs:
  authorize-release:
    name: Authorize exact current-main SHA
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate explicit production authorization
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          PRODUCTION_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "release_sha must be a full 40-character Git SHA" >&2
            exit 1
          fi
          if [ "$PRODUCTION_CONFIRMATION" != "DEPLOY_PRODUCTION" ]; then
            echo "confirmation must exactly match DEPLOY_PRODUCTION" >&2
            exit 1
          fi
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "production deployment must be dispatched from refs/heads/main" >&2
            exit 1
          fi

      - name: Check out trusted main history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release SHA is the current main tip
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git cat-file -e "${RELEASE_SHA}^{commit}"
          test "$(git rev-parse origin/main)" = "${RELEASE_SHA,,}"

      - name: Verify Production environment governance before protected secrets
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_ENVIRONMENT_NAME: Production
          REQUIRE_PROTECTED_BRANCHES: 'true'
        run: node scripts/security/check-github-environment-governance.mjs

  deploy-production:
    name: P0 gates and deploy exact SHA to Vercel production
    needs: authorize-release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production

    env:
      RELEASE_SHA: ${{ inputs.release_sha }}
      VERCEL_CLI_VERSION: '56.3.2'
      RELEASE_TARGET: ${{ vars.RELEASE_TARGET }}
      NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
      TRUSTED_ORIGINS: ${{ vars.TRUSTED_ORIGINS }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets['NEXT_PUBLIC_SUPABASE_URL'] }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets['NEXT_PUBLIC_SUPABASE_ANON_KEY'] }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets['SUPABASE_SERVICE_ROLE_KEY'] }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets['SUPABASE_ACCESS_TOKEN'] }}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
      STRIPE_SECRET_KEY: ${{ secrets['STRIPE_SECRET_KEY'] }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets['STRIPE_WEBHOOK_SECRET'] }}
      STRIPE_PRICE_ESSENTIAL_MONTHLY: ${{ vars.STRIPE_PRICE_ESSENTIAL_MONTHLY }}
      STRIPE_PRICE_ESSENTIAL_ANNUAL: ${{ vars.STRIPE_PRICE_ESSENTIAL_ANNUAL }}
      STRIPE_PRICE_PROFESSIONAL_MONTHLY: ${{ vars.STRIPE_PRICE_PROFESSIONAL_MONTHLY }}
      STRIPE_PRICE_PROFESSIONAL_ANNUAL: ${{ vars.STRIPE_PRICE_PROFESSIONAL_ANNUAL }}
      STRIPE_PRICE_BUSINESS_MONTHLY: ${{ vars.STRIPE_PRICE_BUSINESS_MONTHLY }}
      RESEND_API_KEY: ${{ secrets['RESEND_API_KEY'] }}
      EMAIL_FROM: ${{ vars.EMAIL_FROM }}
      REQUIRE_TRANSACTIONAL_EMAIL_DELIVERY: 'true'
      ENABLE_DASHBOARD_METRIC_SNAPSHOTS: 'false'
      HEALTHCHECK_TOKEN: ${{ secrets['HEALTHCHECK_TOKEN'] }}
      EVIDENCE_PACK_SIGNING_SECRET: ${{ secrets['EVIDENCE_PACK_SIGNING_SECRET'] }}
      AUDIT_CHAIN_SIGNING_SECRET: ${{ secrets['AUDIT_CHAIN_SIGNING_SECRET'] }}
      STEP_UP_PROVIDER_MODE: supabase_mfa
      STEP_UP_SIGNING_SECRET: ${{ secrets['STEP_UP_ASSERTION_SIGNING_SECRET'] || secrets['STEP_UP_SIGNING_SECRET'] }}
      CRON_SECRET: ${{ secrets['CRON_SECRET'] }}
      INTERNAL_CRON_SECRET: ${{ secrets['INTERNAL_CRON_SECRET'] }}
      UPSTASH_REDIS_REST_URL: ${{ secrets['UPSTASH_REDIS_REST_URL'] }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets['UPSTASH_REDIS_REST_TOKEN'] }}
      REQUIRE_MALWARE_SCAN_FOR_UPLOADS: ${{ vars.REQUIRE_MALWARE_SCAN_FOR_UPLOADS }}
      MALWARE_SCANNER_PROVIDER: ${{ vars.MALWARE_SCANNER_PROVIDER }}
      MALWARE_SCANNER_ENDPOINT: ${{ secrets['MALWARE_SCANNER_ENDPOINT'] }}
      MALWARE_SCANNER_URL: ${{ secrets['MALWARE_SCANNER_URL'] }}
      MALWARE_SCANNER_API_KEY: ${{ secrets['MALWARE_SCANNER_API_KEY'] }}
      MALWARE_SCANNER_ALLOWED_HOSTS: ${{ vars.MALWARE_SCANNER_ALLOWED_HOSTS }}
      MALWARE_SCANNER_CLAMAV_HOST: ${{ secrets['MALWARE_SCANNER_CLAMAV_HOST'] }}
      MALWARE_SCANNER_CLAMAV_PORT: ${{ vars.MALWARE_SCANNER_CLAMAV_PORT }}
      MALWARE_SCANNER_TIMEOUT_MS: ${{ vars.MALWARE_SCANNER_TIMEOUT_MS }}
      NEXT_PUBLIC_SENTRY_DSN: ${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
      SENTRY_DSN: ${{ secrets['SENTRY_DSN'] }}
      SENTRY_ORG: ${{ vars.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
      SENTRY_AUTH_TOKEN: ${{ secrets['SENTRY_AUTH_TOKEN'] }}
      NEXT_PUBLIC_POSTHOG_KEY: ${{ vars.NEXT_PUBLIC_POSTHOG_KEY }}
      NEXT_PUBLIC_POSTHOG_HOST: https://eu.i.posthog.com
      NEXT_PUBLIC_POSTHOG_ASSET_HOST: https://eu-assets.i.posthog.com
      NEXT_PUBLIC_ANALYTICS_REQUIRE_CONSENT: 'true'
      VERCEL_TOKEN: ${{ secrets['VERCEL_TOKEN'] }}
      VERCEL_ORG_ID: ${{ secrets['VERCEL_ORG_ID'] }}
      VERCEL_PROJECT_ID: ${{ secrets['VERCEL_PROJECT_ID'] }}

    steps:
      - name: Check out exact release SHA
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact checkout and current main before gates
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${RELEASE_SHA,,}"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "${RELEASE_SHA,,}"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies deterministically
        run: npm ci

      - name: Validate dedicated Enterprise Step-Up deployment input
        shell: bash
        run: |
          set -euo pipefail
          test "$STEP_UP_PROVIDER_MODE" = 'supabase_mfa'
          if [ -z "${STEP_UP_SIGNING_SECRET:-}" ]; then
            echo '::error title=Missing Enterprise Step-Up signing secret::Configure a dedicated STEP_UP_ASSERTION_SIGNING_SECRET or STEP_UP_SIGNING_SECRET in the protected production environment.'
            exit 1
          fi
          if [ -n "${AUDIT_CHAIN_SIGNING_SECRET:-}" ] && [ "$STEP_UP_SIGNING_SECRET" = "$AUDIT_CHAIN_SIGNING_SECRET" ]; then
            echo '::error title=Enterprise Step-Up key separation required::The Step-Up signing secret must be distinct from the audit-chain signing secret.'
            exit 1
          fi

      - name: Validate governed runtime feature inputs
        shell: bash
        run: |
          set -euo pipefail
          if [ "$ENABLE_DASHBOARD_METRIC_SNAPSHOTS" != 'false' ]; then
            echo '::error title=Metric snapshot policy drift::Production snapshots must remain disabled until the V19 snapshot schema is proven compatible.'
            exit 1
          fi
          if [ "$RELEASE_TARGET" = 'enterprise' ] && [ "$REQUIRE_MALWARE_SCAN_FOR_UPLOADS" != 'true' ]; then
            echo '::error title=Enterprise upload scanning disabled::Enterprise Production requires malware scanning to be enabled.'
            exit 1
          fi
          if [ -z "${NEXT_PUBLIC_POSTHOG_KEY:-}" ]; then
            echo '::error title=Missing PostHog Production project binding::Configure NEXT_PUBLIC_POSTHOG_KEY in the protected Production environment from the approved PostHog EU project.'
            exit 1
          fi
          if [ "$NEXT_PUBLIC_ANALYTICS_REQUIRE_CONSENT" != 'true' ]; then
            echo '::error title=Analytics consent policy drift::Production analytics must remain explicitly consent-gated.'
            exit 1
          fi
          if [ "$NEXT_PUBLIC_POSTHOG_HOST" != 'https://eu.i.posthog.com' ] || [ "$NEXT_PUBLIC_POSTHOG_ASSET_HOST" != 'https://eu-assets.i.posthog.com' ]; then
            echo '::error title=PostHog region policy drift::Production analytics must use the approved PostHog EU ingestion and asset hosts.'
            exit 1
          fi

          case "${MALWARE_SCANNER_PROVIDER,,}" in
            http|generic-http|webhook)
              if [ -z "${MALWARE_SCANNER_ALLOWED_HOSTS:-}" ]; then
                echo '::error title=Missing scanner allowlist::HTTP malware scanning requires MALWARE_SCANNER_ALLOWED_HOSTS.'
                exit 1
              fi
              if [ -z "${MALWARE_SCANNER_ENDPOINT:-}" ] && [ -z "${MALWARE_SCANNER_URL:-}" ]; then
                echo '::error title=Missing scanner transport::HTTP malware scanning requires MALWARE_SCANNER_ENDPOINT or MALWARE_SCANNER_URL.'
                exit 1
              fi
              ;;
            clamav|clamd)
              if [ -z "${MALWARE_SCANNER_CLAMAV_HOST:-}" ] || [ -z "${MALWARE_SCANNER_CLAMAV_PORT:-}" ]; then
                echo '::error title=Missing ClamAV transport::ClamAV requires host and port.'
                exit 1
              fi
              if [[ ! "$MALWARE_SCANNER_CLAMAV_PORT" =~ ^[0-9]+$ ]] || (( MALWARE_SCANNER_CLAMAV_PORT < 1 || MALWARE_SCANNER_CLAMAV_PORT > 65535 )); then
                echo '::error title=Invalid ClamAV port::MALWARE_SCANNER_CLAMAV_PORT must be 1-65535.'
                exit 1
              fi
              ;;
            *)
              if [ "$RELEASE_TARGET" = 'enterprise' ]; then
                echo '::error title=Unsupported malware scanner::Enterprise Production requires http, generic-http, webhook, clamav, or clamd.'
                exit 1
              fi
              ;;
          esac

      - name: Run lint gate
        run: npm run lint

      - name: Run typecheck gate
        run: npm run typecheck

      - name: Run test gate
        run: npm run test

      - name: Run build gate
        run: npm run build

      - name: Run full security CI gate
        run: npm run security:ci

      - name: Run route quality gate
        run: npm run quality:routes

      - name: Run Vercel production environment readiness gate
        run: npm run ops:vercel-readiness

      - name: Run release readiness gate
        run: npm run release:readiness

      - name: Run enterprise readiness gate
        if: env.RELEASE_TARGET == 'enterprise'
        run: npm run release:enterprise-readiness

      - name: Link and pull current Vercel production environment
        run: npx --yes "vercel@${VERCEL_CLI_VERSION}" pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Reverify current main immediately before production environment mutation
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${RELEASE_SHA,,}"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "${RELEASE_SHA,,}"

      - name: Synchronize provider-proof runtime bindings to Vercel production
        shell: bash
        run: |
          set -euo pipefail

          required=(
            NEXT_PUBLIC_SUPABASE_URL
            NEXT_PUBLIC_SUPABASE_ANON_KEY
            SUPABASE_SERVICE_ROLE_KEY
            STRIPE_SECRET_KEY
            STRIPE_WEBHOOK_SECRET
            RESEND_API_KEY
            EMAIL_FROM
            REQUIRE_TRANSACTIONAL_EMAIL_DELIVERY
            ENABLE_DASHBOARD_METRIC_SNAPSHOTS
            UPSTASH_REDIS_REST_URL
            UPSTASH_REDIS_REST_TOKEN
            HEALTHCHECK_TOKEN
            NEXT_PUBLIC_SENTRY_DSN
            SENTRY_ORG
            SENTRY_PROJECT
            SENTRY_AUTH_TOKEN
            NEXT_PUBLIC_POSTHOG_KEY
            NEXT_PUBLIC_POSTHOG_HOST
            NEXT_PUBLIC_POSTHOG_ASSET_HOST
            NEXT_PUBLIC_ANALYTICS_REQUIRE_CONSENT
            STEP_UP_SIGNING_SECRET
            STEP_UP_PROVIDER_MODE
            REQUIRE_MALWARE_SCAN_FOR_UPLOADS
            MALWARE_SCANNER_PROVIDER
          )
          missing=()
          for key in "${required[@]}"; do
            if [ -z "${!key:-}" ]; then
              missing+=("$key")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            printf '::error title=Missing protected provider binding source::%s\n' "${missing[*]}"
            exit 1
          fi

          sync_sensitive() {
            local key="$1"
            printf '%s' "${!key}" \
              | npx --yes "vercel@${VERCEL_CLI_VERSION}" env add "$key" production --force --sensitive --token="$VERCEL_TOKEN" >/dev/null
          }
          sync_public() {
            local key="$1"
            printf '%s' "${!key}" \
              | npx --yes "vercel@${VERCEL_CLI_VERSION}" env add "$key" production --force --no-sensitive --token="$VERCEL_TOKEN" >/dev/null
          }
          sync_sensitive_if_present() {
            local key="$1"
            if [ -n "${!key:-}" ]; then
              sync_sensitive "$key"
            fi
          }
          sync_public_if_present() {
            local key="$1"
            if [ -n "${!key:-}" ]; then
              sync_public "$key"
            fi
          }

          for key in \
            SUPABASE_SERVICE_ROLE_KEY \
            STRIPE_SECRET_KEY \
            STRIPE_WEBHOOK_SECRET \
            RESEND_API_KEY \
            UPSTASH_REDIS_REST_URL \
            UPSTASH_REDIS_REST_TOKEN \
            HEALTHCHECK_TOKEN \
            SENTRY_AUTH_TOKEN \
            STEP_UP_SIGNING_SECRET
          do
            sync_sensitive "$key"
          done

          for key in \
            NEXT_PUBLIC_SUPABASE_URL \
            NEXT_PUBLIC_SUPABASE_ANON_KEY \
            EMAIL_FROM \
            REQUIRE_TRANSACTIONAL_EMAIL_DELIVERY \
            ENABLE_DASHBOARD_METRIC_SNAPSHOTS \
            NEXT_PUBLIC_SENTRY_DSN \
            SENTRY_ORG \
            SENTRY_PROJECT \
            NEXT_PUBLIC_POSTHOG_KEY \
            NEXT_PUBLIC_POSTHOG_HOST \
            NEXT_PUBLIC_POSTHOG_ASSET_HOST \
            NEXT_PUBLIC_ANALYTICS_REQUIRE_CONSENT \
            STEP_UP_PROVIDER_MODE \
            REQUIRE_MALWARE_SCAN_FOR_UPLOADS \
            MALWARE_SCANNER_PROVIDER
          do
            sync_public "$key"
          done

          for key in \
            MALWARE_SCANNER_ENDPOINT \
            MALWARE_SCANNER_URL \
            MALWARE_SCANNER_API_KEY \
            MALWARE_SCANNER_CLAMAV_HOST
          do
            sync_sensitive_if_present "$key"
          done

          for key in \
            MALWARE_SCANNER_ALLOWED_HOSTS \
            MALWARE_SCANNER_CLAMAV_PORT \
            MALWARE_SCANNER_TIMEOUT_MS
          do
            sync_public_if_present "$key"
          done

          echo 'Provider-proof runtime binding names synchronized to Vercel Production; values were not printed.'

      - name: Refresh Vercel production environment after provider synchronization
        run: npx --yes "vercel@${VERCEL_CLI_VERSION}" pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build Vercel production artifact
        run: npx --yes "vercel@${VERCEL_CLI_VERSION}" build --prod --token="$VERCEL_TOKEN"

      - name: Reverify current main immediately before production deployment
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${RELEASE_SHA,,}"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "${RELEASE_SHA,,}"

      - name: Deploy prebuilt artifact to Vercel production
        run: npx --yes "vercel@${VERCEL_CLI_VERSION}" deploy --prebuilt --prod --token="$VERCEL_TOKEN"