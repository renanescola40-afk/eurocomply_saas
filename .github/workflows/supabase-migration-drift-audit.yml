name: Supabase Migration Drift Audit

run-name: Supabase migration drift audit for ${{ github.sha }}

on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'scripts/supabase/audit-migration-drift.mjs'
      - 'scripts/supabase/prepare-production-db-connection.mjs'
      - '.github/workflows/supabase-migration-drift-audit.yml'
      - 'tests/security/supabase-migration-drift-audit-workflow.test.ts'

permissions:
  contents: read

concurrency:
  group: supabase-migration-drift-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-contract:
    name: Validate drift-audit contract without production access
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out trusted source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies deterministically without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Test connection resolver and workflow contracts
        run: >-
          npx vitest run
          scripts/supabase/prepare-production-db-connection.test.mjs
          tests/security/supabase-migration-drift-audit-workflow.test.ts

      - name: Record pull request validation boundary
        shell: bash
        run: |
          {
            echo 'Pull requests validate resolver and workflow contracts without requesting the protected production environment.'
            echo 'No production database secret or connection is available to this job.'
            echo 'The scheduled or manually dispatched audit remains responsible for fail-closed live migration drift evidence.'
          } >> "$GITHUB_STEP_SUMMARY"

  audit:
    name: Audit local and production migration history
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    env:
      SUPABASE_CLI_VERSION: '2.101.0'
      EVIDENCE_DIR: artifacts/supabase-migration-drift

    steps:
      - name: Check out trusted source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies deterministically without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Validate production configuration
        shell: bash
        env:
          SUPABASE_DB_POOLER_URL: ${{ secrets.SUPABASE_DB_POOLER_URL }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          for name in SUPABASE_DB_POOLER_URL SUPABASE_PROJECT_ID; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required production secret: $name" >&2
              exit 1
            fi
          done
          if [[ ! "$SUPABASE_PROJECT_ID" =~ ^[a-z0-9]{20}$ ]]; then
            echo "SUPABASE_PROJECT_ID does not look like a Supabase project reference" >&2
            exit 1
          fi
          echo "SUPABASE_DB_URL_FILE=$RUNNER_TEMP/supabase-production-db-url" >> "$GITHUB_ENV"

      - name: Prepare explicit production database connection
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_POOLER_URL }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          node scripts/supabase/prepare-production-db-connection.mjs \
            --write-file "$SUPABASE_DB_URL_FILE" \
            | tee "$EVIDENCE_DIR/connection-diagnostics.json"
          test -s "$SUPABASE_DB_URL_FILE"
          test "$(stat -c '%a' "$SUPABASE_DB_URL_FILE")" = '600'

      - name: Test connection resolver and workflow contracts
        run: >-
          npx vitest run
          scripts/supabase/prepare-production-db-connection.test.mjs
          tests/security/supabase-migration-drift-audit-workflow.test.ts

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Verify pinned Supabase CLI version
        shell: bash
        run: |
          set -euo pipefail
          test "$(supabase --version)" = "$SUPABASE_CLI_VERSION"

      - name: Capture remote migration state
        shell: bash
        run: |
          set -euo pipefail
          DB_URL="$(cat "$SUPABASE_DB_URL_FILE")"
          supabase migration list --db-url "$DB_URL" \
            | tee migration-state-remote.txt \
            | tee "$EVIDENCE_DIR/migration-state-remote.txt"

      - name: Generate drift evidence
        id: drift
        shell: bash
        run: |
          set +e
          node scripts/supabase/audit-migration-drift.mjs \
            supabase/migrations \
            migration-state-remote.txt \
            "$EVIDENCE_DIR" \
            | tee migration-drift-summary.md \
            | tee "$EVIDENCE_DIR/migration-drift-summary.md"
          result=${PIPESTATUS[0]}
          echo "result=$result" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish audit summary
        if: always()
        shell: bash
        run: |
          if [ -f "$EVIDENCE_DIR/migration-drift.md" ]; then
            cat "$EVIDENCE_DIR/migration-drift.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Migration drift evidence was not generated.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Remove temporary database connection material
        if: always()
        shell: bash
        run: |
          rm -f "$SUPABASE_DB_URL_FILE"

      - name: Upload migration drift evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: supabase-migration-drift-${{ github.sha }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 14

      - name: Enforce critical drift gate
        if: steps.drift.outputs.result != '0'
        shell: bash
        run: |
          echo 'Critical Supabase migration drift detected. Review the generated job summary and artifact.' >&2
          exit 1
