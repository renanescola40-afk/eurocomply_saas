name: EuroComply Release Final Validation

on:
  workflow_dispatch:
    inputs:
      release_target:
        description: Release target to validate
        required: true
        default: enterprise
        type: choice
        options:
          - production
          - enterprise
      assessed_commit:
        description: Optional commit SHA being assessed; defaults to workflow SHA
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-final-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  final-validation:
    name: Generate final validation bundle
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ inputs.release_target }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve and check out assessed commit
        shell: bash
        run: |
          ASSESSED_COMMIT="${{ inputs.assessed_commit }}"
          if [ -z "$ASSESSED_COMMIT" ]; then
            ASSESSED_COMMIT="$GITHUB_SHA"
          fi

          git fetch --no-tags --prune origin "$ASSESSED_COMMIT" || true
          RESOLVED_COMMIT="$(git rev-parse "$ASSESSED_COMMIT^{commit}")"
          git checkout --detach "$RESOLVED_COMMIT"

          ACTUAL_COMMIT="$(git rev-parse HEAD)"
          if [ "$ACTUAL_COMMIT" != "$RESOLVED_COMMIT" ]; then
            echo "Assessed commit checkout mismatch: expected $RESOLVED_COMMIT, got $ACTUAL_COMMIT" >&2
            exit 1
          fi

          echo "Assessed commit: $ACTUAL_COMMIT" | tee assessed-commit.txt
          echo "ASSESSED_COMMIT=$ACTUAL_COMMIT" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies deterministically
        run: npm ci --ignore-scripts

      - name: Run Day 1 release control-plane gate
        run: node scripts/release/check-day1-release-control-plane.mjs

      - name: Run final validation bundle
        env:
          RELEASE_TARGET: ${{ inputs.release_target }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          STEP_UP_SIGNING_SECRET: ${{ secrets.STEP_UP_SIGNING_SECRET }}
        run: node scripts/release/run-final-validation.mjs

      - name: Upload final validation artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-validation-${{ github.run_id }}
          path: |
            assessed-commit.txt
            release-validation/summary.json
            release-validation/summary.md
            release-validation/logs/*.log
          retention-days: 14
          if-no-files-found: warn
