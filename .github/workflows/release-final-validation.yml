name: EuroComply Release Final Validation

on:
  workflow_dispatch:
    inputs:
      release_target:
        description: Release target to validate
        required: true
        default: enterprise
        type: choice
        options:
          - production
          - enterprise
      assessed_commit:
        description: Optional exact current main SHA assertion; historical commits are rejected
        required: false
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: release-final-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  production-environment-governance:
    name: Verify Production governance before final validation secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      TARGET_SHA: ${{ github.sha }}
      ASSESSED_COMMIT_INPUT: ${{ inputs.assessed_commit }}
    steps:
      - name: Bind validation to exact current main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_REF_NAME" = "main"
          if [ -n "$ASSESSED_COMMIT_INPUT" ]; then
            [[ "$ASSESSED_COMMIT_INPUT" =~ ^[0-9a-f]{40}$ ]]
            test "$ASSESSED_COMMIT_INPUT" = "$TARGET_SHA"
          fi
          main_sha="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/main" | jq -r '.sha')"
          test "$main_sha" = "$TARGET_SHA"
      - name: Check out exact trusted release SHA
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Verify Production environment governance before protected secrets
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_ENVIRONMENT_NAME: Production
          REQUIRE_PROTECTED_BRANCHES: 'true'
        run: node scripts/security/check-github-environment-governance.mjs

  final-validation:
    name: Generate final validation bundle
    needs: production-environment-governance
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: Production

    steps:
      - name: Revalidate exact current main after environment approval
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
          ASSESSED_COMMIT_INPUT: ${{ inputs.assessed_commit }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "main"
          if [ -n "$ASSESSED_COMMIT_INPUT" ]; then
            test "$ASSESSED_COMMIT_INPUT" = "$TARGET_SHA"
          fi
          main_sha="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/main" | jq -r '.sha')"
          test "$main_sha" = "$TARGET_SHA"

      - name: Checkout exact current main
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact current main checkout
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          ACTUAL_COMMIT="$(git rev-parse HEAD)"
          MAIN_COMMIT="$(git rev-parse origin/main)"
          test "$ACTUAL_COMMIT" = "$GITHUB_SHA"
          test "$MAIN_COMMIT" = "$GITHUB_SHA"

          rm -rf release-validation
          rm -f \
            docs/security/evidence/runtime/enterprise-release-env-readiness.json \
            docs/security/evidence/runtime/public-production-release-env-readiness.json

          echo "Assessed commit: $ACTUAL_COMMIT" | tee assessed-commit.txt
          echo "ASSESSED_COMMIT=$ACTUAL_COMMIT" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Revalidate environment governance after admission
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_ENVIRONMENT_NAME: Production
          REQUIRE_PROTECTED_BRANCHES: 'true'
        run: node scripts/security/check-github-environment-governance.mjs

      - name: Install dependencies deterministically
        run: npm ci --ignore-scripts

      - name: Run Day 1 release control-plane gate
        run: node scripts/release/check-day1-release-control-plane.mjs

      - name: Revalidate protected producer boundary
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_ENVIRONMENT_NAME: Production
          REQUIRE_PROTECTED_BRANCHES: 'true'
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse origin/main)" = "$TARGET_SHA"
          main_sha="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/main" | jq -r '.sha')"
          test "$main_sha" = "$TARGET_SHA"
          node scripts/security/check-github-environment-governance.mjs

      - name: Run final validation bundle
        env:
          RELEASE_TARGET: ${{ inputs.release_target }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          STEP_UP_SIGNING_SECRET: ${{ secrets.STEP_UP_SIGNING_SECRET }}
          STEP_UP_PROVIDER_MODE: ${{ vars.STEP_UP_PROVIDER_MODE || secrets.STEP_UP_PROVIDER_MODE }}
          STEP_UP_IDP_ACR_VALUES: ${{ vars.STEP_UP_IDP_ACR_VALUES || secrets.STEP_UP_IDP_ACR_VALUES }}
          STEP_UP_IDP_AMR_VALUES: ${{ vars.STEP_UP_IDP_AMR_VALUES || secrets.STEP_UP_IDP_AMR_VALUES }}
          STEP_UP_RUNTIME_PROVIDER_PROOF: ${{ vars.STEP_UP_RUNTIME_PROVIDER_PROOF || secrets.STEP_UP_RUNTIME_PROVIDER_PROOF }}
        run: node scripts/release/run-final-validation.mjs

      - name: Upload final validation artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-validation-${{ github.run_id }}
          path: |
            assessed-commit.txt
            release-validation/**
            docs/security/evidence/runtime/enterprise-release-env-readiness.json
            docs/security/evidence/runtime/public-production-release-env-readiness.json
          retention-days: 14
          if-no-files-found: warn
