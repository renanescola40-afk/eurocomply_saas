name: Dispatch exact-SHA final assurance proof

on:
  push:
    branches:
      - ops/dispatch-final-assurance-20260909
    paths:
      - .github/workflows/dispatch-final-assurance-one-shot.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch protected enterprise final assurance proof
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_SHA: 2df64fb7bd5a34e71aa3c375b129d79c912ae110
        shell: bash
        run: |
          set -euo pipefail
          payload="$(printf '{\"ref\":\"main\",\"inputs\":{\"release_sha\":\"%s\",\"confirmation\":\"VALIDATE_FINAL_ASSURANCE\"}}' "$RELEASE_SHA")"
          code="$(curl -sS -o /tmp/dispatch-response.txt -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/actions/workflows/enterprise-final-assurance-proof.yml/dispatches" \
            -d "$payload")"
          if [ "$code" != "204" ]; then
            cat /tmp/dispatch-response.txt >&2
            echo "workflow_dispatch failed with HTTP $code" >&2
            exit 1
          fi
          echo "Dispatched Enterprise Final Assurance Proof for $RELEASE_SHA"
