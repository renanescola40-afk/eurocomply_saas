name: RISCK COMPLY Upload Security CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: upload-security-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  upload-security-ci:
    name: Upload scanner, tenant storage and fail-closed gates
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      clamav:
        image: clamav/clamav:stable
        ports:
          - 3310:3310

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies deterministically without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Wait for live ClamAV scanner
        shell: bash
        run: node scripts/security/wait-for-clamav.mjs

      - name: Upload validation and tenant isolation static gate
        run: npm run security:upload

      - name: Upload content scanning fail-closed gate
        run: npm run security:upload-content-scan

      - name: Enterprise scanner bypass gate
        run: npm run security:upload-scanner:ci

      - name: Live ClamAV scanner proof and P0 evidence generation
        env:
          REQUIRE_MALWARE_SCAN_FOR_UPLOADS: 'true'
          MALWARE_SCANNER_PROVIDER: clamav
          MALWARE_SCANNER_CLAMAV_HOST: 127.0.0.1
          MALWARE_SCANNER_CLAMAV_PORT: '3310'
          MALWARE_SCANNER_TIMEOUT_MS: '30000'
        run: npm run security:upload-scanner:runtime -- --update-register

      - name: Validate generated runtime evidence
        run: |
          node scripts/security/check-p0-runtime-evidence-register.mjs
          node scripts/security/check-p0-runtime-evidence-files.mjs
          git diff -- docs/security/P0_RUNTIME_EVIDENCE_REGISTER.md docs/security/evidence/runtime > upload-runtime-proof.diff

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: upload-security-ci-diagnostics
          path: |
            upload-runtime-proof.diff
            docs/security/evidence/runtime/*.json
            docs/security/P0_RUNTIME_EVIDENCE_REGISTER.md
          retention-days: 14
          if-no-files-found: warn
