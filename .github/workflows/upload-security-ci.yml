name: RISCK COMPLY Upload Security CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: upload-security-ci-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  upload-security-ci:
    name: Upload scanner, tenant storage and fail-closed gates
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      TARGET_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
      UPLOAD_SCANNER_RUNTIME_EVIDENCE_PATH: docs/security/evidence/runtime/upload-malware-scan-validation.json
      UPLOAD_SCANNER_BLOCKING_PROOF_PATH: artifacts/upload-security/clamav-blocking-runtime-proof.json

    services:
      clamav:
        image: clamav/clamav:stable
        ports:
          - 3310:3310

    steps:
      - name: Checkout exact assessed SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact assessed checkout
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies deterministically without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Validate upload scanner evidence contracts
        run: >-
          npx vitest run
          scripts/release/validate-upload-scanner-runtime-evidence.test.mjs
          tests/enterprise/upload-scanner-runtime-evidence-fetch.test.ts
          tests/security/upload-scanner-runtime-proof-workflow.test.ts
          tests/security/upload-clamav-response.test.ts

      - name: Wait for live ClamAV scanner
        shell: bash
        run: |
          node <<'NODE'
          import { createConnection } from 'node:net';

          const host = '127.0.0.1';
          const port = 3310;
          const attempts = 90;
          const delayMs = 5_000;

          function sleep(ms) {
            return new Promise((resolve) => setTimeout(resolve, ms));
          }

          function pingClamd() {
            return new Promise((resolve, reject) => {
              const socket = createConnection({ host, port });
              let response = '';
              const timeout = setTimeout(() => {
                socket.destroy();
                reject(new Error('clamd ping timed out'));
              }, 3_000);

              socket.on('connect', () => socket.write('PING\n', 'utf8'));
              socket.on('data', (chunk) => {
                response += chunk.toString('utf8');
                if (response.includes('PONG')) {
                  clearTimeout(timeout);
                  socket.destroy();
                  resolve();
                }
              });
              socket.on('error', (error) => {
                clearTimeout(timeout);
                reject(error);
              });
              socket.on('end', () => {
                clearTimeout(timeout);
                if (response.includes('PONG')) resolve();
                else reject(new Error('clamd ping ended without PONG'));
              });
            });
          }

          for (let attempt = 1; attempt <= attempts; attempt += 1) {
            try {
              await pingClamd();
              console.log(`ClamAV scanner is ready on ${host}:${port}.`);
              process.exit(0);
            } catch (error) {
              const message = error instanceof Error ? error.message : String(error);
              console.log(`Waiting for ClamAV scanner (${attempt}/${attempts}): ${message}`);
              await sleep(delayMs);
            }
          }

          console.error(`ClamAV scanner did not become ready on ${host}:${port}.`);
          process.exit(1);
          NODE

      - name: Upload validation and tenant isolation static gate
        shell: bash
        run: |
          set -o pipefail
          npm run security:upload 2>&1 | tee upload-security.log

      - name: Upload content scanning fail-closed gate
        shell: bash
        run: |
          set -o pipefail
          npm run security:upload-content-scan 2>&1 | tee upload-content-scan.log

      - name: Enterprise scanner bypass gate
        shell: bash
        run: |
          set -o pipefail
          npm run security:upload-scanner:ci 2>&1 | tee upload-scanner-runtime-ci.log

      - name: Generate clean live ClamAV exact-SHA evidence
        shell: bash
        env:
          REQUIRE_MALWARE_SCAN_FOR_UPLOADS: 'true'
          MALWARE_SCANNER_PROVIDER: clamav
          MALWARE_SCANNER_CLAMAV_HOST: 127.0.0.1
          MALWARE_SCANNER_CLAMAV_PORT: '3310'
          MALWARE_SCANNER_TIMEOUT_MS: '30000'
        run: |
          set -o pipefail
          npm run security:upload-scanner:runtime 2>&1 | tee upload-clamav-clean-proof.log

      - name: Normalize and validate clean scanner provenance
        env:
          REQUIRE_MALWARE_SCAN_FOR_UPLOADS: 'true'
          MALWARE_SCANNER_PROVIDER: clamav
        run: |
          set -euo pipefail
          node scripts/security/normalize-upload-scanner-runtime-evidence.mjs
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { validateUploadScannerRuntimeEvidence } from './scripts/release/validate-upload-scanner-runtime-evidence.mjs';

          const evidence = JSON.parse(
            readFileSync(process.env.UPLOAD_SCANNER_RUNTIME_EVIDENCE_PATH, 'utf8'),
          );
          const failures = validateUploadScannerRuntimeEvidence(evidence, {
            expectedRepository: process.env.GITHUB_REPOSITORY,
            expectedBranch: process.env.TARGET_BRANCH,
            expectedCommitSha: process.env.TARGET_SHA,
          });
          if (failures.length > 0) {
            console.error('Canonical upload scanner evidence validation failed:');
            for (const failure of failures) console.error(`- ${failure}`);
            process.exit(1);
          }
          console.log('Canonical upload scanner evidence validation: ok');
          NODE

      - name: Prove live ClamAV blocks a malicious test fixture
        env:
          MALWARE_SCANNER_CLAMAV_HOST: 127.0.0.1
          MALWARE_SCANNER_CLAMAV_PORT: '3310'
          MALWARE_SCANNER_TIMEOUT_MS: '30000'
        run: node scripts/security/run-upload-scanner-blocking-runtime-validation.mjs

      - name: Validate sanitized blocking proof
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const evidence = JSON.parse(
            readFileSync(process.env.UPLOAD_SCANNER_BLOCKING_PROOF_PATH, 'utf8'),
          );
          const failures = [];
          if (evidence.status !== 'Complete' || evidence.outcome !== 'passed') {
            failures.push('blocking proof must be Complete/passed');
          }
          if (evidence.targetSha !== process.env.TARGET_SHA) failures.push('target SHA mismatch');
          if (evidence.repository !== process.env.GITHUB_REPOSITORY) failures.push('repository mismatch');
          if (evidence.branch !== process.env.TARGET_BRANCH) failures.push('branch mismatch');
          if (evidence.scanner?.classification !== 'blocked') failures.push('fixture was not blocked');
          if (evidence.fixture?.generatedInMemory !== true) failures.push('fixture must be generated in memory');
          if (evidence.fixture?.bytesPersisted !== false) failures.push('fixture bytes must not be persisted');
          if (evidence.scanner?.responseBodyStored !== false) failures.push('scanner response body must not be stored');
          if (evidence.scanner?.signatureNameStored !== false) failures.push('scanner signature must not be stored');
          if (!Array.isArray(evidence.failures) || evidence.failures.length !== 0) failures.push('failures must be empty');
          if (failures.length > 0) {
            for (const failure of failures) console.error(`- ${failure}`);
            process.exit(1);
          }
          console.log('Sanitized ClamAV blocking proof validation: ok');
          NODE

      - name: Prove workflow never mutates the versioned P0 policy register
        run: git diff --exit-code -- docs/security/P0_RUNTIME_EVIDENCE_REGISTER.md

      - name: Generate proof checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/upload-security
          sha256sum \
            "$UPLOAD_SCANNER_RUNTIME_EVIDENCE_PATH" \
            "$UPLOAD_SCANNER_BLOCKING_PROOF_PATH" \
            > artifacts/upload-security/SHA256SUMS

      - name: Publish upload scanner proof summary
        shell: bash
        run: |
          {
            echo '## Upload malware scanner runtime proof'
            echo ''
            echo "- Exact SHA: \`$TARGET_SHA\`"
            echo "- Branch: \`$TARGET_BRANCH\`"
            echo '- Clean PDF verdict: **allowed**'
            echo '- Antivirus test fixture verdict: **blocked**'
            echo '- Provider: **live ClamAV service**'
            echo '- Raw provider responses stored: **no**'
            echo '- Fixture bytes stored: **no**'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload immutable exact-SHA scanner proof
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: upload-security-runtime-proof-${{ env.TARGET_SHA }}
          path: |
            docs/security/evidence/runtime/upload-malware-scan-validation.json
            artifacts/upload-security/clamav-blocking-runtime-proof.json
            artifacts/upload-security/SHA256SUMS
            upload-security.log
            upload-content-scan.log
            upload-scanner-runtime-ci.log
            upload-clamav-clean-proof.log
          retention-days: 90
          if-no-files-found: error
