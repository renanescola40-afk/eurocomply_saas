name: Enterprise Final Assurance Proof

run-name: Final assurance proof for ${{ inputs.release_sha }}

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full current main SHA
        required: true
        type: string
      confirmation:
        description: Type VALIDATE_FINAL_ASSURANCE
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: enterprise-final-assurance-proof-${{ inputs.release_sha }}
  cancel-in-progress: false

jobs:
  assurance-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production-enterprise-assurance
    env:
      ENTERPRISE_EXPECTED_SHA: ${{ inputs.release_sha }}
      FINAL_ASSURANCE_CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - name: Validate requested SHA and confirmation
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ENTERPRISE_EXPECTED_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          test "$FINAL_ASSURANCE_CONFIRMATION" = "VALIDATE_FINAL_ASSURANCE"
          echo "ENTERPRISE_EXPECTED_SHA=${ENTERPRISE_EXPECTED_SHA,,}" >> "$GITHUB_ENV"
      - name: Checkout exact current main SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact current main checkout
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$ENTERPRISE_EXPECTED_SHA"
          test "$(git rev-parse origin/main)" = "$ENTERPRISE_EXPECTED_SHA"
      - name: Validate independent assurance metadata
        run: node scripts/enterprise/validate-final-assurance-bundle.mjs
      - name: Upload canonical final assurance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: enterprise-final-assurance-proof-${{ env.ENTERPRISE_EXPECTED_SHA }}
          path: docs/security/evidence/release/final-assurance-validation.json
          if-no-files-found: error
          retention-days: 365
