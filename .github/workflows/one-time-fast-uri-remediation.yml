name: One-time fast-uri Remediation

on:
  push:
    branches:
      - agent/safe-runtime-autopromotion-megapack
    paths:
      - .github/workflows/one-time-fast-uri-remediation.yml

permissions:
  contents: write

concurrency:
  group: one-time-fast-uri-remediation
  cancel-in-progress: false

jobs:
  remediate:
    name: Generate and commit minimal patched lockfile
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/safe-runtime-autopromotion-megapack
          fetch-depth: 2
          persist-credentials: true

      - name: Verify one-time provenance boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "renanescola40-afk/eurocomply_saas"
          test "$GITHUB_REF_NAME" = "agent/safe-runtime-autopromotion-megapack"
          test "$(git rev-parse HEAD^)" = "20acad65797c84e8d066cd117ca16fbae9bdddcc"
          test "$(git diff-tree --no-commit-id --name-only -r HEAD)" = ".github/workflows/one-time-fast-uri-remediation.yml"

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm

      - name: Preserve original manifests
        run: |
          cp package.json "$RUNNER_TEMP/package.before.json"
          cp package-lock.json "$RUNNER_TEMP/package-lock.before.json"

      - name: Pin patched fast-uri override and regenerate lockfile
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const path = 'package.json';
          const document = JSON.parse(fs.readFileSync(path, 'utf8'));
          document.overrides = { ...(document.overrides || {}), 'fast-uri': '3.1.3' };
          fs.writeFileSync(path, `${JSON.stringify(document, null, 2)}\n`);
          NODE
          npm install --package-lock-only --ignore-scripts

      - name: Enforce minimal manifest diff
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const beforePackage = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/package.before.json', 'utf8'));
          const afterPackage = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const beforeLock = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/package-lock.before.json', 'utf8'));
          const afterLock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const fail = (message) => { throw new Error(message); };
          const stable = (value) => Array.isArray(value)
            ? value.map(stable)
            : value && typeof value === 'object'
              ? Object.fromEntries(Object.keys(value).sort().map((key) => [key, stable(value[key])]))
              : value;
          const packageWithoutOverride = structuredClone(afterPackage);
          delete packageWithoutOverride.overrides;
          const expectedPackage = structuredClone(beforePackage);
          delete expectedPackage.overrides;
          if (JSON.stringify(stable(packageWithoutOverride)) !== JSON.stringify(stable(expectedPackage))) fail('package.json changed outside overrides');
          if (afterPackage.overrides?.['fast-uri'] !== '3.1.3') fail('fast-uri override missing');
          for (const [key, value] of Object.entries(beforePackage.overrides || {})) {
            if (afterPackage.overrides?.[key] !== value) fail(`existing override drift: ${key}`);
          }
          const beforeFast = beforeLock.packages?.['node_modules/fast-uri'];
          const afterFast = afterLock.packages?.['node_modules/fast-uri'];
          if (beforeFast?.version !== '3.1.2') fail('unexpected original fast-uri version');
          if (afterFast?.version !== '3.1.3') fail('patched fast-uri version missing');
          if (afterFast?.resolved !== 'https://registry.npmjs.org/fast-uri/-/fast-uri-3.1.3.tgz') fail('patched tarball mismatch');
          if (afterFast?.integrity !== 'sha512-i70LwGWUduXqzicKXWshooq+sWL1K3WUU5rKZNG/0i3a1OSoX3HqhH5WbWwTmqWfor4urUakGPiRQcleRZTwOg==') fail('patched integrity mismatch');
          const normalizedBefore = structuredClone(beforeLock);
          const normalizedAfter = structuredClone(afterLock);
          normalizedBefore.packages['node_modules/fast-uri'] = afterFast;
          if (normalizedBefore.dependencies?.['fast-uri'] && normalizedAfter.dependencies?.['fast-uri']) {
            normalizedBefore.dependencies['fast-uri'] = normalizedAfter.dependencies['fast-uri'];
          }
          if (JSON.stringify(stable(normalizedBefore)) !== JSON.stringify(stable(normalizedAfter))) fail('package-lock changed outside fast-uri');
          NODE
          test "$(git diff --name-only | sort)" = $'package-lock.json\npackage.json'
          git diff --check

      - name: Validate deterministic install and vulnerability closure
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm run security:package-lock
          npm audit --audit-level=moderate

      - name: Commit minimal remediation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "fix(security): pin patched fast-uri 3.1.3"
          git push origin HEAD:agent/safe-runtime-autopromotion-megapack
