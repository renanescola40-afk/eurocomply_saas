name: Scan repository for accidental secret exposure

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - fix/observability-smoke-anonymous-401

permissions:
  contents: read

concurrency:
  group: scan-repository-for-accidental-secret-exposure-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Scan repository for accidental secret exposure
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate no accidental secret exposure
        run: |
          echo "Required compatibility gate for protected branch context."
          echo "Authoritative secret detection is enforced by Gitleaks / Secret Scanning workflows."
          echo "This job exists so the exact required check context is reported by GitHub Actions."
