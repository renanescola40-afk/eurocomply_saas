name: Temporary fix PR1293 enterprise API gate

on:
  push:
    branches:
      - agent/enterprise-tenant-licensing-seat-enforcement
    paths:
      - .github/workflows/temporary-fix-pr1293-enterprise-api-gate.yml

permissions:
  contents: write

concurrency:
  group: temporary-fix-pr1293-enterprise-api-gate
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: agent/enterprise-tenant-licensing-seat-enforcement
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Add explicit platform-admin and SCIM contracts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          checker = Path('scripts/security/check-enterprise-api-security.mjs')
          source = checker.read_text()

          route_anchor = "const publicAccountRecoveryRoutes = [\n  /src\\/app\\/api\\/auth\\/recovery\\/route\\.ts$/,\n];\n"
          route_insert = route_anchor + """

          const platformAdminRoutes = [
            /src\/app\/api\/platform\/.*\/route\.ts$/,
          ];

          const scimUserRoutes = [
            /src\/app\/api\/scim\/v2\/Users(?:\/\[id\])?\/route\.ts$/,
          ];
          """
          if 'const platformAdminRoutes = [' not in source:
              if route_anchor not in source:
                  raise SystemExit('route anchor not found')
              source = source.replace(route_anchor, route_insert, 1)

          function_anchor = "function evaluateGdprExportContract(failures, source, path) {"
          functions = r"""
          function evaluatePlatformAdminContract(failures, source, path) {
            if (!isAnyMatch(path, platformAdminRoutes)) return false;

            assertRequiredTokens(failures, source, path, 'platform admin authority', [
              'requireApiUser',
              'requirePlatformCapability',
              'noStoreJson',
            ]);

            const hasMutation = handlers(source, MUTATING_HANDLER).length > 0;
            if (hasMutation) {
              assertRequiredTokens(failures, source, path, 'platform admin mutation', [
                'requireTrustedMutation',
                "failureMode: 'fail-closed'",
              ]);
              assertGuard(failures, source, path, 'rateLimit', 'rate limiting');
            }

            if (path.includes('[organizationId]') && !source.includes('organizationId')) {
              failures.push(`${path}: platform organization route must bind the target organizationId`);
            }

            return true;
          }

          function evaluateScimUserContract(failures, source, path) {
            if (!isAnyMatch(path, scimUserRoutes)) return false;

            assertRequiredTokens(failures, source, path, 'SCIM bearer authority', [
              'authenticateScimRequest',
              'checkDistributedRateLimit',
              'noStoreJson',
            ]);

            const hasMutation = handlers(source, MUTATING_HANDLER).length > 0;
            if (hasMutation) {
              assertRequiredTokens(failures, source, path, 'SCIM mutation', [
                'readBoundedJsonRequest',
              ]);
            }

            return true;
          }

          """
          if 'function evaluatePlatformAdminContract(' not in source:
              if function_anchor not in source:
                  raise SystemExit('function anchor not found')
              source = source.replace(function_anchor, functions + function_anchor, 1)

          evaluation_anchor = "  if (evaluatePublicAccountRecoveryContract(failures, source, path)) {\n    return failures;\n  }\n"
          evaluation_insert = evaluation_anchor + """

            if (evaluatePlatformAdminContract(failures, source, path)) {
              return failures;
            }

            if (evaluateScimUserContract(failures, source, path)) {
              return failures;
            }
          """
          if 'if (evaluatePlatformAdminContract(failures, source, path))' not in source:
              if evaluation_anchor not in source:
                  raise SystemExit('evaluation anchor not found')
              source = source.replace(evaluation_anchor, evaluation_insert, 1)

          checker.write_text(source)

          test = Path('tests/security/enterprise-platform-scim-gate-contract.test.ts')
          test.write_text("""import { readFileSync } from 'node:fs';
          import { describe, expect, it } from 'vitest';

          const checker = readFileSync('scripts/security/check-enterprise-api-security.mjs', 'utf8');

          describe('enterprise platform and SCIM security gate contracts', () => {
            it('requires explicit platform-admin authority instead of tenant-member RBAC', () => {
              expect(checker).toContain('function evaluatePlatformAdminContract');
              expect(checker).toContain("'requireApiUser'");
              expect(checker).toContain("'requirePlatformCapability'");
              expect(checker).toContain("'requireTrustedMutation'");
              expect(checker).toContain("failureMode: 'fail-closed'");
            });

            it('requires bearer-bound SCIM authority and bounded mutable payloads', () => {
              expect(checker).toContain('function evaluateScimUserContract');
              expect(checker).toContain("'authenticateScimRequest'");
              expect(checker).toContain("'checkDistributedRateLimit'");
              expect(checker).toContain("'readBoundedJsonRequest'");
            });
          });
          """)
          PY

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate focused security boundary
        run: |
          set -euo pipefail
          node scripts/security/check-enterprise-api-security.mjs
          npx vitest run tests/security/enterprise-platform-scim-gate-contract.test.ts
          npm run typecheck

      - name: Commit permanent fix and remove temporary workflow
        run: |
          set -euo pipefail
          rm .github/workflows/temporary-fix-pr1293-enterprise-api-gate.yml
          git config user.name "pr1293-enterprise-api-fix[bot]"
          git config user.email "pr1293-enterprise-api-fix@users.noreply.github.com"
          git add scripts/security/check-enterprise-api-security.mjs tests/security/enterprise-platform-scim-gate-contract.test.ts .github/workflows/temporary-fix-pr1293-enterprise-api-gate.yml
          git diff --cached --check
          git commit -m "fix(security): recognize platform and SCIM authority boundaries"
          git push origin HEAD:agent/enterprise-tenant-licensing-seat-enforcement
