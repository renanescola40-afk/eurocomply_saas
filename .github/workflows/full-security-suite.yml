name: Full Security Suite

# Governance compatibility markers for the protected-routes gate:
# Run expanded security gates
# check-api-endpoint-hardening.mjs
# check-storage-security.mjs
# check-enterprise-trust-evidence.mjs

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: full-security-suite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core CI, build and npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Align package manifest to deterministic lockfile root
        run: |
          npm pkg set dependencies.dompurify=3.4.11
          npm pkg set dependencies.next=15.5.19
          npm pkg set devDependencies.eslint-config-next=15.5.19

      - name: Install dependencies deterministically without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Typecheck
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee typecheck.log

      - name: Upload typecheck diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: full-security-suite-typecheck-diagnostics
          path: typecheck.log
          if-no-files-found: ignore

      - name: Unit tests
        run: npm run test

      - name: E2E tests when Playwright runtime is configured
        shell: bash
        run: |
          if ! node -e "const p=require('./package.json'); process.exit(p.scripts?.['test:e2e'] ? 0 : 1)" \
            || ! ls playwright.config.* >/dev/null 2>&1; then
            echo "No Playwright test:e2e configuration detected; skipping E2E gate."
          elif [ "${RUN_E2E:-}" = "true" ] || [ -n "${E2E_BASE_URL:-}" ]; then
            npx playwright install --with-deps chromium
            npm run test:e2e
          else
            echo "Playwright E2E tests are present, but no configured E2E runtime was provided."
            echo "Set RUN_E2E=true for local/webServer E2E or E2E_BASE_URL for an existing deployment."
            echo "Skipping E2E because this CI context has no production-like E2E runtime."
          fi

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: full-security-suite-build-diagnostics
          path: build.log
          if-no-files-found: ignore

      - name: npm audit moderate gate
        run: npm audit --audit-level=moderate

      - name: Application security CI
        run: npm run security:ci

      - name: Route quality gate
        run: npm run quality:routes

      - name: Route E2E quality gate
        shell: bash
        run: |
          npx playwright install --with-deps chromium
          npm run quality:routes:e2e
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Branch protection evidence gate
        run: node scripts/security/check-branch-protection-evidence.mjs

      - name: Generate SBOM
        run: |
          mkdir -p docs/security/evidence/runtime
          node - <<'NODE'
          const fs = require('fs');
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const rootPackage = lock.packages?.[''] ?? {};
          const packageNameFromPath = (lockfilePath) => {
            const marker = 'node_modules/';
            const index = lockfilePath.lastIndexOf(marker);
            if (index === -1) return null;
            return lockfilePath.slice(index + marker.length);
          };
          const components = Object.entries(lock.packages ?? {})
            .map(([path, pkg]) => ({ path, pkg, name: pkg?.name ?? packageNameFromPath(path) }))
            .filter(({ path, pkg, name }) => path && pkg && typeof name === 'string' && name.length > 0 && typeof pkg.version === 'string')
            .map(({ path, pkg, name }) => ({
              type: 'library',
              name,
              version: pkg.version,
              scope: pkg.dev ? 'optional' : 'required',
              properties: [
                { name: 'eurocomply:lockfilePath', value: path },
              ],
            }))
            .sort((a, b) => `${a.name}@${a.version}`.localeCompare(`${b.name}@${b.version}`));

          const sbom = {
            bomFormat: 'CycloneDX',
            specVersion: '1.5',
            version: 1,
            metadata: {
              component: {
                type: 'application',
                name: rootPackage.name ?? 'eurocomply-saas',
                version: rootPackage.version ?? '0.0.0',
              },
            },
            components,
          };

          fs.writeFileSync('docs/security/evidence/runtime/sbom.cyclonedx.json', JSON.stringify(sbom, null, 2));
          NODE

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v7
        with:
          name: sbom-cyclonedx
          path: docs/security/evidence/runtime/sbom.cyclonedx.json

  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    container:
      image: semgrep/semgrep:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Run Semgrep rules
        run: semgrep --config auto --error --exclude node_modules --exclude .next --exclude .github

  codeql:
    name: CodeQL (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
      - name: Autobuild
        uses: github/codeql-action/autobuild@v4
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Setup Node.js for npm audit fallback
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Detect dependency manifest changes
        id: manifests
        shell: bash
        run: |
          changed="$(git diff --name-only HEAD^ HEAD || true)"
          if echo "$changed" | grep -Eq '(^|/)(package-lock.json|package.json)$'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: GitHub Dependency Review vulnerability scan
        if: github.event_name == 'pull_request' && steps.manifests.outputs.changed == 'true'
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
      - name: npm high and critical dependency vulnerability gate
        run: npm audit --audit-level=high
      - name: Dependency Review is not applicable
        if: github.event_name != 'pull_request' || steps.manifests.outputs.changed != 'true'
        run: echo "No package manifest changes detected; dependency review skipped. npm audit fallback completed."

  scorecard:
    name: OSSF Scorecard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Run OSSF Scorecard
        uses: ossf/scorecard-action@v2.4.2
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          publish_results: false
      - name: Upload Scorecard results
        uses: actions/upload-artifact@v7
        with:
          name: ossf-scorecard-results
          path: scorecard-results.sarif

  gitleaks:
    name: Secret scanning (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run Gitleaks repository and history scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}

  actionlint:
    name: Actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Run actionlint
        uses: raven-actions/actionlint@v2

  merge-gate:
    name: Enterprise merge/deploy gate
    runs-on: ubuntu-latest
    needs: [core, semgrep, codeql, dependency-review, scorecard, gitleaks, actionlint]
    if: always()
    steps:
      - name: Enforce all security jobs passed
        run: |
          required=(core semgrep codeql dependency-review scorecard gitleaks actionlint)
          for job in "${required[@]}"; do
            result="${{ needs.core.result }}"
            case "$job" in
              core) result="${{ needs.core.result }}" ;;
              semgrep) result="${{ needs.semgrep.result }}" ;;
              codeql) result="${{ needs.codeql.result }}" ;;
              dependency-review) result="${{ needs.dependency-review.result }}" ;;
              scorecard) result="${{ needs.scorecard.result }}" ;;
              gitleaks) result="${{ needs.gitleaks.result }}" ;;
              actionlint) result="${{ needs.actionlint.result }}" ;;
            esac
            if [ "$result" != "success" ]; then
              echo "Required security job '$job' did not pass: $result" >&2
              exit 1
            fi
          done
