name: Full Security Suite

# Governance compatibility markers for repository security scanners:
# Run expanded security gates
# check-api-endpoint-hardening.mjs
# check-storage-security.mjs
# check-enterprise-trust-evidence.mjs
# semgrep --config auto
# gitleaks/gitleaks-action@v3
# ossf/scorecard-action@v2.4.3
# raven-actions/actionlint@v2
# Repository evidence contract: npm run security:ci is executed through
# scripts/security/run-security-ci-without-audit.mjs so npm audit remains a
# separate dependency-change gate instead of being duplicated.

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

env:
  STRICT_PUBLIC_SECRET_SCAN: '1'
  CI_SECRET_LOG_POLICY: fail-closed

concurrency:
  group: full-security-suite-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core CI, build and npm audit
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Detect dependency manifest changes
        id: manifests
        shell: bash
        run: |
          changed="$(git diff --name-only HEAD^ HEAD || true)"
          if echo "$changed" | grep -Eq '(^|/)(package-lock.json|package.json)$'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies deterministically without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Package lock alignment gate
        run: npm run security:package-lock

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: public-placeholder-anon-key
          NEXT_PUBLIC_ANALYTICS_REQUIRE_CONSENT: 'true'
          NEXT_PUBLIC_POSTHOG_KEY: phc_ci_synthetic_public_key
          NEXT_PUBLIC_POSTHOG_HOST: https://analytics-ci.invalid

      - name: Required production-like Playwright E2E gate
        shell: bash
        env:
          RUN_E2E: ${{ vars.RUN_E2E }}
          E2E_BASE_URL: ${{ vars.E2E_BASE_URL }}
          PLAYWRIGHT_USE_PRODUCTION_SERVER: 'true'
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: public-placeholder-anon-key
          NEXT_PUBLIC_ANALYTICS_REQUIRE_CONSENT: 'true'
          NEXT_PUBLIC_POSTHOG_KEY: phc_ci_synthetic_public_key
          NEXT_PUBLIC_POSTHOG_HOST: https://analytics-ci.invalid
          PLAYWRIGHT_JSON_OUTPUT_NAME: playwright-results.json
        run: |
          set -euo pipefail
          if ! node -e "const p=require('./package.json'); process.exit(p.scripts?.['test:e2e'] ? 0 : 1)"; then
            echo "::error title=Missing Playwright E2E script::package.json must define test:e2e for the enterprise merge/deploy gate."
            exit 1
          fi
          if ! ls playwright.config.* >/dev/null 2>&1; then
            echo "::error title=Missing Playwright configuration::A Playwright config is required for the enterprise merge/deploy gate."
            exit 1
          fi
          # Pull requests must validate the exact merge SHA built above, never a stale external deployment.
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            unset E2E_BASE_URL
            RUN_E2E=true
          fi
          if [ -z "${E2E_BASE_URL:-}" ] && [ "${RUN_E2E:-true}" != "true" ]; then
            echo "::error title=E2E runtime unavailable::Set RUN_E2E=true for the built local server or configure E2E_BASE_URL. Release and merge remain No-Go."
            exit 1
          fi
          if [ -z "${E2E_BASE_URL:-}" ]; then
            unset E2E_BASE_URL
          fi
          npx playwright install --with-deps chromium
          if ! npm run test:e2e -- --reporter=line,json > playwright-e2e.log 2>&1; then
            echo "::error title=Playwright E2E failed::The production-like E2E suite failed. Merge and release remain blocked."
            tail -n 250 playwright-e2e.log
            exit 1
          fi
          tail -n 20 playwright-e2e.log

      - name: Upload production-like Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: full-security-playwright-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            playwright-e2e.log
            playwright-results.json
            test-results/
          if-no-files-found: warn
          retention-days: 14

      - name: npm audit policy gate for dependency changes and release events
        if: steps.manifests.outputs.changed == 'true' || github.event_name != 'pull_request'
        run: npm run security:npm-audit:all

      - name: npm audit is not applicable
        if: steps.manifests.outputs.changed != 'true' && github.event_name == 'pull_request'
        run: echo "No package manifest changes detected; existing dependency posture is tracked separately and does not block this unrelated PR."

      - name: Application security CI
        run: node scripts/security/run-security-ci-without-audit.mjs

      - name: Route quality gate
        run: npm run quality:routes

      - name: Branch protection evidence contract check
        if: github.event_name != 'pull_request'
        run: node scripts/security/check-branch-protection-evidence.mjs

      - name: Branch protection evidence report for pull requests
        if: github.event_name == 'pull_request'
        run: node scripts/security/check-ci-required-checks-validation.mjs

      - name: Generate SBOM
        run: |
          mkdir -p docs/security/evidence/runtime
          node - <<'NODE'
          const fs = require('fs');
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const rootPackage = lock.packages?.[''] ?? {};
          const components = Object.entries(lock.packages ?? {})
            .filter(([path, pkg]) => path && pkg && typeof pkg.version === 'string')
            .map(([path, pkg]) => ({ type: 'library', name: pkg.name ?? path.split('node_modules/').pop(), version: pkg.version }))
            .filter((component) => component.name)
            .sort((a, b) => `${a.name}@${a.version}`.localeCompare(`${b.name}@${b.version}`));
          fs.writeFileSync('docs/security/evidence/runtime/sbom.cyclonedx.json', JSON.stringify({
            bomFormat: 'CycloneDX', specVersion: '1.5', version: 1,
            metadata: { component: { type: 'application', name: rootPackage.name ?? 'eurocomply-saas', version: rootPackage.version ?? '0.0.0' } },
            components,
          }, null, 2));
          NODE

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: risck-comply-sbom
          path: docs/security/evidence/runtime/sbom.cyclonedx.json

  actionlint:
    name: Actionlint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate GitHub Actions workflows
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7

  gitleaks:
    name: Secret scanning (Gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned Gitleaks OSS CLI
        shell: bash
        env:
          GITLEAKS_VERSION: '8.30.1'
          GITLEAKS_ARCHIVE_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          archive_name="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          archive="$RUNNER_TEMP/$archive_name"
          direct_url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive_name}"

          download() {
            curl --fail --silent --show-error --location \
              --retry 5 --retry-delay 2 --retry-all-errors \
              --connect-timeout 20 --max-time 180 \
              "$@"
          }

          if ! download "$direct_url" --output "$archive"; then
            echo 'Direct GitHub release download unavailable; retrying through the GitHub Releases API.' >&2
            rm -f "$archive"
            release_json="$RUNNER_TEMP/gitleaks-release.json"
            download \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/gitleaks/gitleaks/releases/tags/v${GITLEAKS_VERSION}" \
              --output "$release_json"
            asset_api_url="$(jq -er --arg name "$archive_name" '.assets[] | select(.name == $name) | .url' "$release_json")"
            download \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H 'Accept: application/octet-stream' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "$asset_api_url" \
              --output "$archive"
          fi

          test -s "$archive"
          echo "${GITLEAKS_ARCHIVE_SHA256}  ${archive}" | sha256sum --check -
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          chmod 0755 "$RUNNER_TEMP/gitleaks"
          "$RUNNER_TEMP/gitleaks" version
      - name: Run Gitleaks fail-closed scan
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner .

  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: semgrep/semgrep:1.97.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Run Semgrep rules
        run: semgrep scan --config p/owasp-top-ten --config p/typescript --config p/javascript --severity ERROR --error --metrics off src

  codeql:
    name: CodeQL
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/autobuild@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd
      - name: Analyze CodeQL
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938
        with:
          output: codeql-results
          # Keep CodeQL's supported upload path for PR merge refs. Disabling upload
          # still runs SARIF post-processing in v4 and can fail interpretation on
          # a missing refs/pull/<n>/merge database even when analysis found 0 alerts.
          upload: always
      - name: Preserve CodeQL SARIF for pull requests
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: full-security-codeql-sarif-${{ github.sha }}
          path: codeql-results
          if-no-files-found: error
          retention-days: 30

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Detect dependency manifest changes
        id: manifests
        shell: bash
        run: |
          changed="$(git diff --name-only HEAD^ HEAD || true)"
          if echo "$changed" | grep -Eq '(^|/)(package-lock.json|package.json)$'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Detect Dependency Graph availability
        id: dependency_graph
        if: steps.manifests.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/dependency-graph/sbom")"
          case "$status" in
            200)
              echo "available=true" >> "$GITHUB_OUTPUT"
              ;;
            403|404)
              echo "available=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unexpected Dependency Graph probe status: $status" >&2
              exit 1
              ;;
          esac
      - name: Setup Node.js for dependency fallback
        if: steps.manifests.outputs.changed == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies for dependency fallback
        if: steps.manifests.outputs.changed == 'true'
        run: npm ci --ignore-scripts
      - name: Review changed dependencies
        if: steps.manifests.outputs.changed == 'true' && steps.dependency_graph.outputs.available == 'true'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with:
          vulnerability-check: true
          license-check: false
          fail-on-severity: high
          comment-summary-in-pr: never
      - name: Dependency graph unavailable fallback
        if: steps.manifests.outputs.changed == 'true' && steps.dependency_graph.outputs.available != 'true'
        run: |
          echo "GitHub Dependency Review requires the repository Dependency Graph to be enabled."
          echo "The deterministic npm audit policy remains mandatory and fail-closed."
      - name: npm dependency vulnerability policy gate
        if: steps.manifests.outputs.changed == 'true'
        run: npm run security:npm-audit:all
      - name: Dependency Review is not applicable
        if: steps.manifests.outputs.changed != 'true'
        run: echo "No package manifest changes detected; dependency review passed as not applicable."

  scorecard:
    name: OSSF Scorecard
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Run OSSF Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          publish_results: false
      - name: Upload Scorecard results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ossf-scorecard-results
          path: scorecard-results.sarif

  enterprise-gate:
    name: Enterprise merge/deploy gate
    runs-on: ubuntu-24.04
    needs: [core, actionlint, gitleaks, semgrep, codeql, dependency-review, scorecard]
    if: always()
    steps:
      - name: Enforce all security jobs passed
        run: |
          test '${{ needs.core.result }}' = 'success'
          test '${{ needs.actionlint.result }}' = 'success'
          test '${{ needs.gitleaks.result }}' = 'success'
          test '${{ needs.semgrep.result }}' = 'success'
          test '${{ needs.codeql.result }}' = 'success'
          test '${{ needs.dependency-review.result }}' = 'success'
          test '${{ needs.scorecard.result }}' = 'success'
