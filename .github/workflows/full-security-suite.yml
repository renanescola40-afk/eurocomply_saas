name: Full Security Suite

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: full-security-suite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-security-suite:
    name: Run expanded security gates
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Detect app-affecting changes
        id: changes
        shell: bash
        run: |
          changed_files=$(git diff --name-only HEAD^ HEAD || git show --name-only --format= HEAD)
          echo "$changed_files"
          if echo "$changed_files" | grep -E '^(src|app|pages|components|lib|server|tests)/|(^|/)(package(-lock)?\.json|tsconfig\.json|next\.config\.|vitest\.config\.)'; then
            echo "app_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "app_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Report P0 enterprise progress
        run: node scripts/security/write-p0-enterprise-progress.mjs

      - name: Run repository security gates
        run: |
          node scripts/quality/check-route-links.mjs
          node scripts/security/check-rls.mjs
          node scripts/security/check-api-guards.mjs
          node scripts/security/check-protected-routes.mjs
          node scripts/security/check-public-secrets.mjs
          node scripts/security/check-client-boundaries.mjs
          node scripts/security/check-authorization-bola.mjs
          node scripts/security/check-api-endpoint-hardening.mjs
          node scripts/security/check-storage-security.mjs
          node scripts/security/check-ci-cd-secrets.mjs
          node scripts/security/check-log-sanitization.mjs
          node scripts/security/check-security-headers.mjs
          node scripts/security/check-no-store.mjs
          ENFORCE_ORIGIN_GUARDS=true node scripts/security/check-origin-guards.mjs
          node scripts/security/check-upload-security.mjs
          node scripts/security/check-upload-content-scan.mjs
          node scripts/security/check-security-responses.mjs
          node scripts/security/check-audit-chain.mjs
          node scripts/security/check-github-security-workflows.mjs
          node scripts/security/check-workflow-permissions.mjs
          node scripts/security/check-workflow-sensitive-patterns.mjs
          node scripts/security/check-workflow-pinned-actions.mjs
          node scripts/security/check-lockfile-required.mjs
          node scripts/security/list-floating-dependencies.mjs
          node scripts/security/check-npm-package-sources.mjs
          node scripts/security/check-npm-script-safety.mjs
          node scripts/security/check-env-example-policy.mjs
          node scripts/security/check-release-environment-evidence.mjs
          node scripts/security/check-p0-enterprise-blockers.mjs
          node scripts/security/check-supply-chain.mjs
          node scripts/security/check-zod-error-usage.mjs
          node scripts/security/check-trust-package.mjs
          node scripts/security/check-enterprise-trust-evidence.mjs

      - name: Typecheck app changes
        if: steps.changes.outputs.app_changed == 'true'
        run: npm run typecheck

      - name: Skip typecheck for non-app changes
        if: steps.changes.outputs.app_changed != 'true'
        run: echo "No app/package/tsconfig changes detected; skipping app typecheck."

      - name: Unit tests for app changes
        if: steps.changes.outputs.app_changed == 'true'
        run: npm run test

      - name: Skip unit tests for non-app changes
        if: steps.changes.outputs.app_changed != 'true'
        run: echo "No app/package/test changes detected; skipping app tests."
