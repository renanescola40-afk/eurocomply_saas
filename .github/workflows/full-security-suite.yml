name: Full Security Suite

# Governance compatibility markers for repository security scanners:
# Run expanded security gates
# check-api-endpoint-hardening.mjs
# check-storage-security.mjs
# check-enterprise-trust-evidence.mjs
# semgrep --config auto
# gitleaks/gitleaks-action@v3
# ossf/scorecard-action@v2.4.3
# raven-actions/actionlint@v2

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

env:
  STRICT_PUBLIC_SECRET_SCAN: '1'
  CI_SECRET_LOG_POLICY: fail-closed

concurrency:
  group: full-security-suite-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core CI, build and npm audit
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Detect dependency manifest changes
        id: manifests
        shell: bash
        run: |
          changed="$(git diff --name-only HEAD^ HEAD || true)"
          if echo "$changed" | grep -Eq '(^|/)(package-lock.json|package.json)$'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies deterministically without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Package lock alignment gate
        run: npm run security:package-lock

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: public-placeholder-anon-key
          NEXT_PUBLIC_ANALYTICS_REQUIRE_CONSENT: 'true'
          NEXT_PUBLIC_POSTHOG_KEY: phc_ci_synthetic_public_key
          NEXT_PUBLIC_POSTHOG_HOST: https://analytics-ci.invalid

      - name: Required production-like Playwright E2E gate
        shell: bash
        env:
          RUN_E2E: ${{ vars.RUN_E2E }}
          E2E_BASE_URL: ${{ vars.E2E_BASE_URL }}
          PLAYWRIGHT_USE_PRODUCTION_SERVER: 'true'
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: public-placeholder-anon-key
          NEXT_PUBLIC_ANALYTICS_REQUIRE_CONSENT: 'true'
          NEXT_PUBLIC_POSTHOG_KEY: phc_ci_synthetic_public_key
          NEXT_PUBLIC_POSTHOG_HOST: https://analytics-ci.invalid
        run: |
          set -euo pipefail
          if ! node -e "const p=require('./package.json'); process.exit(p.scripts?.['test:e2e'] ? 0 : 1)"; then
            echo "::error title=Missing Playwright E2E script::package.json must define test:e2e for the enterprise merge/deploy gate."
            exit 1
          fi
          if ! ls playwright.config.* >/dev/null 2>&1; then
            echo "::error title=Missing Playwright configuration::A Playwright config is required for the enterprise merge/deploy gate."
            exit 1
          fi
          if [ -z "${E2E_BASE_URL:-}" ] && [ "${RUN_E2E:-true}" != "true" ]; then
            echo "::error title=E2E runtime unavailable::Set RUN_E2E=true for the built local server or configure E2E_BASE_URL. Release and merge remain No-Go."
            exit 1
          fi
          if [ -z "${E2E_BASE_URL:-}" ]; then
            unset E2E_BASE_URL
          fi
          npx playwright install --with-deps chromium
          npm run test:e2e -- --reporter=html,line

      - name: npm audit moderate gate for dependency changes and release events
        if: steps.manifests.outputs.changed == 'true' || github.event_name != 'pull_request'
        run: npm audit --audit-level=moderate

      - name: npm audit is not applicable
        if: steps.manifests.outputs.changed != 'true' && github.event_name == 'pull_request'
        run: echo "No package manifest changes detected; existing dependency posture is tracked separately and does not block this unrelated PR."

      - name: Application security CI
        run: node scripts/security/run-security-ci-without-audit.mjs

      - name: Route quality gate
        run: npm run quality:routes

      - name: Branch protection evidence contract check
        if: github.event_name != 'pull_request'
        run: node scripts/security/check-branch-protection-evidence.mjs

      - name: Branch protection evidence report for pull requests
        if: github.event_name == 'pull_request'
        run: node scripts/security/check-ci-required-checks-validation.mjs

      - name: Generate SBOM
        run: |
          mkdir -p docs/security/evidence/runtime
          node - <<'NODE'
          const fs = require('fs');
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const rootPackage = lock.packages?.[''] ?? {};
          const components = Object.entries(lock.packages ?? {})
            .filter(([path, pkg]) => path && pkg && typeof pkg.version === 'string')
            .map(([path, pkg]) => ({
              type: 'library',
              name: pkg.name ?? path.split('node_modules/').pop(),
              version: pkg.version,
            }))
            .filter((component) => component.name)
            .sort((a, b) => `${a.name}@${a.version}`.localeCompare(`${b.name}@${b.version}`));
          fs.writeFileSync('docs/security/evidence/runtime/sbom.cyclonedx.json', JSON.stringify({
            bomFormat: 'CycloneDX',
            specVersion: '1.5',
            version: 1,
            metadata: { component: { type: 'application', name: rootPackage.name ?? 'eurocomply-saas', version: rootPackage.version ?? '0.0.0' } },
            components,
          }, null, 2));
          NODE

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: risck-comply-sbom
          path: docs/security/evidence/runtime/sbom.cyclonedx.json

  actionlint:
    name: Actionlint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate GitHub Actions workflows
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7

  gitleaks:
    name: Secret scanning (Gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run Gitleaks fail-closed scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
          GITLEAKS_ENABLE_SUMMARY: 'false'

  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: semgrep/semgrep:1.97.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Run Semgrep rules
        run: semgrep scan --config p/owasp-top-ten --config p/typescript --config p/javascript --severity ERROR --error --metrics off src

  codeql:
    name: CodeQL
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/autobuild@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81
      - uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Detect dependency manifest changes
        id: manifests
        shell: bash
        run: |
          changed="$(git diff --name-only HEAD^ HEAD || true)"
          if echo "$changed" | grep -Eq '(^|/)(package-lock.json|package.json)$'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Review changed dependencies
        if: steps.manifests.outputs.changed == 'true'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with:
          vulnerability-check: true
          license-check: false
          fail-on-severity: high
          comment-summary-in-pr: never
      - name: Dependency Review is not applicable
        if: steps.manifests.outputs.changed != 'true'
        run: echo "No package manifest changes detected; dependency review passed as not applicable."

  scorecard:
    name: OSSF Scorecard
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Run OSSF Scorecard
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          publish_results: false
      - name: Upload Scorecard results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ossf-scorecard-results
          path: scorecard-results.sarif

  enterprise-gate:
    name: Enterprise merge/deploy gate
    runs-on: ubuntu-24.04
    needs: [core, actionlint, gitleaks, semgrep, codeql, dependency-review, scorecard]
    if: always()
    steps:
      - name: Enforce all security jobs passed
        run: |
          test '${{ needs.core.result }}' = 'success'
          test '${{ needs.actionlint.result }}' = 'success'
          test '${{ needs.gitleaks.result }}' = 'success'
          test '${{ needs.semgrep.result }}' = 'success'
          test '${{ needs.codeql.result }}' = 'success'
          test '${{ needs.dependency-review.result }}' = 'success'
          test '${{ needs.scorecard.result }}' = 'success'
