name: QMS concise npm audit diagnostic

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnostic:
    if: github.head_ref == 'agent/qms-capa-audit-management-review-operational-megapack'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Print concise high and critical audit findings
        shell: bash
        run: |
          npm audit --json > audit.json || true
          node <<'NODE'
          const report = require('./audit.json');
          const items = Object.entries(report.vulnerabilities || {})
            .filter(([, value]) => ['high', 'critical'].includes(value.severity))
            .map(([name, value]) => ({
              name,
              severity: value.severity,
              direct: value.isDirect,
              via: (value.via || []).map((entry) => typeof entry === 'string' ? entry : `${entry.name}:${entry.range}`).join(','),
              fix: value.fixAvailable === true ? 'available' : value.fixAvailable === false ? 'none' : JSON.stringify(value.fixAvailable),
            }));
          console.log(JSON.stringify({ count: items.length, items }, null, 2));
          NODE
