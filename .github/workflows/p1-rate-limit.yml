name: P1 Rate Limit Evidence

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'docs/security/evidence/p1/distributed-rate-limit-sensitive-endpoints.json'
      - 'docs/security/evidence/p1/distributed-rate-limit-sensitive-endpoints.template.json'
      - 'docs/security/P1_RATE_LIMIT_USAGE.md'
      - 'scripts/security/check-p1-rate-limit-evidence.mjs'
      - '.github/workflows/p1-rate-limit.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'docs/security/evidence/p1/distributed-rate-limit-sensitive-endpoints.json'
      - 'docs/security/evidence/p1/distributed-rate-limit-sensitive-endpoints.template.json'
      - 'docs/security/P1_RATE_LIMIT_USAGE.md'
      - 'scripts/security/check-p1-rate-limit-evidence.mjs'
      - '.github/workflows/p1-rate-limit.yml'

permissions:
  contents: read

jobs:
  p1-rate-limit:
    name: Validate P1 rate limit evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Show runner Node.js and npm versions
        run: |
          node --version
          npm --version

      - name: Validate P1 rate limit evidence if present
        run: node scripts/security/check-p1-rate-limit-evidence.mjs
