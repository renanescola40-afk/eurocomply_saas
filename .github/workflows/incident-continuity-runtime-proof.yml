name: Incident Response and Continuity Proof

run-name: Incident continuity proof for ${{ inputs.release_sha }}

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full 40-character current main SHA
        required: true
        type: string
      confirmation:
        description: Type EXECUTE_INCIDENT_CONTINUITY_PROOF
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: incident-continuity-proof-${{ inputs.release_sha }}
  cancel-in-progress: false

jobs:
  incident-environment-governance:
    name: Verify incident proof environment before protected attestations
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      TARGET_SHA: ${{ inputs.release_sha }}
      INCIDENT_PROOF_CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - name: Bind incident proof to exact current main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$INCIDENT_PROOF_CONFIRMATION" = "EXECUTE_INCIDENT_CONTINUITY_PROOF"
          test "$GITHUB_REF_NAME" = "main"
          test "$GITHUB_SHA" = "$TARGET_SHA"
          main_sha="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/main" | jq -r '.sha')"
          test "$main_sha" = "$TARGET_SHA"

      - name: Check out exact trusted release SHA
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ inputs.release_sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22

      - name: Verify incident proof environment governance
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_ENVIRONMENT_NAME: production-incident-proof
          REQUIRE_PROTECTED_BRANCHES: 'true'
        run: node scripts/security/check-github-environment-governance.mjs

  prove:
    needs: incident-environment-governance
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: production-incident-proof
    env:
      TARGET_SHA: ${{ inputs.release_sha }}
      INCIDENT_PROOF_CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - name: Revalidate exact current main after environment approval
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$INCIDENT_PROOF_CONFIRMATION" = "EXECUTE_INCIDENT_CONTINUITY_PROOF"
          test "$GITHUB_REF_NAME" = "main"
          test "$GITHUB_SHA" = "$TARGET_SHA"
          main_sha="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/main" | jq -r '.sha')"
          test "$main_sha" = "$TARGET_SHA"

      - name: Checkout exact release SHA
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ inputs.release_sha }}
          persist-credentials: false

      - name: Verify exact current main execution
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse origin/main)" = "$TARGET_SHA"
          test "$GITHUB_SHA" = "$TARGET_SHA"
          test "$GITHUB_REF_NAME" = "main"

      - name: Set up protected Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22

      - name: Revalidate environment governance after admission
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_ENVIRONMENT_NAME: production-incident-proof
          REQUIRE_PROTECTED_BRANCHES: 'true'
        run: node scripts/security/check-github-environment-governance.mjs

      - name: Revalidate protected producer boundary
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_ENVIRONMENT_NAME: production-incident-proof
          REQUIRE_PROTECTED_BRANCHES: 'true'
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse origin/main)" = "$TARGET_SHA"
          main_sha="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/main" | jq -r '.sha')"
          test "$main_sha" = "$TARGET_SHA"
          node scripts/security/check-github-environment-governance.mjs

      - name: Set up pinned Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520
        with:
          version: 2.101.0

      - name: Install PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Start exact-SHA disposable Supabase project database
        run: node scripts/recovery/run-reviewed-ephemeral-schema-boundary-v4.mjs

      - name: Run incident continuity proof
        env:
          INCIDENT_SEV1_ACK_TARGET_MINUTES: ${{ vars.INCIDENT_SEV1_ACK_TARGET_MINUTES }}
          INCIDENT_SEV1_CONTAINMENT_TARGET_MINUTES: ${{ vars.INCIDENT_SEV1_CONTAINMENT_TARGET_MINUTES }}
          INCIDENT_TABLETOP_MAX_AGE_DAYS: ${{ vars.INCIDENT_TABLETOP_MAX_AGE_DAYS }}
          INCIDENT_ONCALL_ROTATION_CONFIGURED: ${{ vars.INCIDENT_ONCALL_ROTATION_CONFIGURED }}
          INCIDENT_NOTIFICATION_MATRIX_REVIEWED: ${{ vars.INCIDENT_NOTIFICATION_MATRIX_REVIEWED }}
        run: node scripts/incident/run-incident-continuity-runtime-proof.mjs

      - name: Validate canonical evidence
        run: node scripts/incident/check-incident-continuity-evidence.mjs

      - name: Remove disposable project database
        if: always()
        run: node scripts/recovery/manage-ephemeral-recovery-database.mjs stop

      - name: Upload redacted evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: incident-continuity-runtime-proof-${{ inputs.release_sha }}
          path: docs/security/evidence/runtime/incident-continuity-validation.json
          retention-days: 90
          if-no-files-found: error
