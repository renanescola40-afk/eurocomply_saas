name: Codex Auto-Fix on Build Failure

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  push:
    branches: [ main ]

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  auto-fix:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 8
          
      - name: Install dependencies
        run: pnpm install
        
      - name: Try to fix with Codex
        uses: openai/codex-action@main
        with:
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          prompt: |
            Fix the build error for this Next.js + Supabase project.
            Look at package.json and add any missing dependencies.
            The error is about: Module not found: Can't resolve '@supabase/auth-helpers-nextjs'
            Make minimal changes to make the build pass.
          
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "fix: auto-resolve build failure"
          title: "🤖 Auto-fix: Build failure resolved"
          body: |
            ## 🤖 Correção automática via Codex
            
            Este PR foi criado automaticamente para corrigir o erro de build.
            
            **Por favor, revise as alterações antes de fazer merge.**
          branch: codex/auto-fix
          base: main
          delete-branch: true
