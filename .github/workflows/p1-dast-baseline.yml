name: P1 DAST Baseline

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "HTTPS EuroComply URL to scan"
        required: false
        default: "https://eurocomply-saas.vercel.app"
  schedule:
    - cron: "17 3 * * 1"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/p1-dast-baseline.yml"
      - "docs/security/P1_DAST_AUTOMATION.md"
  pull_request:
    paths:
      - ".github/workflows/p1-dast-baseline.yml"
      - "docs/security/P1_DAST_AUTOMATION.md"

permissions:
  contents: read

env:
  DEFAULT_DAST_TARGET_URL: "https://eurocomply-saas.vercel.app"

jobs:
  zap-baseline:
    name: Generate OWASP ZAP baseline report
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Resolve DAST target
        id: target
        shell: bash
        env:
          INPUT_TARGET_URL: ${{ github.event.inputs.target_url }}
        run: |
          set -euo pipefail
          target_url="${INPUT_TARGET_URL:-${DEFAULT_DAST_TARGET_URL}}"

          case "$target_url" in
            https://eurocomply-saas.vercel.app|https://eurocomply-saas.vercel.app/*|https://*.eurocomply-saas.vercel.app|https://*.eurocomply-saas.vercel.app/*) ;;
            *)
              echo "DAST target must be an approved EuroComply HTTPS URL." >&2
              exit 1
              ;;
          esac

          echo "target_url=$target_url" >> "$GITHUB_OUTPUT"
          mkdir -p dast-report

      - name: Run OWASP ZAP baseline scan
        shell: bash
        run: |
          set -euo pipefail
          docker pull ghcr.io/zaproxy/zaproxy:stable
          docker run --rm \
            --user root \
            --workdir /zap/wrk \
            -v "${{ github.workspace }}/dast-report:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
              -t "${{ steps.target.outputs.target_url }}" \
              -r p1-dast-report.html \
              -J p1-dast-report.json \
              -w p1-dast-report.md \
              -x p1-dast-report.xml \
              -I

      - name: Normalize and verify DAST reports
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          echo "Files produced by ZAP:"
          find dast-report -maxdepth 1 -type f -print | sort || true

          reports=()
          for candidate in dast-report/p1-dast-report.* dast-report/*report* dast-report/*zap*; do
            if [ -s "$candidate" ]; then
              reports+=("$candidate")
            fi
          done

          if [ "${#reports[@]}" -eq 0 ]; then
            echo "No non-empty ZAP report files were produced." >&2
            exit 1
          fi

          sha256sum "${reports[@]}" > dast-report/p1-dast-report.sha256

          cat > dast-report/p1-dast-manifest.json <<JSON
          {
            "schemaVersion": 1,
            "controlId": "P1-05",
            "control": "dast-automated",
            "evidenceKind": "automation-output",
            "targetUrl": "${{ steps.target.outputs.target_url }}",
            "workflow": "P1 DAST Baseline",
            "runId": "${{ github.run_id }}",
            "runAttempt": "${{ github.run_attempt }}",
            "commit": "${{ github.sha }}",
            "artifactName": "p1-dast-baseline-report",
            "generatedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "reports": [
          JSON

          first=1
          for report in "${reports[@]}"; do
            digest="$(sha256sum "$report" | awk '{print $1}')"
            name="$(basename "$report")"
            if [ "$first" -eq 0 ]; then
              echo "," >> dast-report/p1-dast-manifest.json
            fi
            first=0
            printf '              {"file":"%s","sha256":"%s"}' "$name" "$digest" >> dast-report/p1-dast-manifest.json
          done

          cat >> dast-report/p1-dast-manifest.json <<JSON
            ]
          }
          JSON

      - name: Upload DAST report artifact
        uses: actions/upload-artifact@v7
        with:
          name: p1-dast-baseline-report
          path: dast-report/*
          if-no-files-found: error
          retention-days: 90

      - name: Write DAST evidence summary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## P1-05 DAST baseline evidence"
            echo
            echo "- Target: ${{ steps.target.outputs.target_url }}"
            echo "- Tool: OWASP ZAP baseline"
            echo "- Artifact: p1-dast-baseline-report"
            echo "- Manifest: p1-dast-manifest.json"
            echo "- Digest: p1-dast-report.sha256"
            echo
            echo "This workflow generates automation evidence only. P1-05 must remain Open until a successful production run is reviewed and formalized in docs/security/evidence/p1/dast-automated.json."
          } >> "$GITHUB_STEP_SUMMARY"
