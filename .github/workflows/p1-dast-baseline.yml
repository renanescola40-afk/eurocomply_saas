name: P1 DAST Baseline

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "HTTPS URL to scan"
        required: false
        default: "https://eurocomply-saas.vercel.app"
  schedule:
    - cron: "17 3 * * 1"
  pull_request:
    paths:
      - ".github/workflows/p1-dast-baseline.yml"
      - "docs/security/P1_DAST_AUTOMATION.md"

permissions:
  contents: read

env:
  DEFAULT_DAST_TARGET_URL: "https://eurocomply-saas.vercel.app"

jobs:
  zap-baseline:
    name: Generate OWASP ZAP baseline report
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve DAST target
        id: target
        shell: bash
        env:
          INPUT_TARGET_URL: ${{ github.event.inputs.target_url }}
        run: |
          set -euo pipefail
          target_url="${INPUT_TARGET_URL:-${DEFAULT_DAST_TARGET_URL}}"

          case "$target_url" in
            https://*) ;;
            *)
              echo "DAST target must use https://" >&2
              exit 1
              ;;
          esac

          echo "target_url=$target_url" >> "$GITHUB_OUTPUT"
          mkdir -p dast-report

      - name: Run OWASP ZAP baseline scan
        shell: bash
        run: |
          set -euo pipefail
          docker pull ghcr.io/zaproxy/zaproxy:stable
          docker run --rm \
            -v "${{ github.workspace }}/dast-report:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
              -t "${{ steps.target.outputs.target_url }}" \
              -r p1-dast-report.html \
              -J p1-dast-report.json \
              -w p1-dast-report.md \
              -x p1-dast-report.xml \
              -I

      - name: Verify DAST reports exist
        shell: bash
        run: |
          set -euo pipefail
          test -s dast-report/p1-dast-report.html
          test -s dast-report/p1-dast-report.json
          test -s dast-report/p1-dast-report.md
          test -s dast-report/p1-dast-report.xml
          sha256sum dast-report/p1-dast-report.* > dast-report/p1-dast-report.sha256

      - name: Upload DAST report artifact
        uses: actions/upload-artifact@v4
        with:
          name: p1-dast-baseline-report
          path: dast-report/*
          if-no-files-found: error
          retention-days: 90

      - name: Write DAST evidence summary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## P1-05 DAST baseline evidence"
            echo
            echo "- Target: ${{ steps.target.outputs.target_url }}"
            echo "- Tool: OWASP ZAP baseline"
            echo "- Artifact: p1-dast-baseline-report"
            echo "- Reports: HTML, JSON, Markdown, XML, SHA-256 digest"
            echo
            echo "This workflow generates automation evidence only. P1-05 must remain Open until a successful production run is reviewed and formalized in docs/security/evidence/p1/dast-automated.json."
          } >> "$GITHUB_STEP_SUMMARY"
