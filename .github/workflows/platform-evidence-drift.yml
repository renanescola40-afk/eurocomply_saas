name: Platform Evidence Drift

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/platform/check-final-evidence-drift.mjs'
      - 'tests/security/platform-evidence-drift-contract.test.mjs'
      - '.github/workflows/platform-evidence-drift.yml'
      - 'docs/runbooks/platform-evidence-drift.md'
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  contract:
    name: Platform evidence drift contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - run: node --test tests/security/platform-evidence-drift-contract.test.mjs

  platform-closeout-environment-governance:
    name: Verify platform closeout governance before drift secret
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      TARGET_SHA: ${{ github.sha }}
    steps:
      - name: Bind drift proof to exact current main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$GITHUB_REF_NAME" = "main"
          main_sha="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/main" | jq -r '.sha')"
          test "$main_sha" = "$TARGET_SHA"
      - name: Check out exact trusted release SHA
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Verify platform closeout environment governance
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_ENVIRONMENT_NAME: production-platform-closeout
          REQUIRE_PROTECTED_BRANCHES: 'true'
        run: node scripts/security/check-github-environment-governance.mjs

  protected-drift-check:
    name: Protected platform evidence freshness
    if: github.event_name != 'pull_request'
    needs: [contract, platform-closeout-environment-governance]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production-platform-closeout
    env:
      PLATFORM_EVIDENCE_WARN_HOURS: ${{ vars.PLATFORM_EVIDENCE_WARN_HOURS }}
    steps:
      - name: Revalidate exact current main after environment approval
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "main"
          main_sha="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/main" | jq -r '.sha')"
          test "$main_sha" = "$TARGET_SHA"
      - name: Check out exact current main
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify checked-out SHA still equals current main
        shell: bash
        env:
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse origin/main)" = "$TARGET_SHA"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Revalidate environment governance after admission
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_ENVIRONMENT_NAME: production-platform-closeout
          REQUIRE_PROTECTED_BRANCHES: 'true'
        run: node scripts/security/check-github-environment-governance.mjs
      - name: Revalidate protected producer boundary
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_ENVIRONMENT_NAME: production-platform-closeout
          REQUIRE_PROTECTED_BRANCHES: 'true'
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse origin/main)" = "$TARGET_SHA"
          main_sha="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/main" | jq -r '.sha')"
          test "$main_sha" = "$TARGET_SHA"
          node scripts/security/check-github-environment-governance.mjs
      - name: Materialize protected evidence
        shell: bash
        env:
          PLATFORM_FINAL_RELEASE_EVIDENCE_JSON: ${{ secrets.PLATFORM_FINAL_RELEASE_EVIDENCE_JSON }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          printf '%s' "$PLATFORM_FINAL_RELEASE_EVIDENCE_JSON" > artifacts/platform-final-release-evidence.json
      - name: Check drift and expiry
        run: node scripts/platform/check-final-evidence-drift.mjs
      - name: Delete protected source
        if: always()
        run: rm -f artifacts/platform-final-release-evidence.json
      - name: Upload redacted drift report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: platform-evidence-drift-${{ github.run_id }}
          path: artifacts/platform-evidence-drift.json
          if-no-files-found: error
          retention-days: 90
