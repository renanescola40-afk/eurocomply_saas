name: Production Deployment Exact-SHA Proof

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: read
  deployments: read

concurrency:
  group: production-deployment-exact-sha-proof-${{ github.sha }}
  cancel-in-progress: false

jobs:
  prove:
    name: Prove exact-SHA Vercel production deployment
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TARGET_SHA: ${{ github.sha }}
      GITHUB_TOKEN: ${{ github.token }}
      PRODUCTION_DEPLOYMENT_EVIDENCE_PATH: docs/security/evidence/runtime/deployment-smoke-validation.json
      PRODUCTION_DEPLOYMENT_PROOF_ATTEMPTS: '60'
      PRODUCTION_DEPLOYMENT_PROOF_POLL_MS: '5000'

    steps:
      - name: Checkout exact assessed SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22

      - name: Validate proof contract
        run: node --check scripts/release/write-github-vercel-production-deployment-evidence.mjs

      - name: Generate exact-SHA production deployment evidence
        id: proof
        shell: bash
        run: |
          set +e
          node scripts/release/write-github-vercel-production-deployment-evidence.mjs
          proof_exit=$?
          set -e
          echo "exit_code=$proof_exit" >> "$GITHUB_OUTPUT"

      - name: Upload retained exact-SHA deployment evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: production-deployment-exact-sha-proof-${{ env.TARGET_SHA }}
          path: docs/security/evidence/runtime/deployment-smoke-validation.json
          if-no-files-found: error
          retention-days: 90

      - name: Enforce proof decision
        if: always()
        env:
          PROOF_EXIT_CODE: ${{ steps.proof.outputs.exit_code }}
        run: test "$PROOF_EXIT_CODE" = '0'
