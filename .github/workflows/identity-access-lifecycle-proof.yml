name: Identity Access Lifecycle Proof

run-name: Identity lifecycle proof for ${{ inputs.release_sha }}

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full 40-character current main SHA
        required: true
        type: string
      confirmation:
        description: Type EXECUTE_IDENTITY_LIFECYCLE_PROOF
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: identity-access-lifecycle-proof-${{ inputs.release_sha }}
  cancel-in-progress: false

jobs:
  identity-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: production-identity-proof
    env:
      TARGET_SHA: ${{ inputs.release_sha }}
      IDENTITY_PROOF_CONFIRMATION: ${{ inputs.confirmation }}
      PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      IDENTITY_PROOF_EMAIL_DOMAIN: ${{ secrets.IDENTITY_PROOF_EMAIL_DOMAIN }}
      IDENTITY_PROOF_OIDC_DISCOVERY_URL: ${{ secrets.IDENTITY_PROOF_OIDC_DISCOVERY_URL }}
      IDENTITY_ADMIN_MFA_REQUIRED: ${{ vars.IDENTITY_ADMIN_MFA_REQUIRED }}
      IDENTITY_SENSITIVE_STEP_UP_REQUIRED: ${{ vars.IDENTITY_SENSITIVE_STEP_UP_REQUIRED }}
      IDENTITY_ORGANIZATION_ONBOARDING_VALIDATED: ${{ vars.IDENTITY_ORGANIZATION_ONBOARDING_VALIDATED }}
    steps:
      - name: Validate requested release SHA and confirmation
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$IDENTITY_PROOF_CONFIRMATION" = "EXECUTE_IDENTITY_LIFECYCLE_PROOF"

      - name: Checkout exact release SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.release_sha }}
          persist-credentials: false

      - name: Verify protected exact-main execution
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse origin/main)" = "$TARGET_SHA"
          test "$GITHUB_SHA" = "$TARGET_SHA"
          test "$GITHUB_REF_NAME" = "main"

      - name: Execute identity lifecycle proof
        run: node scripts/identity/run-identity-access-lifecycle-proof.mjs

      - name: Validate redacted evidence
        run: node scripts/identity/check-identity-access-lifecycle-evidence.mjs

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: identity-access-lifecycle-proof-${{ inputs.release_sha }}
          path: docs/security/evidence/runtime/identity-access-lifecycle-validation.json
          if-no-files-found: error
          retention-days: 90
