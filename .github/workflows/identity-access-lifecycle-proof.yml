name: Identity Access Lifecycle Proof

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full 40-character current main SHA
        required: true
        type: string
      confirmation:
        description: Type EXECUTE_IDENTITY_LIFECYCLE_PROOF
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: identity-access-lifecycle-proof-${{ inputs.release_sha }}
  cancel-in-progress: false

jobs:
  identity-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: production-identity-proof
    env:
      TARGET_SHA: ${{ inputs.release_sha }}
      IDENTITY_PROOF_CONFIRMATION: ${{ inputs.confirmation }}
      PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      IDENTITY_PROOF_EMAIL_DOMAIN: ${{ secrets.IDENTITY_PROOF_EMAIL_DOMAIN }}
      IDENTITY_PROOF_OIDC_DISCOVERY_URL: ${{ secrets.IDENTITY_PROOF_OIDC_DISCOVERY_URL }}
      IDENTITY_ADMIN_MFA_REQUIRED: ${{ vars.IDENTITY_ADMIN_MFA_REQUIRED }}
      IDENTITY_SENSITIVE_STEP_UP_REQUIRED: ${{ vars.IDENTITY_SENSITIVE_STEP_UP_REQUIRED }}
      IDENTITY_ORGANIZATION_ONBOARDING_VALIDATED: ${{ vars.IDENTITY_ORGANIZATION_ONBOARDING_VALIDATED }}
    steps:
      - name: Validate requested release SHA and confirmation
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$IDENTITY_PROOF_CONFIRMATION" = "EXECUTE_IDENTITY_LIFECYCLE_PROOF"

      - name: Checkout exact release SHA
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify protected exact-main execution
        shell: bash
        run: |
          set -euo pipefail

          git fetch --no-tags --depth=1 origin main

          HEAD_SHA="$(git rev-parse HEAD)"
          REMOTE_MAIN_SHA="$(git rev-parse origin/main)"

          {
            echo "## Identity access lifecycle exact-main guard"
            echo ""
            echo "- TARGET_SHA: \`$TARGET_SHA\`"
            echo "- HEAD_SHA: \`$HEAD_SHA\`"
            echo "- REMOTE_MAIN_SHA: \`$REMOTE_MAIN_SHA\`"
            echo "- GITHUB_SHA: \`$GITHUB_SHA\`"
            echo "- GITHUB_REF_NAME: \`$GITHUB_REF_NAME\`"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$HEAD_SHA" != "$TARGET_SHA" ]; then
            echo "::error title=STALE_SHA::TARGET_SHA must equal checked-out HEAD. target=$TARGET_SHA head=$HEAD_SHA"
            echo "IDENTITY_PROOF_BLOCKER=STALE_SHA_TARGET_NOT_HEAD"
            exit 1
          fi

          if [ "$REMOTE_MAIN_SHA" != "$TARGET_SHA" ]; then
            echo "::error title=STALE_SHA::TARGET_SHA must equal current origin/main. target=$TARGET_SHA origin_main=$REMOTE_MAIN_SHA"
            echo "IDENTITY_PROOF_BLOCKER=STALE_SHA_TARGET_NOT_CURRENT_MAIN"
            exit 1
          fi

          if [ "$GITHUB_SHA" != "$TARGET_SHA" ]; then
            echo "::error title=STALE_SHA::GITHUB_SHA must equal TARGET_SHA. target=$TARGET_SHA github_sha=$GITHUB_SHA"
            echo "IDENTITY_PROOF_BLOCKER=STALE_SHA_GITHUB_SHA_MISMATCH"
            exit 1
          fi

          if [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "::error title=INVALID_REF::Identity proof must run from main. ref=$GITHUB_REF_NAME"
            echo "IDENTITY_PROOF_BLOCKER=INVALID_REF"
            exit 1
          fi

          echo "IDENTITY_PROOF_EXACT_MAIN=PASS"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**IDENTITY_PROOF_EXACT_MAIN:** \`PASS\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Execute identity lifecycle proof
        run: node scripts/identity/run-identity-access-lifecycle-proof.mjs

      - name: Validate redacted evidence
        run: node scripts/identity/check-identity-access-lifecycle-evidence.mjs

      - name: Detect evidence artifact
        if: always()
        id: identity_evidence
        shell: bash
        run: |
          set -euo pipefail

          evidence_path="docs/security/evidence/runtime/identity-access-lifecycle-validation.json"

          if [ -f "$evidence_path" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "IDENTITY_PROOF_EVIDENCE_PRESENT=true"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**IDENTITY_PROOF_EVIDENCE_PRESENT:** \`true\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "IDENTITY_PROOF_EVIDENCE_PRESENT=false"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**IDENTITY_PROOF_EVIDENCE_PRESENT:** \`false\`" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload evidence
        if: ${{ always() && steps.identity_evidence.outputs.present == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: identity-access-lifecycle-proof-${{ inputs.release_sha }}
          path: docs/security/evidence/runtime/identity-access-lifecycle-validation.json
          if-no-files-found: error
          retention-days: 90
