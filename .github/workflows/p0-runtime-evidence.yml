name: P0 Runtime Evidence

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_run:
    workflows:
      - RISCK COMPLY Upload Security CI
      - Branch Protection Runtime Proof
      - Auth RBAC Tenant Proof
      - Supabase Live RLS Validation
      - Production Runtime Proof
      - Production Provider Runtime Proof
      - Step-Up Runtime Proof
      - Stripe Runtime Evidence Promotion
      - Public Production Final
      - Audit Chain Runtime Proof
      - Enterprise Production Gate
    types: [completed]

permissions:
  actions: read
  contents: read

concurrency:
  # Producer handoffs are independent transactions keyed by their unique workflow run.
  # Direct push/PR validation is isolated by event type plus SHA, so a duplicate SHA
  # cannot cancel the other event while still de-duplicating repeated runs of one event.
  group: p0-runtime-evidence-${{ github.event.workflow_run.id || github.event_name }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  p0-runtime-evidence:
    name: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha != github.sha && 'Stale P0 runtime evidence trigger (ignored)' || 'Validate P0 runtime evidence register' }}
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.head_sha == github.sha &&
       github.event.workflow_run.head_branch == 'main' &&
       ((github.event.workflow_run.conclusion == 'success' &&
         (github.event.workflow_run.event == 'push' ||
          github.event.workflow_run.event == 'workflow_dispatch')) ||
        (github.event.workflow_run.path == '.github/workflows/enterprise-production-gate.yml' &&
         (github.event.workflow_run.conclusion == 'success' ||
          github.event.workflow_run.conclusion == 'failure'))))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ASSESSED_SHA: ${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha || github.sha }}
      RELEASE_COMMIT_SHA: ${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha || github.sha }}
      UPLOAD_SCANNER_RUNTIME_SOURCE_RUN_ID: ${{ github.event.workflow_run.path == '.github/workflows/upload-security-ci.yml' && github.event.workflow_run.id || '' }}
      BRANCH_PROTECTION_RUNTIME_SOURCE_RUN_ID: ${{ github.event.workflow_run.path == '.github/workflows/branch-protection-runtime-proof.yml' && github.event.workflow_run.id || '' }}
      AUTH_RBAC_RUNTIME_SOURCE_RUN_ID: ${{ github.event.workflow_run.path == '.github/workflows/auth-rbac-runtime-proof.yml' && github.event.workflow_run.id || '' }}
      SUPABASE_RLS_RUNTIME_SOURCE_RUN_ID: ${{ github.event.workflow_run.path == '.github/workflows/supabase-live-rls-validation.yml' && github.event.workflow_run.id || '' }}
      PRODUCTION_RUNTIME_SOURCE_RUN_ID: ${{ github.event.workflow_run.path == '.github/workflows/production-runtime-proof.yml' && github.event.workflow_run.id || '' }}
      PRODUCTION_PROVIDER_RUNTIME_SOURCE_RUN_ID: ${{ github.event.workflow_run.path == '.github/workflows/production-provider-runtime-proof.yml' && github.event.workflow_run.id || '' }}
      STEP_UP_RUNTIME_SOURCE_RUN_ID: ${{ github.event.workflow_run.path == '.github/workflows/step-up-runtime-proof.yml' && github.event.workflow_run.id || '' }}
      STRIPE_RUNTIME_SOURCE_RUN_ID: ${{ github.event.workflow_run.path == '.github/workflows/stripe-runtime-evidence-promotion.yml' && github.event.workflow_run.id || '' }}
      PUBLIC_FINAL_RUNTIME_SOURCE_RUN_ID: ${{ github.event.workflow_run.path == '.github/workflows/public-production-final.yml' && github.event.workflow_run.id || '' }}
      AUDIT_CHAIN_RUNTIME_SOURCE_RUN_ID: ${{ github.event.workflow_run.path == '.github/workflows/audit-chain-runtime-proof.yml' && github.event.workflow_run.id || '' }}
    steps:
      - name: Checkout exact assessed SHA
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ env.ASSESSED_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies deterministically
        run: npm ci --ignore-scripts

      - name: Verify exact assessed checkout
        run: |
          set -euo pipefail
          [[ "$ASSESSED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$ASSESSED_SHA"

      - name: Generate exact-SHA required status checks evidence
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ env.ASSESSED_SHA }}
          CHECKED_OUT_SHA: ${{ env.ASSESSED_SHA }}
        run: node scripts/enterprise/build-required-status-checks-runtime-evidence.mjs

      - name: Test canonical P0 source-of-truth contracts
        run: |
          npx vitest run \
            scripts/security/p0-runtime-evidence-catalog.test.mjs \
            scripts/security/report-p0-runtime-evidence-gap.test.mjs \
            scripts/security/validate-branch-protection-freshness.test.mjs \
            scripts/security/validate-required-status-checks-runtime-evidence.test.mjs \
            scripts/release/validate-upload-scanner-runtime-evidence.test.mjs \
            scripts/release/validate-production-secrets-runtime-evidence.test.mjs \
            tests/enterprise/branch-protection-runtime-evidence-fetch.test.ts \
            tests/enterprise/required-status-checks-evidence-decomposition.test.ts \
            tests/enterprise/upload-scanner-runtime-evidence-fetch.test.ts \
            tests/enterprise/upload-scanner-p0-aggregation.test.ts \
            tests/enterprise/p0-runtime-multi-producer-aggregation.test.ts \
            tests/enterprise/p0-runtime-unified-fanin.test.ts \
            tests/enterprise/p0-production-gate-authoritative-fanin.test.ts \
            tests/enterprise/auth-rbac-runtime-evidence-fetch.test.ts \
            tests/enterprise/supabase-rls-runtime-evidence-fetch.test.ts \
            tests/enterprise/production-provider-runtime-proof.test.ts \
            tests/enterprise/production-provider-runtime-evidence-fetch.test.ts \
            tests/enterprise/step-up-runtime-evidence-fetch.test.ts \
            tests/enterprise/stripe-promoted-runtime-evidence-fetch.test.ts \
            tests/enterprise/public-production-final-evidence-fetch.test.ts \
            tests/enterprise/audit-chain-runtime-evidence-fetch.test.ts \
            tests/enterprise/audit-chain-ephemeral-runtime-proof.test.ts \
            tests/release/production-runtime-scorecard-evidence.test.ts \
            tests/security/p0-runtime-gap-strict-contract.test.ts \
            tests/security/p0-register-source-of-truth-contract.test.ts
          node --test \
            tests/security/p0-runtime-stale-workflow-run-guard.test.mjs \
            tests/security/generate-p0-runtime-evidence-register.test.mjs \
            tests/security/validate-generated-p0-runtime-evidence-register.test.mjs \
            tests/enterprise/p0-production-gate-evidence-hydration.test.mjs

      - name: Validate P0 policy register
        run: node scripts/security/check-p0-runtime-evidence-register.mjs

      - name: Hydrate all independently valid exact-SHA retained runtime evidence
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ env.ASSESSED_SHA }}
          RETAINED_PROOF_OPTIONAL_ERRORS_AS_MISSING: 'true'
        run: node scripts/release/hydrate-enterprise-retained-runtime-evidence.mjs

      - name: Retrieve exact-SHA upload scanner runtime evidence
        if: github.event_name == 'workflow_run'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ env.ASSESSED_SHA }}
          UPLOAD_SCANNER_RUNTIME_SOURCE_RUN_ID: ${{ env.UPLOAD_SCANNER_RUNTIME_SOURCE_RUN_ID }}
          UPLOAD_SCANNER_RUNTIME_EVIDENCE_REQUIRED: ${{ github.event.workflow_run.path == '.github/workflows/upload-security-ci.yml' && 'true' || 'false' }}
        run: node scripts/enterprise/aggregate-upload-scanner-runtime-evidence.mjs

      - name: Retrieve exact-SHA branch protection runtime evidence
        if: github.event_name == 'workflow_run'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ env.ASSESSED_SHA }}
          BRANCH_PROTECTION_RUNTIME_SOURCE_RUN_ID: ${{ env.BRANCH_PROTECTION_RUNTIME_SOURCE_RUN_ID }}
          BRANCH_PROTECTION_RUNTIME_EVIDENCE_REQUIRED: ${{ github.event.workflow_run.path == '.github/workflows/branch-protection-runtime-proof.yml' && 'true' || 'false' }}
        run: node scripts/enterprise/fetch-branch-protection-runtime-evidence.mjs

      - name: Retrieve exact-SHA Auth RBAC runtime evidence
        if: github.event_name == 'workflow_run'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ env.ASSESSED_SHA }}
          AUTH_RBAC_RUNTIME_SOURCE_RUN_ID: ${{ env.AUTH_RBAC_RUNTIME_SOURCE_RUN_ID }}
          AUTH_RBAC_RUNTIME_EVIDENCE_REQUIRED: ${{ github.event.workflow_run.path == '.github/workflows/auth-rbac-runtime-proof.yml' && 'true' || 'false' }}
        run: node scripts/enterprise/fetch-auth-rbac-evidence.mjs

      - name: Retrieve exact-SHA Supabase RLS runtime evidence
        if: github.event_name == 'workflow_run'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ env.ASSESSED_SHA }}
          SUPABASE_RLS_RUNTIME_SOURCE_RUN_ID: ${{ env.SUPABASE_RLS_RUNTIME_SOURCE_RUN_ID }}
          SUPABASE_RLS_RUNTIME_EVIDENCE_REQUIRED: ${{ github.event.workflow_run.path == '.github/workflows/supabase-live-rls-validation.yml' && 'true' || 'false' }}
        run: node scripts/enterprise/fetch-supabase-rls-evidence.mjs

      - name: Retrieve exact-SHA production runtime evidence
        if: github.event_name == 'workflow_run'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ env.ASSESSED_SHA }}
          PRODUCTION_RUNTIME_SOURCE_RUN_ID: ${{ env.PRODUCTION_RUNTIME_SOURCE_RUN_ID }}
          PRODUCTION_RUNTIME_EVIDENCE_REQUIRED: ${{ github.event.workflow_run.path == '.github/workflows/production-runtime-proof.yml' && 'true' || 'false' }}
        run: node scripts/enterprise/fetch-production-runtime-evidence.mjs

      - name: Retrieve exact-SHA production provider evidence
        if: github.event_name == 'workflow_run'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ env.ASSESSED_SHA }}
          PRODUCTION_PROVIDER_RUNTIME_SOURCE_RUN_ID: ${{ env.PRODUCTION_PROVIDER_RUNTIME_SOURCE_RUN_ID }}
          PRODUCTION_PROVIDER_RUNTIME_EVIDENCE_REQUIRED: ${{ github.event.workflow_run.path == '.github/workflows/production-provider-runtime-proof.yml' && 'true' || 'false' }}
        run: node scripts/enterprise/fetch-production-provider-runtime-evidence.mjs

      - name: Retrieve exact-SHA Step-Up runtime evidence
        if: github.event_name == 'workflow_run'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ env.ASSESSED_SHA }}
          STEP_UP_RUNTIME_SOURCE_RUN_ID: ${{ env.STEP_UP_RUNTIME_SOURCE_RUN_ID }}
          STEP_UP_RUNTIME_EVIDENCE_REQUIRED: ${{ github.event.workflow_run.path == '.github/workflows/step-up-runtime-proof.yml' && 'true' || 'false' }}
        run: node scripts/enterprise/fetch-step-up-runtime-evidence.mjs

      - name: Retrieve promoted exact-SHA Stripe runtime evidence
        if: github.event_name == 'workflow_run'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ env.ASSESSED_SHA }}
          STRIPE_RUNTIME_SOURCE_RUN_ID: ${{ env.STRIPE_RUNTIME_SOURCE_RUN_ID }}
          STRIPE_RUNTIME_EVIDENCE_REQUIRED: ${{ github.event.workflow_run.path == '.github/workflows/stripe-runtime-evidence-promotion.yml' && 'true' || 'false' }}
        run: node scripts/enterprise/fetch-stripe-promoted-runtime-evidence.mjs

      - name: Retrieve exact-SHA public production final evidence
        if: github.event_name == 'workflow_run'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ env.ASSESSED_SHA }}
          PUBLIC_FINAL_RUNTIME_SOURCE_RUN_ID: ${{ env.PUBLIC_FINAL_RUNTIME_SOURCE_RUN_ID }}
          PUBLIC_FINAL_RUNTIME_EVIDENCE_REQUIRED: ${{ github.event.workflow_run.path == '.github/workflows/public-production-final.yml' && 'true' || 'false' }}
        run: node scripts/enterprise/fetch-public-production-final-evidence.mjs

      - name: Retrieve exact-SHA audit-chain runtime evidence
        if: github.event_name == 'workflow_run'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ env.ASSESSED_SHA }}
          AUDIT_CHAIN_RUNTIME_SOURCE_RUN_ID: ${{ env.AUDIT_CHAIN_RUNTIME_SOURCE_RUN_ID }}
          AUDIT_CHAIN_RUNTIME_EVIDENCE_REQUIRED: ${{ github.event.workflow_run.path == '.github/workflows/audit-chain-runtime-proof.yml' && 'true' || 'false' }}
        run: node scripts/enterprise/fetch-audit-chain-runtime-evidence.mjs

      - name: Hydrate independently valid exact-SHA Enterprise Production Gate evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ env.ASSESSED_SHA }}
        run: node scripts/enterprise/fetch-production-gate-p0-evidence.mjs

      - name: Validate runtime evidence files
        run: node scripts/security/check-p0-runtime-evidence-files.mjs

      - name: Validate optional runtime evidence files
        run: node scripts/security/check-p0-runtime-evidence-optionals.mjs

      - name: Generate authoritative exact-SHA register
        run: |
          set -euo pipefail
          output=artifacts/p0-runtime-evidence-register
          mkdir -p "$output"
          node scripts/security/generate-p0-runtime-evidence-register.mjs \
            --sha="$ASSESSED_SHA" \
            --output-dir="$output" \
            > "$output/generator-output.json"
          node scripts/security/validate-generated-p0-runtime-evidence-register.mjs \
            --sha="$ASSESSED_SHA"
          cp release-validation/p0-production-gate-evidence-hydration.json "$output/"

      - name: Report current runtime evidence gaps
        run: >-
          node scripts/security/report-p0-runtime-evidence-gap.mjs
          > artifacts/p0-runtime-evidence-register/p0-runtime-gap-report.json

      - name: Generate artifact checksums
        run: |
          set -euo pipefail
          output=artifacts/p0-runtime-evidence-register
          find "$output" -maxdepth 1 -type f \( -name '*.json' -o -name '*.md' \) -print0 \
            | sort -z \
            | xargs -0 sha256sum > "$output/SHA256SUMS"

      - name: Publish P0 runtime evidence summary
        shell: bash
        run: cat artifacts/p0-runtime-evidence-register/p0-runtime-evidence-register.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload authoritative register artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: p0-runtime-evidence-register-${{ env.ASSESSED_SHA }}
          path: artifacts/p0-runtime-evidence-register
          if-no-files-found: error
          retention-days: 365
