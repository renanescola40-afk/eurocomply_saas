name: P0 Runtime Evidence

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: p0-runtime-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  p0-runtime-evidence:
    name: Validate P0 runtime evidence register
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Validate runtime evidence register
        run: node scripts/security/check-p0-runtime-evidence-register.mjs
