name: P0 Runtime Evidence

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_run:
    workflows:
      - RISCK COMPLY Upload Security CI
    types: [completed]

permissions:
  actions: read
  contents: read

concurrency:
  group: p0-runtime-evidence-${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  p0-runtime-evidence:
    name: Validate P0 runtime evidence register
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ASSESSED_SHA: ${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha || github.sha }}
      RELEASE_COMMIT_SHA: ${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha || github.sha }}
      UPLOAD_SCANNER_RUNTIME_SOURCE_RUN_ID: ${{ github.event.workflow_run.name == 'RISCK COMPLY Upload Security CI' && github.event.workflow_run.id || '' }}
    steps:
      - name: Checkout exact assessed SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ env.ASSESSED_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies deterministically
        run: npm ci --ignore-scripts

      - name: Verify exact assessed checkout
        run: |
          set -euo pipefail
          [[ "$ASSESSED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$ASSESSED_SHA"

      - name: Test canonical P0 source-of-truth contracts
        run: |
          npx vitest run \
            scripts/security/p0-runtime-evidence-catalog.test.mjs \
            scripts/security/report-p0-runtime-evidence-gap.test.mjs \
            scripts/release/validate-upload-scanner-runtime-evidence.test.mjs \
            tests/enterprise/upload-scanner-runtime-evidence-fetch.test.ts \
            tests/security/p0-runtime-gap-strict-contract.test.ts \
            tests/security/p0-register-source-of-truth-contract.test.ts
          node --test \
            tests/security/generate-p0-runtime-evidence-register.test.mjs \
            tests/security/validate-generated-p0-runtime-evidence-register.test.mjs

      - name: Validate P0 policy register
        run: node scripts/security/check-p0-runtime-evidence-register.mjs

      - name: Retrieve exact-SHA upload scanner runtime evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ env.ASSESSED_SHA }}
          UPLOAD_SCANNER_RUNTIME_SOURCE_RUN_ID: ${{ env.UPLOAD_SCANNER_RUNTIME_SOURCE_RUN_ID }}
          UPLOAD_SCANNER_RUNTIME_EVIDENCE_REQUIRED: ${{ github.event_name == 'workflow_run' && 'true' || 'false' }}
        run: node scripts/enterprise/fetch-upload-scanner-runtime-evidence.mjs

      - name: Validate runtime evidence files
        run: node scripts/security/check-p0-runtime-evidence-files.mjs

      - name: Validate optional runtime evidence files
        run: node scripts/security/check-p0-runtime-evidence-optionals.mjs

      - name: Generate authoritative exact-SHA register
        run: |
          set -euo pipefail
          output=artifacts/p0-runtime-evidence-register
          mkdir -p "$output"
          node scripts/security/generate-p0-runtime-evidence-register.mjs \
            --sha="$ASSESSED_SHA" \
            --output-dir="$output" \
            > "$output/generator-output.json"
          node scripts/security/validate-generated-p0-runtime-evidence-register.mjs \
            --sha="$ASSESSED_SHA"

      - name: Report current runtime evidence gaps
        run: >-
          node scripts/security/report-p0-runtime-evidence-gap.mjs
          > artifacts/p0-runtime-evidence-register/p0-runtime-gap-report.json

      - name: Generate artifact checksums
        run: |
          set -euo pipefail
          output=artifacts/p0-runtime-evidence-register
          find "$output" -maxdepth 1 -type f \( -name '*.json' -o -name '*.md' \) -print0 \
            | sort -z \
            | xargs -0 sha256sum > "$output/SHA256SUMS"

      - name: Publish P0 runtime evidence summary
        shell: bash
        run: cat artifacts/p0-runtime-evidence-register/P0_RUNTIME_EVIDENCE_REGISTER.generated.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload authoritative register artifact
        uses: actions/upload-artifact@v7
        with:
          name: p0-runtime-evidence-register-${{ env.ASSESSED_SHA }}
          path: artifacts/p0-runtime-evidence-register
          if-no-files-found: error
          retention-days: 365
