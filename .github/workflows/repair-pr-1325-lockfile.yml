name: Repair PR 1325 lockfile

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: repair-pr-1325-lockfile
  cancel-in-progress: true

jobs:
  repair:
    if: github.event.pull_request.number == 1325 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Regenerate deterministic lockfile
        run: |
          npm install --package-lock-only --ignore-scripts
          npm ci --ignore-scripts
          npm audit --audit-level=moderate

      - name: Commit repaired lockfile and remove temporary workflow
        run: |
          rm -f .github/workflows/repair-pr-1325-lockfile.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json .github/workflows/repair-pr-1325-lockfile.yml
          if git diff --cached --quiet; then
            echo "No lockfile change was required."
            exit 0
          fi
          git commit -m "fix(deps): regenerate audited lockfile for PR 1325"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
