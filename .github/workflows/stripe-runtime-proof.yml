name: Stripe Runtime Proof

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/stripe-runtime-proof.yml'
      - 'scripts/security/run-stripe-runtime-validation.mjs'
      - 'src/app/api/billing/**'
      - 'src/app/api/stripe/webhook/**'
      - 'src/server/billing/**'
      - 'supabase/migrations/*stripe*'

permissions:
  contents: read

concurrency:
  group: stripe-runtime-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stripe-runtime-proof:
    name: Run focused Stripe runtime proof
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies deterministically without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Run focused Stripe route and webhook tests
        run: npx vitest run src/app/api/billing/checkout/route.test.ts src/app/api/billing/portal/route.test.ts src/app/api/stripe/webhook/route.test.ts src/app/api/billing/webhook/route.test.ts src/server/billing/stripe-webhooks.test.ts

      - name: Generate Stripe runtime validation evidence
        run: node scripts/security/run-stripe-runtime-validation.mjs --update-register

      - name: Validate runtime evidence files
        run: node scripts/security/check-p0-runtime-evidence-files.mjs

      - name: Upload Stripe runtime evidence
        uses: actions/upload-artifact@v7
        with:
          name: stripe-billing-validation
          path: |
            docs/security/evidence/runtime/stripe-billing-validation.json
            docs/security/P0_RUNTIME_EVIDENCE_REGISTER.md
          if-no-files-found: error
