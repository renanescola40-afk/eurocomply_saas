name: Supabase Production RLS Reconciliation

run-name: Supabase RLS ${{ inputs.mode }} for ${{ inputs.release_sha }}

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact 40-character SHA currently at the tip of main
        required: true
        type: string
      mode:
        description: Verify current production state without writes, or explicitly apply the idempotent hotfix first
        required: true
        default: verify_only
        type: choice
        options:
          - verify_only
          - apply
      confirmation:
        description: Required only for apply mode; type APPLY_RLS_RECONCILIATION
        required: false
        default: ''
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: supabase-production-rls-reconciliation
  cancel-in-progress: false

jobs:
  governance:
    name: Verify production environment governance before protected secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TARGET_SHA: ${{ inputs.release_sha }}
      GITHUB_ENVIRONMENT_NAME: production
      REQUIRE_PROTECTED_BRANCHES: 'true'
      GITHUB_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout exact assessed main SHA without credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ inputs.release_sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact current main SHA before governance lookup
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git ls-remote origin refs/heads/main | grep -q "^${TARGET_SHA}"

      - name: Verify production environment governance before protected secrets
        shell: bash
        run: node scripts/security/check-github-environment-governance.mjs

  reconcile:
    name: Verify or explicitly apply production RLS reconciliation
    needs: governance
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    env:
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_DB_POOLER_URL: ${{ secrets.SUPABASE_DB_POOLER_URL }}
      PGSSLMODE: require

    steps:
      - name: Check out trusted main
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Authorize exact main SHA and requested mode
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          MODE: ${{ inputs.mode }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          main_sha="$(git rev-parse origin/main)"
          [[ "$RELEASE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          test "${RELEASE_SHA,,}" = "$main_sha"
          test "$(git rev-parse HEAD)" = "$main_sha"
          case "$MODE" in
            verify_only)
              ;;
            apply)
              test "$CONFIRMATION" = "APPLY_RLS_RECONCILIATION"
              ;;
            *)
              echo 'Unsupported RLS reconciliation mode' >&2
              exit 1
              ;;
          esac

      - name: Validate production configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_DB_POOLER_URL:-}"
          [[ "${SUPABASE_PROJECT_ID:-}" =~ ^[a-z0-9]{20}$ ]]
          case "$SUPABASE_DB_POOLER_URL" in
            postgresql://*|postgres://*) ;;
            *) echo 'SUPABASE_DB_POOLER_URL must be a PostgreSQL connection string' >&2; exit 1 ;;
          esac
          case "$SUPABASE_DB_POOLER_URL" in
            *pooler.supabase.com*) ;;
            *) echo 'SUPABASE_DB_POOLER_URL must use the Supabase pooler endpoint' >&2; exit 1 ;;
          esac

      - name: Test proof and closure evidence contracts
        shell: bash
        run: |
          set -euo pipefail
          node --test \
            scripts/supabase/verify-rls-reconciliation-proof.test.mjs \
            scripts/supabase/write-rls-reconciliation-closure-evidence.test.mjs

      - name: Install PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y postgresql-client

      - name: Apply idempotent RLS reconciliation only when explicitly authorized
        if: ${{ inputs.mode == 'apply' }}
        shell: bash
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_POOLER_URL" \
            --set ON_ERROR_STOP=1 \
            --file supabase/reconciliation/20260726070000_permissions_catalog_rls_hotfix.sql

      - name: Collect RLS, grants, policies and migration evidence read-only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/supabase-rls-reconciliation
          psql "$SUPABASE_DB_POOLER_URL" --set ON_ERROR_STOP=1 --tuples-only --no-align <<'SQL' | sed '/^[[:space:]]*$/d' | tee artifacts/supabase-rls-reconciliation/reconciliation-proof.txt
          select 'rls|' || c.relname || '|' || c.relrowsecurity || '|' || c.relforcerowsecurity
          from pg_class c
          join pg_namespace n on n.oid = c.relnamespace
          where n.nspname = 'public'
            and c.relname in ('permissions', 'role_permissions', 'stripe_webhook_events')
          order by c.relname;

          select 'policy|' || tablename || '|' || policyname || '|' || cmd || '|' || array_to_string(roles, ',')
          from pg_policies
          where schemaname = 'public'
            and tablename in ('permissions', 'role_permissions', 'stripe_webhook_events')
          order by tablename, policyname;

          select 'grant|' || table_name || '|' || grantee || '|' || privilege_type
          from information_schema.table_privileges
          where table_schema = 'public'
            and table_name in ('permissions', 'role_permissions', 'stripe_webhook_events')
            and grantee in ('PUBLIC', 'anon', 'authenticated', 'service_role')
          order by table_name, grantee, privilege_type;

          select 'history|' || version || '|' || coalesce(name, '')
          from supabase_migrations.schema_migrations
          where version in ('20260726070000', '20260812224650')
          order by version;
          SQL

      - name: Verify reconciliation proof deterministically
        shell: bash
        run: |
          set -euo pipefail
          node scripts/supabase/verify-rls-reconciliation-proof.mjs \
            artifacts/supabase-rls-reconciliation/reconciliation-proof.txt \
            artifacts/supabase-rls-reconciliation/verification.json
          sha256sum artifacts/supabase-rls-reconciliation/* \
            > artifacts/supabase-rls-reconciliation/SHA256SUMS

      - name: Emit canonical exact-SHA Enterprise 100 evidence
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          node scripts/supabase/write-rls-reconciliation-closure-evidence.mjs \
            artifacts/supabase-rls-reconciliation/verification.json \
            artifacts/supabase-rls-reconciliation/reconciliation-proof.txt \
            release-validation/supabase-rls-reconciliation.json \
            "${RELEASE_SHA,,}" \
            "$GITHUB_RUN_ID" \
            "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Publish verification summary
        if: always()
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          MODE: ${{ inputs.mode }}
        run: |
          {
            echo '## Supabase production RLS reconciliation'
            echo
            echo "- Release SHA: \`$RELEASE_SHA\`"
            echo "- Mode: \`$MODE\`"
            echo "- Project ref suffix: \`${SUPABASE_PROJECT_ID: -6}\`"
            echo '- Connection path: Supabase Session Pooler (secret-backed)'
            if [ "$MODE" = 'verify_only' ]; then
              echo "- Production SQL mutation requested: \`false\`"
            else
              echo "- Production SQL mutation requested: \`true\` (explicit apply mode)"
            fi
            if [ -f artifacts/supabase-rls-reconciliation/verification.json ]; then
              status="$(node -e "const r=require('./artifacts/supabase-rls-reconciliation/verification.json'); process.stdout.write(r.status)")"
              echo "- Verification status: \`$status\`"
            else
              echo "- Verification status: \`NOT_PRODUCED\`"
            fi
            if [ -f release-validation/supabase-rls-reconciliation.json ]; then
              echo "- Enterprise 100 canonical evidence: \`produced\`"
            else
              echo "- Enterprise 100 canonical evidence: \`not produced\`"
            fi
            if [ -f artifacts/supabase-rls-reconciliation/reconciliation-proof.txt ]; then
              echo '- Verification evidence:'
              echo '```text'
              cat artifacts/supabase-rls-reconciliation/reconciliation-proof.txt
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload immutable reconciliation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: supabase-rls-reconciliation-${{ inputs.release_sha }}
          path: |
            artifacts/supabase-rls-reconciliation
            release-validation/supabase-rls-reconciliation.json
          if-no-files-found: error
          retention-days: 90
