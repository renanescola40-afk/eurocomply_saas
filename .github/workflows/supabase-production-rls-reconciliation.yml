name: Supabase Production RLS Reconciliation

run-name: Supabase RLS reconciliation for ${{ inputs.release_sha }}

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact 40-character SHA currently at the tip of main
        required: true
        type: string
      confirmation:
        description: Type APPLY_RLS_RECONCILIATION to authorize the production hotfix
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: supabase-production-rls-reconciliation
  cancel-in-progress: false

jobs:
  reconcile:
    name: Apply and verify idempotent production RLS reconciliation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PGSSLMODE: require

    steps:
      - name: Check out trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Authorize exact main SHA
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          main_sha="$(git rev-parse origin/main)"
          [[ "$RELEASE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          test "${RELEASE_SHA,,}" = "$main_sha"
          test "$CONFIRMATION" = "APPLY_RLS_RECONCILIATION"
          test "$(git rev-parse HEAD)" = "$main_sha"

      - name: Validate production configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_DB_PASSWORD:-}"
          [[ "${SUPABASE_PROJECT_ID:-}" =~ ^[a-z0-9]{20}$ ]]

      - name: Install PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y postgresql-client

      - name: Apply idempotent RLS reconciliation
        shell: bash
        env:
          PGHOST: db.${{ secrets.SUPABASE_PROJECT_ID }}.supabase.co
          PGPORT: '5432'
          PGDATABASE: postgres
          PGUSER: postgres
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          psql --set ON_ERROR_STOP=1 \
            --file supabase/reconciliation/20260726070000_permissions_catalog_rls_hotfix.sql

      - name: Verify RLS, grants, policies and migration evidence
        shell: bash
        env:
          PGHOST: db.${{ secrets.SUPABASE_PROJECT_ID }}.supabase.co
          PGPORT: '5432'
          PGDATABASE: postgres
          PGUSER: postgres
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          psql --set ON_ERROR_STOP=1 --tuples-only --no-align <<'SQL' | tee reconciliation-proof.txt
          select 'rls|' || c.relname || '|' || c.relrowsecurity || '|' || c.relforcerowsecurity
          from pg_class c
          join pg_namespace n on n.oid = c.relnamespace
          where n.nspname = 'public'
            and c.relname in ('permissions', 'role_permissions', 'stripe_webhook_events')
          order by c.relname;

          select 'policy|' || tablename || '|' || policyname || '|' || cmd || '|' || array_to_string(roles, ',')
          from pg_policies
          where schemaname = 'public'
            and tablename in ('permissions', 'role_permissions', 'stripe_webhook_events')
          order by tablename, policyname;

          select 'history|' || version || '|' || coalesce(name, '')
          from supabase_migrations.schema_migrations
          where version = '20260726070000';
          SQL

          grep -Fx 'rls|permissions|t|t' reconciliation-proof.txt
          grep -Fx 'rls|role_permissions|t|t' reconciliation-proof.txt
          grep -Fx 'rls|stripe_webhook_events|t|t' reconciliation-proof.txt
          grep -F 'policy|permissions|permissions_authenticated_read|SELECT|authenticated' reconciliation-proof.txt
          grep -F 'policy|role_permissions|role_permissions_authenticated_read|SELECT|authenticated' reconciliation-proof.txt
          if grep -F 'policy|stripe_webhook_events|' reconciliation-proof.txt; then
            echo 'stripe_webhook_events must remain policy-free and backend-only' >&2
            exit 1
          fi
          grep -F 'history|20260726070000|permissions_catalog_rls_hotfix' reconciliation-proof.txt

      - name: Publish verification summary
        if: always()
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          {
            echo '## Supabase production RLS reconciliation'
            echo
            echo "- Release SHA: \`$RELEASE_SHA\`"
            echo "- Project ref suffix: \`${SUPABASE_PROJECT_ID: -6}\`"
            if [ -f reconciliation-proof.txt ]; then
              echo '- Verification evidence:'
              echo '```text'
              cat reconciliation-proof.txt
              echo '```'
            else
              echo '- Verification evidence was not produced.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
