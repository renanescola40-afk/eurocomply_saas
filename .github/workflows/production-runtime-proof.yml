name: Production Runtime Proof

run-name: Production runtime proof for ${{ inputs.release_sha || github.sha }}

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_sha:
        description: Optional full current main SHA; defaults to triggering SHA
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: production-runtime-proof-${{ inputs.release_sha || github.sha }}
  cancel-in-progress: false

jobs:
  validate-production-runtime:
    name: Validate exact-SHA production runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: Production
    env:
      TARGET_SHA: ${{ inputs.release_sha || github.sha }}
      RELEASE_COMMIT_SHA: ${{ inputs.release_sha || github.sha }}
      RELEASE_BUILD_SHA: ${{ inputs.release_sha || github.sha }}
      RELEASE_DEPLOYMENT_URL: https://risckcomply.com
      RELEASE_PRODUCTION_URL: https://risckcomply.com
      RELEASE_TARGET: production-runtime-proof
      HEALTHCHECK_TOKEN: ${{ secrets.HEALTHCHECK_TOKEN }}

    steps:
      - name: Validate exact current main SHA
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ ! "$TARGET_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "release_sha must be a full Git SHA" >&2
            exit 1
          fi
          TARGET_SHA="${TARGET_SHA,,}"
          {
            echo "TARGET_SHA=$TARGET_SHA"
            echo "RELEASE_COMMIT_SHA=$TARGET_SHA"
            echo "RELEASE_BUILD_SHA=$TARGET_SHA"
          } >> "$GITHUB_ENV"
          MAIN_SHA="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/main" | jq -r '.sha')"
          test "$MAIN_SHA" = "$TARGET_SHA"

      - name: Checkout exact release SHA
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ inputs.release_sha || github.sha }}
          persist-credentials: false

      - name: Verify exact checkout
        run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm

      - name: Install deterministic dependencies
        run: npm ci --ignore-scripts

      - name: Validate runtime proof contracts
        run: npx vitest run tests/release/production-runtime-scorecard-evidence.test.ts

      - name: Wait for canonical deployment and execute proof
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 15); do
            echo "Production runtime proof attempt $attempt/15"
            rm -f \
              docs/security/evidence/runtime/deployment-smoke-validation.json \
              docs/security/evidence/runtime/runtime-release-sha-validation.json \
              docs/security/evidence/runtime/security-headers-validation.json \
              docs/security/evidence/runtime/no-store-validation.json \
              docs/security/evidence/runtime/production-runtime-validation.json

            if node scripts/release/run-production-runtime-response-proof.mjs \
              && node scripts/release/verify-runtime-release-sha.mjs \
              && node scripts/release/write-security-response-evidence.mjs \
              && ENTERPRISE_EXPECTED_SHA="$TARGET_SHA" node scripts/security/write-production-runtime-scorecard-evidence.mjs; then
              exit 0
            fi

            if [ "$attempt" -eq 15 ]; then
              echo "Exact-SHA production runtime proof did not converge." >&2
              exit 1
            fi
            sleep 60
          done

      - name: Upload redacted exact-SHA runtime evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: production-runtime-proof-${{ env.TARGET_SHA }}
          path: |
            docs/security/evidence/runtime/deployment-smoke-validation.json
            docs/security/evidence/runtime/runtime-release-sha-validation.json
            docs/security/evidence/runtime/security-headers-validation.json
            docs/security/evidence/runtime/no-store-validation.json
            docs/security/evidence/runtime/production-runtime-validation.json
          if-no-files-found: error
          retention-days: 90
