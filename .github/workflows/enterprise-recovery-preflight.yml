name: Enterprise recovery preflight (no data export)
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type PREFLIGHT_ONLY to run read-only connectivity checks'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: risck-recovery-preflight
  cancel-in-progress: false
jobs:
  preflight:
    if: ${{ inputs.confirm == 'PREFLIGHT_ONLY' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      PGCONNECT_TIMEOUT: '8'
      PGSSLMODE: verify-full
      PGSSLROOTCERT: /etc/ssl/certs/ca-certificates.crt
      PGOPTIONS: '-c statement_timeout=10000'
    steps:
      - name: Check required secret without printing it
        shell: bash
        env:
          RISCK_BACKUP_DATABASE_URL: ${{ secrets.RISCK_BACKUP_DATABASE_URL }}
        run: |
          set -euo pipefail
          if [[ -z "${RISCK_BACKUP_DATABASE_URL:-}" ]]; then
            echo "::error::Missing RISCK_BACKUP_DATABASE_URL GitHub Actions secret."
            exit 1
          fi
          echo "Secret presence: PASS"
      - name: Verify PostgreSQL 17 client image
        shell: bash
        run: |
          set -euo pipefail
          docker pull postgres:17
          docker run --rm postgres:17 pg_dump --version
          docker run --rm postgres:17 pg_restore --version
      - name: Read-only connection check
        shell: bash
        env:
          RISCK_BACKUP_DATABASE_URL: ${{ secrets.RISCK_BACKUP_DATABASE_URL }}
        run: |
          set -euo pipefail
          set +x
          # The connection string is never echoed or written to an artifact.
          # The connection URL must use a least-privilege read-only role and sslmode=verify-full.
          # Do not pass a privileged postgres/service role URL.
          result="$(docker run --rm --network host \
            -e RISCK_BACKUP_DATABASE_URL \
            -e PGCONNECT_TIMEOUT=8 \
            -e PGSSLMODE=verify-full \
            postgres:17 sh -c 'psql "$RISCK_BACKUP_DATABASE_URL" -X -qAt -v ON_ERROR_STOP=1 -c "show server_version_num"')"
          if [[ ! "$result" =~ ^[0-9]+$ ]] || (( result < 170000 )); then
            echo "::error::Expected PostgreSQL 17 or newer."
            exit 1
          fi
          echo "PostgreSQL 17+ connection: PASS (TLS verification depends on the URL sslmode and CA settings)"
          echo "No backup was taken. No data was exported."
