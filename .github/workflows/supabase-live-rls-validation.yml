name: Supabase Live RLS Validation

run-name: Supabase live RLS proof for ${{ inputs.release_sha || github.sha }}

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_sha:
        description: Optional full 40-character current main SHA; defaults to the triggering SHA
        required: false
        type: string
      apply_migrations:
        description: Apply the committed RLS validation migrations before the proof
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: supabase-live-rls-validation-${{ inputs.release_sha || github.sha }}
  cancel-in-progress: false

jobs:
  live-rls-validation:
    name: Run live tenant isolation proof
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: supabase-live-rls-validation
    env:
      TARGET_SHA: ${{ inputs.release_sha || github.sha }}

    steps:
      - name: Validate requested release SHA
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$TARGET_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "release_sha must be a full 40-character Git SHA" >&2
            exit 1
          fi
          echo "TARGET_SHA=${TARGET_SHA,,}" >> "$GITHUB_ENV"

      - name: Check out exact release SHA
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ inputs.release_sha || github.sha }}
          persist-credentials: false

      - name: Verify exact current main checkout
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          OBSERVED_SHA="$(git rev-parse HEAD)"
          test "$OBSERVED_SHA" = "$TARGET_SHA"
          test "$GITHUB_SHA" = "$TARGET_SHA"
          MAIN_SHA="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/main" | jq -r '.sha')"
          test "$MAIN_SHA" = "$TARGET_SHA"

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies deterministically
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate Supabase RLS proof contracts
        run: >-
          npx vitest run
          tests/enterprise/supabase-rls-runtime-evidence-fetch.test.ts
          tests/security/supabase-rls-scorecard-evidence.test.ts

      - name: Apply live RLS policy and inventory helper migrations
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.apply_migrations }}
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_DB_URL:-}" ]; then
            echo "SUPABASE_DB_URL is required when apply_migrations=true." >&2
            exit 1
          fi
          if printf '%s' "$SUPABASE_DB_URL" | grep -Eq '@db\.[^.]+\.supabase\.co:5432/'; then
            echo "Use the Supabase IPv4 transaction pooler URI rather than the direct IPv6-only endpoint." >&2
            exit 1
          fi
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          for migration in \
            supabase/migrations/20260623120000_live_rls_validation_inventory.sql \
            supabase/migrations/20260624220000_live_rls_validation_missing_tables.sql \
            supabase/migrations/20260624223000_live_rls_audit_entity_id_text.sql \
            supabase/migrations/20260624170400_live_rls_validation_drop_apply_helpers.sql \
            supabase/migrations/20260624170500_live_rls_validation_policy_patch.sql \
            supabase/migrations/20260625193000_clerk_organization_identity_mapping.sql \
            supabase/migrations/20260626120000_clerk_uuid_safe_rls_helpers.sql \
            supabase/migrations/20260629110000_enterprise_tenant_rls_cleanup_indexes.sql \
            supabase/migrations/20260701150000_supabase_production_rls_proof_hardening.sql \
            supabase/migrations/20260702112000_apply_invitations_live_rls_validation.sql
          do
            psql "$SUPABASE_DB_URL" --set=ON_ERROR_STOP=1 --file="$migration"
          done

      - name: Run strict Supabase tenant isolation validator
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RLS_LIVE_UPDATE_REGISTER: '0'
        run: node scripts/security/run-supabase-live-tenant-isolation.mjs

      - name: Stamp GitHub Actions provenance
        run: node scripts/security/stamp-supabase-live-rls-provenance.mjs

      - name: Validate redacted source runtime evidence
        env:
          ENTERPRISE_EXPECTED_SHA: ${{ env.TARGET_SHA }}
          SUPABASE_RLS_RUNTIME_SOURCE_RUN_ID: ${{ github.run_id }}
        run: node scripts/security/check-supabase-rls-runtime-evidence.mjs

      - name: Derive canonical scorecard evidence
        env:
          ENTERPRISE_EXPECTED_SHA: ${{ env.TARGET_SHA }}
        run: node scripts/security/write-supabase-rls-scorecard-evidence.mjs

      - name: Validate canonical scorecard evidence
        env:
          ENTERPRISE_EXPECTED_SHA: ${{ env.TARGET_SHA }}
        run: node scripts/security/check-supabase-rls-scorecard-evidence.mjs

      - name: Upload redacted runtime and scorecard evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: supabase-live-rls-runtime-proof-${{ env.TARGET_SHA }}
          path: |
            docs/security/evidence/runtime/supabase-live-rls-validation.json
            docs/security/evidence/runtime/supabase-rls-validation.json
          if-no-files-found: error
          retention-days: 90
