name: Supabase Live RLS Validation

on:
  workflow_dispatch:
    inputs:
      evidence_branch:
        description: Branch to receive generated live RLS evidence
        required: true
        default: security/supabase-live-rls-evidence
      update_register:
        description: Update the P0 runtime evidence register when validation passes
        required: true
        type: boolean
        default: true
      apply_migrations:
        description: Apply the committed live RLS policy and inventory helper migrations before running the live validator
        required: true
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

jobs:
  live-rls-validation:
    name: Run live tenant isolation proof
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.ref == 'refs/heads/main'
    environment: supabase-live-rls-validation
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: true
          fetch-depth: 0

      - name: Verify trusted workflow ref
        run: |
          test "${GITHUB_REF}" = "refs/heads/main"
          test "$(git rev-parse --abbrev-ref HEAD)" = "main"

      - name: Configure Git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies deterministically
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Apply live RLS policy and inventory helper migrations
        if: ${{ inputs.apply_migrations }}
        env:
          SUPABASE_DB_URL: ${{ secrets['SUPABASE_DB_URL'] }}
        run: |
          if [ -z "${SUPABASE_DB_URL}" ]; then
            echo "SUPABASE_DB_URL is required when apply_migrations=true."
            echo "Add the Supabase Postgres transaction pooler connection string as an environment/repository secret, or apply the live RLS policy and inventory helper migrations manually and rerun with apply_migrations=false."
            exit 1
          fi

          if printf '%s' "${SUPABASE_DB_URL}" | grep -Eq '@db\.[^.]+\.supabase\.co:5432/'; then
            echo "SUPABASE_DB_URL appears to use the direct IPv6-only Supabase database endpoint."
            echo "GitHub-hosted runners cannot reliably reach that endpoint. Use the Supabase IPv4 transaction pooler URI from Connect > Transaction pooler, typically on port 6543, then rerun with apply_migrations=true."
            exit 1
          fi

          sudo apt-get update
          sudo apt-get install -y postgresql-client
          for migration in \
            supabase/migrations/20260623120000_live_rls_validation_inventory.sql \
            supabase/migrations/20260624220000_live_rls_validation_missing_tables.sql \
            supabase/migrations/20260624223000_live_rls_audit_entity_id_text.sql \
            supabase/migrations/20260624170400_live_rls_validation_drop_apply_helpers.sql \
            supabase/migrations/20260624170500_live_rls_validation_policy_patch.sql \
            supabase/migrations/20260625193000_clerk_organization_identity_mapping.sql \
            supabase/migrations/20260626120000_clerk_uuid_safe_rls_helpers.sql \
            supabase/migrations/20260629110000_enterprise_tenant_rls_cleanup_indexes.sql \
            supabase/migrations/20260701150000_supabase_production_rls_proof_hardening.sql \
            supabase/migrations/20260702112000_apply_invitations_live_rls_validation.sql
          do
            psql "${SUPABASE_DB_URL}" \
              --set=ON_ERROR_STOP=1 \
              --file="$migration"
          done

      - name: Run strict Supabase tenant isolation validator
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets['NEXT_PUBLIC_SUPABASE_URL'] }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets['NEXT_PUBLIC_SUPABASE_ANON_KEY'] }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets['SUPABASE_SERVICE_ROLE_KEY'] }}
          RLS_LIVE_UPDATE_REGISTER: ${{ inputs.update_register && '1' || '0' }}
        run: node scripts/security/run-supabase-live-tenant-isolation.mjs

      - name: Stamp GitHub Actions provenance
        run: node scripts/security/stamp-supabase-live-rls-provenance.mjs

      - name: Validate generated evidence before commit
        run: |
          node scripts/security/check-p0-runtime-evidence-register.mjs
          node scripts/security/enforce-supabase-rls-live-complete.mjs

      - name: Commit evidence to dedicated branch
        env:
          EVIDENCE_BRANCH: ${{ inputs.evidence_branch }}
        run: |
          git checkout -B "$EVIDENCE_BRANCH"
          git add docs/security/evidence/runtime/supabase-live-rls-validation.json docs/security/P0_RUNTIME_EVIDENCE_REGISTER.md
          git commit -m "Add passing Supabase live RLS evidence"
          git push --force-with-lease origin "$EVIDENCE_BRANCH"

      - name: Upload generated evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: supabase-live-rls-validation-evidence
          path: |
            docs/security/evidence/runtime/supabase-live-rls-validation.json
            docs/security/P0_RUNTIME_EVIDENCE_REGISTER.md
          if-no-files-found: error
          retention-days: 30

      - name: Open evidence pull request
        env:
          GH_TOKEN: ${{ github.token }}
          EVIDENCE_BRANCH: ${{ inputs.evidence_branch }}
        run: |
          existing_pr=$(gh pr list --head "$EVIDENCE_BRANCH" --base main --json number --jq '.[0].number // empty')
          if [ -n "$existing_pr" ]; then
            gh pr comment "$existing_pr" --body "Supabase live RLS validation passed again; evidence branch updated."
          else
            gh pr create \
              --base main \
              --head "$EVIDENCE_BRANCH" \
              --title "Add passing Supabase live RLS evidence" \
              --body "This PR was generated by the manual Supabase Live RLS Validation workflow after the strict tenant-isolation proof passed against the configured Supabase project."
          fi
