name: Supabase Live RLS Validation

run-name: Supabase post-V20 live RLS proof for ${{ inputs.release_sha }}

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact current main SHA successfully promoted by the governed V20 chain
        required: true
        type: string
      promotion_run_id:
        description: Successful Supabase Forward Reconciliation Production Promotion run ID for this exact SHA
        required: true
        type: string
      confirmation:
        description: Type EXECUTE_POST_V20_RUNTIME_PROOF
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: supabase-live-rls-validation-${{ inputs.release_sha }}
  cancel-in-progress: false

jobs:
  governance:
    name: Verify exact post-V20 proof authority before protected secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TARGET_SHA: ${{ inputs.release_sha }}
      PROMOTION_RUN_ID: ${{ inputs.promotion_run_id }}
      INPUT_CONFIRMATION: ${{ inputs.confirmation }}
      GITHUB_ENVIRONMENT_NAME: supabase-live-rls-validation
      REQUIRE_PROTECTED_BRANCHES: 'true'
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Check out exact current main without credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js for governance validation
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22

      - name: Validate exact-SHA post-promotion authority
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$PROMOTION_RUN_ID" =~ ^[0-9]+$ ]]
          test "$INPUT_CONFIRMATION" = 'EXECUTE_POST_V20_RUNTIME_PROOF'
          test "$GITHUB_REF_NAME" = 'main'
          test "$GITHUB_SHA" = "$TARGET_SHA"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')" = "$TARGET_SHA"

          promotion_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PROMOTION_RUN_ID}")"
          test "$(jq -r '.head_sha' <<<"$promotion_json")" = "$TARGET_SHA"
          test "$(jq -r '.path' <<<"$promotion_json")" = '.github/workflows/supabase-forward-reconciliation-production-promotion.yml'
          test "$(jq -r '.event' <<<"$promotion_json")" = 'workflow_dispatch'
          test "$(jq -r '.conclusion' <<<"$promotion_json")" = 'success'

      - name: Verify protected environment governance before secrets
        run: node scripts/security/check-github-environment-governance.mjs

  live-proof:
    name: Run promotion-bound V20 tenant and payment-first proof
    needs: governance
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: supabase-live-rls-validation
    env:
      TARGET_SHA: ${{ inputs.release_sha }}
      PROMOTION_RUN_ID: ${{ inputs.promotion_run_id }}
      INPUT_CONFIRMATION: ${{ inputs.confirmation }}
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_ENVIRONMENT_NAME: supabase-live-rls-validation
      REQUIRE_PROTECTED_BRANCHES: 'true'
    steps:
      - name: Check out exact promoted release SHA
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Revalidate exact current main and promotion after approval
        shell: bash
        run: |
          set -euo pipefail
          test "$INPUT_CONFIRMATION" = 'EXECUTE_POST_V20_RUNTIME_PROOF'
          test "$GITHUB_REF_NAME" = 'main'
          test "$GITHUB_SHA" = "$TARGET_SHA"
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse origin/main)" = "$TARGET_SHA"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')" = "$TARGET_SHA"

          promotion_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PROMOTION_RUN_ID}")"
          test "$(jq -r '.head_sha' <<<"$promotion_json")" = "$TARGET_SHA"
          test "$(jq -r '.path' <<<"$promotion_json")" = '.github/workflows/supabase-forward-reconciliation-production-promotion.yml'
          test "$(jq -r '.event' <<<"$promotion_json")" = 'workflow_dispatch'
          test "$(jq -r '.conclusion' <<<"$promotion_json")" = 'success'

      - name: Revalidate protected environment governance after admission
        run: node scripts/security/check-github-environment-governance.mjs

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies deterministically
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate V20 live-proof code contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/security/supabase-v20-live-fixtures.mjs
          node --check scripts/security/run-supabase-live-tenant-isolation-v4.mjs
          node --check scripts/security/run-supabase-live-tenant-isolation.mjs
          node --check scripts/security/supabase-live-rls-evidence.mjs
          node --check scripts/release/validate-supabase-rls-runtime-evidence.mjs

      - name: Download exact governed Production promotion evidence
        shell: bash
        run: |
          set -euo pipefail
          rm -rf source-promotion
          mkdir -p source-promotion
          gh run download "$PROMOTION_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "supabase-forward-production-promotion-${TARGET_SHA}" \
            --dir source-promotion

          promotion_transition="$(find source-promotion -type f -name 'promotion-transition.json' -print -quit)"
          live_postconditions="$(find source-promotion -type f -name 'live-postconditions.json' -print -quit)"
          current_manifest="$(find source-promotion -type f -name 'current-manifest.json' -print -quit)"
          test -n "$promotion_transition"
          test -n "$live_postconditions"
          test -n "$current_manifest"

          jq -e --arg sha "$TARGET_SHA" '
            .schema == "risck-comply.supabase-forward-reconciliation-promotion.v1"
            and .status == "Complete"
            and .outcome == "passed"
            and .targetSha == $sha
            and .selectedMigrationCount == 27
            and .checks.remoteAfterEqualsBeforePlusSelected == true
            and .checks.unauthorizedMigrationApplied == false
            and .checks.migrationHistoryRepairPerformed == false
            and .checks.unrestrictedDbPushPerformed == false
          ' "$promotion_transition" >/dev/null

          jq -e '
            .status == "PASS"
            and .readOnly == true
            and .postconditions == "forward_reconciliation_postconditions_passed"
          ' "$live_postconditions" >/dev/null

          jq -e --arg sha "$TARGET_SHA" '
            .schema == "risck-comply.supabase-forward-reconciliation-manifest.v1"
            and .targetSha == $sha
            and .changeSet == "2026-08-23-enterprise-data-plane-payment-first-closure-v20"
            and (.migrations | length) == 27
            and (.selectionDigest | test("^sha256:[a-f0-9]{64}$"))
            and (.migrations | all(.sha256 | test("^[a-f0-9]{64}$")))
            and (.migrations | map(.filename) | index("20260823123000_payment_first_commercial_data_plane.sql") != null)
            and (.migrations | map(.filename) | index("20260823131500_payment_first_gap_analysis_and_storage.sql") != null)
            and .checks.productionWriteAuthorized == false
            and .checks.migrationHistoryRepairAuthorized == false
            and .checks.unrestrictedDbPushAuthorized == false
          ' "$current_manifest" >/dev/null

          {
            echo "PROMOTION_CHANGE_SET=$(jq -r '.changeSet' "$current_manifest")"
            echo "PROMOTION_SELECTED_MIGRATION_COUNT=$(jq -r '.migrations | length' "$current_manifest")"
            echo "PROMOTION_SELECTION_DIGEST=$(jq -r '.selectionDigest' "$current_manifest")"
            echo 'PROMOTION_REMOTE_TRANSITION_VERIFIED=true'
            echo 'PROMOTION_UNAUTHORIZED_MIGRATION_APPLIED=false'
            echo 'PROMOTION_PRODUCTION_VERIFIED=true'
          } >> "$GITHUB_ENV"

      - name: Execute canonical post-V20 live tenant-isolation proof
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RLS_LIVE_UPDATE_REGISTER: '0'
          RLS_LIVE_KEEP_FIXTURES: '0'
        run: node scripts/security/run-supabase-live-tenant-isolation.mjs

      - name: Stamp canonical GitHub Actions provenance
        run: node scripts/security/stamp-supabase-live-rls-provenance.mjs

      - name: Validate redacted exact-SHA source evidence
        env:
          ENTERPRISE_EXPECTED_SHA: ${{ env.TARGET_SHA }}
          SUPABASE_RLS_RUNTIME_SOURCE_RUN_ID: ${{ github.run_id }}
        run: node scripts/security/check-supabase-rls-runtime-evidence.mjs

      - name: Derive canonical scorecard evidence
        env:
          ENTERPRISE_EXPECTED_SHA: ${{ env.TARGET_SHA }}
        run: node scripts/security/write-supabase-rls-scorecard-evidence.mjs

      - name: Validate canonical scorecard evidence
        env:
          ENTERPRISE_EXPECTED_SHA: ${{ env.TARGET_SHA }}
        run: node scripts/security/check-supabase-rls-scorecard-evidence.mjs

      - name: Verify V20 payment-first and Evidence Vault evidence flags
        shell: bash
        run: |
          set -euo pipefail
          source_evidence='docs/security/evidence/runtime/supabase-live-rls-validation.json'
          jq -e --arg sha "$TARGET_SHA" --arg promotion "$PROMOTION_RUN_ID" '
            .schema == "risck-comply.supabase-live-rls-validation.v20"
            and .status == "Complete"
            and .outcome == "passed"
            and .commitSha == $sha
            and .promotionLineage.promotionRunId == $promotion
            and .promotionLineage.selectedMigrationCount == 27
            and .promotionLineage.remoteAfterEqualsBeforePlusSelected == true
            and .promotionLineage.unauthorizedMigrationApplied == false
            and .promotionLineage.productionPromotionVerified == true
            and .paymentFirstV20.licensedTenantsProved == true
            and .paymentFirstV20.unlicensedSameTenantDenied == true
            and .paymentFirstV20.regulatoryUpdatesBackendOnly == true
            and .paymentFirstV20.providerEventsCreated == false
            and .paymentFirstV20.stripeLifecycleSynthesized == false
            and .evidenceVaultV20.unlicensedMetadataInsertDenied == true
            and .evidenceVaultV20.privateBucketProved == true
            and .evidenceVaultV20.orphanStorageInsertDenied == true
          ' "$source_evidence" >/dev/null

      - name: Generate immutable evidence checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/supabase-live-rls-runtime-proof
          sha256sum \
            docs/security/evidence/runtime/supabase-live-rls-validation.json \
            docs/security/evidence/runtime/supabase-rls-validation.json \
            > artifacts/supabase-live-rls-runtime-proof/SHA256SUMS
          cp docs/security/evidence/runtime/supabase-live-rls-validation.json artifacts/supabase-live-rls-runtime-proof/
          cp docs/security/evidence/runtime/supabase-rls-validation.json artifacts/supabase-live-rls-runtime-proof/

      - name: Upload canonical post-V20 runtime and scorecard evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: supabase-live-rls-runtime-proof-${{ env.TARGET_SHA }}
          path: artifacts/supabase-live-rls-runtime-proof
          if-no-files-found: error
          retention-days: 90
