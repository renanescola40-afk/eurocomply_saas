name: Supabase Live RLS Validation

run-name: Supabase promotion-bound live RLS proof for ${{ inputs.release_sha }}

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact current main SHA successfully promoted by the governed forward chain
        required: true
        type: string
      promotion_run_id:
        description: Successful Supabase Forward Reconciliation Production Promotion run ID for this exact SHA
        required: true
        type: string
      confirmation:
        description: Type EXECUTE_POST_FORWARD_PROMOTION_RUNTIME_PROOF
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: supabase-live-rls-validation-${{ inputs.release_sha }}
  cancel-in-progress: false

jobs:
  governance:
    name: Verify exact promotion authority before protected secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TARGET_SHA: ${{ inputs.release_sha }}
      PROMOTION_RUN_ID: ${{ inputs.promotion_run_id }}
      INPUT_CONFIRMATION: ${{ inputs.confirmation }}
      GITHUB_ENVIRONMENT_NAME: supabase-live-rls-validation
      REQUIRE_PROTECTED_BRANCHES: 'true'
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Check out exact current main without credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js for governance validation
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22

      - name: Validate exact-SHA promotion authority
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$PROMOTION_RUN_ID" =~ ^[0-9]+$ ]]
          test "$INPUT_CONFIRMATION" = 'EXECUTE_POST_FORWARD_PROMOTION_RUNTIME_PROOF'
          test "$GITHUB_REF_NAME" = 'main'
          test "$GITHUB_SHA" = "$TARGET_SHA"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')" = "$TARGET_SHA"
          promotion_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PROMOTION_RUN_ID}")"
          test "$(jq -r '.head_sha' <<<"$promotion_json")" = "$TARGET_SHA"
          test "$(jq -r '.path' <<<"$promotion_json")" = '.github/workflows/supabase-forward-reconciliation-production-promotion.yml'
          test "$(jq -r '.event' <<<"$promotion_json")" = 'workflow_dispatch'
          test "$(jq -r '.conclusion' <<<"$promotion_json")" = 'success'

      - name: Verify protected environment governance before secrets
        run: node scripts/security/check-github-environment-governance.mjs

  production-project-binding:
    name: Bind proof to Production Supabase project
    needs: governance
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: Production
    outputs:
      project_digest: ${{ steps.binding.outputs.project_digest }}
    env:
      TARGET_SHA: ${{ inputs.release_sha }}
      GITHUB_ENVIRONMENT_NAME: Production
      REQUIRE_PROTECTED_BRANCHES: 'true'
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Check out exact promoted release SHA
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22

      - name: Revalidate exact current main and Production environment governance
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')" = "$TARGET_SHA"
          node scripts/security/check-github-environment-governance.mjs

      - name: Emit redacted Production Supabase project digest
        id: binding
        env:
          SUPABASE_DB_POOLER_URL: ${{ secrets.SUPABASE_DB_POOLER_URL }}
        run: node scripts/security/supabase-project-binding.mjs emit-pooler-digest

  live-proof:
    name: Run exact governed promotion-bound tenant proof
    needs: [governance, production-project-binding]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: supabase-live-rls-validation
    env:
      TARGET_SHA: ${{ inputs.release_sha }}
      PROMOTION_RUN_ID: ${{ inputs.promotion_run_id }}
      INPUT_CONFIRMATION: ${{ inputs.confirmation }}
      EXPECTED_SUPABASE_PROJECT_DIGEST: ${{ needs.production-project-binding.outputs.project_digest }}
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_ENVIRONMENT_NAME: supabase-live-rls-validation
      REQUIRE_PROTECTED_BRANCHES: 'true'
    steps:
      - name: Check out exact promoted release SHA
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Revalidate exact current main and promotion after approval
        shell: bash
        run: |
          set -euo pipefail
          test "$INPUT_CONFIRMATION" = 'EXECUTE_POST_FORWARD_PROMOTION_RUNTIME_PROOF'
          test "$GITHUB_REF_NAME" = 'main'
          test "$GITHUB_SHA" = "$TARGET_SHA"
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse origin/main)" = "$TARGET_SHA"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')" = "$TARGET_SHA"
          promotion_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PROMOTION_RUN_ID}")"
          test "$(jq -r '.head_sha' <<<"$promotion_json")" = "$TARGET_SHA"
          test "$(jq -r '.path' <<<"$promotion_json")" = '.github/workflows/supabase-forward-reconciliation-production-promotion.yml'
          test "$(jq -r '.event' <<<"$promotion_json")" = 'workflow_dispatch'
          test "$(jq -r '.conclusion' <<<"$promotion_json")" = 'success'
          [[ "$EXPECTED_SUPABASE_PROJECT_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]

      - name: Revalidate protected environment governance after admission
        run: node scripts/security/check-github-environment-governance.mjs

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies deterministically
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate live-proof code contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/security/supabase-forward-manifest-contract.mjs
          node --check scripts/security/validate-supabase-live-promotion-source.mjs
          node --check scripts/security/supabase-project-binding.mjs
          node --check scripts/security/supabase-v20-live-fixtures.mjs
          node --check scripts/security/run-supabase-live-tenant-isolation-v4.mjs
          node --check scripts/security/run-supabase-live-tenant-isolation.mjs
          node --check scripts/security/supabase-live-rls-evidence.mjs
          node --check scripts/release/validate-supabase-rls-runtime-evidence.mjs
          node --test tests/security/supabase-project-binding.test.mjs

      - name: Download exact governed Production promotion evidence
        shell: bash
        run: |
          set -euo pipefail
          rm -rf source-promotion
          mkdir -p source-promotion
          gh run download "$PROMOTION_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "supabase-forward-production-promotion-${TARGET_SHA}" \
            --dir source-promotion
          promotion_transition="$(find source-promotion -type f -name 'promotion-transition.json' -print -quit)"
          live_postconditions="$(find source-promotion -type f -name 'live-postconditions.json' -print -quit)"
          current_manifest="$(find source-promotion -type f -name 'current-manifest.json' -print -quit)"
          test -n "$promotion_transition"
          test -n "$live_postconditions"
          test -n "$current_manifest"
          PROMOTION_TRANSITION_PATH="$promotion_transition" \
          LIVE_POSTCONDITIONS_PATH="$live_postconditions" \
          PROMOTION_MANIFEST_PATH="$current_manifest" \
            node scripts/security/validate-supabase-live-promotion-source.mjs

      - name: Verify live API project matches the Production promotion project
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
        run: node scripts/security/supabase-project-binding.mjs verify-api-digest

      - name: Execute canonical live tenant-isolation proof
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RLS_LIVE_UPDATE_REGISTER: '0'
          RLS_LIVE_KEEP_FIXTURES: '0'
        run: node scripts/security/run-supabase-live-tenant-isolation.mjs

      - name: Stamp canonical GitHub Actions provenance
        run: node scripts/security/stamp-supabase-live-rls-provenance.mjs

      - name: Validate redacted exact-SHA source evidence
        env:
          ENTERPRISE_EXPECTED_SHA: ${{ env.TARGET_SHA }}
          SUPABASE_RLS_RUNTIME_SOURCE_RUN_ID: ${{ github.run_id }}
        run: node scripts/security/check-supabase-rls-runtime-evidence.mjs

      - name: Derive canonical scorecard evidence
        env:
          ENTERPRISE_EXPECTED_SHA: ${{ env.TARGET_SHA }}
        run: node scripts/security/write-supabase-rls-scorecard-evidence.mjs

      - name: Validate canonical scorecard evidence
        env:
          ENTERPRISE_EXPECTED_SHA: ${{ env.TARGET_SHA }}
        run: node scripts/security/check-supabase-rls-scorecard-evidence.mjs

      - name: Generate immutable evidence checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/supabase-live-rls-runtime-proof
          sha256sum \
            docs/security/evidence/runtime/supabase-live-rls-validation.json \
            docs/security/evidence/runtime/supabase-rls-validation.json \
            > artifacts/supabase-live-rls-runtime-proof/SHA256SUMS
          cp docs/security/evidence/runtime/supabase-live-rls-validation.json artifacts/supabase-live-rls-runtime-proof/
          cp docs/security/evidence/runtime/supabase-rls-validation.json artifacts/supabase-live-rls-runtime-proof/

      - name: Upload canonical promotion-bound runtime and scorecard evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: supabase-live-rls-runtime-proof-${{ env.TARGET_SHA }}
          path: artifacts/supabase-live-rls-runtime-proof
          if-no-files-found: error
          retention-days: 90
