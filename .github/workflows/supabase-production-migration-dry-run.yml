name: Supabase Production Migration Dry Run

run-name: Supabase production migration dry-run for ${{ inputs.release_sha }}

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact full 40-character current main SHA to assess
        required: true
        type: string
      confirmation:
        description: Type DRY_RUN_ONLY to confirm that no production write is authorised
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: supabase-production-migration-dry-run-${{ inputs.release_sha }}
  cancel-in-progress: false

jobs:
  production-migration-dry-run:
    name: Authorize and execute read-only migration dry-run
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: supabase-production-migration-dry-run
    env:
      TARGET_SHA: ${{ inputs.release_sha }}
      SUPABASE_CLI_VERSION: '2.101.0'
      MIGRATION_DRY_RUN_ARTIFACT_DIR: artifacts/supabase-production-migration-dry-run

    steps:
      - name: Validate exact confirmation and release SHA
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          mkdir -p "$MIGRATION_DRY_RUN_ARTIFACT_DIR"

          STATUS='accepted'
          REASON='Input confirmation and release SHA format are valid.'
          if [ "$CONFIRMATION" != 'DRY_RUN_ONLY' ]; then
            STATUS='blocked'
            REASON='confirmation must equal DRY_RUN_ONLY'
          elif [[ ! "$TARGET_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            STATUS='blocked'
            REASON='release_sha must be a full 40-character Git SHA'
          fi

          jq -n \
            --arg status "$STATUS" \
            --arg reason "$REASON" \
            --arg requestedSha "${TARGET_SHA,,}" \
            --arg runId "$GITHUB_RUN_ID" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg generatedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              evidenceItem: "supabase-production-migration-dry-run-request",
              status: $status,
              reason: $reason,
              requestedSha: $requestedSha,
              runId: $runId,
              repository: $repository,
              generatedAt: $generatedAt,
              productionWriteAuthorized: false,
              productionWritePerformed: false
            }' > "$MIGRATION_DRY_RUN_ARTIFACT_DIR/request-validation.json"

          if [ "$STATUS" != 'accepted' ]; then
            echo "$REASON" >&2
            exit 1
          fi

          echo "TARGET_SHA=${TARGET_SHA,,}" >> "$GITHUB_ENV"
          echo "SUPABASE_DB_URL_FILE=$RUNNER_TEMP/supabase-production-db-url" >> "$GITHUB_ENV"

      - name: Check out exact release SHA
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Initialize exact-SHA diagnostic artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$MIGRATION_DRY_RUN_ARTIFACT_DIR"
          OBSERVED_SHA="$(git rev-parse HEAD)"
          jq -n \
            --arg status 'pending' \
            --arg reason 'Awaiting exact current main SHA validation.' \
            --arg requestedSha "$TARGET_SHA" \
            --arg observedSha "$OBSERVED_SHA" \
            --arg runId "$GITHUB_RUN_ID" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg generatedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              evidenceItem: "supabase-production-migration-dry-run-exact-sha",
              status: $status,
              reason: $reason,
              requestedSha: $requestedSha,
              observedCheckoutSha: $observedSha,
              currentMainSha: null,
              runId: $runId,
              repository: $repository,
              generatedAt: $generatedAt,
              productionWriteAuthorized: false,
              productionWritePerformed: false
            }' > "$MIGRATION_DRY_RUN_ARTIFACT_DIR/exact-main-sha-validation.json"

      - name: Verify exact current main checkout
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ARTIFACT_PATH="$MIGRATION_DRY_RUN_ARTIFACT_DIR/exact-main-sha-validation.json"
          OBSERVED_SHA="$(git rev-parse HEAD)"
          MAIN_RESPONSE_FILE="$(mktemp)"
          CURL_EXIT=0

          curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/main" \
            --output "$MAIN_RESPONSE_FILE" || CURL_EXIT=$?

          MAIN_SHA=''
          if [ "$CURL_EXIT" -eq 0 ]; then
            MAIN_SHA="$(jq -r '.sha // empty' "$MAIN_RESPONSE_FILE")"
          fi
          rm -f "$MAIN_RESPONSE_FILE"

          STATUS='passed'
          REASON='Requested SHA is the exact current main SHA.'
          if [ "$OBSERVED_SHA" != "$TARGET_SHA" ]; then
            STATUS='blocked'
            REASON='checked-out SHA does not match the requested release SHA'
          elif [ "$CURL_EXIT" -ne 0 ]; then
            STATUS='blocked'
            REASON="could not query the current main SHA from GitHub (curl exit $CURL_EXIT)"
          elif [[ ! "$MAIN_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            STATUS='blocked'
            REASON='GitHub returned an invalid current main SHA'
          elif [ "$MAIN_SHA" != "$TARGET_SHA" ]; then
            STATUS='blocked'
            REASON='requested release SHA is stale because main has advanced'
          fi

          jq -n \
            --arg status "$STATUS" \
            --arg reason "$REASON" \
            --arg requestedSha "$TARGET_SHA" \
            --arg observedSha "$OBSERVED_SHA" \
            --arg currentMainSha "$MAIN_SHA" \
            --arg runId "$GITHUB_RUN_ID" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg generatedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              evidenceItem: "supabase-production-migration-dry-run-exact-sha",
              status: $status,
              reason: $reason,
              requestedSha: $requestedSha,
              observedCheckoutSha: $observedSha,
              currentMainSha: (if $currentMainSha == "" then null else $currentMainSha end),
              runId: $runId,
              repository: $repository,
              generatedAt: $generatedAt,
              productionWriteAuthorized: false,
              productionWritePerformed: false
            }' > "$ARTIFACT_PATH"

          {
            echo '## Exact current main SHA validation'
            echo
            echo "- Status: \`$STATUS\`"
            echo "- Requested SHA: \`$TARGET_SHA\`"
            echo "- Checked-out SHA: \`$OBSERVED_SHA\`"
            echo "- Current main SHA: \`${MAIN_SHA:-unavailable}\`"
            echo "- Reason: $REASON"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$STATUS" != 'passed' ]; then
            echo "$REASON" >&2
            if [ -n "$MAIN_SHA" ] && [ "$MAIN_SHA" != "$TARGET_SHA" ]; then
              echo "Re-run the workflow with release_sha=$MAIN_SHA" >&2
            fi
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies deterministically without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Validate production Supabase configuration
        shell: bash
        env:
          SUPABASE_DB_POOLER_URL: ${{ secrets.SUPABASE_DB_POOLER_URL }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          for name in SUPABASE_DB_POOLER_URL SUPABASE_PROJECT_ID; do
            if [ -z "${!name:-}" ]; then
              echo "$name is required for the migration dry-run." >&2
              exit 1
            fi
          done
          if [[ ! "$SUPABASE_PROJECT_ID" =~ ^[a-z0-9]{20}$ ]]; then
            echo "SUPABASE_PROJECT_ID does not look like a Supabase project reference" >&2
            exit 1
          fi

      - name: Prepare explicit production database connection
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_POOLER_URL }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          mkdir -p "$MIGRATION_DRY_RUN_ARTIFACT_DIR"
          node scripts/supabase/prepare-production-db-connection.mjs \
            --write-file "$SUPABASE_DB_URL_FILE" \
            | tee "$MIGRATION_DRY_RUN_ARTIFACT_DIR/connection-diagnostics.json"
          test -s "$SUPABASE_DB_URL_FILE"
          test "$(stat -c '%a' "$SUPABASE_DB_URL_FILE")" = '600'

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Verify pinned Supabase CLI version
        shell: bash
        run: |
          set -euo pipefail
          test "$(supabase --version)" = "$SUPABASE_CLI_VERSION"

      - name: Capture remote migration history
        shell: bash
        run: |
          set -euo pipefail
          DB_URL="$(cat "$SUPABASE_DB_URL_FILE")"
          supabase migration list --db-url "$DB_URL" \
            | tee migration-state-remote.txt \
            | tee "$MIGRATION_DRY_RUN_ARTIFACT_DIR/migration-state-remote.txt"

      - name: Test migration deployability and review-package contracts
        run: >-
          npx vitest run
          scripts/supabase/audit-migration-drift.test.mjs
          scripts/supabase/generate-migration-reconciliation-review-packages.test.mjs
          scripts/supabase/prepare-production-db-connection.test.mjs
          tests/security/supabase-production-migration-dry-run-workflow.test.ts

      - name: Evaluate migration deployability and retain blocker status
        id: deployability
        shell: bash
        run: |
          set -uo pipefail
          set +e
          node scripts/supabase/audit-migration-drift.mjs \
            supabase/migrations \
            migration-state-remote.txt \
            "$MIGRATION_DRY_RUN_ARTIFACT_DIR/drift" \
            --require-deployable \
            | tee "$MIGRATION_DRY_RUN_ARTIFACT_DIR/deployability-summary.md"
          PIPELINE_STATUS=("${PIPESTATUS[@]}")
          AUDIT_EXIT="${PIPELINE_STATUS[0]}"
          TEE_EXIT="${PIPELINE_STATUS[1]}"
          set -e
          echo "exit_code=$AUDIT_EXIT" >> "$GITHUB_OUTPUT"
          echo "tee_exit_code=$TEE_EXIT" >> "$GITHUB_OUTPUT"
          if [ "$TEE_EXIT" -ne 0 ]; then
            echo "Could not retain the migration deployability evidence (tee exit $TEE_EXIT)." >&2
            exit "$TEE_EXIT"
          fi
          test -f "$MIGRATION_DRY_RUN_ARTIFACT_DIR/drift/migration-reconciliation-inventory.json"
          exit 0

      - name: Generate non-crediting reconciliation review packages
        shell: bash
        run: |
          set -euo pipefail
          node scripts/supabase/generate-migration-reconciliation-review-packages.mjs \
            "$MIGRATION_DRY_RUN_ARTIFACT_DIR/drift/migration-reconciliation-inventory.json" \
            "$MIGRATION_DRY_RUN_ARTIFACT_DIR/reconciliation-review" \
            --batch-size=25 \
            | tee "$MIGRATION_DRY_RUN_ARTIFACT_DIR/reconciliation-review-summary.json"

      - name: Enforce migration deployability before dry-run
        shell: bash
        env:
          DEPLOYABILITY_EXIT_CODE: ${{ steps.deployability.outputs.exit_code }}
        run: |
          set -euo pipefail
          case "$DEPLOYABILITY_EXIT_CODE" in
            0) ;;
            2|3)
              echo "Migration deployability is blocked; review packages were retained." >&2
              exit "$DEPLOYABILITY_EXIT_CODE"
              ;;
            *)
              echo "Unexpected deployability audit exit code: $DEPLOYABILITY_EXIT_CODE" >&2
              exit 1
              ;;
          esac

      - name: Execute Supabase migration dry-run only
        shell: bash
        run: |
          set -euo pipefail
          DB_URL="$(cat "$SUPABASE_DB_URL_FILE")"
          supabase db push --db-url "$DB_URL" --dry-run \
            | tee "$MIGRATION_DRY_RUN_ARTIFACT_DIR/db-push-dry-run.txt"

      - name: Publish dry-run summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Supabase production migration dry-run'
            echo
            echo "- Assessed SHA: \`$TARGET_SHA\`"
            echo "- Supabase CLI: \`$SUPABASE_CLI_VERSION\`"
            echo '- Database endpoint and credential: canonical protected SUPABASE_DB_POOLER_URL'
            echo '- Operation: dry-run only'
            echo '- Reconciliation review packages: generated when the audit produced an inventory'
            echo '- Package status: HUMAN_REVIEW_REQUIRED; accepted decisions remain zero'
            echo '- Production writes: not authorised and not executed by this workflow'
            echo '- General migration deployment remains subject to independent approval'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary database connection material
        if: always()
        shell: bash
        run: |
          rm -f "${SUPABASE_DB_URL_FILE:-}"

      - name: Upload migration authorization, review and dry-run artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: supabase-production-migration-dry-run-${{ env.TARGET_SHA }}
          path: artifacts/supabase-production-migration-dry-run
          if-no-files-found: error
          retention-days: 90
