name: P0 Runtime Gap Report

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - 'scripts/security/*p0-runtime*'
      - 'scripts/enterprise/fetch-production-gate-p0-evidence.mjs'
      - 'scripts/release/hydrate-enterprise-retained-runtime-evidence.mjs'
      - 'tests/security/*p0-runtime*'
      - 'tests/security/p0-register-source-of-truth-contract.test.ts'
      - 'tests/enterprise/p0-*.test.mjs'
      - 'docs/security/P0_RUNTIME_EVIDENCE_REGISTER.md'
      - 'docs/security/evidence/runtime/**'
      - 'docs/security/evidence/schemas/p0-runtime-evidence-register.schema.json'
      - '.github/workflows/p0-runtime-gap-report.yml'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read
  actions: read

concurrency:
  group: p0-runtime-gap-report-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  p0-runtime-gap-report:
    name: Report P0 runtime evidence gap
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ASSESSED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      RELEASE_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact assessed SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies deterministically
        run: npm ci --ignore-scripts

      - name: Verify exact assessed checkout
        run: |
          set -euo pipefail
          [[ "$ASSESSED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$ASSESSED_SHA"

      - name: Validate P0 policy register
        run: node scripts/security/check-p0-runtime-evidence-register.mjs

      - name: Run focused P0 source-of-truth contracts
        run: |
          node --check scripts/enterprise/fetch-production-gate-p0-evidence.mjs
          node --check scripts/release/hydrate-enterprise-retained-runtime-evidence.mjs
          node --test \
            tests/security/generate-p0-runtime-evidence-register.test.mjs \
            tests/security/validate-generated-p0-runtime-evidence-register.test.mjs \
            tests/enterprise/p0-retained-runtime-hydration.test.mjs \
            tests/enterprise/p0-production-gate-evidence-hydration.test.mjs
          npx vitest run \
            scripts/security/report-p0-runtime-evidence-gap.test.mjs \
            tests/security/p0-register-source-of-truth-contract.test.ts

      - name: Hydrate retained exact-SHA producer evidence for diagnostics
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ env.ASSESSED_SHA }}
          RETAINED_PROOF_OPTIONAL_ERRORS_AS_MISSING: 'true'
        run: node scripts/release/hydrate-enterprise-retained-runtime-evidence.mjs

      - name: Hydrate exact-SHA Enterprise Production Gate evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ env.ASSESSED_SHA }}
        run: node scripts/enterprise/fetch-production-gate-p0-evidence.mjs

      - name: Generate exact-SHA gap report and register
        run: |
          set -euo pipefail
          output=artifacts/p0-runtime-evidence-register
          mkdir -p "$output"
          node scripts/security/report-p0-runtime-evidence-gap.mjs > "$output/p0-runtime-gap-report.json"
          node scripts/security/generate-p0-runtime-evidence-register.mjs \
            --sha="$ASSESSED_SHA" \
            --output-dir="$output" \
            > "$output/generator-output.json"
          cp release-validation/retained-runtime-evidence-hydration.json "$output/"
          cp release-validation/p0-production-gate-evidence-hydration.json "$output/"

      - name: Validate generated register and schema syntax
        run: |
          set -euo pipefail
          node scripts/security/validate-generated-p0-runtime-evidence-register.mjs \
            --sha="$ASSESSED_SHA"
          node -e "JSON.parse(require('node:fs').readFileSync('docs/security/evidence/schemas/p0-runtime-evidence-register.schema.json','utf8'))"

      - name: Generate integrity checksums
        run: |
          set -euo pipefail
          output=artifacts/p0-runtime-evidence-register
          find "$output" -maxdepth 1 -type f \( -name '*.json' -o -name '*.md' \) -print0 \
            | sort -z \
            | xargs -0 sha256sum > "$output/SHA256SUMS"

      - name: Publish decision summary
        run: |
          node --input-type=module <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          import { readFileSync } from 'node:fs';
          const register = JSON.parse(readFileSync('artifacts/p0-runtime-evidence-register/p0-runtime-evidence-register.json', 'utf8'));
          const retained = JSON.parse(readFileSync('release-validation/retained-runtime-evidence-hydration.json', 'utf8'));
          const productionGate = JSON.parse(readFileSync('release-validation/p0-production-gate-evidence-hydration.json', 'utf8'));
          console.log('## P0 runtime evidence source of truth');
          console.log('');
          console.log(`- Exact SHA: \`${register.commitSha}\``);
          console.log(`- Decision: **${register.decision}**`);
          console.log(`- Completion: **${register.completed}/${register.total} (${register.completionPercent}%)**`);
          console.log(`- Blocking controls: **${register.blocked}**`);
          console.log(`- Retained exact-SHA producers hydrated: **${retained.hydratedProducerCount}/${retained.producerCount}**`);
          console.log(`- Invalid optional producer artifacts kept as missing: **${retained.producerValidationErrorCount}**`);
          console.log(`- Production Gate exact-SHA P0 documents hydrated: **${productionGate.hydratedEvidence}/${productionGate.expectedEvidence}**`);
          console.log('');
          console.log('Versioned Markdown statuses are advisory only; canonical validators and exact-SHA artifact provenance determine the result.');
          NODE

      - name: Upload immutable P0 register artifact
        uses: actions/upload-artifact@v7
        with:
          name: p0-runtime-evidence-register-${{ env.ASSESSED_SHA }}
          path: artifacts/p0-runtime-evidence-register
          if-no-files-found: error
          retention-days: 365

      - name: Strict report for exact main release evidence
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          node scripts/security/report-p0-runtime-evidence-gap.mjs --strict
          node scripts/security/generate-p0-runtime-evidence-register.mjs \
            --sha="$ASSESSED_SHA" \
            --output-dir=artifacts/p0-runtime-evidence-register \
            --strict
