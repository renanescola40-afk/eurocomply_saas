name: Temporary apply PR1299 dependency fix

on:
  pull_request:
    types: [synchronize]
    branches: [main]
    paths:
      - .github/workflows/temporary-apply-pr1299-dependency-fix.yml

permissions:
  contents: write

concurrency:
  group: temporary-apply-pr1299-dependency-fix
  cancel-in-progress: false

jobs:
  repair:
    if: github.event.pull_request.number == 1299 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Apply secure compatible dependency versions
        run: |
          set -euo pipefail
          npm pkg set dependencies.dompurify=3.4.12
          npm pkg set overrides.sharp=0.35.0
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm audit --audit-level=moderate
          node - <<'NODE'
          const pkg = require('./package.json');
          const lock = require('./package-lock.json');
          if (pkg.dependencies?.dompurify !== '3.4.12') throw new Error('dompurify pin missing');
          if (pkg.overrides?.sharp !== '0.35.0') throw new Error('sharp override missing');
          const sharp = lock.packages?.['node_modules/sharp']?.version;
          if (sharp !== '0.35.0') throw new Error(`unexpected sharp lock version: ${sharp}`);
          NODE

      - name: Commit final dependency repair and remove temporary files
        run: |
          set -euo pipefail
          rm .github/workflows/temporary-apply-pr1299-dependency-fix.yml
          rm -f .tmp-pr1299-audit-summary.json
          git config user.name "pr1299-dependency-fix[bot]"
          git config user.email "pr1299-dependency-fix@users.noreply.github.com"
          git add package.json package-lock.json .github/workflows/temporary-apply-pr1299-dependency-fix.yml .tmp-pr1299-audit-summary.json
          git diff --cached --check
          git commit -m "fix(deps): remediate sharp and dompurify advisories"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
