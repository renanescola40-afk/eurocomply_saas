name: Temporary V28 Lockfile Remediation

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: temporary-v28-lockfile-remediation-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  remediate-lockfile:
    if: >-
      github.event.pull_request.number == 1931 &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact current PR head with branch write credential
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Remediate audit findings and commit only package-lock when needed
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          cp package.json /tmp/package.before.json
          npm audit fix --package-lock-only --ignore-scripts
          cmp -s package.json /tmp/package.before.json

          node - <<'NODE'
          const lock = require('./package-lock.json');
          const fast = lock.packages?.['node_modules/fast-uri']?.version;
          const qs = lock.packages?.['node_modules/qs']?.version;
          if (fast !== '3.1.7' || qs !== '6.16.0') {
            throw new Error(`unexpected remediation versions: fast-uri=${fast} qs=${qs}`);
          }
          NODE

          npm audit --audit-level=moderate --json > /tmp/audit.json || status=$?
          status=${status:-0}
          test "$status" -eq 0
          node - <<'NODE'
          const audit = require('/tmp/audit.json');
          const v = audit.metadata?.vulnerabilities ?? {};
          if ((v.moderate ?? 0) !== 0 || (v.high ?? 0) !== 0 || (v.critical ?? 0) !== 0) {
            throw new Error(`audit remains open: ${JSON.stringify(v)}`);
          }
          NODE

          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already remediated; no commit required."
            exit 0
          fi

          mapfile -t changed < <(git diff --name-only)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "package-lock.json"
          git config user.name "risck-comply-security-bot"
          git config user.email "security-bot@users.noreply.github.com"
          git add package-lock.json
          test "$(git diff --cached --name-only)" = "package-lock.json"
          git commit -m "security: remediate fast-uri and qs lockfile vulnerabilities"
          git push origin "HEAD:${HEAD_BRANCH}"
