name: Stripe Runtime Evidence Promotion Contract

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/stripe-runtime-evidence-promotion.yml'
      - '.github/workflows/stripe-runtime-evidence-promotion-contract.yml'
      - 'scripts/enterprise/fetch-stripe-entitlement-runtime-proof.mjs'
      - 'scripts/enterprise/fetch-stripe-promoted-runtime-evidence.mjs'
      - 'scripts/release/promote-stripe-runtime-evidence.mjs'
      - 'scripts/release/validate-stripe-runtime-evidence.mjs'
      - 'scripts/release/validate-stripe-runtime-replay.mjs'
      - 'tests/enterprise/stripe-runtime-auto-promotion.test.ts'
      - 'tests/enterprise/stripe-promoted-runtime-evidence-fetch.test.ts'
      - 'tests/release/stripe-runtime-evidence-promotion.test.ts'
      - 'docs/enterprise/STRIPE_RUNTIME_EVIDENCE_PROMOTION.md'
      - 'docs/enterprise/STRIPE_ENTITLEMENT_RUNTIME_PROOF.md'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stripe-runtime-evidence-promotion-contract-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact tested SHA
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact checkout
        run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - name: Install deterministic dependencies
        run: npm ci --ignore-scripts
      - name: Validate Stripe promotion contracts
        run: >-
          npx vitest run
          tests/enterprise/stripe-runtime-auto-promotion.test.ts
          tests/enterprise/stripe-promoted-runtime-evidence-fetch.test.ts
          tests/release/stripe-runtime-evidence-promotion.test.ts
      - name: Verify promotion workflows remain read-only and immutable-action pinned
        shell: bash
        run: |
          set -euo pipefail
          if grep -Eq 'contents: write|actions: write' .github/workflows/stripe-runtime-evidence-promotion.yml; then
            echo "::error title=Unsafe workflow permissions::Stripe runtime evidence promotion must remain read-only."
            exit 1
          fi
          if grep -Eq 'actions/(checkout|setup-node|upload-artifact)@v[0-9]+' .github/workflows/stripe-runtime-evidence-promotion.yml; then
            echo "::error title=Mutable action reference::Stripe promotion workflow actions must remain pinned to immutable SHAs."
            exit 1
          fi
          if grep -Eq 'actions/(checkout|setup-node)@v[0-9]+' .github/workflows/stripe-runtime-evidence-promotion-contract.yml; then
            echo "::error title=Mutable action reference::Stripe promotion contract actions must remain pinned to immutable SHAs."
            exit 1
          fi
