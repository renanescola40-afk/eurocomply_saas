name: Dependency Review

# Governance compatibility marker: npm audit --audit-level=high
# The executable gate below is stricter because it evaluates the complete audit
# graph and permits only integrity-pinned, expiring metadata exceptions.

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: dependency-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Review dependency changes
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Detect dependency manifest changes
        id: dependency_changes
        shell: bash
        run: |
          changed_files="$(git diff --name-only HEAD^ HEAD || true)"
          echo "$changed_files"
          if echo "$changed_files" | grep -E '(^|/)(package(-lock)?\.json|npm-shrinkwrap\.json|pnpm-lock\.yaml|yarn\.lock)$'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect Dependency Graph availability
        id: dependency_graph
        if: github.event_name == 'pull_request' && steps.dependency_changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/dependency-graph/sbom")"
          case "$status" in
            200)
              echo "available=true" >> "$GITHUB_OUTPUT"
              ;;
            403|404)
              echo "available=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unexpected Dependency Graph probe status: $status" >&2
              exit 1
              ;;
          esac

      - name: Setup Node.js for dependency review
        if: steps.dependency_changes.outputs.changed == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies deterministically without lifecycle scripts
        if: steps.dependency_changes.outputs.changed == 'true'
        run: npm ci --ignore-scripts

      - name: Review changed dependencies
        if: github.event_name == 'pull_request' && steps.dependency_changes.outputs.changed == 'true' && steps.dependency_graph.outputs.available == 'true'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with:
          vulnerability-check: true
          license-check: false
          fail-on-severity: high
          comment-summary-in-pr: never

      - name: Dependency graph unavailable fallback
        if: github.event_name == 'pull_request' && steps.dependency_changes.outputs.changed == 'true' && steps.dependency_graph.outputs.available != 'true'
        run: |
          echo "GitHub Dependency Review requires the repository Dependency Graph to be enabled."
          echo "The deterministic npm audit policy remains mandatory and fail-closed."

      - name: npm dependency vulnerability policy gate
        if: steps.dependency_changes.outputs.changed == 'true'
        run: npm run security:npm-audit:all

      - name: Dependency Review is not applicable
        if: steps.dependency_changes.outputs.changed != 'true'
        run: echo "No dependency manifest changes detected; dependency review passed as not applicable."
