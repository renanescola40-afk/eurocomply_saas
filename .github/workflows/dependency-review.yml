name: Dependency Review

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: dependency-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Review dependency changes
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Setup Node.js for npm audit fallback
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies deterministically without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: GitHub Dependency Review vulnerability scan
        uses: actions/dependency-review-action@v5
        with:
          vulnerability-check: true
          license-check: false
          fail-on-severity: high
          comment-summary-in-pr: never

      - name: npm high and critical dependency vulnerability gate
        run: npm audit --audit-level=high
