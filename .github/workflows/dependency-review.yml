name: Dependency Review

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: dependency-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Review dependency changes
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Detect dependency manifest changes
        id: dependency_changes
        shell: bash
        run: |
          changed_files="$(git diff --name-only HEAD^ HEAD || true)"
          echo "$changed_files"
          if echo "$changed_files" | grep -E '(^|/)(package(-lock)?\.json|npm-shrinkwrap\.json|pnpm-lock\.yaml|yarn\.lock)$'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js for dependency review
        if: steps.dependency_changes.outputs.changed == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies deterministically without lifecycle scripts
        if: steps.dependency_changes.outputs.changed == 'true'
        run: npm ci --ignore-scripts

      - name: Dependency graph unavailable fallback
        if: steps.dependency_changes.outputs.changed == 'true'
        run: |
          echo "Dependency manifests changed."
          echo "Using npm audit as the blocking high/critical vulnerability gate."

      - name: npm high and critical dependency vulnerability gate
        if: steps.dependency_changes.outputs.changed == 'true'
        run: npm audit --audit-level=high

      - name: Dependency Review is not applicable
        if: steps.dependency_changes.outputs.changed != 'true'
        run: echo "No dependency manifest changes detected; dependency review is not applicable to this PR."
