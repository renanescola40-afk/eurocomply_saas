name: Dependency Review

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: dependency-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Review dependency changes
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Setup Node.js for npm audit fallback
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies deterministically without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Detect dependency manifest changes
        id: dependency_changes
        shell: bash
        run: |
          changed_files="$(git diff --name-only HEAD^ HEAD || true)"
          echo "$changed_files"
          if echo "$changed_files" | grep -E '(^|/)(package(-lock)?\.json|npm-shrinkwrap\.json|pnpm-lock\.yaml|yarn\.lock)$'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: GitHub Dependency Review vulnerability scan
        if: github.event_name == 'pull_request' && steps.dependency_changes.outputs.changed == 'true'
        uses: actions/dependency-review-action@v5
        with:
          vulnerability-check: true
          license-check: false
          fail-on-severity: high
          comment-summary-in-pr: never

      - name: npm high and critical dependency vulnerability gate
        run: npm audit --audit-level=high

      - name: Dependency Review is not applicable
        if: github.event_name != 'pull_request' || steps.dependency_changes.outputs.changed != 'true'
        run: echo "No dependency manifest changes detected; dependency review action skipped. npm audit fallback completed."
