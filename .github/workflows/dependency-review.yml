name: Dependency Review

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  dependency-review:
    name: Review dependency changes
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Detect dependency manifest changes
        id: dependency_changes
        shell: bash
        run: |
          changed_files=$(git diff --name-only HEAD^ HEAD)
          echo "$changed_files"
          if echo "$changed_files" | grep -E '(^|/)(package(-lock)?\.json|npm-shrinkwrap\.json|pnpm-lock\.yaml|yarn\.lock)$'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Dependency Review
        if: steps.dependency_changes.outputs.changed == 'true'
        uses: actions/dependency-review-action@v5
        with:
          vulnerability-check: true
          license-check: false
          fail-on-severity: high
          comment-summary-in-pr: never

      - name: No dependency manifest changes
        if: steps.dependency_changes.outputs.changed != 'true'
        run: echo "No dependency manifest changes detected; dependency review is not required for this PR."
