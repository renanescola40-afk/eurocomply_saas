name: Apply Clean Package Lock On Branch

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/apply-clean-package-lock-on-branch.yml
      - package.json
      - package-lock.json
  push:
    branches:
      - fix/apply-clean-package-lock-via-ci
    paths:
      - .github/workflows/apply-clean-package-lock-on-branch.yml
      - package.json
      - package-lock.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-clean-package-lock:
    name: Apply regenerated package-lock.json
    if: github.event_name != 'pull_request' || github.head_ref == 'fix/apply-clean-package-lock-via-ci'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/apply-clean-package-lock-via-ci
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Regenerate package-lock only
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify lockfile is clean
        run: |
          node - <<'NODE'
          const { readFileSync } = require('node:fs');
          const lockText = readFileSync('package-lock.json', 'utf8');
          const lock = JSON.parse(lockText);
          const rootDeps = lock.packages?.['']?.dependencies ?? {};
          if ('@clerk/nextjs' in rootDeps) {
            console.error('@clerk/nextjs is still present in package-lock root dependencies');
            process.exit(1);
          }
          if (lockText.includes('@clerk/nextjs')) {
            console.error('@clerk/nextjs is still present somewhere in package-lock.json');
            process.exit(1);
          }
          console.log('package-lock.json is clean for Supabase Auth only');
          NODE

      - name: Remove temporary workflow and commit clean lockfile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-clean-package-lock-on-branch.yml
          git add package-lock.json
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'chore: apply clean regenerated package lock'
          git push origin HEAD:fix/apply-clean-package-lock-via-ci
