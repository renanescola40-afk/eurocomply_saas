name: Enterprise Runtime Closeout Campaign

run-name: Runtime closeout campaign for ${{ inputs.release_sha || github.sha }}

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full 40-character current main SHA
        required: true
        type: string
      supabase_promotion_run_id:
        description: Successful exact-SHA governed Supabase Production promotion run ID (mutually exclusive with reattestation)
        required: false
        default: ''
        type: string
      supabase_reattestation_run_id:
        description: Successful exact-SHA Supabase Forward Production Reattestation run ID (mutually exclusive with promotion)
        required: false
        default: ''
        type: string

permissions:
  actions: write
  contents: read

concurrency:
  group: enterprise-runtime-closeout-${{ inputs.release_sha || github.sha }}
  cancel-in-progress: false

jobs:
  dispatch-runtime-proofs:
    name: Dispatch exact-SHA protected runtime proofs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: enterprise-release-approval
    env:
      TARGET_SHA: ${{ inputs.release_sha || github.sha }}
      SUPABASE_PROMOTION_RUN_ID: ${{ inputs.supabase_promotion_run_id || '' }}
      SUPABASE_REATTESTATION_RUN_ID: ${{ inputs.supabase_reattestation_run_id || '' }}

    steps:
      - name: Checkout exact release SHA
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ inputs.release_sha || github.sha }}
          persist-credentials: false

      - name: Verify exact checkout and Supabase authority input shape
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          promotion_set=0
          reattestation_set=0
          if [[ -n "$SUPABASE_PROMOTION_RUN_ID" ]]; then [[ "$SUPABASE_PROMOTION_RUN_ID" =~ ^[0-9]+$ ]]; promotion_set=1; fi
          if [[ -n "$SUPABASE_REATTESTATION_RUN_ID" ]]; then [[ "$SUPABASE_REATTESTATION_RUN_ID" =~ ^[0-9]+$ ]]; reattestation_set=1; fi
          test $((promotion_set + reattestation_set)) -le 1
          TARGET_SHA="${TARGET_SHA,,}"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          echo "TARGET_SHA=$TARGET_SHA" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22

      - name: Validate campaign contracts
        run: npx --yes vitest run tests/enterprise/runtime-closeout-campaign.test.ts

      - name: Dispatch protected proof workflows
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/enterprise/dispatch-runtime-closeout-campaign.mjs > enterprise-runtime-closeout-receipt.json

      - name: Publish campaign receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: enterprise-runtime-closeout-campaign-${{ env.TARGET_SHA }}
          path: enterprise-runtime-closeout-receipt.json
          if-no-files-found: error
          retention-days: 90

      - name: Record truthful campaign boundary
        run: |
          echo 'Runtime proofs were dispatched for the exact current main SHA.'
          echo 'Push-triggered runs dispatch the non-Supabase exact-SHA proof set automatically after main advances.'
          echo 'Non-Supabase runtime proofs are always dispatched for the exact current main SHA.'
          echo 'TEN-RLS live proof is dispatched only when exactly one canonical Supabase Production promotion or read-only reattestation authority is supplied.'
          echo 'The read-only RLS reconciliation lane may run without Production writes.'
          echo 'This workflow cannot apply migrations and does not promote controls by itself; the canonical scorecard remains authoritative.'
