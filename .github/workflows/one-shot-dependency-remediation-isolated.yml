name: One-shot isolated dependency security remediation

on:
  push:
    branches:
      - work/dep-security-pr1998-20260908
    paths:
      - .github/workflows/one-shot-dependency-remediation-isolated.yml

permissions:
  contents: write

concurrency:
  group: one-shot-dependency-remediation-isolated
  cancel-in-progress: false

jobs:
  remediate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout isolated remediation branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: work/dep-security-pr1998-20260908
          fetch-depth: 1
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm

      - name: Preserve npm10 SWC helper topology
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const preserved = {};
          for (const [path, entry] of Object.entries(lock.packages || {})) {
            if (path.endsWith('node_modules/@swc/helpers')) preserved[path] = entry;
          }
          if (Object.keys(preserved).length === 0) throw new Error('no @swc/helpers nodes found in npm10 lock');
          console.log('preserved_swc_helper_nodes=' + Object.entries(preserved).map(([p,e]) => `${p}:${e.version}`).join(','));
          fs.writeFileSync('/tmp/npm10-swc-helper-nodes.json', JSON.stringify(preserved, null, 2));
          NODE

      - name: Apply exact security patches with fresh Arborist
        shell: bash
        run: |
          set -euo pipefail
          test ! -d node_modules
          npm install --global npm@11
          npm --version
          npm pkg set 'devDependencies.vitest=4.1.11'
          npm pkg set 'overrides.sharp=0.35.4'
          npm pkg set 'overrides.js-yaml=4.3.2'
          npm install --package-lock-only --ignore-scripts --no-audit --fund=false

      - name: Restore npm10 SWC helper topology
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const preserved = JSON.parse(fs.readFileSync('/tmp/npm10-swc-helper-nodes.json', 'utf8'));
          for (const key of Object.keys(lock.packages || {})) {
            if (key.endsWith('node_modules/@swc/helpers')) delete lock.packages[key];
          }
          Object.assign(lock.packages, preserved);
          fs.writeFileSync('package-lock.json', JSON.stringify(lock, null, 2) + '\n');
          NODE

      - name: Validate with repository npm10 contract
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@10.8.2
          test "$(npm --version)" = '10.8.2'
          npm ci --ignore-scripts
          npm audit --audit-level=moderate
          npm run security:package-lock
          npm ls --all >/dev/null
          node --test scripts/security/npm-audit-policy.test.mjs tests/enterprise/dependency-vulnerability-evidence.test.mjs tests/enterprise/dependency-vulnerability-remediation-candidate.test.mjs tests/enterprise/dependency-vulnerability-scorecard-contract.test.mjs

      - name: Commit verified remediation and self-remove
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/one-shot-dependency-remediation-isolated.yml
          git config user.name 'risck-comply-release-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add package.json package-lock.json .github/workflows/one-shot-dependency-remediation-isolated.yml
          git diff --cached --check
          git diff --cached --quiet && { echo 'No remediation changes produced'; exit 1; }
          git commit -m 'chore(security): patch release dependency advisories'
          git push origin HEAD:work/dep-security-pr1998-20260908
