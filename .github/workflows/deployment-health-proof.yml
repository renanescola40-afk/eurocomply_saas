name: Deployment Health Proof

on:
  workflow_dispatch:
    inputs:
      deployment_url:
        description: 'HTTPS deployment URL to validate. Root path is normalized to /api/health.'
        required: true
        type: string
      include_promoted_register:
        description: 'Also generate a promoted P0 register copy in the uploaded artifact. Does not commit changes.'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  deployment-health-proof:
    name: Validate deployment health endpoint
    runs-on: ubuntu-latest
    env:
      DEPLOYMENT_HEALTH_URL: ${{ inputs.deployment_url }}
      DEPLOYMENT_HEALTH_TIMEOUT_MS: '15000'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Run deployment health validation
        run: |
          if [ "${{ inputs.include_promoted_register }}" = "true" ]; then
            node scripts/security/run-deployment-health-validation.mjs --update-register
          else
            node scripts/security/run-deployment-health-validation.mjs
          fi

      - name: Upload deployment health evidence
        uses: actions/upload-artifact@v4
        with:
          name: deployment-health-validation
          path: |
            docs/security/evidence/runtime/deployment-health-validation.json
            docs/security/P0_RUNTIME_EVIDENCE_REGISTER.md
          if-no-files-found: error
