name: Actionlint

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: actionlint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: Lint GitHub Actions workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install actionlint and register problem matcher
        id: actionlint-setup
        uses: raven-actions/actionlint@v2
        with:
          fail-on-error: false

      - name: Run actionlint with durable diagnostics
        shell: bash
        run: |
          set -o pipefail
          actionlint 2>&1 | tee actionlint.log

      - name: Upload actionlint diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: actionlint-diagnostics
          path: actionlint.log
          if-no-files-found: error
