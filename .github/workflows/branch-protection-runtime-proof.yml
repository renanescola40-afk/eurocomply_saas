name: Branch Protection Runtime Proof

run-name: Branch protection proof for ${{ inputs.release_sha || github.sha }}

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_sha:
        description: Optional full current main SHA; defaults to triggering SHA
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: branch-protection-runtime-proof-${{ inputs.release_sha || github.sha }}
  cancel-in-progress: false

jobs:
  branch-protection-proof:
    name: Validate exact-SHA main protection
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: Production
    env:
      TARGET_SHA: ${{ inputs.release_sha || github.sha }}
      BRANCH_PROTECTION_READ_TOKEN: ${{ secrets.BRANCH_PROTECTION_READ_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}
      BRANCH_PROTECTION_EVIDENCE_PATH: p0-evidence/branch-protection-main.generated.json

    steps:
      - name: Validate requested SHA
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          echo "TARGET_SHA=${TARGET_SHA,,}" >> "$GITHUB_ENV"

      - name: Checkout exact current main SHA
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ inputs.release_sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact checkout
        run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22

      - name: Validate proof scripts
        run: |
          node --check scripts/enterprise/build-branch-protection-runtime-evidence.mjs
          node --check scripts/security/check-generated-branch-protection-evidence.mjs

      - name: Generate exact-SHA branch protection evidence
        run: node scripts/enterprise/build-branch-protection-runtime-evidence.mjs

      - name: Validate generated evidence contract
        if: always()
        env:
          ENTERPRISE_EXPECTED_SHA: ${{ env.TARGET_SHA }}
        run: node scripts/security/check-generated-branch-protection-evidence.mjs

      - name: Upload redacted exact-SHA evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: branch-protection-runtime-proof-${{ env.TARGET_SHA }}
          path: p0-evidence/branch-protection-main.generated.json
          if-no-files-found: error
          retention-days: 90
