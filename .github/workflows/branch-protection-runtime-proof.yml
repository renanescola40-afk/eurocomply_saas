name: Branch Protection Runtime Proof

on:
  pull_request:
    paths:
      - 'scripts/enterprise/build-platform-controls-runtime-evidence.mjs'
      - 'scripts/enterprise/build-branch-protection-runtime-evidence.mjs'
      - 'scripts/enterprise/fetch-branch-protection-runtime-evidence.mjs'
      - 'scripts/enterprise/aggregate-upload-scanner-runtime-evidence.mjs'
      - 'scripts/security/check-generated-branch-protection-evidence.mjs'
      - 'scripts/security/validate-branch-protection-freshness.mjs'
      - 'scripts/security/p0-runtime-evidence-catalog.mjs'
      - 'tests/enterprise/platform-controls-rulesets-evidence.test.ts'
      - 'tests/enterprise/branch-protection-runtime-evidence-fetch.test.ts'
      - 'tests/enterprise/upload-scanner-p0-aggregation.test.ts'
      - '.github/workflows/branch-protection-runtime-proof.yml'
      - '.github/workflows/p0-runtime-evidence.yml'
      - 'docs/enterprise/PLATFORM_RULESETS_EVIDENCE_FALLBACK.md'
      - 'docs/security/runbooks/PLATFORM_CONTROLS_RULESETS_PROOF.md'
      - 'docs/security/threat-models/GITHUB_RULESETS_EVIDENCE.md'
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_sha:
        description: Optional full current main SHA; defaults to triggering SHA
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: branch-protection-runtime-proof-${{ inputs.release_sha || github.sha }}
  cancel-in-progress: false

jobs:
  contract:
    name: Validate platform evidence contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout trusted source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies deterministically
        run: npm ci --ignore-scripts

      - name: Validate evidence scripts
        run: |
          node --check scripts/enterprise/build-platform-controls-runtime-evidence.mjs
          node --check scripts/enterprise/build-branch-protection-runtime-evidence.mjs
          node --check scripts/enterprise/fetch-branch-protection-runtime-evidence.mjs
          node --check scripts/enterprise/aggregate-upload-scanner-runtime-evidence.mjs
          node --check scripts/security/check-generated-branch-protection-evidence.mjs
          node --check scripts/security/validate-branch-protection-freshness.mjs

      - name: Run rulesets and P0 promotion contract tests
        run: >-
          npx vitest run
          tests/enterprise/platform-controls-rulesets-evidence.test.ts
          tests/enterprise/branch-protection-runtime-evidence-fetch.test.ts
          tests/enterprise/upload-scanner-p0-aggregation.test.ts

  branch-protection-proof:
    name: Validate exact-SHA main protection
    if: github.event_name != 'pull_request'
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: Production
    env:
      TARGET_SHA: ${{ inputs.release_sha || github.sha }}
      BRANCH_PROTECTION_READ_TOKEN: ${{ secrets.BRANCH_PROTECTION_READ_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}
      BRANCH_PROTECTION_EVIDENCE_PATH: p0-evidence/branch-protection-main.generated.json

    steps:
      - name: Validate requested SHA
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          echo "TARGET_SHA=${TARGET_SHA,,}" >> "$GITHUB_ENV"

      - name: Checkout exact current main SHA
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ inputs.release_sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact checkout
        run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22

      - name: Generate exact-SHA platform controls evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$BRANCH_PROTECTION_EVIDENCE_PATH")"
          umask 077
          node scripts/enterprise/build-platform-controls-runtime-evidence.mjs > "$BRANCH_PROTECTION_EVIDENCE_PATH"

      - name: Validate generated evidence contract
        if: always()
        env:
          ENTERPRISE_EXPECTED_SHA: ${{ env.TARGET_SHA }}
        run: node scripts/security/check-generated-branch-protection-evidence.mjs

      - name: Upload redacted exact-SHA evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: branch-protection-runtime-proof-${{ env.TARGET_SHA }}
          path: p0-evidence/branch-protection-main.generated.json
          if-no-files-found: error
          retention-days: 90
