name: P0 External Review Plan

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'docs/security/evidence/templates/external-review-plan.template.json'
      - 'scripts/security/check-p0-external-review-plan.mjs'
      - 'docs/security/P0_EXTERNAL_REVIEW_PLAN_USAGE.md'
      - '.github/workflows/p0-external-review-plan.yml'

permissions:
  contents: read

jobs:
  p0-external-review-plan:
    name: Validate external review plan template
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Show runner Node.js and npm versions
        run: |
          node --version
          npm --version

      - name: Validate review plan template
        run: node scripts/security/check-p0-external-review-plan.mjs docs/security/evidence/templates/external-review-plan.template.json
