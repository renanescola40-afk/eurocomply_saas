name: QMS Next.js security lock refresh

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  refresh:
    if: github.head_ref == 'agent/qms-capa-audit-management-review-operational-megapack'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Update patched Next.js line and lockfile
        run: npm install --ignore-scripts --save-exact next@15.5.21 eslint-config-next@15.5.21
      - name: Commit deterministic security update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes were required."
            exit 0
          fi
          git commit -m "fix(deps): update Next.js to 15.5.21"
          git push origin HEAD:agent/qms-capa-audit-management-review-operational-megapack
