name: Enterprise Seat Concurrency

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/20260724103000_enterprise_seat_concurrency.sql'
      - 'src/server/enterprise/seat-capacity*'
      - 'tests/enterprise/enterprise-seat-concurrency-migration.test.ts'
      - 'scripts/enterprise/report-seat-concurrency-gap.mjs'
      - 'docs/enterprise/ENTERPRISE_SEAT_CONCURRENCY.md'
      - '.github/workflows/enterprise-seat-concurrency.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: enterprise-seat-concurrency-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate atomic seat capacity
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact assessed SHA
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false

      - name: Verify exact assessed checkout
        run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies deterministically
        run: npm ci --ignore-scripts

      - name: Run seat concurrency contracts
        run: >-
          npx vitest run
          src/server/enterprise/seat-capacity.test.ts
          tests/enterprise/enterprise-seat-concurrency-migration.test.ts

      - name: Generate exact-SHA gap report
        run: node scripts/enterprise/report-seat-concurrency-gap.mjs

      - name: Publish report summary
        run: cat artifacts/enterprise-seat-concurrency/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload retained evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: enterprise-seat-concurrency-${{ env.TARGET_SHA }}
          path: artifacts/enterprise-seat-concurrency
          retention-days: 90
          if-no-files-found: error
