name: One-shot Dependency Remediation

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  remediate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'chore/dependency-policy-remediation-20260930'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout PR head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Generate non-breaking lockfile remediation
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm audit fix --package-lock-only --ignore-scripts --no-audit --no-fund
          npm audit --audit-level=moderate
          git diff --check
          if git diff --quiet -- package-lock.json; then
            echo 'No lockfile change was required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'chore: remediate dependency advisories'
          git push origin HEAD:${GITHUB_HEAD_REF}
