name: P0 Final Release Gate

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'docs/security/P0_RUNTIME_EVIDENCE_REGISTER.md'
      - 'docs/security/evidence/runtime/**'
      - 'scripts/security/**'
      - '.github/workflows/p0-final-release-gate.yml'

permissions:
  contents: read

jobs:
  p0-final-release-gate:
    name: Validate final P0 release evidence
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Show runner Node.js and npm versions
        run: |
          node --version
          npm --version

      - name: Detect runtime evidence changes
        id: runtime_changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "strict=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          case "$HEAD_REF" in
            *final-evidence*|*release-ready*)
              echo "strict=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "strict=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Validate runtime evidence register
        run: node scripts/security/check-p0-runtime-evidence-register.mjs

      - name: Validate runtime evidence file hygiene
        run: node scripts/security/check-p0-runtime-evidence-files.mjs

      - name: Validate optional runtime evidence files
        run: node scripts/security/check-p0-runtime-evidence-optionals.mjs

      - name: Enforce remaining runtime evidence gap is closed
        if: steps.runtime_changes.outputs.strict == 'true'
        run: node scripts/security/report-p0-runtime-evidence-gap.mjs --strict

      - name: Skip strict runtime evidence gap for non-final evidence changes
        if: steps.runtime_changes.outputs.strict != 'true'
        run: echo "Skipping strict runtime evidence gap for this non-final evidence PR. Use workflow_dispatch or a release-ready/final-evidence branch for final release enforcement."
