name: P0 Final Release Gate

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'docs/security/P0_RUNTIME_EVIDENCE_REGISTER.md'
      - 'docs/security/evidence/runtime/**'
      - 'docs/security/evidence/schemas/p0-runtime-evidence-register.schema.json'
      - 'scripts/security/**'
      - 'tests/security/*p0-runtime*'
      - 'tests/security/p0-register-source-of-truth-contract.test.ts'
      - '.github/workflows/p0-final-release-gate.yml'
      - '.github/workflows/p0-runtime-evidence.yml'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

jobs:
  p0-final-release-gate:
    name: Validate final P0 release evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ASSESSED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      RELEASE_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact assessed SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies deterministically
        run: npm ci --ignore-scripts

      - name: Verify exact assessed checkout
        run: |
          set -euo pipefail
          [[ "$ASSESSED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$ASSESSED_SHA"

      - name: Test canonical P0 evidence contracts
        run: |
          npx vitest run \
            scripts/security/p0-runtime-evidence-catalog.test.mjs \
            scripts/security/report-p0-runtime-evidence-gap.test.mjs \
            tests/security/p0-runtime-gap-strict-contract.test.ts \
            tests/security/p0-register-source-of-truth-contract.test.ts
          node --test \
            tests/security/generate-p0-runtime-evidence-register.test.mjs \
            tests/security/validate-generated-p0-runtime-evidence-register.test.mjs

      - name: Detect strict release enforcement
        id: runtime_changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "strict=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          case "$HEAD_REF" in
            *final-evidence*|*release-ready*) echo "strict=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "strict=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Validate P0 policy register
        run: node scripts/security/check-p0-runtime-evidence-register.mjs

      - name: Validate runtime evidence file hygiene
        run: node scripts/security/check-p0-runtime-evidence-files.mjs

      - name: Validate optional runtime evidence files
        run: node scripts/security/check-p0-runtime-evidence-optionals.mjs

      - name: Generate and validate exact-SHA P0 register
        run: |
          set -euo pipefail
          output=artifacts/p0-runtime-evidence-register
          mkdir -p "$output"
          node scripts/security/report-p0-runtime-evidence-gap.mjs > "$output/p0-runtime-gap-report.json"
          node scripts/security/generate-p0-runtime-evidence-register.mjs \
            --sha="$ASSESSED_SHA" \
            --output-dir="$output" \
            > "$output/generator-output.json"
          node scripts/security/validate-generated-p0-runtime-evidence-register.mjs \
            --sha="$ASSESSED_SHA"

      - name: Enforce remaining runtime evidence gap is closed
        if: steps.runtime_changes.outputs.strict == 'true'
        run: |
          node scripts/security/report-p0-runtime-evidence-gap.mjs --strict
          node scripts/security/generate-p0-runtime-evidence-register.mjs \
            --sha="$ASSESSED_SHA" \
            --output-dir=artifacts/p0-runtime-evidence-register \
            --strict

      - name: Skip strict runtime evidence gap for non-final changes
        if: steps.runtime_changes.outputs.strict != 'true'
        run: echo "Report mode only. Use workflow_dispatch or a release-ready/final-evidence branch for strict final enforcement."

      - name: Generate immutable checksums
        if: always()
        run: |
          set -euo pipefail
          output=artifacts/p0-runtime-evidence-register
          mkdir -p "$output"
          find "$output" -maxdepth 1 -type f \( -name '*.json' -o -name '*.md' \) -print0 \
            | sort -z \
            | xargs -0 -r sha256sum > "$output/SHA256SUMS"

      - name: Upload P0 final-gate evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: p0-final-release-gate-${{ env.ASSESSED_SHA }}
          path: artifacts/p0-runtime-evidence-register
          if-no-files-found: error
          retention-days: 365

  required-p0-runtime-evidence-register-context:
    name: Validate P0 runtime evidence register
    needs: p0-final-release-gate
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Enforce authoritative gate result
        env:
          AUTHORITATIVE_RESULT: ${{ needs.p0-final-release-gate.result }}
        run: |
          if [ "$AUTHORITATIVE_RESULT" != "success" ]; then
            echo "Authoritative P0 final release gate did not pass: $AUTHORITATIVE_RESULT" >&2
            exit 1
          fi
          echo "Required P0 runtime evidence register context is backed by the exact-SHA authoritative gate."
