name: Enterprise Recovery Drill

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - '.github/workflows/enterprise-recovery-drill.yml'
      - '.github/workflows/recovery-resilience-proof.yml'
      - '.github/workflows/supabase-forward-reconciliation-rehearsal.yml'
      - 'scripts/recovery/verify-supabase-provider-managed-restore.mjs'
      - 'scripts/recovery/destroy-supabase-provider-managed-restore.mjs'
      - 'tests/enterprise/recovery-control-plane.test.ts'
      - 'tests/security/protected-proof-workflow-contract.test.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: enterprise-recovery-contract-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  contract:
    name: Verify provider-managed recovery boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact assessed SHA
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22

      - name: Validate provider-managed recovery scripts
        run: |
          node --check scripts/recovery/verify-supabase-provider-managed-restore.mjs
          node --check scripts/recovery/destroy-supabase-provider-managed-restore.mjs
          node --test tests/security/supabase-provider-managed-restore.test.mjs

      - name: Prove GitHub-hosted recovery workflows cannot export Production row data
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          guarded = [
              Path('.github/workflows/enterprise-recovery-drill.yml'),
              Path('.github/workflows/recovery-resilience-proof.yml'),
          ]
          forbidden = [
              'RECOVERY_' + 'SOURCE_DATABASE_URL',
              'SUPABASE_DB_' + 'POOLER_URL',
              'run-' + 'backup-restore-exercise.mjs',
              'supabase db ' + 'dump',
              'pg_' + 'dump',
              'production-' + 'data.sql',
              'production-' + 'backup.dump',
          ]
          for path in guarded:
              text = path.read_text(encoding='utf-8')
              for token in forbidden:
                  if token in text:
                      raise SystemExit(f'legacy Production row-data path present in {path}: {token}')

          rehearsal = Path('.github/workflows/supabase-forward-reconciliation-rehearsal.yml').read_text(encoding='utf-8')
          for token in [
              'verify-supabase-provider-managed-restore.mjs',
              'destroy-supabase-provider-managed-restore.mjs',
              'SUPABASE_RESTORE_TO_NEW_PROJECT_CONFIRMED',
          ]:
              if token not in rehearsal:
                  raise SystemExit(f'provider-managed recovery authority missing from Stage 1: {token}')
          PY

      - name: Publish non-crediting recovery boundary summary
        shell: bash
        run: |
          {
            echo '## Enterprise recovery boundary'
            echo
            echo '- This workflow is a contract guard only and receives no Production database secret.'
            echo '- REC-05 through REC-10 are produced by Supabase Forward Reconciliation Rehearsal using a Supabase provider-managed Production restore.'
            echo '- REC-01 through REC-04 remain a separate explicitly confirmed Vercel rollback proof.'
            echo '- This guard does not execute, simulate, or claim recovery credit.'
          } >> "$GITHUB_STEP_SUMMARY"
