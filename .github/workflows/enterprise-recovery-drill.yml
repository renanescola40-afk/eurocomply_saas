name: Enterprise Recovery Drill

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: enterprise-recovery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  environment-governance:
    name: Verify recovery environment governance before protected secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TARGET_SHA: ${{ github.sha }}
    steps:
      - name: Checkout exact assessed main SHA without credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact current main SHA before governance lookup
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'main'
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git ls-remote origin refs/heads/main | grep -q "^${TARGET_SHA}"

      - name: Verify recovery environment governance before protected secrets
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_ENVIRONMENT_NAME: production-recovery
          REQUIRE_PROTECTED_BRANCHES: 'true'
        run: node scripts/security/check-github-environment-governance.mjs

  recovery:
    name: Exact-SHA isolated backup restore and RPO RTO proof
    needs: environment-governance
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment:
      name: production-recovery
    permissions:
      contents: read
      actions: read
    env:
      TARGET_SHA: ${{ github.sha }}
      RELEASE_SHA: ${{ github.sha }}
      RECOVERY_REQUIRED_EXERCISE: backup-restore
    steps:
      - name: Checkout exact main SHA
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact current main SHA after environment approval
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'main'
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git ls-remote origin refs/heads/main | grep -q "^${TARGET_SHA}"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies deterministically without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Set up pinned Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520
        with:
          version: 2.101.0

      - name: Install pinned recovery psql shim
        shell: bash
        run: |
          set -euo pipefail
          shim_dir="$RUNNER_TEMP/risck-recovery-bin"
          mkdir -p "$shim_dir"
          cat > "$shim_dir/psql" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          exec node "$GITHUB_WORKSPACE/scripts/recovery/run-pinned-recovery-psql.mjs" "$@"
          EOF
          chmod 0700 "$shim_dir/psql"
          echo "$shim_dir" >> "$GITHUB_PATH"

      - name: Start disposable isolated Supabase restore target
        run: node scripts/recovery/manage-ephemeral-recovery-database.mjs start

      - name: Revalidate protected recovery producer boundary
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_ENVIRONMENT_NAME: production-recovery
          REQUIRE_PROTECTED_BRANCHES: 'true'
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse origin/main)" = "$TARGET_SHA"
          main_sha="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/main" | jq -r '.sha')"
          test "$main_sha" = "$TARGET_SHA"
          node scripts/security/check-github-environment-governance.mjs

      - name: Preflight protected backup restore proof
        env:
          RECOVERY_SOURCE_DATABASE_URL: ${{ secrets.RECOVERY_SOURCE_DATABASE_URL }}
        run: node scripts/security/preflight-protected-proof.mjs recovery

      - name: Execute supported logical backup and isolated restore
        env:
          RECOVERY_SOURCE_DATABASE_URL: ${{ secrets.RECOVERY_SOURCE_DATABASE_URL }}
        run: node scripts/recovery/run-backup-restore-exercise.mjs

      - name: Validate canonical backup restore evidence
        run: node scripts/recovery/check-recovery-evidence.mjs

      - name: Remove disposable recovery database
        if: always()
        run: node scripts/recovery/manage-ephemeral-recovery-database.mjs stop

      - name: Upload immutable exact-SHA backup restore evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: enterprise-recovery-${{ github.sha }}
          path: |
            docs/security/evidence/runtime/recovery-resilience-preflight.json
            docs/security/evidence/p1/backup-restore-tested.json
          if-no-files-found: error
          retention-days: 90
