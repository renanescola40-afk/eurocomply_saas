name: Enterprise Recovery Drill

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: enterprise-recovery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  environment-governance:
    name: Verify recovery environment governance before protected secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TARGET_SHA: ${{ github.sha }}
    steps:
      - name: Checkout exact assessed main SHA without credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact current main SHA before governance lookup
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'main'
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git ls-remote origin refs/heads/main | grep -q "^${TARGET_SHA}"

      - name: Verify recovery environment governance before protected secrets
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_ENVIRONMENT_NAME: supabase-production-migration-dry-run
          REQUIRE_PROTECTED_BRANCHES: 'true'
        run: node scripts/security/check-github-environment-governance.mjs

  recovery:
    name: Exact-SHA isolated backup restore and RPO RTO proof
    needs: environment-governance
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment:
      name: supabase-production-migration-dry-run
    permissions:
      contents: read
    env:
      TARGET_SHA: ${{ github.sha }}
      RELEASE_SHA: ${{ github.sha }}
      RECOVERY_REQUIRED_EXERCISE: backup-restore
      RECOVERY_SOURCE_DATABASE_URL: ${{ secrets.SUPABASE_DB_POOLER_URL }}
    steps:
      - name: Checkout exact main SHA
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact current main SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'main'
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git ls-remote origin refs/heads/main | grep -q "^${TARGET_SHA}"

      - name: Validate protected read-only source configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RECOVERY_SOURCE_DATABASE_URL:-}" || {
            echo 'Missing protected SUPABASE_DB_POOLER_URL recovery source.' >&2
            exit 1
          }

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies deterministically without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Set up pinned Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520
        with:
          version: 2.101.0

      - name: Install PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Start disposable isolated Supabase restore target
        run: node scripts/recovery/manage-ephemeral-recovery-database.mjs start

      - name: Preflight protected backup restore proof
        run: node scripts/security/preflight-protected-proof.mjs recovery

      - name: Execute supported logical backup and isolated restore
        run: node scripts/recovery/run-backup-restore-exercise.mjs

      - name: Validate canonical backup restore evidence
        run: node scripts/recovery/check-recovery-evidence.mjs

      - name: Remove disposable recovery database
        if: always()
        run: node scripts/recovery/manage-ephemeral-recovery-database.mjs stop

      - name: Upload immutable exact-SHA backup restore evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: enterprise-recovery-${{ github.sha }}
          path: |
            docs/security/evidence/runtime/recovery-resilience-preflight.json
            docs/security/evidence/p1/backup-restore-tested.json
          if-no-files-found: error
          retention-days: 90
