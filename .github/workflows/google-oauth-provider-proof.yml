name: Google OAuth Provider Proof

run-name: Google OAuth provider proof for ${{ inputs.release_sha }}

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full 40-character main SHA deployed to production
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: google-oauth-provider-proof-${{ inputs.release_sha }}
  cancel-in-progress: false

jobs:
  validate-provider:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Validate requested SHA
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
      - name: Check out exact release SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha }}
          persist-credentials: false
      - name: Verify exact checkout
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: test "$(git rev-parse HEAD)" = "${RELEASE_SHA,,}"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate Supabase Google OAuth configuration
        env:
          ENTERPRISE_EXPECTED_SHA: ${{ inputs.release_sha }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: node scripts/security/run-google-oauth-provider-validation.mjs
      - name: Upload redacted evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: google-oauth-provider-proof-${{ inputs.release_sha }}
          path: docs/security/evidence/runtime/google-oauth-validation.json
          if-no-files-found: error
          retention-days: 90
