name: Google OAuth Provider Proof

run-name: Google OAuth provider proof for ${{ inputs.release_sha }}

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full 40-character current main SHA deployed to production
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: google-oauth-provider-proof-${{ inputs.release_sha }}
  cancel-in-progress: false

jobs:
  production-environment-governance:
    name: Verify Production governance before Google OAuth provider secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      TARGET_SHA: ${{ inputs.release_sha }}
    steps:
      - name: Bind provider proof to exact current main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_REF_NAME" = "main"
          test "$GITHUB_SHA" = "$TARGET_SHA"
          main_sha="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/main" | jq -r '.sha')"
          test "$main_sha" = "$TARGET_SHA"
      - name: Check out exact trusted release SHA
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ inputs.release_sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Verify Production environment governance before protected secrets
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_ENVIRONMENT_NAME: Production
          REQUIRE_PROTECTED_BRANCHES: 'true'
        run: node scripts/security/check-github-environment-governance.mjs

  validate-provider:
    needs: production-environment-governance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Production
    env:
      TARGET_SHA: ${{ inputs.release_sha }}
    steps:
      - name: Revalidate exact current main after environment approval
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "main"
          test "$GITHUB_SHA" = "$TARGET_SHA"
          main_sha="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/main" | jq -r '.sha')"
          test "$main_sha" = "$TARGET_SHA"

      - name: Check out exact release SHA
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ inputs.release_sha }}
          persist-credentials: false

      - name: Verify exact checkout
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse origin/main)" = "$TARGET_SHA"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Revalidate environment governance after admission
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_ENVIRONMENT_NAME: Production
          REQUIRE_PROTECTED_BRANCHES: 'true'
        run: node scripts/security/check-github-environment-governance.mjs

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Revalidate protected producer boundary
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_ENVIRONMENT_NAME: Production
          REQUIRE_PROTECTED_BRANCHES: 'true'
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse origin/main)" = "$TARGET_SHA"
          main_sha="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/main" | jq -r '.sha')"
          test "$main_sha" = "$TARGET_SHA"
          node scripts/security/check-github-environment-governance.mjs

      - name: Validate Supabase Google OAuth configuration
        env:
          ENTERPRISE_EXPECTED_SHA: ${{ inputs.release_sha }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          RELEASE_PRODUCTION_URL: ${{ vars.RELEASE_PRODUCTION_URL || secrets.RELEASE_PRODUCTION_URL || vars.NEXT_PUBLIC_APP_URL || secrets.NEXT_PUBLIC_APP_URL }}
        run: node scripts/security/run-google-oauth-provider-validation.mjs

      - name: Upload redacted evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: google-oauth-provider-proof-${{ inputs.release_sha }}
          path: docs/security/evidence/runtime/google-oauth-validation.json
          if-no-files-found: error
          retention-days: 90
