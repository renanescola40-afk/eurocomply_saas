name: Supabase Migration Evidence Bootstrap

run-name: Supabase migration evidence bootstrap for ${{ github.sha }}

on:
  pull_request:
    paths:
      - '.github/workflows/supabase-migration-evidence-bootstrap.yml'
      - 'tests/security/supabase-migration-evidence-bootstrap-workflow.test.ts'
      - 'docs/security/runbooks/SUPABASE_MIGRATION_EVIDENCE_BOOTSTRAP.md'
  push:
    branches: [main]
    paths-ignore:
      - 'docs/security/evidence/runtime/supabase-migration-reconciliation-decisions.json'
      - 'docs/security/evidence/accepted/supabase-staging-rehearsal-result.json'
      - 'docs/security/evidence/accepted/supabase-bounded-production-change-request.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-migration-evidence-bootstrap
  cancel-in-progress: false

jobs:
  contract:
    name: Validate evidence bootstrap contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies deterministically
        run: npm ci --ignore-scripts
      - name: Test orchestration safety contract
        run: npx vitest run tests/security/supabase-migration-evidence-bootstrap-workflow.test.ts

  bootstrap:
    name: Bootstrap exact-SHA migration evidence
    if: github.event_name != 'pull_request'
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
      actions: write
    env:
      TARGET_SHA: ${{ github.sha }}
      OUTPUT_DIR: artifacts/supabase-migration-evidence-bootstrap
    steps:
      - name: Checkout exact main subject
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact current main subject SHA
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CURRENT_MAIN="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')"
          CHECKED_OUT="$(git rev-parse HEAD)"
          test "$CHECKED_OUT" = "$CURRENT_MAIN"
          test "$TARGET_SHA" = "$CURRENT_MAIN"
          [[ "$TARGET_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          mkdir -p "$OUTPUT_DIR"
          jq -n \
            --arg schema 'risck-comply.supabase-migration-evidence-bootstrap.v1' \
            --arg subjectSha "$TARGET_SHA" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg orchestratorRunId "$GITHUB_RUN_ID" \
            --arg startedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              schema: $schema,
              subjectSha: $subjectSha,
              repository: $repository,
              orchestratorRunId: $orchestratorRunId,
              startedAt: $startedAt,
              status: "running",
              stages: {},
              safety: {
                productionWriteAuthorized: false,
                productionWritePerformed: false,
                stagingDispatched: false,
                boundedProductionChangeDispatched: false
              }
            }' > "$OUTPUT_DIR/bootstrap-state.json"

      - name: Dispatch and verify read-only evidence chain
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail

          STATE="$OUTPUT_DIR/bootstrap-state.json"
          TMP_ROOT="$RUNNER_TEMP/supabase-evidence-bootstrap"
          mkdir -p "$TMP_ROOT"

          update_stage() {
            local stage="$1"
            local workflow="$2"
            local run_id="$3"
            local conclusion="$4"
            local artifact="$5"
            local tmp
            tmp="$(mktemp)"
            jq \
              --arg stage "$stage" \
              --arg workflow "$workflow" \
              --arg runId "$run_id" \
              --arg conclusion "$conclusion" \
              --arg artifact "$artifact" \
              '.stages[$stage] = {
                workflow: $workflow,
                runId: $runId,
                conclusion: $conclusion,
                artifact: $artifact
              }' "$STATE" > "$tmp"
            mv "$tmp" "$STATE"
          }

          dispatch_workflow() {
            local workflow="$1"
            shift
            local baseline
            baseline="$(
              gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?event=workflow_dispatch&branch=main&per_page=100" \
                --jq '[.workflow_runs[].id] | max // 0'
            )"

            gh workflow run "$workflow" --repo "$GITHUB_REPOSITORY" --ref main "$@"

            local run_id=''
            for _ in $(seq 1 60); do
              run_id="$(
                gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?event=workflow_dispatch&branch=main&per_page=100" \
                  --jq ".workflow_runs | map(select(.id > ${baseline} and .head_sha == \"${TARGET_SHA}\" and .event == \"workflow_dispatch\")) | sort_by(.id) | .[0].id // empty"
              )"
              if [[ "$run_id" =~ ^[0-9]+$ ]]; then
                printf '%s\n' "$run_id"
                return 0
              fi
              sleep 2
            done

            echo "Timed out resolving workflow run for ${workflow}" >&2
            return 1
          }

          wait_for_run() {
            local run_id="$1"
            for _ in $(seq 1 1080); do
              local status
              status="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.status')"
              if [ "$status" = 'completed' ]; then
                gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.conclusion // "unknown"'
                return 0
              fi
              sleep 5
            done
            echo "Timed out waiting for workflow run ${run_id}" >&2
            return 1
          }

          require_artifact() {
            local run_id="$1"
            local artifact_name="$2"
            local artifact_id
            artifact_id="$(
              gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts?per_page=100" \
                --jq "[.artifacts[] | select(.expired == false and .name == \"${artifact_name}\")] | sort_by(.created_at) | reverse | .[0].id // empty"
            )"
            [[ "$artifact_id" =~ ^[0-9]+$ ]]
          }

          download_artifact() {
            local run_id="$1"
            local artifact_name="$2"
            local destination="$3"
            rm -rf "$destination"
            mkdir -p "$destination"
            gh run download "$run_id" \
              --repo "$GITHUB_REPOSITORY" \
              --name "$artifact_name" \
              --dir "$destination"
          }

          DRIFT_WORKFLOW='supabase-migration-drift-audit.yml'
          DRIFT_ARTIFACT="supabase-migration-drift-${TARGET_SHA}"
          DRIFT_RUN_ID="$(dispatch_workflow "$DRIFT_WORKFLOW")"
          DRIFT_CONCLUSION="$(wait_for_run "$DRIFT_RUN_ID")"
          require_artifact "$DRIFT_RUN_ID" "$DRIFT_ARTIFACT"
          update_stage 'driftAudit' "$DRIFT_WORKFLOW" "$DRIFT_RUN_ID" "$DRIFT_CONCLUSION" "$DRIFT_ARTIFACT"

          DRY_WORKFLOW='supabase-production-migration-dry-run.yml'
          DRY_ARTIFACT="supabase-production-migration-dry-run-${TARGET_SHA}"
          DRY_RUN_ID="$(dispatch_workflow "$DRY_WORKFLOW" -f "release_sha=${TARGET_SHA}" -f 'confirmation=DRY_RUN_ONLY')"
          DRY_CONCLUSION="$(wait_for_run "$DRY_RUN_ID")"
          require_artifact "$DRY_RUN_ID" "$DRY_ARTIFACT"
          download_artifact "$DRY_RUN_ID" "$DRY_ARTIFACT" "$TMP_ROOT/dry-run"
          INVENTORY="$(find "$TMP_ROOT/dry-run" -type f -path '*/drift/migration-reconciliation-inventory.json' -print -quit)"
          test -n "$INVENTORY"
          test -s "$INVENTORY"
          update_stage 'productionDryRun' "$DRY_WORKFLOW" "$DRY_RUN_ID" "$DRY_CONCLUSION" "$DRY_ARTIFACT"

          SCHEMA_WORKFLOW='supabase-live-schema-evidence.yml'
          SCHEMA_ARTIFACT="supabase-live-schema-evidence-${TARGET_SHA}"
          SCHEMA_RUN_ID="$(dispatch_workflow "$SCHEMA_WORKFLOW" -f "release_sha=${TARGET_SHA}" -f "source_run_id=${DRY_RUN_ID}")"
          SCHEMA_CONCLUSION="$(wait_for_run "$SCHEMA_RUN_ID")"
          test "$SCHEMA_CONCLUSION" = 'success'
          require_artifact "$SCHEMA_RUN_ID" "$SCHEMA_ARTIFACT"
          download_artifact "$SCHEMA_RUN_ID" "$SCHEMA_ARTIFACT" "$TMP_ROOT/live-schema"
          OBJECT_EVIDENCE="$(find "$TMP_ROOT/live-schema" -type f -name 'migration-object-evidence.json' -print -quit)"
          test -n "$OBJECT_EVIDENCE"
          test -s "$OBJECT_EVIDENCE"
          update_stage 'liveSchemaEvidence' "$SCHEMA_WORKFLOW" "$SCHEMA_RUN_ID" "$SCHEMA_CONCLUSION" "$SCHEMA_ARTIFACT"

          DOSSIER_WORKFLOW='supabase-migration-review-dossiers.yml'
          DOSSIER_ARTIFACT="supabase-migration-review-dossiers-${TARGET_SHA}"
          DOSSIER_RUN_ID="$(dispatch_workflow "$DOSSIER_WORKFLOW" -f "release_sha=${TARGET_SHA}" -f "inventory_run_id=${DRY_RUN_ID}" -f "schema_evidence_run_id=${SCHEMA_RUN_ID}")"
          DOSSIER_CONCLUSION="$(wait_for_run "$DOSSIER_RUN_ID")"
          test "$DOSSIER_CONCLUSION" = 'success'
          require_artifact "$DOSSIER_RUN_ID" "$DOSSIER_ARTIFACT"
          download_artifact "$DOSSIER_RUN_ID" "$DOSSIER_ARTIFACT" "$TMP_ROOT/dossiers"
          DOSSIER_REPORT="$(find "$TMP_ROOT/dossiers" -type f -name 'migration-review-dossiers.json' -print -quit)"
          test -n "$DOSSIER_REPORT"
          test -s "$DOSSIER_REPORT"
          update_stage 'reviewDossiers' "$DOSSIER_WORKFLOW" "$DOSSIER_RUN_ID" "$DOSSIER_CONCLUSION" "$DOSSIER_ARTIFACT"

          DECISION_WORKFLOW='supabase-migration-reconciliation-decision-gate.yml'
          DECISION_ARTIFACT="supabase-migration-reconciliation-decisions-${TARGET_SHA}"
          DECISION_RUN_ID="$(dispatch_workflow "$DECISION_WORKFLOW" -f "release_sha=${TARGET_SHA}" -f "source_run_id=${DRY_RUN_ID}")"
          DECISION_CONCLUSION="$(wait_for_run "$DECISION_RUN_ID")"
          require_artifact "$DECISION_RUN_ID" "$DECISION_ARTIFACT"
          download_artifact "$DECISION_RUN_ID" "$DECISION_ARTIFACT" "$TMP_ROOT/decisions"
          DECISION_TEMPLATE="$(find "$TMP_ROOT/decisions" -type f -name 'decision-template.json' -print -quit)"
          test -n "$DECISION_TEMPLATE"
          test -s "$DECISION_TEMPLATE"
          update_stage 'decisionTemplate' "$DECISION_WORKFLOW" "$DECISION_RUN_ID" "$DECISION_CONCLUSION" "$DECISION_ARTIFACT"

          cp "$INVENTORY" "$OUTPUT_DIR/migration-reconciliation-inventory.json"
          cp "$OBJECT_EVIDENCE" "$OUTPUT_DIR/migration-object-evidence.json"
          cp "$DOSSIER_REPORT" "$OUTPUT_DIR/migration-review-dossiers.json"
          cp "$DECISION_TEMPLATE" "$OUTPUT_DIR/decision-template.json"
          sha256sum \
            "$OUTPUT_DIR/migration-reconciliation-inventory.json" \
            "$OUTPUT_DIR/migration-object-evidence.json" \
            "$OUTPUT_DIR/migration-review-dossiers.json" \
            "$OUTPUT_DIR/decision-template.json" \
            > "$OUTPUT_DIR/SHA256SUMS"

          tmp="$(mktemp)"
          jq \
            --arg completedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '.status = "HUMAN_MIGRATION_REVIEW_READY" | .completedAt = $completedAt' \
            "$STATE" > "$tmp"
          mv "$tmp" "$STATE"

      - name: Publish bootstrap summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Supabase migration evidence bootstrap'
            echo
            echo "- Subject SHA: \`$TARGET_SHA\`"
            if test -f "$OUTPUT_DIR/bootstrap-state.json"; then
              echo "- Status: \`$(jq -r '.status' "$OUTPUT_DIR/bootstrap-state.json")\`"
              echo
              echo '### Child workflow runs'
              jq -r '.stages | to_entries[] | "- \(.key): run `\(.value.runId)` — `\(.value.conclusion)`"' "$OUTPUT_DIR/bootstrap-state.json" || true
            else
              echo '- Status: `bootstrap_state_missing`'
            fi
            echo
            echo '- Production write authorized: no'
            echo '- Production write performed: no'
            echo '- Staging dispatched: no'
            echo '- Bounded production change dispatched: no'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload bootstrap provenance bundle
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: supabase-migration-evidence-bootstrap-${{ env.TARGET_SHA }}
          path: artifacts/supabase-migration-evidence-bootstrap
          if-no-files-found: error
          retention-days: 90
