name: Supabase Forward Reconciliation Rehearsal

on:
  pull_request:
    paths:
      - 'config/supabase-forward-reconciliation.json'
      - 'scripts/supabase/forward-reconciliation-control-plane.mjs'
      - 'scripts/supabase/verify-forward-reconciliation-postconditions.sql'
      - 'scripts/security/validate-enterprise-integrations-runtime.sql'
      - 'scripts/security/validate-enterprise-billing-runtime.sql'
      - 'scripts/security/validate-live-rls-inventory-helper-boundary.sql'
      - 'scripts/security/validate-gap-remediation-runtime.sql'
      - 'scripts/recovery/verify-supabase-provider-managed-restore.mjs'
      - 'scripts/recovery/destroy-supabase-provider-managed-restore.mjs'
      - 'docs/adr/ADR-018-supabase-provider-managed-recovery-rehearsal.md'
      - 'supabase/migrations/**'
      - 'tests/security/supabase-provider-managed-restore.test.mjs'
      - 'tests/security/hermetic-forward-reconciliation-workflows.test.mjs'
      - '.github/workflows/supabase-forward-reconciliation-rehearsal.yml'
      - '.github/workflows/supabase-forward-reconciliation-dry-run.yml'
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact current main SHA containing the reviewed forward reconciliation set
        required: true
        type: string
      restore_project_ref:
        description: Supabase project ref created by Restore to a New Project from the selected Production backup
        required: true
        type: string
      backup_id:
        description: Selected source backup identifier as shown by Supabase
        required: true
        type: string
      backup_created_at:
        description: ISO-8601 creation timestamp of the selected source backup
        required: true
        type: string
      restore_started_at:
        description: ISO-8601 timestamp when Restore to a New Project was started
        required: true
        type: string
      restore_completed_at:
        description: ISO-8601 timestamp when the restored project became healthy
        required: true
        type: string
      restore_attestation:
        description: Type SUPABASE_RESTORE_TO_NEW_PROJECT_CONFIRMED after verifying the target came from the selected source backup
        required: true
        type: string
      destroy_confirmation:
        description: Type DELETE <restore_project_ref> AFTER REHEARSAL to authorize teardown of only the isolated restore project
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: supabase-forward-reconciliation-rehearsal-${{ inputs.release_sha || github.ref }}
  cancel-in-progress: false

jobs:
  contract:
    name: Validate bounded reconciliation contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact contract SHA
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - name: Set up pinned Supabase CLI contract baseline
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520
        with:
          version: 2.114.0
      - name: Install dependencies deterministically without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Validate provider-managed recovery control plane
        run: |
          node --check scripts/supabase/forward-reconciliation-control-plane.mjs
          node --check scripts/recovery/verify-supabase-provider-managed-restore.mjs
          node --check scripts/recovery/destroy-supabase-provider-managed-restore.mjs
          node --test tests/security/supabase-provider-managed-restore.test.mjs
          node --test tests/security/hermetic-forward-reconciliation-workflows.test.mjs
      - name: Compile exact contract manifest
        shell: bash
        env:
          CONTRACT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CONTRACT_SHA"
          node scripts/supabase/forward-reconciliation-control-plane.mjs compile config/supabase-forward-reconciliation.json "$RUNNER_TEMP/forward-reconciliation-manifest.json" --expected-sha="$CONTRACT_SHA"
          jq -e '.checks.productionWriteAuthorized == false' "$RUNNER_TEMP/forward-reconciliation-manifest.json" >/dev/null
          jq -e '.checks.migrationHistoryRepairAuthorized == false' "$RUNNER_TEMP/forward-reconciliation-manifest.json" >/dev/null
          jq -e '.checks.unrestrictedDbPushAuthorized == false' "$RUNNER_TEMP/forward-reconciliation-manifest.json" >/dev/null
          test "$(jq '.migrations | length' "$RUNNER_TEMP/forward-reconciliation-manifest.json")" -ge 1
          test "$(jq '.migrations | length' "$RUNNER_TEMP/forward-reconciliation-manifest.json")" -le 33
      - name: Prove Production row data cannot transit this GitHub-hosted workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/supabase-forward-reconciliation-rehearsal.yml').read_text(encoding='utf-8')
          forbidden = [
              'secrets.' + 'SUPABASE_DB_' + 'POOLER_URL',
              'node scripts/recovery/' + 'run-backup-' + 'restore-exercise.mjs',
              'supabase db ' + 'dump --',
              'pg_' + 'dump ',
              'production-' + 'data.sql',
              'production-' + 'backup.dump',
          ]
          for token in forbidden:
              if token in text:
                  raise SystemExit(f'Production row-data path still present: {token}')
          for token in [
              'verify-supabase-provider-managed-restore.mjs',
              'destroy-supabase-provider-managed-restore.mjs',
              'SUPABASE_RESTORE_TO_NEW_PROJECT_CONFIRMED',
              'RECOVERY_PROVIDER_DESTROY_CONFIRMATION',
              'validate-gap-remediation-runtime.sql',
              'Destroy isolated Supabase restore project',
          ]:
              if token not in text:
                  raise SystemExit(f'provider-managed recovery guard missing: {token}')
          PY
      - name: Reject dangerous production shortcuts in bounded workflows
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          forbidden = ['--include' + '-all', 'migration ' + 'repair']
          paths = [Path('.github/workflows/supabase-forward-reconciliation-rehearsal.yml'), Path('.github/workflows/supabase-forward-reconciliation-dry-run.yml'), Path('scripts/supabase/forward-reconciliation-control-plane.mjs')]
          for path in paths:
              text = path.read_text(encoding='utf-8')
              for token in forbidden:
                  if token in text:
                      raise SystemExit(f'forbidden bounded-reconciliation shortcut in {path}')
          PY

  rehearse:
    name: Rehearse selected migrations on Supabase provider-managed Production restore
    if: github.event_name == 'workflow_dispatch'
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    environment: supabase-production-migration-dry-run
    env:
      TARGET_SHA: ${{ inputs.release_sha }}
      RELEASE_SHA: ${{ inputs.release_sha }}
      RECOVERY_REQUIRED_EXERCISE: backup-restore
      RECOVERY_PROVIDER_RESTORE_PROJECT_REF: ${{ inputs.restore_project_ref }}
      RECOVERY_PROVIDER_BACKUP_ID: ${{ inputs.backup_id }}
      RECOVERY_PROVIDER_BACKUP_CREATED_AT: ${{ inputs.backup_created_at }}
      RECOVERY_PROVIDER_RESTORE_STARTED_AT: ${{ inputs.restore_started_at }}
      RECOVERY_PROVIDER_RESTORE_COMPLETED_AT: ${{ inputs.restore_completed_at }}
      RECOVERY_PROVIDER_RESTORE_ATTESTATION: ${{ inputs.restore_attestation }}
      RECOVERY_PROVIDER_DESTROY_CONFIRMATION: ${{ inputs.destroy_confirmation }}
      MANIFEST_PATH: artifacts/supabase-forward-reconciliation/manifest.json
      ATTESTATION_PATH: artifacts/supabase-forward-reconciliation/rehearsal-attestation.json
    steps:
      - name: Validate exact current main subject
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$GITHUB_REF_NAME" = 'main'
          test "$GITHUB_SHA" = "$TARGET_SHA"
          main_sha="$(curl --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/main" | jq -r '.sha')"
          test "$main_sha" = "$TARGET_SHA"
          test "$RECOVERY_PROVIDER_RESTORE_ATTESTATION" = 'SUPABASE_RESTORE_TO_NEW_PROJECT_CONFIRMED'
          test "$RECOVERY_PROVIDER_DESTROY_CONFIRMATION" = "DELETE ${RECOVERY_PROVIDER_RESTORE_PROJECT_REF} AFTER REHEARSAL"
      - name: Checkout exact current main SHA
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ inputs.release_sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify checked out source
        run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies deterministically without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Compile immutable selected migration manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$MANIFEST_PATH")"
          node scripts/supabase/forward-reconciliation-control-plane.mjs compile config/supabase-forward-reconciliation.json "$MANIFEST_PATH" --expected-sha="$TARGET_SHA"
      - name: Verify Supabase provider-managed Production restore without exporting row data
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
        run: node scripts/recovery/verify-supabase-provider-managed-restore.mjs verify
      - name: Apply only selected exact-byte migrations to isolated Supabase restore project
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r filename expected_digest; do
            [[ "$filename" =~ ^[0-9]{14}_[a-z0-9_]+\.sql$ ]]
            path="supabase/migrations/$filename"
            test -f "$path"
            observed_digest="$(sha256sum "$path" | awk '{print $1}')"
            test "$observed_digest" = "$expected_digest"
            node scripts/recovery/verify-supabase-provider-managed-restore.mjs apply-file "$path"
          done < <(jq -r '.migrations[] | [.filename, .sha256] | @tsv' "$MANIFEST_PATH")
      - name: Verify selected migration postconditions on isolated Supabase restore project
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
        run: |
          set -euo pipefail
          for validator in \
            scripts/supabase/verify-forward-reconciliation-postconditions.sql \
            scripts/security/validate-enterprise-integrations-runtime.sql \
            scripts/security/validate-enterprise-billing-runtime.sql \
            scripts/security/validate-live-rls-inventory-helper-boundary.sql \
            scripts/security/validate-gap-remediation-runtime.sql; do
            node scripts/recovery/verify-supabase-provider-managed-restore.mjs apply-file "$validator"
          done
          echo 'FORWARD_RECONCILIATION_POSTCONDITIONS=passed' >> "$GITHUB_ENV"
      - name: Seal non-authorizing exact-SHA rehearsal attestation
        shell: bash
        run: |
          set -euo pipefail
          node scripts/supabase/forward-reconciliation-control-plane.mjs attest "$MANIFEST_PATH" docs/security/evidence/p1/backup-restore-tested.json "$ATTESTATION_PATH" --expected-sha="$TARGET_SHA"
          node scripts/supabase/forward-reconciliation-control-plane.mjs validate-rehearsal "$MANIFEST_PATH" "$ATTESTATION_PATH" --expected-sha="$TARGET_SHA"
      - name: Upload redacted immutable rehearsal evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: supabase-forward-reconciliation-rehearsal-${{ inputs.release_sha }}
          path: |
            artifacts/supabase-forward-reconciliation/manifest.json
            artifacts/supabase-forward-reconciliation/rehearsal-attestation.json
            docs/security/evidence/p1/backup-restore-tested.json
          if-no-files-found: warn
          retention-days: 90
      - name: Destroy isolated Supabase restore project
        if: always()
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
        run: node scripts/recovery/destroy-supabase-provider-managed-restore.mjs