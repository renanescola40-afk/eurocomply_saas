name: Legal Rules Runtime Validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/server/ai-governance/legal-rules.ts'
      - 'src/server/ai-governance/legal-rules-runtime.ts'
      - 'src/server/ai-governance/decision-engine.ts'
      - 'src/app/api/ops/legal-rules-validation/**'
      - 'src/server/release/runtime-release-metadata.ts'
      - 'tests/legal-rules-*.test.ts'
      - 'tests/article-function-evidence-registry.test.ts'
      - 'tests/compliance/eu-ai-act-safe-runtime-promotion.test.mjs'
      - 'scripts/compliance/capture-legal-rules-runtime-evidence.mjs'
      - 'scripts/compliance/create-legal-rules-runtime-promotion-pr.mjs'
      - 'scripts/compliance/generate-eu-ai-act-product-coverage.mjs'
      - 'scripts/security/check-p0-runtime-evidence-files.mjs'
      - 'docs/compliance/**'
      - 'docs/architecture/decisions/2026-07-30-legal-rules-runtime-evidence.md'
      - 'docs/security/evidence/runtime/legal-rules-validation.json'
      - 'docs/security/evidence/runtime/technical-closeout-consolidated.json'
      - '.github/workflows/legal-rules-runtime-validation.yml'
      - '.github/workflows/legal-rules-runtime-promotion.yml'
  push:
    branches: [main]
    paths:
      - 'src/server/ai-governance/legal-rules.ts'
      - 'src/server/ai-governance/legal-rules-runtime.ts'
      - 'src/app/api/ops/legal-rules-validation/**'
      - 'scripts/compliance/capture-legal-rules-runtime-evidence.mjs'
      - 'scripts/compliance/create-legal-rules-runtime-promotion-pr.mjs'
      - 'scripts/compliance/generate-eu-ai-act-product-coverage.mjs'
      - 'scripts/security/check-p0-runtime-evidence-files.mjs'
      - '.github/workflows/legal-rules-runtime-validation.yml'
      - '.github/workflows/legal-rules-runtime-promotion.yml'
  deployment_status:
  workflow_dispatch:
    inputs:
      deployment_url:
        description: 'Exact HTTPS deployment origin to validate'
        required: true
        type: string
      expected_sha:
        description: 'Full 40-character deployment SHA'
        required: true
        type: string
      environment:
        description: 'Evidence environment label'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - production

permissions:
  contents: read

env:
  TARGET_SHA: ${{ github.event.pull_request.head.sha || inputs.expected_sha || github.event.deployment.sha || github.sha }}

concurrency:
  # Deployment-status events are noisy: Vercel/GitHub can emit several status
  # records for the same SHA. A skipped/untrusted sibling must never cancel the
  # successful current-main run that is capturing immutable runtime evidence.
  # PR/push/manual runs still coalesce by exact SHA as before.
  group: legal-rules-runtime-validation-${{ github.event_name == 'deployment_status' && github.run_id || github.event.pull_request.head.sha || inputs.expected_sha || github.event.deployment.sha || github.sha }}
  cancel-in-progress: true

jobs:
  contract:
    name: Legal rules contract gates
    if: >-
      github.event_name != 'deployment_status' ||
      (
        github.event.deployment_status.state == 'success' &&
        (
          github.event.deployment.ref == github.event.repository.default_branch ||
          github.event.deployment.ref == ''
        )
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact assessed SHA
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false

      - name: Verify exact assessed checkout
        run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies deterministically
        run: npm ci --ignore-scripts

      - name: Run focused legal rules contracts
        run: >-
          npx vitest run
          src/server/ai-governance/legal-rules.test.ts
          src/server/ai-governance/legal-rules-runtime.test.ts
          src/server/ai-governance/decision-engine.test.ts
          tests/ai-act-decision-engine-contract.test.ts
          tests/legal-rules-runtime-api-contract.test.ts
          tests/legal-rules-runtime-capture-contract.test.ts
          tests/legal-rules-runtime-promotion-contract.test.ts
          tests/legal-rules-closeout-artifacts.test.ts
          tests/article-function-evidence-registry.test.ts
          tests/compliance/eu-ai-act-safe-runtime-promotion.test.mjs

      - name: Validate P0 runtime evidence schemas
        run: node scripts/security/check-p0-runtime-evidence-files.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Run focused security gates
        run: |
          npm run security:no-store
          npm run security:headers
          npm run security:logs
          npm run security:public-errors

  runtime:
    name: Capture deployed exact-SHA evidence
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'deployment_status' &&
        github.event.deployment_status.state == 'success' &&
        (
          github.event.deployment.ref == github.event.repository.default_branch ||
          github.event.deployment.ref == ''
        )
      )
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DEPLOYMENT_URL: ${{ github.event_name == 'deployment_status' && 'https://www.risckcomply.com' || inputs.deployment_url }}
      EXPECTED_DEPLOYMENT_SHA: ${{ inputs.expected_sha || github.event.deployment.sha }}
      DEPLOYMENT_EVENT_STATE: ${{ github.event.deployment_status.state }}
      DEPLOYMENT_EVENT_REF: ${{ github.event.deployment.ref }}
      DEPLOYMENT_EVENT_SHA: ${{ github.event.deployment.sha }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      INTERNAL_CRON_SECRET: ${{ secrets.INTERNAL_CRON_SECRET || secrets.CRON_SECRET }}
      OUTPUT_PATH: artifacts/legal-rules-runtime/docs/security/evidence/runtime/legal-rules-validation.json
    steps:
      - name: Checkout exact deployed SHA
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ env.EXPECTED_DEPLOYMENT_SHA }}
          persist-credentials: false
          fetch-depth: 0

      - name: Verify deployment event trust boundary
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_DEPLOYMENT_SHA"
          test -n "$INTERNAL_CRON_SECRET"
          node <<'NODE'
          const fullSha = /^[a-f0-9]{40}$/;
          const rawUrl = String(process.env.DEPLOYMENT_URL || '').trim();
          const expectedSha = String(process.env.EXPECTED_DEPLOYMENT_SHA || '').trim().toLowerCase();
          if (!fullSha.test(expectedSha)) throw new Error('deployment SHA must be a full lowercase SHA');
          const url = new URL(rawUrl);
          const host = url.hostname.toLowerCase();
          const allowedHost = host === 'risckcomply.com'
            || host === 'www.risckcomply.com'
            || host.endsWith('.vercel.app');
          if (url.protocol !== 'https:' || url.username || url.password || url.search || url.hash || !allowedHost) {
            throw new Error('deployment URL is outside the approved HTTPS host boundary');
          }
          if (process.env.GITHUB_EVENT_NAME === 'deployment_status') {
            if (process.env.DEPLOYMENT_EVENT_STATE !== 'success') throw new Error('deployment status must be success');
            const deploymentRef = String(process.env.DEPLOYMENT_EVENT_REF || '');
            if (deploymentRef && deploymentRef !== process.env.DEFAULT_BRANCH) throw new Error('deployment ref is neither the default branch nor an empty commit-SHA ref');
            if (String(process.env.DEPLOYMENT_EVENT_SHA || '').toLowerCase() !== expectedSha) throw new Error('deployment event SHA mismatch');
            if (url.origin !== 'https://www.risckcomply.com') throw new Error('automatic production proof must use the canonical production origin');
          }
          NODE
          if [ "$GITHUB_EVENT_NAME" = 'deployment_status' ]; then
            git fetch --no-tags origin "+refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"
            test "$(git rev-parse "refs/remotes/origin/${DEFAULT_BRANCH}")" = "$EXPECTED_DEPLOYMENT_SHA"
          fi

      - name: Capture and verify runtime evidence
        run: |
          install -d -m 700 "$(dirname "$OUTPUT_PATH")"
          umask 077
          node scripts/compliance/capture-legal-rules-runtime-evidence.mjs > "$OUTPUT_PATH"
          node -e 'const fs=require("node:fs"); const p=process.env.OUTPUT_PATH; const v=JSON.parse(fs.readFileSync(p,"utf8")); if(v.status!=="PASS"||v.deploymentSha!==process.env.EXPECTED_DEPLOYMENT_SHA) process.exit(1)'

      - name: Upload immutable runtime evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: legal-rules-runtime-${{ inputs.expected_sha || github.event.deployment.sha }}
          path: artifacts/legal-rules-runtime
          retention-days: 365
          if-no-files-found: error
