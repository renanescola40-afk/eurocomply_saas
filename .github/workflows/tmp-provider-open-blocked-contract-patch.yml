name: Temporary provider Open-blocked evidence contract patch

on:
  push:
    branches:
      - fix/provider-open-blocked-evidence-contract

permissions:
  contents: write

concurrency:
  group: tmp-provider-open-blocked-${{ github.ref }}
  cancel-in-progress: false

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 1

      - name: Patch fail-closed provider evidence validator
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'scripts/security/check-p0-runtime-evidence-files.mjs';
          let source = fs.readFileSync(path, 'utf8');
          if (source.includes('function checkProductionProviderOpenEvidence(')) {
            throw new Error('provider Open/blocked validator already present');
          }

          const functionMarker = 'function checkEnterpriseReleaseEnvOpenPlaceholder(file, evidence) {';
          if (!source.includes(functionMarker)) throw new Error('validator insertion marker missing');

          const providerValidator = String.raw`function checkProductionProviderOpenEvidence(file, evidence) {
  if (evidence.evidenceItem !== 'production-secrets-provider-stores' || evidence.status !== 'Open') return false;
  if (evidence.schema !== 'risck-comply.production-provider-runtime-evidence.v2') failures.push(\`${file} has unexpected production provider evidence schema\`);
  if (evidence.outcome !== 'blocked') failures.push(\`${file} Open provider evidence must have outcome blocked\`);
  requireString(file, evidence, 'reviewer', 3);
  requireString(file, evidence, 'reviewedAt', 10);
  requireString(file, evidence, 'summary', 40);
  requireArray(file, evidence, 'evidenceLocations', 1);
  if (!hasValidRedactionText(evidence)) failures.push(\`${file} missing redaction confirmation\`);
  if (evidence.valuesRedacted !== true) failures.push(\`${file} Open provider evidence must confirm valuesRedacted\`);

  const runtimeContext = requireObject(file, evidence, 'runtimeContext');
  if (runtimeContext) {
    if (runtimeContext.repository !== 'renanescola40-afk/eurocomply_saas') failures.push(\`${file} has unexpected provider evidence repository binding\`);
    if (runtimeContext.branch !== 'main') failures.push(\`${file} Open provider evidence must be bound to main\`);
    if (!FULL_SHA.test(String(runtimeContext.commitSha ?? ''))) failures.push(\`${file} Open provider evidence requires a full commit SHA\`);
    if (runtimeContext.environment !== 'production') failures.push(\`${file} Open provider evidence must target production\`);
    if (runtimeContext.generatedByGithubActions !== true) failures.push(\`${file} Open provider evidence must be generated by GitHub Actions\`);
  }

  requireArray(file, evidence, 'providersReviewed', 5);
  const providers = Array.isArray(evidence.providersReviewed) ? evidence.providersReviewed : [];
  const expectedProviderNames = ['github', 'vercel', 'supabase', 'stripe', 'sentry'];
  const observedProviderNames = providers.map((entry) => String(entry?.provider ?? ''));
  if (JSON.stringify(observedProviderNames) !== JSON.stringify(expectedProviderNames)) {
    failures.push(\`${file} Open provider evidence must preserve the canonical five-provider order\`);
  }

  let blockedCount = 0;
  const expectedControlsVerified = [];
  for (const entry of providers) {
    if (!entry || typeof entry !== 'object' || Array.isArray(entry)) {
      failures.push(\`${file} contains invalid provider evidence entry\`);
      continue;
    }
    if (entry.environment !== 'production') failures.push(\`${file} provider ${entry.provider ?? 'unknown'} must target production\`);
    if (entry.status !== 'reviewed' && entry.status !== 'blocked') failures.push(\`${file} provider ${entry.provider ?? 'unknown'} has unsupported status\`);
    requireString(file, entry, 'evidenceLocation', 10);
    const checks = requireObject(file, entry, 'checks');
    const checkValues = checks ? Object.values(checks) : [];
    if (entry.status === 'reviewed') {
      if (checkValues.length === 0 || checkValues.some((value) => value !== true)) {
        failures.push(\`${file} reviewed provider ${entry.provider ?? 'unknown'} must have every check true\`);
      }
      expectedControlsVerified.push(\`${entry.provider} production provider configuration verified by protected runtime probe.\`);
    }
    if (entry.status === 'blocked') {
      blockedCount += 1;
      if (checkValues.length === 0 || checkValues.every((value) => value === true)) {
        failures.push(\`${file} blocked provider ${entry.provider ?? 'unknown'} must preserve at least one failed check\`);
      }
    }
  }
  if (blockedCount < 1) failures.push(\`${file} Open provider evidence must contain at least one blocked provider\`);
  if (JSON.stringify(evidence.controlsVerified ?? []) !== JSON.stringify(expectedControlsVerified)) {
    failures.push(\`${file} controlsVerified must list only providers whose protected checks all passed\`);
  }

  const integrity = requireObject(file, evidence, 'evidenceIntegrity');
  if (integrity) {
    for (const key of [
      'containsSensitiveValues',
      'rawValuesStored',
      'credentialsStored',
      'providerResponseBodiesStored',
      'decryptedProviderEnvironmentValuesStored',
      'selectedNonSecretControlValuesStored',
    ]) {
      if (integrity[key] !== false) failures.push(\`${file} provider evidence integrity field ${key} must be false\`);
    }
    if (integrity.exactShaBound !== true) failures.push(\`${file} Open provider evidence must remain exact-SHA bound\`);
  }
  return true;
}
`;
          source = source.replace(functionMarker, `${providerValidator}\n${functionMarker}`);

          const loopMarker = '  if (checkReleaseOpenPlaceholder(file, evidence)) continue;';
          if (!source.includes(loopMarker)) throw new Error('validator loop marker missing');
          source = source.replace(loopMarker, `${loopMarker}\n  if (checkProductionProviderOpenEvidence(file, evidence)) continue;`);
          fs.writeFileSync(path, source, 'utf8');

          const testPath = 'tests/enterprise/production-provider-open-evidence-validator.test.mjs';
          const test = `import assert from 'node:assert/strict';\nimport { readFile } from 'node:fs/promises';\nimport test from 'node:test';\n\nconst validator = await readFile('scripts/security/check-p0-runtime-evidence-files.mjs', 'utf8');\nconst producer = await readFile('scripts/security/run-production-provider-runtime-proof.mjs', 'utf8');\n\ntest('provider producer emits fail-closed Open/blocked evidence when any provider fails', () => {\n  assert.match(producer, /status: allPassed \\? 'Complete' : 'Open'/);\n  assert.match(producer, /outcome: allPassed \\? 'passed' : 'blocked'/);\n  assert.match(producer, /providersReviewed\\.every\\(\\(entry\\) => entry\\.status === 'reviewed'\\)/);\n});\n\ntest('runtime evidence validator explicitly validates provider Open/blocked without granting PASS credit', () => {\n  assert.match(validator, /function checkProductionProviderOpenEvidence\\(/);\n  assert.match(validator, /Open provider evidence must contain at least one blocked provider/);\n  assert.match(validator, /reviewed provider .* must have every check true/);\n  assert.match(validator, /blocked provider .* must preserve at least one failed check/);\n  assert.match(validator, /controlsVerified must list only providers whose protected checks all passed/);\n  assert.match(validator, /checkProductionProviderOpenEvidence\\(file, evidence\\)/);\n  assert.doesNotMatch(validator, /Open provider evidence.*status.*Complete/);\n});\n`;
          fs.writeFileSync(testPath, test, 'utf8');
          NODE

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/security/check-p0-runtime-evidence-files.mjs tests/enterprise/production-provider-open-evidence-validator.test.mjs
          git commit -m "fix(security): validate blocked provider runtime evidence fail closed"
          git push origin "HEAD:${GITHUB_REF_NAME}"
