name: Temporary provider evidence contract patcher

on:
  push:
    branches:
      - fix/provider-open-blocked-evidence-contract

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 1

      - name: Apply provider evidence contract patch
        run: node scripts/maintenance/patch-provider-open-evidence-contract.mjs

      - name: Commit generated patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/security/check-p0-runtime-evidence-files.mjs tests/enterprise/production-provider-open-evidence-validator.test.mjs
          git commit -m "fix(security): validate blocked provider runtime evidence fail closed"
          git push origin "HEAD:${GITHUB_REF_NAME}"
