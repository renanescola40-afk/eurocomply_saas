name: Lockfile Regeneration Artifact

on:
  pull_request:
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/lockfile-regeneration-artifact.yml
  workflow_dispatch:
    inputs:
      commit_clean_lockfile:
        description: 'Commit regenerated package-lock.json back to the current branch'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: write

jobs:
  regenerate-lockfile:
    name: Regenerate package-lock artifact
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Regenerate package-lock only
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify removed auth provider is absent from root lock manifest
        run: |
          node - <<'NODE'
          const { readFileSync } = require('node:fs');
          const lock = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          const rootDeps = lock.packages?.['']?.dependencies ?? {};
          if ('@clerk/nextjs' in rootDeps) {
            console.error('@clerk/nextjs is still present in package-lock root dependencies');
            process.exit(1);
          }
          console.log('package-lock root dependencies are clean for the active Supabase Auth stack');
          NODE

      - name: Upload regenerated package-lock
        uses: actions/upload-artifact@v4
        with:
          name: regenerated-package-lock
          path: package-lock.json
          if-no-files-found: error

      - name: Commit regenerated package-lock
        if: github.event_name == 'workflow_dispatch' && inputs.commit_clean_lockfile == 'true'
        run: |
          if git diff --quiet -- package-lock.json; then
            echo 'package-lock.json already clean; no commit needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'chore: apply regenerated package lock'
          git push
