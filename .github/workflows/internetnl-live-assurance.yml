name: Internet.nl Live Assurance

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/assurance/internetnl-live-assurance.mjs'
      - '.github/workflows/internetnl-live-assurance.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: internetnl-live-assurance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  website-assurance:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'assurance/internetnl-live-assurance'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        include:
          - domain: www.risckcomply.com
            slug: canonical-cloudflare-edge
          - domain: eurocomply-saas.vercel.app
            slug: direct-vercel-edge
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run public Internet.nl website test
        env:
          INTERNETNL_DOMAIN: ${{ matrix.domain }}
          REPORT_PATH: artifacts/internetnl/${{ matrix.slug }}.json
          INTERNETNL_TIMEOUT_MS: '300000'
          INTERNETNL_POLL_MS: '5000'
        run: |
          set -euo pipefail
          umask 077
          mkdir -p artifacts/internetnl
          tmp="${REPORT_PATH}.tmp"
          trap 'rm -f "$tmp"' EXIT
          node scripts/assurance/internetnl-live-assurance.mjs > "$tmp"
          chmod 600 "$tmp"
          mv "$tmp" "$REPORT_PATH"
          trap - EXIT

      - name: Publish compact job summary
        if: always()
        env:
          REPORT_PATH: artifacts/internetnl/${{ matrix.slug }}.json
        run: |
          if [ -f "$REPORT_PATH" ]; then
            node - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs = require('fs');
          const p = process.env.REPORT_PATH;
          const e = JSON.parse(fs.readFileSync(p, 'utf8'));
          console.log(`## Internet.nl Website Assurance`);
          console.log(`- Domain: \`${e.domain}\``);
          console.log(`- Score: **${e.score}%**`);
          console.log(`- 100% claim: **${e.claims.internetNl100Website}**`);
          console.log(`- Report: ${e.reportUrl}`);
          for (const [name, verdict] of Object.entries(e.categoryVerdicts || {})) console.log(`- ${name}: ${verdict}`);
          NODE
          else
            echo '## Internet.nl Website Assurance' >> "$GITHUB_STEP_SUMMARY"
            echo '- Live evidence was not produced; inspect the probe step.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload redacted Internet.nl evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: internetnl-website-assurance-${{ matrix.slug }}
          path: artifacts/internetnl/${{ matrix.slug }}.json
          if-no-files-found: warn
          retention-days: 14
