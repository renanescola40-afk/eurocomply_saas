name: Enterprise Break-Glass Governance

on:
  pull_request:
    paths:
      - 'supabase/migrations/**break_glass**'
      - 'src/server/enterprise/break-glass-governance.ts'
      - 'src/app/api/team/break-glass/**'
      - 'src/app/api/internal/enterprise-break-glass/**'
      - 'tests/enterprise/enterprise-break-glass-governance.test.ts'
      - '.github/workflows/enterprise-break-glass-governance.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: enterprise-break-glass-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  assurance:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Break-glass contract tests
        run: npx vitest run tests/enterprise/enterprise-break-glass-governance.test.ts
      - name: Typecheck
        run: npm run typecheck
      - name: Security API guards
        run: npm run security:api-guards
