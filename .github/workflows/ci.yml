name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Refresh lockfile for current package manifest
        run: npm install --package-lock-only --ignore-scripts
      - run: npm ci --ignore-scripts
      - run: npm run phase3:strict
      - run: npm run phase3:closeout
      - run: npm run phase4:check
      - run: node scripts/dev/check-phase4-final-review.mjs
      - run: node scripts/dev/check-phase4-next-implementation-plan.mjs
      - run: node scripts/dev/check-phase4-validation-commands.mjs
      - run: npm run phase5:check
      - run: npm run phase6:check
      - name: Lint
        shell: bash
        run: |
          npm run lint 2>&1 | tee lint.log
          test "${PIPESTATUS[0]}" -eq 0
      - name: Upload lint diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-lint-diagnostics
          path: lint.log
          retention-days: 7
          if-no-files-found: warn
      - name: Typecheck
        shell: bash
        run: |
          npm run typecheck 2>&1 | tee typecheck.log
          test "${PIPESTATUS[0]}" -eq 0
      - name: Upload typecheck diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-typecheck-diagnostics
          path: typecheck.log
          retention-days: 7
          if-no-files-found: warn
      - name: Test
        shell: bash
        run: |
          npm run test 2>&1 | tee test.log
          test "${PIPESTATUS[0]}" -eq 0
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-test-diagnostics
          path: test.log
          retention-days: 7
          if-no-files-found: warn
