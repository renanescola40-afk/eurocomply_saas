name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Run Phase 3 strict checks
        run: npm run phase3:strict
      - name: Run Phase 3 closeout checks
        run: npm run phase3:closeout
      - name: Run Phase 4 checks
        run: npm run phase4:check
      - name: Check Phase 4 final review
        run: node scripts/dev/check-phase4-final-review.mjs
      - name: Check Phase 4 implementation plan
        run: node scripts/dev/check-phase4-next-implementation-plan.mjs
      - name: Check Phase 4 validation commands
        run: node scripts/dev/check-phase4-validation-commands.mjs
      - name: Run Phase 5 checks
        run: npm run phase5:check
      - name: Run Phase 6 checks
        run: npm run phase6:check
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test
