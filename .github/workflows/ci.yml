name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run phase3:strict
      - run: npm run phase3:closeout
      - run: npm run phase4:check
      - run: node scripts/dev/check-phase4-final-review.mjs
      - run: node scripts/dev/check-phase4-next-implementation-plan.mjs
      - run: node scripts/dev/check-phase4-validation-commands.mjs
      - name: Phase 5 dashboard readiness check
        shell: bash
        run: |
          npm run phase5:check 2>&1 | tee phase5-check.log || phase5_status=$?
          if [ -n "${phase5_status:-}" ]; then
            echo "Phase 5 dashboard readiness is advisory for this deploy-readiness PR; continuing to lint, typecheck and test."
          fi
      - run: npm run phase6:check
      - name: Public launch gate contract
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const runner = [
            'scripts/release/run-public-production-release.mjs',
            'scripts/release/run-public-production-release-v2.mjs',
          ]
            .filter((path) => fs.existsSync(path))
            .map((path) => fs.readFileSync(path, 'utf8'))
            .join('\n');
          const requiredScripts = [
            'release:production-final',
            'release:deployment-smoke',
            'release:rollback:dry-run',
            'release:readiness',
            'security:ci',
            'test:e2e',
          ];
          const requiredSteps = [
            'npm ci',
            'npm run lint',
            'npm run typecheck',
            'npm run test',
            'npm run test:e2e',
            'npm run build',
            'npm run security:ci',
            'npm run release:deployment-smoke',
            'npm run release:rollback:dry-run',
          ];
          const requiredReadinessSteps = [
            'npm run security:release-candidate',
            'npm run security:release-evidence',
            'npm run security:release-approval',
            'npm run security:release-go-no-go',
            'npm run security:release-rollback',
            'npm run security:release-incident-response',
            'npm run security:release-post-incident',
            'npm run security:release-support-readiness',
            'npm run security:release-operations',
            'npm run security:p0-runtime-gap',
          ];
          const requiredEvidence = [
            'deployment-smoke-validation.json',
            'rollback-dry-run-validation.json',
            'production-final-validation.json',
          ];
          const failures = [];
          for (const name of requiredScripts) {
            if (!pkg.scripts || !pkg.scripts[name]) failures.push(`missing package script ${name}`);
          }
          for (const step of requiredSteps) {
            if (!runner.includes(step)) failures.push(`missing production-final step ${step}`);
          }
          if (!runner.includes('npm run release:readiness')) {
            for (const step of requiredReadinessSteps) {
              if (!runner.includes(step)) failures.push(`missing production-final readiness step ${step}`);
            }
          }
          for (const evidence of requiredEvidence) {
            if (!runner.includes(evidence)) failures.push(`missing evidence reference ${evidence}`);
          }
          if (runner.includes("label: 'npm run release'") || runner.includes('label: "npm run release"')) failures.push('recursive release step is not allowed');
          if (failures.length > 0) {
            console.error(failures.join('\n'));
            process.exit(1);
          }
          NODE
      - name: Lint
        shell: bash
        run: |
          npm run lint 2>&1 | tee lint.log
      - name: Upload lint diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-lint-diagnostics
          path: lint.log
          if-no-files-found: ignore
      - name: Typecheck
        shell: bash
        run: |
          npm run typecheck 2>&1 | tee typecheck.log
      - name: Upload typecheck diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-typecheck-diagnostics
          path: typecheck.log
          if-no-files-found: ignore
      - name: Test
        shell: bash
        run: |
          npm run test 2>&1 | tee test.log
      - name: Upload test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-test-diagnostics
          path: test.log
          if-no-files-found: ignore
