name: CI

on:
  push:
    branches:
      - main
      - fix/observability-smoke-anonymous-401
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  STRICT_PUBLIC_SECRET_SCAN: '1'
  CI_SECRET_LOG_POLICY: fail-closed

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies deterministically without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Package lock alignment gate
        run: npm run security:package-lock

      - name: Required GitHub checks drift gate
        run: node scripts/security/check-ci-required-checks-validation.mjs

      - name: Lint
        shell: bash
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee lint.log

      - name: Upload lint diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ci-lint-diagnostics
          path: lint.log
          if-no-files-found: ignore

      - name: Typecheck
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee typecheck.log

      - name: Upload typecheck diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ci-typecheck-diagnostics
          path: typecheck.log
          if-no-files-found: ignore

      - name: Unit tests
        shell: bash
        run: |
          set -o pipefail
          npm run test 2>&1 | tee test.log

      - name: Upload unit test diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ci-test-diagnostics
          path: test.log
          if-no-files-found: ignore

      - name: E2E tests when runtime is configured
        shell: bash
        run: |
          if ! node -e "const p=require('./package.json'); process.exit(p.scripts?.['test:e2e'] ? 0 : 1)" \
            || ! ls playwright.config.* >/dev/null 2>&1; then
            echo "No Playwright test:e2e configuration detected; skipping E2E gate."
          elif [ "${RUN_E2E:-}" = "true" ] || [ -n "${E2E_BASE_URL:-}" ]; then
            npx playwright install --with-deps chromium
            npm run test:e2e
          else
            echo "Playwright E2E tests are present, but no configured E2E runtime was provided."
            echo "Set RUN_E2E=true for local/webServer E2E or E2E_BASE_URL for an existing deployment."
            echo "Skipping E2E because this CI context has no production-like E2E runtime."
          fi

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: public-placeholder-anon-key

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ci-build-diagnostics
          path: build.log
          if-no-files-found: ignore

      - name: npm audit policy gate for dependency changes
        shell: bash
        run: |
          if git diff --quiet HEAD^ HEAD -- package.json package-lock.json npm-shrinkwrap.json; then
            echo "No dependency manifest or lockfile changes; npm audit is not applicable to this PR."
          else
            npm run security:npm-audit:all
          fi

      - name: Application security CI
        run: node scripts/security/run-security-ci-without-audit.mjs

      - name: Route quality gate
        run: npm run quality:routes
