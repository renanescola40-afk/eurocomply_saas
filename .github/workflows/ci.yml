name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Detect app-affecting changes
        id: changes
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            changed_files=$(git diff --name-only HEAD^ HEAD)
          else
            changed_files=$(git diff --name-only HEAD^ HEAD || git show --name-only --format= HEAD)
          fi
          echo "$changed_files"
          if echo "$changed_files" | grep -E '^(src|app|pages|components|lib|server|tests)/|(^|/)(package(-lock)?\.json|tsconfig\.json|next\.config\.|vitest\.config\.)'; then
            echo "app_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "app_changed=false" >> "$GITHUB_OUTPUT"
          fi
      - run: npm run phase3:strict
      - run: npm run phase3:closeout
      - run: npm run phase4:check
      - run: node scripts/dev/check-phase4-final-review.mjs
      - run: node scripts/dev/check-phase4-next-implementation-plan.mjs
      - run: node scripts/dev/check-phase4-validation-commands.mjs
      - run: npm run phase5:check
      - run: npm run phase6:check
      - run: npm run lint
      - name: Typecheck app changes
        if: steps.changes.outputs.app_changed == 'true'
        shell: bash
        run: |
          npm run typecheck 2>&1 | tee typecheck.log
          test "${PIPESTATUS[0]}" -eq 0
      - name: Upload typecheck diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-typecheck-diagnostics
          path: typecheck.log
          retention-days: 7
          if-no-files-found: warn
      - name: Skip typecheck for non-app changes
        if: steps.changes.outputs.app_changed != 'true'
        run: echo "No app/package/tsconfig changes detected; skipping app typecheck."
      - name: Test app changes
        if: steps.changes.outputs.app_changed == 'true'
        run: npm run test
      - name: Skip tests for non-app changes
        if: steps.changes.outputs.app_changed != 'true'
        run: echo "No app/package/test changes detected; skipping app tests."
