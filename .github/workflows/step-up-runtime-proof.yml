name: Step-Up Runtime Proof

run-name: Step-Up runtime proof for ${{ inputs.release_sha }}

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full 40-character main-branch release SHA deployed to the target environment
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: step-up-runtime-proof-${{ inputs.release_sha }}
  cancel-in-progress: false

jobs:
  validate-step-up-provider:
    name: Validate live Supabase MFA provider
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    steps:
      - name: Validate requested release SHA
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "release_sha must be a full 40-character Git SHA" >&2
            exit 1
          fi

      - name: Check out exact release SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha }}
          persist-credentials: false

      - name: Verify exact checkout
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${RELEASE_SHA,,}"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deterministic dependencies
        run: npm ci

      - name: Execute protected live step-up validation
        env:
          RISCK_COMPLY_ENTERPRISE_RELEASE: 'true'
          ENTERPRISE_EXPECTED_SHA: ${{ inputs.release_sha }}
          ENTERPRISE_EXPECTED_BRANCH: main
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          STEP_UP_PROVIDER_MODE: ${{ secrets.STEP_UP_PROVIDER_MODE }}
          STEP_UP_SIGNING_SECRET: ${{ secrets.STEP_UP_SIGNING_SECRET }}
          STEP_UP_LIVE_USER_EMAIL: ${{ secrets.STEP_UP_LIVE_USER_EMAIL }}
          STEP_UP_LIVE_USER_PASSWORD: ${{ secrets.STEP_UP_LIVE_USER_PASSWORD }}
          STEP_UP_LIVE_TOTP_SECRET: ${{ secrets.STEP_UP_LIVE_TOTP_SECRET }}
        run: npm run security:step-up:runtime

      - name: Upload redacted runtime evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: step-up-runtime-proof-${{ inputs.release_sha }}
          path: docs/security/evidence/runtime/step-up-mfa-validation.json
          if-no-files-found: error
          retention-days: 90
