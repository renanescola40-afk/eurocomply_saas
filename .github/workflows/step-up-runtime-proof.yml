name: Step-Up Runtime Proof

run-name: Step-Up runtime proof for ${{ inputs.release_sha }}

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full 40-character main-branch release SHA deployed to the target environment
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: step-up-runtime-proof-${{ inputs.release_sha }}
  cancel-in-progress: false

jobs:
  production-environment-governance:
    name: Verify Production governance before Step-Up secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Bind proof to exact current main before governance lookup
        shell: bash
        env:
          TARGET_SHA: ${{ inputs.release_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          test "$GITHUB_REF_NAME" = "main"
          main_sha="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/main" | jq -r '.sha')"
          test "$main_sha" = "${TARGET_SHA,,}"
      - name: Check out exact trusted release SHA
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ inputs.release_sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Verify Production environment governance before protected secrets
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_ENVIRONMENT_NAME: Production
          REQUIRE_PROTECTED_BRANCHES: 'true'
        run: node scripts/security/check-github-environment-governance.mjs

  validate-step-up-provider:
    name: Validate live Supabase MFA provider
    needs: production-environment-governance
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: Production

    steps:
      - name: Validate requested release SHA
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "release_sha must be a full 40-character Git SHA" >&2
            exit 1
          fi

      - name: Check out exact release SHA
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ inputs.release_sha }}
          persist-credentials: false

      - name: Verify exact checkout and current main binding
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${RELEASE_SHA,,}"
          main_sha="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/main" | jq -r '.sha')"
          test "$main_sha" = "${RELEASE_SHA,,}"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Install deterministic dependencies
        run: npm ci --ignore-scripts

      - name: Validate disposable Step-Up proof contracts
        run: >-
          npx vitest run
          tests/security/ephemeral-mfa-fixture.test.ts
          tests/security/step-up-runtime-proof-integrity.test.ts
          tests/enterprise/step-up-runtime-evidence-fetch.test.ts

      - name: Execute protected live step-up validation
        env:
          RISCK_COMPLY_ENTERPRISE_RELEASE: 'true'
          ENTERPRISE_EXPECTED_SHA: ${{ inputs.release_sha }}
          ENTERPRISE_EXPECTED_BRANCH: main
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          STEP_UP_PROVIDER_MODE: supabase_mfa
          STEP_UP_SIGNING_SECRET: ${{ secrets.STEP_UP_ASSERTION_SIGNING_SECRET || secrets.STEP_UP_SIGNING_SECRET }}
        run: npm run security:step-up:runtime

      - name: Upload redacted runtime evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: step-up-runtime-proof-${{ inputs.release_sha }}
          path: docs/security/evidence/runtime/step-up-mfa-validation.json
          if-no-files-found: error
          retention-days: 90
