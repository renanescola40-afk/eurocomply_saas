name: P0 Branch Protection Evidence

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p0-branch-protection-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  branch-protection-evidence:
    name: Generate branch protection evidence draft
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate committed branch protection evidence policy
        run: node scripts/security/check-branch-protection-evidence.mjs

      - name: Generate branch protection evidence JSON
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.BRANCH_PROTECTION_READ_TOKEN != '' && secrets.BRANCH_PROTECTION_READ_TOKEN || github.token }}
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = 'main';
            const artifactPath = 'p0-evidence/branch-protection-main.generated.json';
            const requiredChecks = [
              'Full Security Suite / Core CI, build and npm audit',
              'Full Security Suite / Actionlint',
              'Full Security Suite / Secret scanning (Gitleaks)',
              'Full Security Suite / Semgrep SAST',
              'Full Security Suite / CodeQL',
              'Full Security Suite / Dependency Review',
              'Full Security Suite / OSSF Scorecard',
              'Full Security Suite / Enterprise merge/deploy gate',
              'CI / quality',
              'RISCK COMPLY Security CI / Run security gates, typecheck and tests',
              'Gitleaks / Scan repository for accidental secret exposure',
              'Secret Scanning / Production secret readiness gate',
            ];
            const aliases = {
              'Full Security Suite / Core CI, build and npm audit': ['Core CI, build and npm audit'],
              'Full Security Suite / Actionlint': ['Actionlint'],
              'Full Security Suite / Secret scanning (Gitleaks)': ['Secret scanning (Gitleaks)'],
              'Full Security Suite / Semgrep SAST': ['Semgrep SAST'],
              'Full Security Suite / CodeQL': ['CodeQL'],
              'Full Security Suite / Dependency Review': ['Dependency Review'],
              'Full Security Suite / OSSF Scorecard': ['OSSF Scorecard'],
              'Full Security Suite / Enterprise merge/deploy gate': ['Enterprise merge/deploy gate'],
              'CI / quality': ['quality'],
              'RISCK COMPLY Security CI / Run security gates, typecheck and tests': ['Run security gates, typecheck and tests'],
              'Gitleaks / Scan repository for accidental secret exposure': ['Scan repository for accidental secret exposure', 'Gitleaks'],
              'Secret Scanning / Production secret readiness gate': ['Production secret readiness gate'],
            };
            const evidenceBase = (status, summary) => ({
              schema_version: 4,
              evidenceItem: 'required-status-checks',
              status,
              repository: `${owner}/${repo}`,
              branch,
              evidence_type: 'branch-protection-required-checks',
              captured_at: new Date().toISOString(),
              reviewer: '@renansilva2002',
              reviewedAt: new Date().toISOString(),
              source: 'github-api-branch-protection-workflow',
              policy_document: 'docs/security/BRANCH_PROTECTION_REQUIRED_RULES.md',
              summary,
              evidenceLocations: [
                `GitHub Actions run: ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
                'Artifact: p0-branch-protection-evidence/branch-protection-main.generated.json',
                'Reference: docs/security/branch-protection-check-name-aliases.json',
              ],
              redactionConfirmation: 'All secrets, tokens, credentials, connection strings, and access-granting values are redacted.',
              required_status_checks: requiredChecks,
              accepted_status_check_aliases: aliases,
            });
            const writeEvidence = (evidence) => {
              fs.mkdirSync('p0-evidence', { recursive: true });
              fs.writeFileSync(artifactPath, `${JSON.stringify(evidence, null, 2)}\n`);
            };

            let protection;
            try {
              protection = (await github.rest.repos.getBranchProtection({ owner, repo, branch })).data;
            } catch (error) {
              const evidence = evidenceBase('Exception', `GitHub branch protection for main could not be read through the GitHub API: ${error.message}.`);
              evidence.controlsVerified = [];
              evidence.branch_protection = {};
              evidence.sourceDetails = { repository: `${owner}/${repo}`, branch, runId: String(context.runId), apiError: error.message, apiStatus: error.status ?? null };
              evidence.exception = { riskOwner: '@renansilva2002', rationale: 'Branch protection settings were not readable through the GitHub API.', expiresAt: '2026-07-14', approvalReference: 'P0 branch protection required checks rollout' };
              writeEvidence(evidence);
              core.warning(evidence.summary);
              return;
            }

            const contexts = protection.required_status_checks?.contexts ?? [];
            const checks = protection.required_status_checks?.checks?.map((check) => check.context) ?? [];
            const configuredChecks = [...new Set([...contexts, ...checks])];
            const configured = new Set(configuredChecks);
            const matchedRequiredChecks = Object.fromEntries(requiredChecks.map((check) => {
              const accepted = [check, ...(aliases[check] ?? [])];
              return [check, accepted.filter((name) => configured.has(name))];
            }));
            const missingChecks = requiredChecks.filter((check) => matchedRequiredChecks[check].length === 0);
            const requirePullRequest = Boolean(protection.required_pull_request_reviews);
            const directPushBlockedByPrRequirement = requirePullRequest;
            const branchProtection = {
              protect_branch: true,
              require_pull_request: requirePullRequest,
              required_approving_reviews: protection.required_pull_request_reviews?.required_approving_review_count ?? 0,
              require_code_owner_review: Boolean(protection.required_pull_request_reviews?.require_code_owner_reviews),
              dismiss_stale_reviews: Boolean(protection.required_pull_request_reviews?.dismiss_stale_reviews),
              require_conversation_resolution: Boolean(protection.required_conversation_resolution),
              require_status_checks: Boolean(protection.required_status_checks),
              require_up_to_date_branch: Boolean(protection.required_status_checks?.strict),
              block_force_pushes: protection.allow_force_pushes?.enabled === false,
              block_deletions: protection.allow_deletions?.enabled === false,
              restrict_direct_pushes: Boolean(protection.restrictions) || directPushBlockedByPrRequirement,
            };
            const flags = [
              branchProtection.require_pull_request,
              branchProtection.required_approving_reviews >= 1,
              branchProtection.require_code_owner_review,
              branchProtection.dismiss_stale_reviews,
              branchProtection.require_conversation_resolution,
              branchProtection.require_status_checks,
              branchProtection.require_up_to_date_branch,
              branchProtection.block_force_pushes,
              branchProtection.block_deletions,
              branchProtection.restrict_direct_pushes,
            ];
            const missingProtectionFlags = flags.filter((flag) => !flag).length;
            const controlsVerified = [
              branchProtection.require_pull_request ? 'Pull requests are required before merging' : null,
              branchProtection.required_approving_reviews >= 1 ? 'At least one approving review is required' : null,
              branchProtection.require_code_owner_review ? 'CODEOWNERS review is required' : null,
              branchProtection.dismiss_stale_reviews ? 'Stale approvals are dismissed' : null,
              branchProtection.require_status_checks ? 'Required status checks are enforced' : null,
              branchProtection.require_conversation_resolution ? 'Conversations must be resolved before merge' : null,
              branchProtection.block_force_pushes ? 'Force pushes are blocked' : null,
              branchProtection.block_deletions ? 'Branch deletion is blocked' : null,
              branchProtection.restrict_direct_pushes ? 'Direct pushes are restricted by pull request requirements or explicit push restrictions' : null,
              missingChecks.length === 0 ? 'All documented required checks are configured by policy name or accepted GitHub UI alias' : null,
            ].filter(Boolean);
            const complete = missingChecks.length === 0 && missingProtectionFlags === 0;
            const evidence = evidenceBase(complete ? 'Complete' : 'Exception', complete ? 'GitHub branch protection for main matched the enterprise protection requirements.' : `GitHub branch protection for main was read, but ${missingChecks.length} required check(s) and ${missingProtectionFlags} protection flag(s) are missing.`);
            evidence.controlsVerified = controlsVerified;
            evidence.branch_protection = branchProtection;
            evidence.sourceDetails = { repository: `${owner}/${repo}`, branch, runId: String(context.runId), missingRequiredChecks: missingChecks, missingProtectionFlags, configuredRequiredChecks: configuredChecks, matchedRequiredChecks, directPushRestrictionsConfigured: Boolean(protection.restrictions), directPushBlockedByPrRequirement };
            if (!complete) {
              evidence.exception = { riskOwner: '@renansilva2002', rationale: 'Generated evidence detected an incomplete branch protection configuration.', expiresAt: '2026-07-14', approvalReference: 'P0 branch protection required checks rollout' };
            }
            writeEvidence(evidence);

      - name: Upload branch protection evidence draft
        uses: actions/upload-artifact@v4
        with:
          name: p0-branch-protection-evidence
          path: p0-evidence/branch-protection-main.generated.json
          if-no-files-found: error
