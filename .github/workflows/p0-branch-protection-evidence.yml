name: P0 Branch Protection Evidence

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p0-branch-protection-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  branch-protection-evidence:
    name: Generate branch protection evidence draft
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate committed branch protection evidence policy
        run: node scripts/security/check-branch-protection-evidence.mjs

      - name: Generate branch protection evidence JSON
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.BRANCH_PROTECTION_READ_TOKEN != '' && secrets.BRANCH_PROTECTION_READ_TOKEN || github.token }}
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = 'main';
            const artifactPath = 'p0-evidence/branch-protection-main.generated.json';
            const requiredChecks = [
              'Full Security Suite / Core CI, build and npm audit',
              'Full Security Suite / Actionlint',
              'Full Security Suite / Secret scanning (Gitleaks)',
              'Full Security Suite / Semgrep SAST',
              'Full Security Suite / CodeQL',
              'Full Security Suite / Dependency Review',
              'Full Security Suite / OSSF Scorecard',
              'Full Security Suite / Enterprise merge/deploy gate',
              'CI / quality',
              'RISCK COMPLY Security CI / Run security gates, typecheck and tests',
              'Gitleaks / Scan repository for accidental secret exposure',
              'Secret Scanning / Production secret readiness gate',
            ];

            function writeEvidence(evidence) {
              fs.mkdirSync('p0-evidence', { recursive: true });
              fs.writeFileSync(artifactPath, `${JSON.stringify(evidence, null, 2)}\n`);
            }

            function baseEvidence(status, summary) {
              return {
                schema_version: 4,
                evidenceItem: 'required-status-checks',
                status,
                repository: `${owner}/${repo}`,
                branch,
                evidence_type: 'branch-protection-required-checks',
                captured_at: new Date().toISOString(),
                reviewer: '@renansilva2002',
                reviewedAt: new Date().toISOString(),
                source: 'github-api-branch-protection-workflow',
                policy_document: 'docs/security/BRANCH_PROTECTION_REQUIRED_RULES.md',
                summary,
                evidenceLocations: [
                  `GitHub Actions run: ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
                  'Artifact: p0-branch-protection-evidence/branch-protection-main.generated.json',
                ],
                redactionConfirmation: 'All secrets, tokens, credentials, connection strings, and access-granting values are redacted.',
                required_status_checks: requiredChecks,
              };
            }

            let protection;
            try {
              const response = await github.rest.repos.getBranchProtection({ owner, repo, branch });
              protection = response.data;
            } catch (error) {
              const evidence = baseEvidence(
                'Exception',
                `GitHub branch protection for main could not be read through the GitHub API: ${error.message}. This run generated an Exception artifact instead of failing before evidence upload.`,
              );
              evidence.controlsVerified = [];
              evidence.branch_protection = {
                protect_branch: null,
                require_pull_request: null,
                required_approving_reviews: null,
                require_code_owner_review: null,
                dismiss_stale_reviews: null,
                require_conversation_resolution: null,
                require_status_checks: null,
                require_up_to_date_branch: null,
                block_force_pushes: null,
                block_deletions: null,
                restrict_direct_pushes: null,
              };
              evidence.sourceDetails = {
                repository: `${owner}/${repo}`,
                branch,
                runId: String(context.runId),
                apiError: error.message,
                apiStatus: error.status ?? null,
                tokenRequirement: 'Create repository secret BRANCH_PROTECTION_READ_TOKEN with a fine-grained token that can read repository administration/branch protection metadata, or run from an environment where github.token can read branch protection.',
                missingRequiredChecks: requiredChecks,
                missingProtectionFlags: 10,
                configuredRequiredChecks: [],
              };
              evidence.exception = {
                riskOwner: '@renansilva2002',
                rationale: 'The workflow token could not read GitHub branch protection settings. This is a permission/evidence collection gap, not proof that branch protection is complete.',
                compensatingControls: [
                  'Do not mark this evidence Complete until branch protection settings are read successfully through the GitHub API or screenshot-backed administrator evidence is reviewed.',
                  'Create BRANCH_PROTECTION_READ_TOKEN as a repository secret if the default GITHUB_TOKEN cannot read branch protection metadata.',
                  'Keep docs/security/BRANCH_PROTECTION_REQUIRED_RULES.md aligned with required GitHub status checks.',
                ],
                expiresAt: '2026-07-14',
                approvalReference: 'P0 branch protection required checks rollout',
              };
              writeEvidence(evidence);
              core.warning(evidence.summary);
              return;
            }

            const contexts = protection.required_status_checks?.contexts ?? [];
            const checks = protection.required_status_checks?.checks?.map((check) => check.context) ?? [];
            const configuredChecks = [...new Set([...contexts, ...checks])];
            const missingChecks = requiredChecks.filter((check) => !configuredChecks.includes(check));
            const branchProtection = {
              protect_branch: true,
              require_pull_request: Boolean(protection.required_pull_request_reviews),
              required_approving_reviews: protection.required_pull_request_reviews?.required_approving_review_count ?? 0,
              require_code_owner_review: Boolean(protection.required_pull_request_reviews?.require_code_owner_reviews),
              dismiss_stale_reviews: Boolean(protection.required_pull_request_reviews?.dismiss_stale_reviews),
              require_conversation_resolution: Boolean(protection.required_conversation_resolution),
              require_status_checks: Boolean(protection.required_status_checks),
              require_up_to_date_branch: Boolean(protection.required_status_checks?.strict),
              block_force_pushes: protection.allow_force_pushes?.enabled === false,
              block_deletions: protection.allow_deletions?.enabled === false,
              restrict_direct_pushes: Boolean(protection.restrictions),
            };
            const requiredProtectionFlags = [
              branchProtection.require_pull_request,
              branchProtection.required_approving_reviews >= 1,
              branchProtection.require_code_owner_review,
              branchProtection.dismiss_stale_reviews,
              branchProtection.require_conversation_resolution,
              branchProtection.require_status_checks,
              branchProtection.require_up_to_date_branch,
              branchProtection.block_force_pushes,
              branchProtection.block_deletions,
              branchProtection.restrict_direct_pushes,
            ];
            const missingProtectionFlags = requiredProtectionFlags.filter((flag) => !flag).length;

            const controlsVerified = [
              branchProtection.require_pull_request ? 'Pull requests are required before merging' : null,
              branchProtection.required_approving_reviews >= 1 ? 'At least one approving review is required' : null,
              branchProtection.require_code_owner_review ? 'CODEOWNERS review is required' : null,
              branchProtection.require_status_checks ? 'Required status checks are enforced' : null,
              branchProtection.require_conversation_resolution ? 'Conversations must be resolved before merge' : null,
              branchProtection.block_force_pushes ? 'Force pushes are blocked' : null,
              branchProtection.block_deletions ? 'Branch deletion is blocked' : null,
              missingChecks.length === 0 ? 'All documented enterprise required checks are configured' : null,
            ].filter(Boolean);

            const complete = controlsVerified.length === 8 && missingProtectionFlags === 0;
            const evidence = baseEvidence(
              complete ? 'Complete' : 'Exception',
              complete
                ? 'GitHub branch protection for main was read through the GitHub API and matched the enterprise protection requirements.'
                : `GitHub branch protection for main was read through the GitHub API, but ${missingChecks.length} required check(s) and ${missingProtectionFlags} required protection flag(s) are missing or not detectable.`,
            );
            evidence.controlsVerified = controlsVerified;
            evidence.branch_protection = branchProtection;
            evidence.sourceDetails = {
              repository: `${owner}/${repo}`,
              branch,
              runId: String(context.runId),
              missingRequiredChecks: missingChecks,
              missingProtectionFlags,
              configuredRequiredChecks: configuredChecks,
            };

            if (!complete) {
              evidence.exception = {
                riskOwner: '@renansilva2002',
                rationale: 'Generated evidence detected that branch protection is not fully configured or not fully visible to the workflow token.',
                compensatingControls: ['Do not mark this evidence Complete until branch protection evidence is complete and Full Security Suite is required.'],
                expiresAt: '2026-07-14',
                approvalReference: 'P0 branch protection required checks rollout',
              };
            }

            writeEvidence(evidence);

      - name: Upload branch protection evidence draft
        uses: actions/upload-artifact@v4
        with:
          name: p0-branch-protection-evidence
          path: p0-evidence/branch-protection-main.generated.json
          if-no-files-found: error
