name: P0 Branch Protection Evidence

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p0-branch-protection-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  branch-protection-evidence:
    name: Generate branch protection evidence draft
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate committed branch protection evidence policy
        run: node scripts/security/check-branch-protection-evidence.mjs

      - name: Generate branch protection evidence JSON
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = 'main';

            let protection;
            try {
              const response = await github.rest.repos.getBranchProtection({ owner, repo, branch });
              protection = response.data;
            } catch (error) {
              core.setFailed(`Unable to read branch protection for ${owner}/${repo}@${branch}: ${error.message}. Run this workflow after branch protection is configured and with a token that can read repository administration/protection settings.`);
              return;
            }

            const requiredChecks = [
              'Full Security Suite / Core CI, build and npm audit',
              'Full Security Suite / Actionlint',
              'Full Security Suite / Secret scanning (Gitleaks)',
              'Full Security Suite / Semgrep SAST',
              'Full Security Suite / CodeQL (javascript-typescript)',
              'Full Security Suite / Dependency Review',
              'Full Security Suite / OSSF Scorecard',
              'Full Security Suite / Enterprise merge/deploy gate',
              'CI / quality',
              'RISCK COMPLY Security CI / Run security gates, typecheck and tests',
              'Gitleaks / Scan repository for accidental secret exposure',
              'Secret Scanning / Production secret readiness gate',
            ];

            const contexts = protection.required_status_checks?.contexts ?? [];
            const checks = protection.required_status_checks?.checks?.map((check) => check.context) ?? [];
            const configuredChecks = [...new Set([...contexts, ...checks])];
            const missingChecks = requiredChecks.filter((check) => !configuredChecks.includes(check));

            const controlsVerified = [
              protection.required_pull_request_reviews ? 'Pull requests are required before merging' : null,
              protection.required_pull_request_reviews?.required_approving_review_count >= 1 ? 'At least one approving review is required' : null,
              protection.required_pull_request_reviews?.require_code_owner_reviews ? 'CODEOWNERS review is required' : null,
              protection.required_status_checks ? 'Required status checks are enforced' : null,
              protection.required_conversation_resolution ? 'Conversations must be resolved before merge' : null,
              protection.allow_force_pushes?.enabled === false ? 'Force pushes are blocked' : null,
              protection.allow_deletions?.enabled === false ? 'Branch deletion is blocked' : null,
              missingChecks.length === 0 ? 'All documented enterprise required checks are configured' : null,
            ].filter(Boolean);

            const complete = controlsVerified.length === 8;
            const evidence = {
              evidenceItem: 'branch-protection-main',
              status: complete ? 'Complete' : 'Exception',
              reviewer: '@renansilva2002',
              reviewedAt: new Date().toISOString(),
              summary: complete
                ? 'GitHub branch protection for main was read through the GitHub API and matched the enterprise protection requirements.'
                : `GitHub branch protection for main was read through the GitHub API, but ${8 - controlsVerified.length} required control(s) are missing or not detectable.`,
              evidenceLocations: [
                `GitHub Actions run: ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
                'Artifact: p0-branch-protection-evidence/branch-protection-main.generated.json',
              ],
              redactionConfirmation: 'I confirm all secrets, tokens, keys, connection strings, and access-granting values are redacted.',
              controlsVerified,
              source: {
                repository: `${owner}/${repo}`,
                branch,
                runId: String(context.runId),
                missingRequiredChecks: missingChecks,
                configuredRequiredChecks: configuredChecks,
              },
            };

            if (!complete) {
              evidence.exception = {
                riskOwner: '@renansilva2002',
                rationale: 'Generated evidence draft detected that branch protection is not fully configured or not fully visible to the workflow token.',
                compensatingControls: ['Do not mark this evidence Complete until branch protection evidence is complete and Full Security Suite is required.'],
                expiryDate: 'YYYY-MM-DD',
                approvalReference: 'P0 tracking issue #76',
              };
            }

            fs.mkdirSync('p0-evidence', { recursive: true });
            fs.writeFileSync('p0-evidence/branch-protection-main.generated.json', `${JSON.stringify(evidence, null, 2)}\n`);

      - name: Upload branch protection evidence draft
        uses: actions/upload-artifact@v4
        with:
          name: p0-branch-protection-evidence
          path: p0-evidence/branch-protection-main.generated.json
          if-no-files-found: error
