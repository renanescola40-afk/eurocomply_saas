name: P0 Branch Protection Evidence

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full 40-character current main SHA to assess
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: p0-branch-protection-evidence-${{ inputs.release_sha }}
  cancel-in-progress: false

env:
  RELEASE_SHA: ${{ inputs.release_sha }}

jobs:
  branch-protection-evidence:
    name: Generate exact-SHA branch protection evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate requested release SHA
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]

      - name: Checkout exact release SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${RELEASE_SHA,,}"

      - name: Validate committed branch protection evidence policy
        run: node scripts/security/check-branch-protection-evidence.mjs

      - name: Generate exact-SHA branch protection evidence JSON
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: node scripts/security/generate-branch-protection-ruleset-evidence.mjs

      - name: Validate exact-SHA branch protection evidence contract
        if: always()
        env:
          ENTERPRISE_EXPECTED_SHA: ${{ inputs.release_sha }}
          BRANCH_PROTECTION_EVIDENCE_PATH: p0-evidence/branch-protection-main.generated.json
        run: node scripts/security/check-generated-branch-protection-evidence.mjs

      - name: Upload exact-SHA branch protection evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: p0-branch-protection-evidence-${{ inputs.release_sha }}
          path: p0-evidence/branch-protection-main.generated.json
          retention-days: 90
          if-no-files-found: error
