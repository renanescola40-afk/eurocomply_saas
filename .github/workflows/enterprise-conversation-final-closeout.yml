name: Enterprise Conversation Final Closeout

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact 40-character SHA currently at the tip of main
        required: true
        type: string
      confirmation:
        description: Type CLOSE_ENTERPRISE_CONVERSATION
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: enterprise-conversation-final-closeout-${{ inputs.release_sha }}
  cancel-in-progress: false

jobs:
  closeout:
    name: Assess exact-SHA conversation completion
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    steps:
      - name: Check out exact assessed SHA
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Authorize exact current main SHA
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main
          main_sha="$(git rev-parse origin/main)"
          [[ "$RELEASE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          test "${RELEASE_SHA,,}" = "$main_sha"
          test "$(git rev-parse HEAD)" = "$main_sha"
          test "$CONFIRMATION" = "CLOSE_ENTERPRISE_CONVERSATION"

      - name: Retrieve mandatory exact-SHA evidence
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/enterprise/fetch-conversation-final-closeout-evidence.mjs

      - name: Assess final closeout without losing diagnostics
        id: assessor
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set +e
          node scripts/enterprise/assess-conversation-final-closeout.mjs
          exit_code="$?"
          set -e
          test "$exit_code" = "0" -o "$exit_code" = "2"
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"

      - name: Generate immutable evidence checksums
        if: always()
        run: |
          set -euo pipefail
          output=artifacts/enterprise-conversation-closeout
          mkdir -p "$output"
          find "$output" -maxdepth 1 -type f -name '*.json' -print0 \
            | sort -z \
            | xargs -0 -r sha256sum > "$output/SHA256SUMS"

      - name: Publish completion or blocker summary
        if: always()
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          node --input-type=module <<'NODE'
          import { existsSync, readFileSync } from 'node:fs';
          const resultPath = 'artifacts/enterprise-conversation-closeout/result.json';
          const manifestPath = 'artifacts/enterprise-conversation-closeout/retrieval-manifest.json';
          const result = existsSync(resultPath) ? JSON.parse(readFileSync(resultPath, 'utf8')) : null;
          const manifest = existsSync(manifestPath) ? JSON.parse(readFileSync(manifestPath, 'utf8')) : null;
          const lines = ['## Enterprise conversation final closeout', ''];
          lines.push(`- Release SHA: \`${process.env.RELEASE_SHA}\``);
          lines.push(`- Retrieval: \`${manifest?.status || 'Unavailable'}\``);
          lines.push(`- Decision: \`${result?.decision || 'ASSESSMENT_UNAVAILABLE'}\``);
          lines.push(`- Completion: \`${result?.completionPercentage ?? 'unknown'}%\``);
          lines.push('');
          const blockers = Array.isArray(result?.blockers) ? result.blockers : [];
          if (blockers.length === 0 && result?.status === 'Complete') {
            lines.push('All canonical exact-SHA evidence passed. The conversation can be closed.');
          } else {
            lines.push('### Blocking evidence');
            if (blockers.length === 0) lines.push('- Assessor result was not produced.');
            for (const blocker of blockers) {
              lines.push(`- \`${blocker.control}\`: ${(blocker.failures || []).map((failure) => `\`${failure}\``).join(', ')}`);
            }
          }
          console.log(lines.join('\n'));
          NODE
          node --input-type=module <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          import { existsSync, readFileSync } from 'node:fs';
          const resultPath = 'artifacts/enterprise-conversation-closeout/result.json';
          const manifestPath = 'artifacts/enterprise-conversation-closeout/retrieval-manifest.json';
          const result = existsSync(resultPath) ? JSON.parse(readFileSync(resultPath, 'utf8')) : null;
          const manifest = existsSync(manifestPath) ? JSON.parse(readFileSync(manifestPath, 'utf8')) : null;
          const lines = ['## Enterprise conversation final closeout', ''];
          lines.push(`- Release SHA: \`${process.env.RELEASE_SHA}\``);
          lines.push(`- Retrieval: \`${manifest?.status || 'Unavailable'}\``);
          lines.push(`- Decision: \`${result?.decision || 'ASSESSMENT_UNAVAILABLE'}\``);
          lines.push(`- Completion: \`${result?.completionPercentage ?? 'unknown'}%\``);
          lines.push('');
          const blockers = Array.isArray(result?.blockers) ? result.blockers : [];
          if (blockers.length === 0 && result?.status === 'Complete') {
            lines.push('All canonical exact-SHA evidence passed. The conversation can be closed.');
          } else {
            lines.push('### Blocking evidence');
            if (blockers.length === 0) lines.push('- Assessor result was not produced.');
            for (const blocker of blockers) {
              lines.push(`- \`${blocker.control}\`: ${(blocker.failures || []).map((failure) => `\`${failure}\``).join(', ')}`);
            }
          }
          console.log(lines.join('\n'));
          NODE

      - name: Upload immutable closeout evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: enterprise-conversation-final-closeout-${{ inputs.release_sha }}
          path: artifacts/enterprise-conversation-closeout
          if-no-files-found: error
          retention-days: 365

      - name: Enforce final completion decision
        if: always()
        env:
          ASSESSOR_EXIT_CODE: ${{ steps.assessor.outputs.exit_code }}
        run: |
          set -euo pipefail
          test "$ASSESSOR_EXIT_CODE" = "0"
          result=artifacts/enterprise-conversation-closeout/result.json
          test -s "$result"
          node -e "const r=require('./' + process.argv[1]); if(r.status!=='Complete'||r.decision!=='CONVERSATION_COMPLETE'||r.completionPercentage!==100) process.exit(1)" "$result"
