name: Temporary dependency lockfile candidate
on:
  push:
    branches:
      - fix/security-dependency-patches-20261101
permissions:
  contents: write
concurrency:
  group: dependency-lock-candidate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - name: Setup Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - name: Regenerate lockfile from reviewed package manifest
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify manifest and lock alignment
        run: node scripts/security/check-package-lock-aligned.mjs
      - name: Verify locked patch versions
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const expected = {
            'node_modules/dompurify': { minimum: '3.4.17' },
            'node_modules/zod': { minimum: '4.6.6' },
            'node_modules/qs': { exact: '6.16.1' },
            'node_modules/undici': { exact: '7.30.1' },
          };
          const compareVersions = (left, right) => {
            const a = left.split('.').map(Number);
            const b = right.split('.').map(Number);
            for (let i = 0; i < Math.max(a.length, b.length); i += 1) {
              const delta = (a[i] ?? 0) - (b[i] ?? 0);
              if (delta !== 0) return Math.sign(delta);
            }
            return 0;
          };
          for (const [path, rule] of Object.entries(expected)) {
            const actual = lock.packages?.[path]?.version;
            const valid = typeof actual === 'string'
              && (rule.exact ? actual === rule.exact : compareVersions(actual, rule.minimum) >= 0);
            if (!valid) {
              const expectedDescription = rule.exact ? 'exactly ' + rule.exact : 'at least ' + rule.minimum;
              throw new Error(path + ': expected ' + expectedDescription + ', got ' + (actual ?? 'missing'));
            }
            console.log(path + '@' + actual);
          }
          NODE
      - name: Validate clean install from generated lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Commit generated package-lock.json only
        shell: bash
        run: |
          set -euo pipefail
          git add package-lock.json
          changed_files="$(git diff --cached --name-only)"
          test "$changed_files" = 'package-lock.json'
          if git diff --cached --quiet; then
            echo 'package-lock.json is already current; no commit required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(deps): regenerate lockfile with patched packages'
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Upload generated lockfile candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: dependency-lockfile-candidate-${{ github.sha }}
          path: package-lock.json
          if-no-files-found: error
          retention-days: 3
