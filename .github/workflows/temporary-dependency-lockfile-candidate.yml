name: Temporary dependency lockfile candidate
on:
  push:
    branches:
      - fix/security-dependency-patches-20261101
permissions:
  contents: read
concurrency:
  group: dependency-lock-candidate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - name: Regenerate lockfile from reviewed package manifest
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify manifest and lock alignment
        run: node scripts/security/check-package-lock-aligned.mjs
      - name: Verify locked patch versions
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const expected = {
            'node_modules/dompurify': '3.4.17',
            'node_modules/zod': '4.6.6',
            'node_modules/qs': '6.16.1',
            'node_modules/undici': '7.30.1',
          };
          for (const [path, version] of Object.entries(expected)) {
            const actual = lock.packages?.[path]?.version;
            if (actual !== version) {
              throw new Error(`${path}: expected ${version}, got ${actual ?? 'missing'}`);
            }
            console.log(`${path}@${actual}`);
          }
          NODE
      - name: Validate clean install from generated lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Upload generated lockfile candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: dependency-lockfile-candidate-${{ github.sha }}
          path: package-lock.json
          if-no-files-found: error
          retention-days: 3
