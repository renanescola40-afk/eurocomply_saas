name: Gitleaks

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - fix/observability-smoke-anonymous-401

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: gitleaks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Scan repository for accidental secret exposure
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - name: Checkout repository history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Gitleaks OSS CLI
        shell: bash
        env:
          GITLEAKS_VERSION: '8.30.1'
          GITLEAKS_ARCHIVE_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$archive"
          echo "${GITLEAKS_ARCHIVE_SHA256}  ${archive}" | sha256sum --check -
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          chmod 0755 "$RUNNER_TEMP/gitleaks"
          "$RUNNER_TEMP/gitleaks" version

      - name: Run fail-closed Gitleaks scan
        shell: bash
        run: |
          set -euo pipefail

          # Always scan the complete checked-out tree so a secret that survives in
          # the PR result cannot be hidden by historical scope decisions.
          "$RUNNER_TEMP/gitleaks" dir --redact --no-banner --verbose .

          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            if [ -z "${PR_BASE_SHA:-}" ]; then
              echo "::error title=Missing PR base SHA::Cannot establish a trustworthy secret-scan boundary."
              exit 1
            fi
            # PRs fail on secrets introduced after the exact base SHA. Historical
            # findings already present before the PR remain a main-branch remediation
            # concern instead of permanently blocking unrelated pull requests.
            "$RUNNER_TEMP/gitleaks" git --redact --no-banner --verbose --log-opts="${PR_BASE_SHA}..HEAD" .
          else
            # Pushes and manual runs retain the full-history audit.
            "$RUNNER_TEMP/gitleaks" git --redact --no-banner --verbose .
          fi
