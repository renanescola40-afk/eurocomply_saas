name: Gitleaks

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - fix/observability-smoke-anonymous-401

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: gitleaks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Scan repository for accidental secret exposure
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Gitleaks OSS CLI
        shell: bash
        env:
          GITLEAKS_VERSION: '8.30.1'
          GITLEAKS_ARCHIVE_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          archive_name="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          archive="$RUNNER_TEMP/$archive_name"
          direct_url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive_name}"

          download() {
            curl --fail --silent --show-error --location \
              --retry 5 --retry-delay 2 --retry-all-errors \
              --connect-timeout 20 --max-time 180 \
              "$@"
          }

          if ! download "$direct_url" --output "$archive"; then
            echo 'Direct GitHub release download unavailable; retrying through the GitHub Releases API.' >&2
            rm -f "$archive"
            release_json="$RUNNER_TEMP/gitleaks-release.json"
            download \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/gitleaks/gitleaks/releases/tags/v${GITLEAKS_VERSION}" \
              --output "$release_json"
            asset_api_url="$(jq -er --arg name "$archive_name" '.assets[] | select(.name == $name) | .url' "$release_json")"
            download \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H 'Accept: application/octet-stream' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "$asset_api_url" \
              --output "$archive"
          fi

          test -s "$archive"
          echo "${GITLEAKS_ARCHIVE_SHA256}  ${archive}" | sha256sum --check -
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          chmod 0755 "$RUNNER_TEMP/gitleaks"
          "$RUNNER_TEMP/gitleaks" version

      - name: Run Gitleaks repository and history scan
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner .
