name: PR 1976 Lockfile Fix

on:
  push:
    branches:
      - dependabot/npm_and_yarn/nextjs-and-react-5514051293

permissions:
  contents: write

jobs:
  regenerate-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v7
        with:
          ref: dependabot/npm_and_yarn/nextjs-and-react-5514051293
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Regenerate lockfile without lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify deterministic install
        run: npm ci --ignore-scripts

      - name: Commit only corrected lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo 'package-lock.json already clean; no commit needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'chore: regenerate package lock for Next 15.5.25'
          git push
