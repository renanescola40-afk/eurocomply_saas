# Risck Comply Senior Agent configuration
# Read by humans, GitHub custom agents, coding-agent providers, and workflows.

version: 5

agent_profile:
  path: .github/agents/enterprise-go.agent.md
  pr_creation_prompt: .github/agents/pr-creation-with-vercel-limit.prompt.md
  display_name: Risck Comply Enterprise GO
  user_invocable: true
  automatic_model_invocation: false
  mission: >-
    Move the repository toward a truthful, evidence-backed Enterprise Production GO
    without weakening security, privacy, tenancy, release, review, or operational controls.

queue:
  primary_label: senior-agent
  ready_label: agent:ready
  triage_label: agent:triage
  blocked_label: agent:blocked
  owner_required_label: needs-owner
  branch_prefix: agent
  work_packet_marker: senior-agent-work-packet:v2
  watchdog_marker: senior-agent-watchdog:v2

commands:
  triage: /agent triage
  run: /agent run
  block: /agent block
  p0: /agent p0
  explain: /agent explain

orchestration:
  triage_workflow: .github/workflows/senior-agent-triage.yml
  dispatch_workflow: .github/workflows/senior-agent-dispatch.yml
  watchdog_workflow: .github/workflows/senior-agent-watchdog.yml
  pr_classifier_workflow: .github/workflows/pr-autopilot.yml
  ci_autofix_workflow: .github/workflows/codex-autofix.yml
  repository_watchdog_cadence_hours: 6
  code_writing_requires_agent_assignment: true
  automatic_merge: false
  automatic_branch_sync: false
  automatic_production_deploy: false
  final_merge_actor: human-owner

branching:
  base_branch: main
  pattern: agent/<issue-number>-<short-slug>
  allow_direct_push_to_main: false
  allow_force_push: false
  allow_automatic_update_branch: false
  conflict_resolution: human-or-explicitly-authorized-agent

pull_requests:
  draft_by_default: true
  require_owner_approval: true
  require_owner_merge_click: true
  require_manual_merge_for_all_paths: true
  create_when_vercel_rate_limited: true
  vercel_rate_limit_prompt: .github/agents/pr-creation-with-vercel-limit.prompt.md
  link_issue: true
  require_overlap_review: true
  require_sections:
    - Objective
    - Customer or production motivation
    - Prioritization and ROEI
    - Open-work overlap review
    - Root cause and technical approach
    - Security, privacy, and tenancy impact
    - Verification
    - External deployment status
    - Evidence and limitations
    - Risk, compatibility, and rollback
    - Follow-ups

pr_classifier:
  policy: .github/pr-autopilot-policy.json
  workflow: .github/workflows/pr-autopilot.yml
  authority:
    classify_risk: true
    maintain_classification_labels: true
    checkout_pr_code: false
    update_branch: false
    resolve_conflicts: false
    approve_pr: false
    resolve_threads: false
    enable_auto_merge: false
    merge_pr: false
    administrator_bypass: false

ci_autofix:
  workflow: .github/workflows/codex-autofix.yml
  required_secrets:
    - OPENAI_API_KEY
    - PR_AUTOPILOT_TOKEN
  token_scope: >-
    Repository-scoped same-branch repair push only. It has no classifier,
    approval, branch-sync, merge, administrator, provider, or production authority.
  max_attempts: 2
  exact_head_required: true
  same_branch_only: true
  verification_required: true
  merge_authority: false
  branch_sync_authority: false

manual_merge_requirements:
  - exact current head SHA
  - successful required status-check rollup
  - approval from an eligible reviewer other than the latest pusher
  - resolved review conversations
  - clean GitHub merge state
  - no protected-path or owner-only blocker
  - explicit human merge action

never_bypass:
  - required status checks
  - independent approval
  - conversation resolution
  - branch protection
  - protected path policy
  - exact SHA binding
  - owner-only decisions
  - human final merge

protected_domains:
  - authentication and sessions
  - authorization, RBAC, tenant isolation, and RLS
  - Supabase authority and migrations
  - billing, Stripe, webhooks, and entitlements
  - security and release workflows
  - secrets and production configuration
  - audit evidence, legal records, and compliance claims
  - package manifests and agent governance

verification:
  full_gate:
    - npm ci
    - npm run lint
    - npm run typecheck
    - npm run test
    - npm run build
    - npm run security:ci
  release_candidate_gate:
    - npm run test:e2e
    - npm run release:production-final
  ci_fix_gate:
    - npm ci
    - npm run security:package-lock
    - npm run lint
    - npm run typecheck
    - npm run test
    - npm run build
  evidence_states:
    - PASS
    - FAIL
    - PARTIAL
    - NOT VERIFIED
    - BLOCKED
    - NOT APPLICABLE
  zero_tests_is_failure: true
  skipped_required_check_is_failure: true
  require_exact_sha_binding: true

enterprise_go:
  decision_default: Enterprise No-Go
  allowed_narrower_decisions:
    - Controlled Beta GO
    - Early Access GO
    - Production GO with Enterprise Limitations
  stop_conditions:
    - critical vulnerability
    - high vulnerability without formal owner risk acceptance
    - failed required check
    - skipped critical test or zero-test E2E
    - validated SHA differs from deployed SHA
    - tenant isolation or RLS not proven
    - authentication or authorization bypass
    - secret exposure
    - insecure Stripe webhook or entitlement path
    - rollback not executable
    - backup restore not tested
    - manipulated or synthetic evidence represented as production proof
    - owner-only external configuration unavailable

external_blockers:
  do_not_autofix:
    - vercel build rate limit
    - deployment quota
    - missing environment secret
    - missing environment variable
    - billing or plan upgrade required
    - provider outage
    - production SSO tenant configuration
    - external penetration test
    - WAF or CDN console configuration
    - production rollback or restore approval
  vercel_rate_limit_policy:
    classify_as: external deployment blocker
    create_or_update_code_pr: true
    continue_github_checks: true
    infer_code_failure: false
    run_codex_autofix: false
    require_external_deployment_status_section: true
    deployment_evidence_state: BLOCKED
    production_validation_state: NOT VERIFIED
    merge_policy: human-controlled and branch-protection-authoritative

safe_autonomy:
  allowed:
    - Documentation and runbook updates.
    - GitHub issue templates, PR templates, and queue automation.
    - CI hardening that preserves or strengthens checks.
    - Small lint, typecheck, test, and build fixes with evidence.
    - Bounded same-branch Codex CI repair under trusted default-branch policy.
    - Pull-request creation during a Vercel-only rate-limit or quota blocker with truthful evidence.
    - Small bug fixes with tests or clear reproduction evidence.
    - Low-risk systemic refactors that preserve deployed identities and public behavior.
  never_allowed:
    - Automatic pull-request merge.
    - Automatic branch synchronization.
    - Administrator bypass.
    - Self-approval or fabricated review.
    - Automatic review-thread resolution.
  blocked_without_owner:
    - Authentication, sessions, cookies, middleware auth, MFA, or step-up auth.
    - Authorization, tenant isolation, object-level access, or Supabase RLS assumptions.
    - Billing, subscriptions, Stripe webhooks, pricing, or entitlement behavior.
    - Audit chain, compliance evidence, trust package, or legal records.
    - Upload security, malware scanning, storage buckets, or signed URLs.
    - Production secrets, environment configuration, deployment, or new external integrations.
    - Destructive or backward-incompatible database migrations.
    - Production rollback, restore, pentest, SSO, WAF, or risk acceptance.

security:
  never_commit:
    - .env
    - Supabase service role keys
    - Stripe secrets
    - GitHub tokens
    - customer data
    - production logs containing PII
  required_pr_checks:
    - No security or compliance guardrail weakened.
    - No tenant boundary widened.
    - No privileged operation moved client-side.
    - No scanner, required check, or test disabled to make a build pass.
    - No repository result represented as proof of production behavior.
    - No automatic merge or branch synchronization.
    - No Vercel rate-limit signal represented as deployment success or a code defect without evidence.
