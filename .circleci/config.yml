version: 2.1
# Synthetic-only validation branch. No production context, credentials or export.
jobs:
  synthetic-supabase-target:
    machine:
      image: ubuntu-2204:2026.05.1
    resource_class: medium
    steps:
      - checkout
      - run:
          name: Enforce synthetic-only branch and absent production inputs
          command: |
            set -eu
            set +x
            test "$CIRCLE_BRANCH" = ci/verify-recovery-supabase-target-20261019
            test -z "${RISCK_SOURCE_DB_PASSWORD:-}"
            test -z "${RISCK_SOURCE_DATABASE_URL:-}"
      - run:
          name: Isolated Supabase PG17 synthetic compatibility and restore
          command: timeout 600s python3 scripts/recovery/supabase-target-probe.py
      - store_artifacts:
          path: artifacts/supabase-target-probe.json
          destination: synthetic-supabase-target
workflows:
  synthetic-target-only:
    jobs:
      - synthetic-supabase-target:
          filters:
            branches:
              only: ci/verify-recovery-supabase-target-20261019
