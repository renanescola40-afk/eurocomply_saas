  # GitHub legacy-source branch: the G6/G9 suites are only present on GitLab Work Master.
  # Evidence from this GitHub SHA is NOT eligible as the current integration candidate.
  # Enterprise evidence bridge: SOURCE ONLY, not a runtime or formal gate PASS.
  # Only the dedicated review branch can execute, even on manually-triggered pipelines.
  enterprise-source-proof:
    docker:
      - image: cimg/node:22.16.0
    resource_class: small
    working_directory: ~/project
    steps:
      - checkout
      - run:
          name: Fail closed on wrong source SHA, branch or privileged credentials
          command: |
            set -euo pipefail
            test "${CIRCLE_BRANCH:-}" = "ci/circleci-enterprise-gates-20261027"
            test -n "${CIRCLE_SHA1:-}"
            test "$(git rev-parse HEAD)" = "$CIRCLE_SHA1"
            for key in DATABASE_URL DIRECT_URL SUPABASE_ACCESS_TOKEN SUPABASE_SERVICE_ROLE_KEY STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET VERCEL_TOKEN RESEND_API_KEY SENTRY_AUTH_TOKEN QA_DB_PASSWORD PGPASSWORD; do
