          POSTGRES_USER: risck_synthetic
          POSTGRES_PASSWORD: synthetic-local-only
    resource_class: small
    working_directory: ~/project
    environment:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGDATABASE: risck_synthetic
      PGUSER: risck_synthetic
      PGPASSWORD: synthetic-local-only
    steps:
      - checkout
      - run:
          name: Verify exact branch/SHA and reject provider credentials
          command: |
            set -euo pipefail
            test "${CIRCLE_BRANCH:-}" = "phase1/security-dat01-v22"
            test -n "${CIRCLE_SHA1:-}"
            test "$(git rev-parse HEAD)" = "$CIRCLE_SHA1"
            for key in DATABASE_URL DIRECT_URL SUPABASE_ACCESS_TOKEN SUPABASE_SERVICE_ROLE_KEY STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET VERCEL_TOKEN RESEND_API_KEY SENTRY_AUTH_TOKEN QA_DB_PASSWORD; do
