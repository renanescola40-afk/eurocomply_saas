      - run:
          name: Install deterministic dependencies, no lifecycle scripts
          command: npm ci --ignore-scripts --no-audit --no-fund
      - run:
          name: Run source, CI, security, Stripe and migration contract checks
          command: |
            set -euo pipefail
            mkdir -p artifacts/circleci-enterprise
            npm run security:package-lock
            npm run lint
            npm run typecheck
            npm run test
            node --test scripts/qa-environment-guard.test.mjs
            node scripts/security/run-security-ci-without-audit.mjs
            node scripts/release/score-g1-product-ready.mjs > artifacts/circleci-enterprise/score.json
            node -e 'const r=require("./artifacts/circleci-enterprise/score.json");if(!r.valid||r.PRODUCTION_RELEASE_AUTHORIZED||r.productionReleaseAuthorized){process.exit(1)}'
            node -e 'const fs=require("fs");fs.writeFileSync("artifacts/circleci-enterprise/identity.json",JSON.stringify({kind:"CIRCLECI_ENTERPRISE_SOURCE_ONLY",sha:process.env.CIRCLE_SHA1,branch:process.env.CIRCLE_BRANCH,pipeline:process.env.CIRCLE_WORKFLOW_ID||null,qaRuntime:"NOT_EXECUTED",historicalReplay:"NOT_EXECUTED",stripeTestRuntime:"NOT_EXECUTED",formalAcceptance:"NOT_GRANTED",productionWrites:0},null,2)+"\\n")'
      - store_artifacts:
