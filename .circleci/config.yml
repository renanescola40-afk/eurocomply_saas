            branches:
              only:
                - ci/verify-actionlint-narrow-v15a-20261022
      - actionlint-narrow-g7-1:
          filters:
            branches:
              only:
                - ci/verify-actionlint-narrow-v15a-20261022
      - actionlint-narrow-g7-2:
          filters:
            branches:
              only:
                - ci/verify-actionlint-narrow-v15a-20261022
      - actionlint-narrow-g7-3:
          filters:
            branches:
              only:
                - ci/verify-actionlint-narrow-v15a-20261022
      - actionlint-narrow-g7-4:
          filters:
            branches:
              only:
                - ci/verify-actionlint-narrow-v15a-20261022
