            test "${CIRCLE_BRANCH:-}" = "ci/verify-actionlint-groups-v15a-20261022"
            test "$(git rev-parse HEAD)" = "${CIRCLE_SHA1:?missing source SHA}"
      - run:
          name: Install and self-test pinned actionlint
          command: |

            set -euo pipefail
            version=1.7.7
            archive="actionlint_${version}_linux_amd64.tar.gz"
            curl --fail --silent --show-error --location --retry 5 --retry-delay 2               "https://github.com/rhysd/actionlint/releases/download/v${version}/${archive}" -o "/tmp/${archive}"
            echo "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757  /tmp/${archive}" | sha256sum --check -
            tar -xzf "/tmp/${archive}" -C /tmp actionlint
            chmod 0755 /tmp/actionlint
            /tmp/actionlint -version

