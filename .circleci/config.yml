            node - "$report" <<'NODE'
            const fs=require('fs');
            const p=process.argv[2];
            const rows=JSON.parse(fs.readFileSync(p,'utf8'));
            const hit=rows.filter(x=>{const f=String(x.File||''); return !/^(\.github|\.circleci|src|scripts|docs|supabase|tests)\//.test(f);});
            console.log(JSON.stringify({group:'other',findingCount:hit.length,fileCount:new Set(hit.map(x=>x.File)).size}));
            process.exit(hit.length===0?0:3);
            NODE

  g5-02-postgres17-canonical-replay:
