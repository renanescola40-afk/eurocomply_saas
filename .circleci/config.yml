version: 2.1

# Opt-in: avoid consuming CircleCI credits until the owner explicitly triggers QA.
parameters:
  run_dat01_preflight:
    type: boolean
    default: false
  run_dat01_pg17_smoke:
    type: boolean
    default: false
  run_main_source:
    type: boolean
    default: false
  run_qa_preflight:
    type: boolean
    default: false
  run_qa_full:
    type: boolean
    default: false
  run_g5_02_pg_replay:
    type: boolean
    default: false

  run_actions_recovery:
    type: boolean
    default: false

  run_actions_recovery_quality:
    type: boolean
    default: false

  run_enterprise_source:
    type: boolean
    default: false
  run_enterprise_pg_synthetic:
    type: boolean
    default: false

# RISCK COMPLY: validação isolada, sem deploy
jobs:
  synthetic-backup-components:
    machine:
      image: ubuntu-2204:2026.05.1
    resource_class: medium
    steps:
      - checkout
      - run:
          name: Reject production credentials in synthetic job
          command: |
            set -euo pipefail
            case "${CIRCLE_BRANCH:-}" in
              main|ci/verify-*|fix/p0-forward-manifest-v44-20261019|qa/fix-e2e-node22-20261021|fix/g1-qa48-canonical-rls-precondition-20261023) ;;
              *) echo "CircleCI: unexpected branch ${CIRCLE_BRANCH:-missing}" >&2; exit 1 ;;
            esac
            test -n "${CIRCLE_SHA1:-}" || { echo "Missing CircleCI source SHA" >&2; exit 1; }
            checked_out_sha="$(git rev-parse HEAD)"
            test "$checked_out_sha" = "$CIRCLE_SHA1" || {
              echo "CircleCI checkout SHA does not match pipeline SHA" >&2
              exit 1
            }
            node --version
            npm --version
            printf 'Validated source SHA: %s\n' "$checked_out_sha"
      - run:
          name: Recusar credenciais privilegiadas neste CI isolado
          command: |
            set -euo pipefail
            for key in SUPABASE_SERVICE_ROLE_KEY SUPABASE_ACCESS_TOKEN STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET VERCEL_TOKEN DATABASE_URL DIRECT_URL RESEND_API_KEY SENTRY_AUTH_TOKEN; do
              if [ -n "${!key:-}" ]; then
                echo "Privileged provider variable must not be present in this source-only CI: $key" >&2
                exit 1
              fi
            done
      - run:
          name: Instalar dependencias sem scripts externos
          command: npm ci --ignore-scripts --no-audit --no-fund
      - run:
          name: Verificar package-lock
          command: npm run security:package-lock
      - run:
          name: Validar contrato dos checks GitHub (offline)
          command: node scripts/security/check-ci-required-checks-validation.mjs
      - run:
          name: Lint
          command: npm run lint
      - run:
          name: TypeScript
          command: npm run typecheck
      - run:
          name: Testes unitarios
          command: npm run test
      - run:
          name: G1 Migration Reconciliation exact-SHA fail-closed regression
          command: node --test tests/release/g1-migration-reconciliation-runtime.test.mjs
      - run:
          name: Contratos P0 PostgreSQL source-only (Node .test.mjs)
          command: |
            set -euo pipefail
            node --test tests/security/p0-membership-release-admission.test.mjs \
              tests/security/membership-usage-counter-drift.test.mjs \
              tests/security/p0f-manual-counter-reconciliation.test.mjs \
              tests/security/enterprise-private-membership-mfa-contract.test.mjs
      - run:
          name: Integridade ISO e SOC2
          command: |
            node --test scripts/security/iso-soc2-register-audit.test.mjs
            node --test scripts/security/iso-soc2-gate-progress.test.mjs
            node --test scripts/security/iso-soc2-common-criteria-check.test.mjs
            node scripts/security/iso-soc2-register-audit.mjs
            node scripts/security/iso-soc2-gate-progress.mjs
            node scripts/security/iso-soc2-common-criteria-check.mjs
      - run:
          name: Seguranca sem servicos externos
          command: node scripts/security/run-security-ci-without-audit.mjs
      - run:
          name: Strict exact-lockfile dependency policy
          command: |
            node --test scripts/security/npm-audit-policy.test.mjs
            npm run security:npm-audit:all
      - run:
          name: Validate specialist routing when implementation is present
          command: |
            set -euo pipefail
            if [ -f scripts/agents/select-specialists.cjs ]; then
              node --test tests/agents/specialist-routing.test.cjs
            else
              echo "Not applicable: specialist routing implementation not yet in this SHA."
            fi
      - run:
          name: Build Next.js
          command: npm run build
      - run:
          name: Verificar rotas
          command: npm run quality:routes
      - run:
          name: Emitir prova CircleCI de testes SOURCE-ONLY sem GO
          command: |
            set -euo pipefail
            node --test tests/security/circleci-source-proof.test.mjs tests/security/verify-circleci-source-proof.test.mjs
            node scripts/security/create-circleci-source-proof.mjs
            node scripts/security/verify-circleci-source-proof.mjs
      - store_artifacts:
          path: artifacts/circleci-source-validation
          destination: source-only-exact-sha-evidence

  # Explicit opt-in. No build, deploy, production keys or provider mutations.
  github-actions-recovery-smoke:
    docker:
      - image: cimg/node:22
    resource_class: small
    working_directory: ~/project
    steps:
      - checkout
      - run:
          name: Verify exact GitHub recovery branch and no privileged credentials
          command: |
            set -euo pipefail
            case "${CIRCLE_BRANCH:-}" in
              fix/actions-p0-runner-storm-20261102|integration/enterprise-unified-candidate-20261102) ;;
              *) echo "Unexpected branch for manual recovery smoke" >&2; exit 1 ;;
            esac
            test "$(git rev-parse HEAD)" = "${CIRCLE_SHA1:?Missing source SHA}" || {
              echo "Refusing non-identical checkout SHA" >&2; exit 1
            }
            node -e "if (Number(process.versions.node.split('.')[0]) !== 22) process.exit(1)"
            for key in SUPABASE_SERVICE_ROLE_KEY SUPABASE_ACCESS_TOKEN STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET VERCEL_TOKEN DATABASE_URL DIRECT_URL RESEND_API_KEY; do
              if [ -n "${!key:-}" ]; then
                echo "Privileged provider credential is forbidden for offline CI: $key" >&2
                exit 1
              fi
            done
            echo "Source-only GitHub Actions recovery contracts for $CIRCLE_SHA1"
      - run:
          name: Test workflow fixes and security/Free invariants
          command: |
            set -euo pipefail
            node --test --test-reporter=tap \
              tests/ci/circleci-github-actions-recovery-contract.test.mjs \
              tests/ci/workflow-run-main-branch-contract.test.mjs \
              tests/ci/github-actions-budget-regression.test.mjs \
              tests/enterprise/p0-progress-concurrency.test.mjs \
              tests/security/enterprise-100-stale-workflow-run-guard.test.mjs
      - run:
          name: Integrated candidate source-only billing security and evidence regressions
          command: |
            set -euo pipefail
            # Preserve legacy recovery-branch smoke: these new files exist only in the unified candidate.
            if [ "${CIRCLE_BRANCH:-}" != "integration/enterprise-unified-candidate-20261102" ]; then
              echo "Integrated source contracts apply to the candidate branch only"
              exit 0
            fi
            test "$(git rev-parse HEAD)" = "${CIRCLE_SHA1:?missing exact SHA}"
            node --test --test-reporter=tap \
              tests/security/client-env-access.test.mjs \
              tests/ci/circleci-readonly-diagnose.test.mjs \
              tests/ci/enterprise-evidence-exact-sha-contract.test.mjs \
              tests/ci/circleci-memory-diagnostics-contract.test.mjs \
              tests/security/membership-usage-counter-drift.test.mjs \
              tests/release/sec05-acceptance-verifier.test.mjs \
              tests/release/g1-sec05-evidence.test.mjs \
              tests/release/g1-bil02-evidence.test.mjs \
              tests/security/sec05-qa-nontls-probe.test.mjs \
              tests/release/g1-enterprise-scope-acceptance.test.mjs \
              tests/enterprise-evidence/validate-evidence.test.mjs
            node --test --test-reporter=tap \
              tests/billing/checkout-recovery-lease-contract.test.mjs
            node --experimental-strip-types --test --test-reporter=tap \
              tests/billing/checkout-price-authority.test.mjs
            node --test --test-reporter=tap \
              tests/billing/phase2-qa-webhook-preflight.test.mjs
            node --experimental-strip-types --test --test-reporter=tap \
              tests/product/evidence-upload-recovery.test.mjs

  # Second-stage opt-in; never auto-trigger, deploy, write to production or use provider secrets.
  github-actions-recovery-quality:
    docker:
      - image: cimg/node:22
    resource_class: large
    working_directory: ~/project
    steps:
      - checkout
      - run:
          name: Verify exact branch, source SHA and non-privileged environment
          command: |
            set -euo pipefail
            case "${CIRCLE_BRANCH:-}" in
              fix/actions-p0-runner-storm-20261102|ci/circleci-gh-actions-one-shot-20261102|integration/enterprise-unified-candidate-20261102) ;;
              *) echo "Recovery quality must run only on an approved branch" >&2; exit 1 ;;
            esac
            test "$(git rev-parse HEAD)" = "${CIRCLE_SHA1:?Missing CircleCI commit}" || {
              echo "Refusing a checkout that does not match the pipeline SHA" >&2
              exit 1
            }
            node -e "if (Number(process.versions.node.split('.')[0]) !== 22) process.exit(1)"
            for key in SUPABASE_SERVICE_ROLE_KEY SUPABASE_ACCESS_TOKEN STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET VERCEL_TOKEN DATABASE_URL DIRECT_URL RESEND_API_KEY SENTRY_AUTH_TOKEN QA_DB_PASSWORD PGPASSWORD; do
              if [ -n "${!key:-}" ]; then
                echo "Forbidden credential present in source quality job: $key" >&2
                exit 1
              fi
            done
      - run:
          name: Deterministic dependency install without lifecycle scripts
          command: npm ci --ignore-scripts --no-audit --no-fund
      - run:
          name: Lockfile consistency and repository security policies
          command: |
            set -euo pipefail
            npm run security:package-lock
            node scripts/security/run-security-ci-without-audit.mjs
      - run:
          name: ESLint and TypeScript
          command: |
            set -euo pipefail
            npm run lint
            npm run typecheck
      - run:
          name: Application unit tests
          command: npm run test
      - run:
          name: DAT-01 fail-closed 137-row source manifest consistency (not replay)
          command: |
            set -euo pipefail
            node --test --test-reporter=tap scripts/diagnostics/g5-02-ledger-manifest-draft-validator.test.mjs
            node scripts/diagnostics/g5-02-ledger-manifest-draft-validator.mjs
      - run:
          name: Next.js CI build using non-production placeholders
          environment:
            NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
            NEXT_PUBLIC_SUPABASE_ANON_KEY: public-placeholder-anon-key
            NODE_OPTIONS: --max-old-space-size=5120
          command: |
            set -euo pipefail
            # Bounded numeric-only cgroup readback; never dump environment or tokens.
            mem=/sys/fs/cgroup/memory.events
            limit=/sys/fs/cgroup/memory.max
            if [ -r "$limit" ]; then
              printf 'CI_CGROUP_MEMORY_LIMIT=%s\n' "$(cat "$limit")"
            fi
            before=0
            if [ -r "$mem" ]; then
              before=$(awk '$1=="oom_kill" {print $2}' "$mem")
              printf 'CI_OOM_KILL_BEFORE=%s\n' "${before:-0}"
            fi
            set +e
            npm run build
            status=$?
            set -e
            after=0
            if [ -r "$mem" ]; then
              after=$(awk '$1=="oom_kill" {print $2}' "$mem")
              printf 'CI_OOM_KILL_AFTER=%s\n' "${after:-0}"
            fi
            printf 'CI_BUILD_EXIT=%s\n' "$status"
            if [ "$status" -eq 137 ]; then
              if [ "${after:-0}" -gt "${before:-0}" ]; then
                echo 'CI_BUILD_CLASS=CGROUP_OOM_KILL_OBSERVED'
              else
                echo 'CI_BUILD_CLASS=EXIT_137_OOM_UNCONFIRMED'
              fi
            fi
            exit "$status"
      - run:
          name: Validate built routes and archive source-quality evidence
          command: |
            set -euo pipefail
            mkdir -p artifacts/circleci-quality
            npm run quality:routes 2>&1 | tee artifacts/circleci-quality/quality-routes.log
            node --test --test-reporter=tap tests/ci/circleci-quality-proof.test.mjs \
              tests/ci/circleci-memory-diagnostics-contract.test.mjs \
              tests/ci/circleci-github-actions-recovery-contract.test.mjs \
              2>&1 | tee artifacts/circleci-quality/evidence-contracts.tap
            node scripts/ci/create-circleci-quality-proof.mjs
      - store_artifacts:
          path: artifacts/circleci-quality
          destination: source-quality-exact-sha

  # Opt-in small executor; no npm install, network calls, real provider tokens or deploys.
  qa-preflight-offline:
    docker:
      - image: cimg/node:22.16.0
    resource_class: small
    working_directory: ~/project
    steps:
      - checkout
      - run:
          name: Verify exact QA checkout and refuse provider secrets
          command: |
            set -euo pipefail
            test "${CIRCLE_BRANCH:-}" = "qa/fix-e2e-node22-20261021" || {
              echo "CircleCI QA job cannot run on other branches" >&2
              exit 1
            }
            test "$(git rev-parse HEAD)" = "${CIRCLE_SHA1:?CircleCI source SHA missing}" || {
              echo "CircleCI checkout must match pipeline SHA" >&2
              exit 1
            }
            for key in SUPABASE_SERVICE_ROLE_KEY SUPABASE_ACCESS_TOKEN STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET VERCEL_TOKEN DATABASE_URL DIRECT_URL RESEND_API_KEY SENTRY_AUTH_TOKEN; do
              if [ -n "${!key:-}" ]; then
                echo "Provider credential forbidden in offline QA: $key" >&2
                exit 1
              fi
            done
      - run:
          name: Execute source-only QA suites and preserve exact-SHA evidence
          command: |
            set -euo pipefail
            mkdir -p artifacts/qa-preflight
            node --test --test-reporter=tap \
              tests/security/e2e-preflight-offline.test.mjs \
              tests/security/payment-first-qa-origin-guard.test.mjs \
              tests/security/playwright-synthetic-write-qa-gate.test.mjs \
              tests/security/paid-owner-playwright-proof.test.mjs \
              tests/security/circleci-qa-manual-gate.test.mjs \
              2>&1 | tee artifacts/qa-preflight/tests.tap
            # No external provider call, install, payment or runtime mutation.
            node scripts/security/check-stripe-webhook-contract.mjs \
              2>&1 | tee artifacts/qa-preflight/stripe-webhook-contract.txt
            node scripts/security/run-stripe-runtime-validation.mjs \
              2>&1 | tee artifacts/qa-preflight/stripe-runtime-source-only.json
            node --input-type=module <<'NODE'
            import { writeFileSync } from 'node:fs';
            import { createHash } from 'node:crypto';
            import { readFileSync } from 'node:fs';
            import { execFileSync } from 'node:child_process';
            const sha = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
            if (sha !== process.env.CIRCLE_SHA1) throw new Error('qa_evidence_sha_mismatch');
            const tap = readFileSync('artifacts/qa-preflight/tests.tap');
            writeFileSync('artifacts/qa-preflight/evidence.json', JSON.stringify({
              kind: 'RISCK_CIRCLECI_QA_SOURCE_PROOF',
              checkedOutSha: sha,
              pipelineSha: process.env.CIRCLE_SHA1,
              branch: process.env.CIRCLE_BRANCH,
              workflow: 'qa-preflight-manual',
              result: 'PASS',
              testReportSha256: createHash('sha256').update(tap).digest('hex'),
              stripeWebhookContractSha256: createHash('sha256').update(readFileSync('artifacts/qa-preflight/stripe-webhook-contract.txt')).digest('hex'),
              stripeRuntimeSourceOnlySha256: createHash('sha256').update(readFileSync('artifacts/qa-preflight/stripe-runtime-source-only.json')).digest('hex'),
              proofBoundary: 'Offline Node and Stripe source-contract checks only; no Playwright, provider delivery, Supabase, payment or deployment proof',
            }, null, 2) + '\n');
            NODE
      - store_artifacts:
          path: artifacts/qa-preflight
          destination: qa-preflight-exact-sha

  # Native PG service is disposable and contains ONLY synthetic fixtures.
  # Free-plan included quota verified 2026-10-18 before activation.
  p0-postgres-synthetic:
    docker:
      - image: cimg/node:22.16.0
      - image: postgres:17.6
        environment:
          POSTGRES_DB: risck_synthetic
          POSTGRES_USER: risck_synthetic
          POSTGRES_PASSWORD: synthetic-local-only
    resource_class: small
    working_directory: ~/project
    steps:
      - checkout
      - run:
          name: Verify bounded validation source and branch
          command: |
            set -eu
            set +x
            test "$CIRCLE_BRANCH" = ci/verify-recovery-production-20261019
            test "$(git rev-parse HEAD)" = "$CIRCLE_SHA1"
            test "$(git merge-base HEAD 1cd3c05ce628fcfd5de78169c1a18e8939f81d70)" = 1cd3c05ce628fcfd5de78169c1a18e8939f81d70
            python3 -c "import subprocess; changed=set(subprocess.check_output(['git','diff','--name-only','1cd3c05ce628fcfd5de78169c1a18e8939f81d70','HEAD'],text=True).splitlines()); assert changed == {'.circleci/config.yml','scripts/recovery/connection-preflight.py','scripts/recovery/production-backup-rehearsal.py','scripts/recovery/production-backup-components.py'}"
      - run:
          name: Approved read-only encrypted export and isolated logical restore
          command: timeout 900s python3 scripts/recovery/production-backup-rehearsal.py
      - store_artifacts:
          path: artifacts/p0-postgres
          destination: p0-postgres-synthetic

  gitleaks-group-ci-v15a:
    docker:
      - image: cimg/base:stable
    resource_class: small
    working_directory: ~/project
    steps:
      - checkout
      - run:
          name: Restore exact target SHA
          command: |
            set -euo pipefail
            git checkout --detach 2242d06b773b806701e0ed49e8ecc7752ca6aae8
            test "$(git rev-parse HEAD)" = "2242d06b773b806701e0ed49e8ecc7752ca6aae8"
      - run:
          name: Install pinned Gitleaks
          command: |

            set -euo pipefail
            version=8.30.1
            archive="gitleaks_${version}_linux_x64.tar.gz"
            curl --fail --silent --show-error --location --retry 5 --retry-delay 2               "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}" -o "/tmp/${archive}"
            echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/${archive}" | sha256sum --check -
            tar -xzf "/tmp/${archive}" -C /tmp gitleaks
            chmod 0755 /tmp/gitleaks
      - run:
          name: Classify redacted findings for ci
          command: |
            set -euo pipefail
            report="/tmp/gitleaks-ci.json"
            /tmp/gitleaks dir --redact --no-banner --exit-code 0 --report-format json --report-path "$report" .
            node - "$report" <<'NODE'
            const fs=require('fs');
            const p=process.argv[2];
            const rows=JSON.parse(fs.readFileSync(p,'utf8'));
            const hit=rows.filter(x=>/^(\.github|\.circleci)\//.test(String(x.File||'')));
            console.log(JSON.stringify({group:'ci',findingCount:hit.length,fileCount:new Set(hit.map(x=>x.File)).size}));
            process.exit(hit.length===0?0:3);
            NODE

