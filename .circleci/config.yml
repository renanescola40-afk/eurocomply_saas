version: 2.1
# Validation branch only. No main change, deploy, production credentials or data.
jobs:
  synthetic-logical-recovery:
    machine:
      image: ubuntu-2204:2026.05.1
    resource_class: medium
    working_directory: ~/project
    steps:
      - checkout
      - run:
          name: Offline input guard and isolated PG17 encrypted recovery rehearsal
          no_output_timeout: 10m
          command: |
            set -euo pipefail
            test "${CIRCLE_BRANCH:?}" = ci/verify-recovery-synthetic-20261019
            test "$(git rev-parse HEAD)" = "${CIRCLE_SHA1:?}"
            bash tests/recovery/isolated-logical-restore-tls.test.sh
            python3 tests/recovery/libpq-connection.test.py
            timeout 900s python3 tests/recovery/ci-synthetic-rehearsal.py
      - store_artifacts:
          path: artifacts/recovery
          destination: synthetic-logical-recovery
workflows:
  synthetic-recovery-only:
    jobs:
      - synthetic-logical-recovery:
          filters:
            branches:
              only: ci/verify-recovery-synthetic-20261019
