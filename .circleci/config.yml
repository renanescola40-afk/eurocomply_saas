workflows:
  verificacao-isolada:
    jobs:
      - validar-risck:
          filters:
            branches:
              # Main, ci/verify-* e branch pontual de prova CircleCI controladas pelo owner.
              # CircleCI usa creditos incluidos; nenhum deploy/segredo de producao.
              # Branches ci/verify-* sao intencionalmente restritas para testes
              # antes de abrir PRs que possam criar preview no Supabase.
              only:
                - main
                - fix/p0-forward-manifest-v44-20261019
                - fix/circleci-source-evidence-v17-20261021
      - p0-postgres-synthetic:
          filters:
            branches:
              only:
                - main
                - fix/p0-forward-manifest-v44-20261019
                - fix/circleci-source-evidence-v17-20261021

  actionlint-narrow-v15a:
    jobs:
      - actionlint-narrow-g1-1:
          filters:
            branches:
              only:
                - ci/verify-actionlint-narrow-v15a-20261022
      - actionlint-narrow-g1-2:
          filters:
            branches:
              only:
                - ci/verify-actionlint-narrow-v15a-20261022
      - actionlint-narrow-g1-3:
