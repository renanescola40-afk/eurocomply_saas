version: 2.1
# VALIDATION ONLY. Do not merge this configuration into main.
# No database dump, data export, migration, release or customer-row query.
jobs:
  read-only-connection:
    machine:
      image: ubuntu-2204:2026.05.1
    resource_class: medium
    steps:
      - checkout
      - run:
          name: Verify fixed baseline and bounded validation-only changes
          command: |
            set -eu
            set +x
            test "$CIRCLE_BRANCH" = ci/verify-recovery-production-20261019
            test "$(git rev-parse HEAD)" = "$CIRCLE_SHA1"
            test "$(git merge-base HEAD 1cd3c05ce628fcfd5de78169c1a18e8939f81d70)" = 1cd3c05ce628fcfd5de78169c1a18e8939f81d70
            python3 -c "import subprocess; changed=set(subprocess.check_output(['git','diff','--name-only','1cd3c05ce628fcfd5de78169c1a18e8939f81d70','HEAD'],text=True).splitlines()); assert changed == {'.circleci/config.yml','scripts/recovery/connection-preflight.py'}"
      - run:
          name: Native PG17 read-only verified-TLS connection check
          command: |
            set -eu
            set +x
            umask 077
            timeout 300s python3 scripts/recovery/connection-preflight.py
      - store_artifacts:
          path: artifacts/connection-preflight.json
          destination: connection-preflight
workflows:
  guarded-connection-check:
    jobs:
      - approve-read-only-connection:
          type: approval
          filters:
            branches:
              only: ci/verify-recovery-production-20261019
      - read-only-connection:
          requires:
            - approve-read-only-connection
          context: risck-recovery
          filters:
            branches:
              only: ci/verify-recovery-production-20261019
